name: Stabilize (canonical & redirects)
on:
  workflow_dispatch:
permissions: { contents: write }
jobs:
  stab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/stabilize/fix_canonical.js
      - run: node scripts/stabilize/merge_redirects.js
      - name: Commit changes (if any)
        run: |
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add -A _redirects
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "stabilize: canonical & force-www redirects"; git pull --rebase --autostash || true; git push; fi
