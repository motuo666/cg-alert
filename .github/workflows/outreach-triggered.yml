name: Outreach Triggered (Boost+30d)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max emails this run"
        required: false
        default: "12"
      window_h:
        description: "Lookback hours"
        required: false
        default: "168"
      dry:
        description: "Dry run?"
        required: false
        default: "true"
  schedule:
    - cron: "05 16 * * 1-5"  # 工作日 16:05 UTC

permissions:
  contents: write

concurrency:
  group: outreach-triggered-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trig:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max_old_space_size=2048
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
      PERSONA_RULES: config/persona_rules.json
      REGION_FILTER: config/region_filter.json
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      BCC_TO: ${{ secrets.BCC_TO }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps (best-effort)
        run: npm ci || npm i --no-audit --no-fund || true

      - name: Preflight deliverability gate
        id: gate
        run: |
          node scripts/diag_7d_report.js > diag.txt || true
          echo '### 7D Diagnosis' >> "$GITHUB_STEP_SUMMARY"
          cat diag.txt >> "$GITHUB_STEP_SUMMARY" || true
          L=${{ inputs.limit }}
          echo "OUT_LIMIT=$L" >> $GITHUB_ENV
          echo "- send limit this run: $L" >> "$GITHUB_STEP_SUMMARY"

      - name: Normalize vendor aliases (inline)
        run: |
          cat > /tmp/vendor_aliases.json <<'JSON'
          { "google":"google.com","google cloud":"google.com","gcp":"google.com","cloud.google.com":"google.com",
            "aws":"aws.amazon.com","amazon web services":"aws.amazon.com","amazonaws.com":"aws.amazon.com",
            "okta inc":"okta.com","auth0":"okta.com",
            "atlassian":"atlassian.com","jira":"atlassian.com","confluence":"atlassian.com",
            "microsoft":"microsoft.com","azure":"microsoft.com",
            "salesforce":"salesforce.com","zendesk":"zendesk.com","twilio":"twilio.com","stripe":"stripe.com",
            "box":"box.com","dropbox":"dropbox.com","new relic":"newrelic.com","algolia":"algolia.com",
            "sentry":"sentry.io","vercel":"vercel.com","figma":"figma.com","mailgun":"mailgun.com",
            "helpscout":"helpscout.com","checkout":"checkout.com","duo security":"duo.com",
            "cloudflare":"cloudflare.com","snowflake":"snowflake.com","notion":"notion.so" }
          JSON
          node -e '
            const fs=require("fs"),p="data/leads.csv";
            if(!fs.existsSync(p)) process.exit(0);
            const map=Object.fromEntries(Object.entries(JSON.parse(fs.readFileSync("/tmp/vendor_aliases.json","utf8"))).map(([k,v])=>[k.toLowerCase(),v]));
            const out=fs.readFileSync(p,"utf8").split(/\r?\n/).map(ln=>{
              if(!ln.trim()) return ln;
              const c=ln.split(","); for(let j=3;j<=5;j++){ const s=(c[j]||"").trim().toLowerCase(); if(s) c[j]=map[s]||map[s.replace(/^www\./,"")]||c[j]; }
              return c.join(",");
            }).join("\n");
            fs.writeFileSync(p,out); console.log("leads.csv normalized");
          '

      - name: Link guard
        run: node scripts/link_guard.js

      # Try A — 168h
      - name: Dry run (A: 168h)
        id: dry1
        env:
          TRIGGER_WINDOW_H: ${{ inputs.window_h }}
        run: |
          node scripts/send_triggered.js --dry=true --limit=${{ env.OUT_LIMIT }} --pack \
            --domain_cap=1 --domain_window_d=14 --email_cooldown_d=14 --vendor_company_d=14 | tee dry1.log
          F=$(grep -oE '"final":\s*[0-9]+' dry1.log | tail -1 | awk -F: '{print $2+0}')
          echo "final=$F" >> $GITHUB_OUTPUT
          echo "### Try A → final=$F" >> "$GITHUB_STEP_SUMMARY"

      - name: Send (A)
        if: steps.dry1.outputs.final && fromJSON(steps.dry1.outputs.final) >= 8
        env:
          TRIGGER_WINDOW_H: ${{ inputs.window_h }}
        run: |
          node scripts/send_triggered.js --dry=false --limit=${{ env.OUT_LIMIT }} --pack \
            --domain_cap=1 --domain_window_d=14 --email_cooldown_d=14 --vendor_company_d=14

      # Try B — 336h + discover
      - name: Discover Contacts (boost)
        if: steps.dry1.outputs.final && fromJSON(steps.dry1.outputs.final) < 8
        run: |
          node scripts/discover_contacts.js || true
          node scripts/validate_leads.js || true
          node scripts/leads_guard.js || true
          echo "discovered=done" >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run (B: 336h)
        id: dry2
        if: steps.dry1.outputs.final && fromJSON(steps.dry1.outputs.final) < 8
        env:
          TRIGGER_WINDOW_H: 336
        run: |
          node scripts/send_triggered.js --dry=true --limit=${{ env.OUT_LIMIT }} --pack \
            --domain_cap=1 --domain_window_d=14 --email_cooldown_d=14 --vendor_company_d=14 | tee dry2.log
          F=$(grep -oE '"final":\s*[0-9]+' dry2.log | tail -1 | awk -F: '{print $2+0}')
          echo "final=$F" >> $GITHUB_OUTPUT
          echo "### Try B → final=$F" >> "$GITHUB_STEP_SUMMARY"

      - name: Send (B)
        if: steps.dry2.outputs.final && fromJSON(steps.dry2.outputs.final) >= 8
        env:
          TRIGGER_WINDOW_H: 336
        run: |
          node scripts/send_triggered.js --dry=false --limit=${{ env.OUT_LIMIT }} --pack \
            --domain_cap=1 --domain_window_d=14 --email_cooldown_d=14 --vendor_company_d=14

      # Try C — 336h + relaxed persona
      - name: Relax persona (once)
        if: steps.dry2.outputs.final && fromJSON(steps.dry2.outputs.final) < 8
        run: |
          cat > /tmp/persona_relaxed.json <<'JSON'
          ["security","trust","privacy","legal","procurement","sourcing","vendor","thirdparty","compliance","risk","dpo","gdpr"]
          JSON
          echo "PERSONA_RULES=/tmp/persona_relaxed.json" >> $GITHUB_ENV
          echo "persona=relaxed" >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run (C: 336h + relaxed persona)
        id: dry3
        if: steps.dry2.outputs.final && fromJSON(steps.dry2.outputs.final) < 8
        env:
          TRIGGER_WINDOW_H: 336
        run: |
          node scripts/send_triggered.js --dry=true --limit=${{ env.OUT_LIMIT }} --pack \
            --domain_cap=1 --domain_window_d=14 --email_cooldown_d=14 --vendor_company_d=14 | tee dry3.log
          F=$(grep -oE '"final":\s*[0-9]+' dry3.log | tail -1 | awk -F: '{print $2+0}')
          echo "final=$F" >> $GITHUB_OUTPUT
          echo "### Try C → final=$F" >> "$GITHUB_STEP_SUMMARY"

      - name: Send (C)
        if: steps.dry3.outputs.final && fromJSON(steps.dry3.outputs.final) >= 8
        env:
          TRIGGER_WINDOW_H: 336
        run: |
          node scripts/send_triggered.js --dry=false --limit=${{ env.OUT_LIMIT }} --pack \
            --domain_cap=1 --domain_window_d=14 --email_cooldown_d=14 --vendor_company_d=14

      # Try D — 336h + relaxed caps
      - name: Relax caps (once)
        if: steps.dry3.outputs.final && fromJSON(steps.dry3.outputs.final) < 8
        run: |
          echo "DOMAIN_CAP=4" >> $GITHUB_ENV
          echo "DOMAIN_WINDOW_DAYS=7" >> $GITHUB_ENV
          echo "EMAIL_COOLDOWN_DAYS=7" >> $GITHUB_ENV
          echo "VENDOR_COMPANY_COOLDOWN_DAYS=7" >> $GITHUB_ENV
          echo "caps=relaxed" >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run (D: 336h + caps)
        id: dry4
        if: steps.dry3.outputs.final && fromJSON(steps.dry3.outputs.final) < 8
        env:
          TRIGGER_WINDOW_H: 336
        run: |
          node scripts/send_triggered.js --dry=true --limit=${{ env.OUT_LIMIT }} --pack \
            --domain_cap=4 --domain_window_d=7 --email_cooldown_d=7 --vendor_company_d=7 | tee dry4.log
          F=$(grep -oE '"final":\s*[0-9]+' dry4.log | tail -1 | awk -F: '{print $2+0}')
          echo "final=$F" >> $GITHUB_OUTPUT
          echo "### Try D → final=$F" >> "$GITHUB_STEP_SUMMARY"

      - name: Send (D)
        if: steps.dry4.outputs.final && fromJSON(steps.dry4.outputs.final) >= 8
        env:
          TRIGGER_WINDOW_H: 336
        run: |
          node scripts/send_triggered.js --dry=false --limit=${{ env.OUT_LIMIT }} --pack \
            --domain_cap=4 --domain_window_d=7 --email_cooldown_d=7 --vendor_company_d=7

      # Try E — 720h (30d fallback)
      - name: Dry run (E: 720h 30d fallback)
        id: dry5
        if: steps.dry1.outputs.final && fromJSON(steps.dry1.outputs.final) < 8 && steps.dry2.outputs.final && fromJSON(steps.dry2.outputs.final) < 8 && steps.dry3.outputs.final && fromJSON(steps.dry3.outputs.final) < 8 && steps.dry4.outputs.final && fromJSON(steps.dry4.outputs.final) < 8
        env:
          TRIGGER_WINDOW_H: 720
          FALLBACK_30D: "1"
        run: |
          node scripts/send_triggered.js --dry=true --limit=${{ env.OUT_LIMIT }} --pack \
            --domain_cap=4 --domain_window_d=7 --email_cooldown_d=7 --vendor_company_d=7 | tee dry5.log
          F=$(grep -oE '"final":\s*[0-9]+' dry5.log | tail -1 | awk -F: '{print $2+0}')
          echo "final=$F" >> $GITHUB_OUTPUT
          echo "### Try E (30d) → final=$F" >> "$GITHUB_STEP_SUMMARY"

      - name: Send (E)
        if: steps.dry5.outputs.final && fromJSON(steps.dry5.outputs.final) >= 8
        env:
          TRIGGER_WINDOW_H: 720
          FALLBACK_30D: "1"
        run: |
          node scripts/send_triggered.js --dry=false --limit=${{ env.OUT_LIMIT }} --pack \
            --domain_cap=4 --domain_window_d=7 --email_cooldown_d=7 --vendor_company_d=7

      - name: Summarize failure cause
        if: steps.dry1.outputs.final && fromJSON(steps.dry1.outputs.final) < 8 && steps.dry2.outputs.final && fromJSON(steps.dry2.outputs.final) < 8 && steps.dry3.outputs.final && fromJSON(steps.dry3.outputs.final) < 8 && steps.dry4.outputs.final && fromJSON(steps.dry4.outputs.final) < 8 && steps.dry5.outputs.final && fromJSON(steps.dry5.outputs.final) < 8
        run: |
          echo "### Boost not enough (final still < 8)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Likely: pool small, vendor-match miss, evidence window empty, or suppression still tight." >> "$GITHUB_STEP_SUMMARY"
          echo "- Next: widen domains.csv weekly; run Discover Contacts; keep Try D/E CLI in place." >> "$GITHUB_STEP_SUMMARY"

      - name: Safe push changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            chmod +x scripts/git_safe_push.sh || true
            bash scripts/git_safe_push.sh "outreach: triggered boost+30d"
          else
            echo "no changes to commit"
          fi
