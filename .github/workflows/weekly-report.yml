name: Weekly Report
permissions:
  contents: write
jobs:
  weekly:
    runs-on: ubuntu-latest
    concurrency:
      group: weekly-report
      cancel-in-progress: true
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install deps
      run: npm i dayjs fs-extra
    - name: Build weekly report
      run: node scripts/weekly_report.js
    - name: Commit report
      run: "set -e\ngit config user.name \"bot\"\ngit config user.email \"bot@users.noreply.github.com\"\
        git add -A public vendors reports updates _redirects _headers || true
        No new report.\"\nelse\n  git commit -m \"chore(report): publish weekly\"\n\
        \  git push\nfi\n"
'on':
  workflow_dispatch: {}
  schedule:
  - cron: 10 3 * * 1
