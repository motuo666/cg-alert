name: Check Secrets

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    # 如果你的 Secrets 放在某个 Environment（例如 production），取消注释下一行并改成你的环境名
    # environment: production
    env:
      IMAP_HOST: ${{ secrets.IMAP_HOST }}
      IMAP_PORT: ${{ secrets.IMAP_PORT }}
      IMAP_USER: ${{ secrets.IMAP_USER }}
      IMAP_PASS: ${{ secrets.IMAP_PASS }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
    steps:
      - name: Show presence (no values printed)
        run: |
          for n in IMAP_HOST IMAP_PORT IMAP_USER IMAP_PASS SLACK_WEBHOOK; do
            if [ -z "${!n}" ]; then
              echo "$n = MISSING"
            else
              echo "$n = OK"
            fi
          done
