name: Build Diff Visuals
permissions:
  contents: write
jobs:
  build-diffs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Normalize evidence pairs
      run: node scripts/normalize_evidence_pairs.js
    - name: Generate diff visuals
      run: node scripts/generate_diff_visuals.js
    - name: Inject diff links
      run: node scripts/inject_diff_links.js
    - name: Commit diffs (if any)
      shell: bash
      run: "set -e\ngit config user.email \"bot@cg-alert.com\"\ngit config user.name\
        git add -A public vendors reports updates _redirects _headers || true
        \ --quiet; then\n  echo \"No diffs to commit\"\nelse\n  git commit -m \"evidence:\
        \ add word-level diffs and links\"\n  git pull --rebase --autostash || true\n\
        \  git push\nfi\n"
'on':
  workflow_dispatch: null
  schedule:
  - cron: 0 6 * * 1
