name: Policy Auto-Escalate
on:
  schedule:
    - cron: "20 12 * * *"   # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      MIN_SENT7_FOR_DLVR: "${{ vars.MIN_SENT7_FOR_DLVR || '120' }}"
      UNSUB_7D_MAX: "${{ vars.UNSUB_7D_MAX || '1.0' }}"
      BOUNCE_7D_MAX: "${{ vars.BOUNCE_7D_MAX || '5.0' }}"
      COMPLAINT_7D_MAX: "${{ vars.COMPLAINT_7D_MAX || '0.1' }}"
      TARGET_EVID_TODAY: "${{ vars.TARGET_EVID_TODAY || '10' }}"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compute rolling KPIs (7d/14d)
        id: kpi
        run: node ops/compute_rolling_kpis.js

      - name: Sync metrics to public (best-effort)
        run: |
          mkdir -p public/reports/metrics
          cp -f reports/metrics/rolling.json public/reports/metrics/rolling.json || true

      - name: Read current max
        id: cur
        run: echo "current=$(node -e "process.stdout.write(String(require('./config/volume_policy.json').max))")" >> $GITHUB_OUTPUT

      - name: Decide & apply (escalate to 100)
        if: steps.kpi.outputs.ok == 'true' && steps.cur.outputs.current != '100'
        run: |
          node ops/set_policy_max.js 100
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add config/volume_policy.json reports/metrics/rolling.json public/reports/metrics/rolling.json || true
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "policy: auto-escalate max to 100 (kpi ok: ${{ steps.kpi.outputs.reason }})" || echo "no changes"
          git pull --rebase --autostash || true
          git push || true

      - name: Decide & apply (de-escalate to 80)
        if: steps.kpi.outputs.ok != 'true' && steps.cur.outputs.current != '80'
        run: |
          node ops/set_policy_max.js 80
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add config/volume_policy.json reports/metrics/rolling.json public/reports/metrics/rolling.json || true
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "policy: auto-de-escalate max to 80 (kpi fail: ${{ steps.kpi.outputs.reason }})" || echo "no changes"
          git pull --rebase --autostash || true
          git push || true

      - name: Persist metrics only (no policy change)
        if: (steps.kpi.outputs.ok == 'true' && steps.cur.outputs.current == '100') || (steps.kpi.outputs.ok != 'true' && steps.cur.outputs.current == '80')
        run: |
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add reports/metrics/rolling.json public/reports/metrics/rolling.json || true
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "metrics: rolling kpis" || echo "no metric changes"
          git push || true

      - name: Slack notify (policy & KPI)
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL || vars.SLACK_WEBHOOK_URL }}
        run: |
          set -e
          status="${{ steps.kpi.outputs.ok }}"
          reason="${{ steps.kpi.outputs.reason }}"
          cur="${{ steps.cur.outputs.current }}"
          sent7="${{ steps.kpi.outputs.sent7 }}"
          unsub="${{ steps.kpi.outputs.unsub7_pct }}"
          bounce="${{ steps.kpi.outputs.bounce7_pct }}"
          complaint="${{ steps.kpi.outputs.complaint7_pct }}"
          evidence="${{ steps.kpi.outputs.evidence1 }}"
          text="Policy Auto-Escalate → ${{ github.ref_name }} • ok=${status} • policy.max=${cur} • sent7=${sent7} • unsub7%=${unsub} • bounce7%=${bounce} • complaint7%=${complaint} • evidence1=${evidence} • ${reason}"
          payload=$(printf '{"text": "%s"}' "$text" | sed 's/"/\"/g')
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sS -X POST -H 'Content-Type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL" >/dev/null || true
          else
            echo "SLACK_WEBHOOK_URL not set; skipping"
          fi
