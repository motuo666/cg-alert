<!doctype html>
<html lang="en">
<head>
<meta name="worker-url" content="https://api.cg-alert.com">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Request Enterprise — CG Alert</title>
  <meta name="description" content="Tell us your vendors and delivery preferences.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; connect-src 'self' https://buy.stripe.com https://api.cg-alert.com; frame-src https://buy.stripe.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'self' https://buy.stripe.com https://forms.gle;">
  <link rel="canonical" href="https://www.cg-alert.com/intake/">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">

<link rel="stylesheet" href="/assets/home-v3c.css">
</head>
<body>
<header class="cg-topbar">
  <div class="cg-wrap cg-nav">
    <a class="cg-brand" href="/"><img src="/icon.svg" alt="CG Alert" width="40" height="40"><span>CG&nbsp;Alert</span></a>
    <nav class="cg-links" id="topnav">
      <a href="/#pricing">Pricing</a>
      <a href="/#how">How it works</a>
      <a href="/#evidence">Evidence</a>
      <a href="/#compare">Compare</a>
      <a href="/#faq">FAQ</a>
      
    </nav>
  </div>
</header>
<section class="cg-wrap">
<form id="intake-app" novalidate>
  <h1 class="cg-title">Request Enterprise</h1>
  <p class="cg-sub">Tell us who you need monitored. We’ll reply shortly.</p>

  <div class="cg-grid">
    <label>Email (work preferred)
      <input type="email" name="email" placeholder="you@company.com" required autocomplete="email">
      <small class="hint">We'll contact you at this address.</small>
    </label>

    <label>Company name
      <input type="text" name="company" placeholder="Acme Corp" required autocomplete="organization">
    </label>

    <label>Vendors to monitor (comma or newline separated)
      <textarea name="vendors" rows="4" placeholder="okta.com, slack.com, atlassian.com" required></textarea>
      <small class="hint">Add 3–200 domains. We’ll expand to pricing / terms / DPA / subprocessors / status pages automatically.</small>
    </label>

    <label>Budget
      <select name="budget" required>
        <option value="" selected disabled>Choose…</option>
        <option>$3k–$6k / yr</option>
        <option>$6k–$18k / yr</option>
        <option>$18k–$50k / yr</option>
        <option>$50k+ / yr</option>
      </select>
    </label>

    <label>Notes (optional)
      <textarea name="notes" rows="3" placeholder="Anything we should know? Renewal dates, SLAs, data residency, etc."></textarea>
    </label>
  </div>

  <div class="cg-actions">
    <button id="btn-submit" type="submit">Submit</button>
    <span id="status" role="status" aria-live="polite"></span>
  </div>

  <style>
  /* scoped styles */
  #intake-app { max-width: 880px; margin: 0 auto; background: #fff; border:1px solid #e5e7eb; border-radius: 12px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,.03); }
  #intake-app .cg-title { margin: 0 0 6px; font-size: 28px; line-height: 1.2; color:#0b1e3a; }
  #intake-app .cg-sub { margin: 0 0 18px; color:#475569; }
  #intake-app .cg-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  #intake-app label { display:block; font-weight:600; color:#0b1e3a; }
  #intake-app input, #intake-app textarea, #intake-app select { width:100%; margin-top:8px; padding:12px 14px; border:1px solid #cbd5e1; border-radius:10px; font: inherit; }
  #intake-app input:focus, #intake-app textarea:focus, #intake-app select:focus { outline: 2px solid #2563eb22; border-color:#2563eb; }
  #intake-app .hint { display:block; color:#64748b; font-weight:400; }
  #intake-app .cg-actions { display:flex; align-items:center; gap:12px; margin-top: 10px; }
  #intake-app button { background:#0b66ff; color:#fff; border:0; padding:12px 18px; border-radius:10px; cursor:pointer; font-weight:700; }
  #intake-app button[disabled] { opacity:.6; cursor:not-allowed; }
  #status { min-height: 1.2em; font-size: 14px; color:#0b1e3a; }
  #status.ok { color:#047857; } 
  #status.err { color:#b91c1c; }
  @media (min-width: 860px){ #intake-app .cg-grid { grid-template-columns: 1fr 1fr; } #intake-app .cg-grid > label:nth-child(3), #intake-app .cg-grid > label:nth-child(5) { grid-column: 1/-1; } }
  </style>

  <script>
  (function(){
    const form = document.currentScript.closest('#intake-app');
    const btn = form.querySelector('#btn-submit');
    const status = form.querySelector('#status');

    function getWorkerBase(){
      const m = document.querySelector('meta[name="worker-url"]');
      return (m && m.content) ? m.content.replace(/\/$/, '') : '';
    }

    function collect(){
      const fd = new FormData(form);
      return {
        email: (fd.get('email')||'').trim(),
        company: (fd.get('company')||'').trim(),
        vendors: (fd.get('vendors')||'').trim(),
        budget: (fd.get('budget')||'').trim(),
        notes: (fd.get('notes')||'').trim(),
        source: 'intake-form'
      };
    }

    function validate(){
      // rely on HTML5; plus vendors must include at least one dot
      const vendors = form.querySelector('[name="vendors"]');
      const v = vendors.value.trim();
      if(!v || !/[a-z0-9.-]+\.[a-z]{2,}/i.test(v)){
        vendors.setCustomValidity('Please provide at least one vendor domain.');
      } else {
        vendors.setCustomValidity('');
      }
      return form.reportValidity();
    }

    async function submitLead(e){
      e.preventDefault();
      if(!validate()) return;
      const data = collect();
      const base = getWorkerBase();
      const url = base ? (base + '/lead') : '/lead';
      btn.disabled = true;
      status.className = '';
      status.textContent = 'Submitting…';

      try{
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
          credentials: 'omit',
          mode: 'cors',
        });
        let ok = false, payload = null;
        if (res && res.ok) {
          const ct = res.headers.get('content-type') || '';
          if (ct.includes('application/json')) payload = await res.json();
          ok = !payload || payload.ok !== false;
        }
        if (ok){
          status.className = 'ok';
          status.textContent = 'Success — we will get back to you shortly.';
          form.reset();
        } else {
          status.className = 'err';
          status.textContent = 'Submission failed — please try again.';
        }
      } catch(err){
        status.className = 'err';
        status.textContent = 'Submission failed — please try again.';
      } finally {
        btn.disabled = false;
      }
    }

    form.addEventListener('submit', submitLead);
  })();
  </script>
</form>

  <script>
    // If you deploy with ENV replacements, set window.WORKER_URL / window.INTAKE_FORM_URL here.
    window.WORKER_URL = window.WORKER_URL || "";
    window.INTAKE_FORM_URL = window.INTAKE_FORM_URL || "";
  </script>
  <script src="/assets/app-intake.js" defer></script>
</section>

<footer class="cg-footer">
  <div class="cg-wrap cg-footlinks">
    <a href="/who-uses/">Who uses</a>
    <a href="/about/">About</a>
    <a href="/reports/">Reports</a>
    <a href="/rss/index.xml">RSS</a>
    <a href="/terms/">Terms</a>
    <a href="/privacy/">Privacy</a>
    <span>© CG Alert — evidence-backed vendor change alerts.</span>
  </div>
</footer>

<script src="/assets/intake-submit.js" defer></script>
</body>
</html>
