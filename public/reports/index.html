<style>
main{max-width:960px;margin:24px auto;padding:0 16px}
h1{font-size:28px;margin:12px 0 8px}
h2{font-size:20px;margin:20px 0 8px;border-bottom:1px solid #eee;padding-bottom:4px}
ul{padding-left:18px}
li{margin:4px 0}
.small{color:#6b7280;font-size:14px}
</style>

<script>
(async function(){
  const mount = document.getElementById('reports-mount');
  try{
    const res = await fetch('/reports/index.json', {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    // expected shape: { months: { 'YYYY-MM': ['vendor1','vendor2', ...] } } or array-like
    const months = data.months || data;
    const monthKeys = Object.keys(months).sort().reverse();
    const frag = document.createDocumentFragment();
    monthKeys.forEach(m => {
      const h2 = document.createElement('h2'); h2.textContent = m;
      frag.appendChild(h2);
      const ul = document.createElement('ul');
      (months[m] || []).forEach(v => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = `/reports/${m}/${v}/`; a.textContent = v;
        li.appendChild(a); ul.appendChild(li);
      });
      frag.appendChild(ul);
    });
    mount.innerHTML = '';
    mount.appendChild(frag);
  } catch (e){
    mount.innerHTML = '<p style="color:#b91c1c">Failed to load reports/index.json</p>';
    console.error(e);
  }
})();
</script>

</head>
<body>
<main>

<h1>Vendor Change Packs</h1>
<p class="small">Verified change packs by month and vendor. All times in UTC.</p>
<div id="reports-mount"><p class="small">Loading…</p></div>

</main>
</body>
