name: On Failure Notify
on:
  workflow_run:
    workflows:
      - Daily Ops
      - Auto Acceptance
      - CTA Health Repair
      - Heartbeat
      - Programmatic SEO Pages
      - Weekly Report
    types: [completed]
permissions:
  contents: read
  issues: write
jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Open GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `❗ Pipeline failed: ${context.payload.workflow.name} @ ${context.payload.workflow_run.head_branch}`;
            const body = [
              `Workflow: **${context.payload.workflow.name}**`,
              `Run: ${context.payload.workflow_run.html_url}`,
              `Conclusion: ${context.payload.workflow_run.conclusion}`,
              `Event: ${context.payload.workflow_run.event}`,
              '',
              'Please triage. This issue was created automatically.'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title, body, labels: ['pipeline-failure']
            });
      - name: Slack (optional)
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -X POST -H 'Content-type: application/json' \
              --data "$(jq -n --arg t "Pipeline failed: ${{ github.event.workflow.name }}" '{text:$t}')" \
              "$SLACK_WEBHOOK_URL"
          else
            echo "No SLACK_WEBHOOK_URL set."
