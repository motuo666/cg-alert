name: Check Vars & Secrets
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/check-secrets.yml'
      - 'scripts/ci/check_secrets.sh'
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
      MAIL_POSTAL_ADDRESS: ${{ vars.MAIL_POSTAL_ADDRESS }}
      STRIPE_LINK_RENEWAL_DESK: ${{ vars.STRIPE_LINK_RENEWAL_DESK }}
      STRIPE_LINK_PORTFOLIO: ${{ vars.STRIPE_LINK_PORTFOLIO }}
      STRIPE_LINK_COMPLIANCE: ${{ vars.STRIPE_LINK_COMPLIANCE }}
      STRIPE_LINK_ENTERPRISE: ${{ vars.STRIPE_LINK_ENTERPRISE }}
      INTAKE_FORM_URL: ${{ vars.INTAKE_FORM_URL }}
      WORKER_URL: ${{ vars.WORKER_URL }}
      UNSUB_HMAC_SECRET: ${{ secrets.UNSUB_HMAC_SECRET }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      IMAP_HOST: ${{ secrets.IMAP_HOST }}
      IMAP_PORT: ${{ secrets.IMAP_PORT }}
      IMAP_USER: ${{ secrets.IMAP_USER }}
      IMAP_PASS: ${{ secrets.IMAP_PASS }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required vars/secrets
        run: |
          chmod +x scripts/ci/check_secrets.sh
          scripts/ci/check_secrets.sh
