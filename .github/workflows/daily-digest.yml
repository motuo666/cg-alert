name: Daily Digest
on:
  schedule: [ { cron: "5 15 * * *" } ]  # 每天 09:05 MT
  workflow_dispatch: {}
permissions: { contents: read }

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env
        run: echo "TODAY=$(date -u +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Compute metrics (header-aware)
        id: m
        run: |
          set -e
          f="data/leads.csv"
          if [ ! -f "$f" ]; then
            echo "sent=0" >> $GITHUB_OUTPUT
            echo "err=0" >> $GITHUB_OUTPUT
            echo "pending=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          awk -F',' '
            NR==1{
              for(i=1;i<=NF;i++){ gsub(/^[ \t]+|[ \t]+$/,"",$i); idx[$i]=i }
              s=idx["status"]; t=idx["last_sent"]; next
            }
            {
              status=(s? $s:""); ts=(t? $t:"");
              if(status=="sent" && ts ~ ENVIRON["TODAY"]) sent++
              if(status ~ /^err/) err++
              if(status=="" || status=="new" || status=="retry") pending++
            }
            END{
              printf("sent=%d\nerr=%d\npending=%d\n", sent+0, err+0, pending+0)
            }
          ' "$f" >> $GITHUB_OUTPUT

      - name: Post to Slack
        if: ${{ success() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TODAY: ${{ env.TODAY }}
          SENT: ${{ steps.m.outputs.sent }}
          ERR: ${{ steps.m.outputs.err }}
          PENDING: ${{ steps.m.outputs.pending }}
        run: |
          msg="Daily ${TODAY} — sent:${SENT}, err:${ERR}, pending:${PENDING}"
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "$msg"
            exit 0
          fi
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\"$msg\"}" "$SLACK_WEBHOOK_URL" >/dev/null
