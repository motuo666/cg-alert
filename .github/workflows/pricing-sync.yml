name: Pricing Sync
on:
  schedule:
  - cron: 21 3 * * *
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  pricing:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Sync pricing (ESM, no enterprise link)
      env:
        SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://www.cg-alert.com' }}
        STRIPE_LINK_PORTFOLIO: ${{ secrets.STRIPE_LINK_PORTFOLIO || vars.STRIPE_LINK_PORTFOLIO
          }}
        STRIPE_LINK_BUSINESS: ${{ secrets.STRIPE_LINK_BUSINESS  || vars.STRIPE_LINK_BUSINESS  }}
      run: 'set -e

        node scripts/pricing_sync.mjs

        '
    - name: Install deps
      run: npm ci
concurrency:
  group: cg-full-pipeline
  cancel-in-progress: false
