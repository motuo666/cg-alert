name: Check Vars & Secrets
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/check-secrets.yml'
      - '**/*.yml'
      - '**/*.yaml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required variables
        run: |
          set -e
          missing=0
          req_vars=("SITE_ORIGIN" "INTAKE_FORM_URL" "STRIPE_LINK_PORTFOLIO")
          for v in "${req_vars[@]}"; do
            val="${{ vars.${{''}}v }}"
            if [ -z "${{ github.vars[$v] }}" ]; then
              echo "::error title=$v missing::Set Actions → Variables → $v"; missing=1
            fi
          done
          exit $missing
