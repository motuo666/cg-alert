name: Vendors Build
on:
  workflow_dispatch: {}
  schedule:
    - cron: '13 3 * * *'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLISH_DIR: .
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci || npm install
      - name: Build reports index
        run: node scripts/build_vendors_index.mjs
      - name: Render evidence pages
        run: node scripts/render_evidence_pages.mjs
      - name: Commit & push if changes
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add reports
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "Vendors Build: render reports index & pages"
            git pull --rebase --autostash || true
            git push
          fi
