name: emergency-sanitize
on:
  workflow_dispatch: {}

jobs:
  sanitize:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm i
      - name: Sanitize legacy report pages
        run: node scripts/sanitize_reports.js
      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
git add public reports || true
          git commit -m "sanitize: replace GH run links with site snapshots" || echo "Nothing to commit"
          git push
