name: Workflows Doctor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install YAML parser
        run: npm i yaml@2

      - name: Run doctor
        run: node scripts/workflows_doctor.js

      # 不能直接 push 改 workflows，改走 PR（GITHUB_TOKEN 允许）
      - name: Create PR with fixes
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: fix workflows yaml (doctor v2)'
          branch: bot/workflows-doctor
          title: 'Fix workflows yaml (doctor v2)'
          body: 'Automated fixes for YAML (remove stray true/false at top, tabs→spaces, ensure on.workflow_dispatch & name, drop top-level git lines).'
          labels: 'automation'
          delete-branch: true
