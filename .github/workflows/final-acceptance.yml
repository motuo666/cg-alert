name: Final Acceptance
on:
  workflow_dispatch:

jobs:
  final-acceptance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanity check workspace for truncation markers
        shell: bash
        run: |
          set -euo pipefail
          # Check for accidental truncation/ellipsis markers without embedding guard-forbidden tokens here
          if grep -RIn --exclude-dir=.git -E '\.\.\.|…|conversation too long; truncated' . ; then
            echo "::error::Truncation/ellipsis markers found in repo"
            exit 1
          fi
          echo "OK: no truncation markers"
