name: CodeQL

on:
  push: { branches: [ "main" ] }
  pull_request: { branches: [ "main" ] }
  schedule: [ { cron: "20 14 * * 1" } ]  # 每周一 08:20 MT
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: { group: "codeql-${{ github.ref }}", cancel-in-progress: true }
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844c123c6a86e0a82  # v4.2.2
      - uses: github/codeql-action/init@0a818ac707c1f2c6af4bc985b7d0cfacb8bb1f36 # v3.30.7
        with: { languages: javascript }
      - uses: github/codeql-action/analyze@0a818ac707c1f2c6af4bc985b7d0cfacb8bb1f36 # v3.30.7
