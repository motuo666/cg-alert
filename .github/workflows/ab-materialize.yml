name: AB Materialize (pre-outreach)
on:
  schedule:
    - cron: '25 0 * * *'   # 在 Autopilot Step (00:35) 之前运行
  repository_dispatch:
    types: [autopilot_kick]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  mat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Materialize active email template
        run: node scripts/conversion/ab_materialize_active.js
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo no changes; else
            git config user.email "bot@cg-alert.com"
            git config user.name  "cg-alert-bot"
            git add templates/email/active.txt
            git commit -m "ab: materialize active template"
            git push
          fi
