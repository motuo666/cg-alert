name: Daily Ops
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"   # 每日 00:00 UTC

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install deps
        run: npm ci || npm i
      - name: Daily Ops Report
        run: node scripts/daily_ops_report.js || true
      - name: Correct sent_today (UTC)
        run: |
          node scripts/fix_sent_today.js
          echo "### Corrections (UTC)" >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/daily_ops.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with: { name: daily_ops, path: artifacts/daily_ops.json, if-no-files-found: warn }
