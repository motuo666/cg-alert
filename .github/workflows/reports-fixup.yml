name: Reports Fixup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run reports_fixup
        run: node scripts/reports_fixup.js
      - name: Commit fixes (if any)
        shell: bash
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add public/reports || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "reports: dedupe first header; fix evidence/report links"
            git push
          fi
