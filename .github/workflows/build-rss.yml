name: Build RSS

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    paths:
      - "reports/**"
      - "public/evidence/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://www.cg-alert.com' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build RSS (no deps)
        run: |
          set -e
          node -v
          node scripts/build_rss.js

      - name: Commit & Push if changed
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add -A public/rss.xml
          if git diff --cached --quiet; then
            echo "No RSS changes"
          else
            git commit -m "chore(rss): update rss.xml"
            git pull --rebase --autostash || true
            git push
          fi

      - name: Expose in summary
        run: |
          echo "RSS built at: ${SITE_ORIGIN%/}/rss.xml" >> $GITHUB_STEP_SUMMARY
