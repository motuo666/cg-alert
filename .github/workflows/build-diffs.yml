name: Build Diff Visuals

on:
  workflow_dispatch:
  push:
    paths:
      - 'public/evidence/**'

permissions:
  contents: write

jobs:
  build-diffs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Generate diff.html for evidence
        run: |
          set -e
          node scripts/build_diff_visuals.js
      - name: Commit diffs (if any)
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add -A public/evidence
          if git diff --cached --quiet; then
            echo "no diffs to commit"
          else
            git commit -m "evidence: add diff visualizations"
            git pull --rebase --autostash || true
            git push
          fi
