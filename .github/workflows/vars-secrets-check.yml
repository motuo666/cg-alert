name: Vars & Secrets Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Required VARIABLES
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
      WORKER_URL: ${{ vars.WORKER_URL }}
      UNSUB_ORIGIN: ${{ vars.UNSUB_ORIGIN }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
      REPLY_TO: ${{ vars.REPLY_TO }}
      MAIL_POSTAL_ADDRESS: ${{ vars.MAIL_POSTAL_ADDRESS }}
      STRIPE_LINK_PORTFOLIO: ${{ vars.STRIPE_LINK_PORTFOLIO }}
      STRIPE_LINK_BUSINESS: ${{ vars.STRIPE_LINK_BUSINESS }}
      INTAKE_FORM_URL: ${{ vars.INTAKE_FORM_URL }}
      # Optional VARIABLES
      DOMAIN_LIMIT: ${{ vars.DOMAIN_LIMIT }}
      SEND_SPACING_MS: ${{ vars.SEND_SPACING_MS }}
      ERROR_ABORT_THRESHOLD: ${{ vars.ERROR_ABORT_THRESHOLD }}
      ERROR_ABORT_WINDOW: ${{ vars.ERROR_ABORT_WINDOW }}
      SEED_SEND: ${{ vars.SEED_SEND }}
      RAMP_BASE: ${{ vars.RAMP_BASE }}
      RAMP_WEEKLY_INCREMENT: ${{ vars.RAMP_WEEKLY_INCREMENT }}
      RAMP_MAX: ${{ vars.RAMP_MAX }}
      # Required SECRETS
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      UNSUB_HMAC_SECRET: ${{ secrets.UNSUB_HMAC_SECRET }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      IMAP_HOST: ${{ secrets.IMAP_HOST }}
      IMAP_PORT: ${{ secrets.IMAP_PORT }}
      IMAP_USER: ${{ secrets.IMAP_USER }}
      IMAP_PASS: ${{ secrets.IMAP_PASS }}
      # Optional SECRETS
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Self check
        run: node scripts/check_env_and_secrets.js
