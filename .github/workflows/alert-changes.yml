name: Customer Alerts on Evidence Changes
on:
  push:
    paths:
      - 'evidence/**/*.json'
  workflow_dispatch:

permissions: { contents: read }

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Collect changed files
        run: |
          git diff --name-only HEAD^ HEAD | tee changed.txt
          echo "Changed:"
          cat changed.txt || true
      - uses: actions/setup-node@v4
        with: { node-version: '18' }
      - name: Run customer alerts
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/alert_changes.js changed.txt
