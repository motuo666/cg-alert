name: All Systems Go
on:
  workflow_dispatch:
  schedule:
    - cron: '23 1 * * *'

permissions:
  contents: read

jobs:
  dryrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required paths
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking required paths..."
          for p in index.html pricing/index.html reports/index.html rss/index.html intake/index.html assets; do
            if [ ! -e "$p" ]; then
              echo "::warning::missing $p"
            fi
          done
      - name: Placeholder scan (code only)
        shell: bash
        run: |
          bash scripts/ci/scan_placeholders.sh
