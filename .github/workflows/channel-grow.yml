name: Channel Grow (weekly)
on:
  schedule: [ { cron: "10 4 * * 1" } ]
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  channel:
    runs-on: ubuntu-latest
    concurrency: { group: cg-channel, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci || npm i --no-audit --no-fund || true
      - name: Run channel discovery
        run: node scripts/auto_append_domains.js --channel=1 || true
      - name: Commit & push
        run: |
          git config --local user.name "CG Bot"
          git config --local user.email "bot@cg-alert.com"
          git add -A && (git diff --cached --quiet || git commit -m "channel: weekly partner targets")
          git pull --rebase --autostash origin main || (git rebase --abort || true)
          git push origin HEAD:main || true
