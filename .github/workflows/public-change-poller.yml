name: Public Change Poller

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"  # 每 3 小时（UTC）

permissions:
  contents: write

concurrency:
  group: public-change-poller
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    env:
      # 站点根（用于生成外链、RSS 等）。脚本内也会兜底。
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
      # Proof 页基址（供 build_change_pack 使用，指向站内快照目录）
      PROOF_BASE: ${{ vars.SITE_ORIGIN }}/reports/proof
      # 保留页面正文，便于哈希/差异计算
      POLL_SAVE_BODY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci || npm i

      # ========== 采集 & 预处理 ==========
      - name: Poll public endpoints & normalize
        shell: bash
        run: |
          set -euo pipefail
          node scripts/poll_public_endpoints.js
          node scripts/normalize_evidence.js
          node scripts/evidence_enrich_provenance.js
          node scripts/extract_diff_excerpt.js
          node scripts/materiality_score.js
          node scripts/build_evidence_index.js

      # ========== 先修 ==========
      - name: Redact internal fields in evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/redact_public_fields.js

      # 生成站内 Proof（非阻断；自动适配 .mjs/.js）
      - name: Build local proof snapshots (non-blocking)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/build_proof_from_evidence.mjs ]; then
            node scripts/build_proof_from_evidence.mjs || true
          elif [ -f scripts/build_proof_from_evidence.js ]; then
            node scripts/build_proof_from_evidence.js || true
          else
            echo "skip: build_proof_from_evidence not found"
          fi

      # （可选）一次性清理历史页面中的 GitHub run 链接
      - name: Sanitize legacy report pages (non-blocking)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sanitize_reports.js || true

      # ========== 再展示 ==========
      - name: Build change packs & monthly rollups
        shell: bash
        run: |
          set -euo pipefail
          # 注意：build_change_pack.js 里优先用 PROOF_BASE/snapshot 链接
          node scripts/build_change_pack.js
          node scripts/build_who_uses.js
          node scripts/build_updates.js
          node scripts/monthly_checksum.js

      - name: Public index / sitemap / RSS
        shell: bash
        env:
          SITE_ORIGIN: ${{ env.SITE_ORIGIN }}
        run: |
          set -euo pipefail
          node scripts/generate_reports_index.js
          node scripts/generate_sitemap_rss.js

      # ========== 日报（可选，不阻断） ==========
      - name: Daily Ops snapshot (UTC, non-blocking)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/daily_ops_report.js || true
          node scripts/fix_sent_today.js || true
          if [ -f artifacts/daily_ops.json ]; then
            echo "## Poller Summary (UTC)" >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/daily_ops.json >> "$GITHUB_STEP_SUMMARY"
          fi

      # ========== 提交 ==========
      - name: Commit changes (if any)
        shell: bash
        run: |
          set -euo pipefail
          # 不限定路径，避免 pathspec 错误；确保 evidence/** 被纳入
          git add -A || true
          if [ -n "$(git status --porcelain)" ]; then
            git -c user.name="cg-bot" -c user.email="bot@cg-alert.com" commit -m "poller: redact+proof+packs+index+sitemap/rss"
            git pull --rebase --autostash || true
            git push
          else
            echo "no changes to commit"
          fi
