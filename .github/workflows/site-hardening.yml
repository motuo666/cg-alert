name: Site Hardening
on:
  workflow_dispatch:
    inputs:
      origin:
        description: "SITE_ORIGIN (e.g., https://www.cg-alert.com)"
        required: true
        default: "https://www.cg-alert.com"
      desc:
        description: "Default meta description"
        required: true
        default: "Evidence-backed vendor change alerts."
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Inject head meta
        run: |
          node cg-alert-main/scripts/inject_head_meta.js cg-alert-main "${{ inputs.origin }}" "${{ inputs.desc }}"
      - name: Commit changes
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "Site hardening: inject CSP/canonical/description"
            git push
          fi