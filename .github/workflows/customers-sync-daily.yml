name: Customers Sync Daily
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Merge intakes.csv -> customers.csv
        run: node scripts/customers_sync.js
      - name: Commit changes
        run: |
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add customers.csv
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "customers: sync from intakes.csv"
            git pull --rebase --autostash || true
            git push
          fi
