name: Poller Kick Hook
on:
  repository_dispatch:
    types: [poller_kick]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger 'Public Change Poller' by name or filename
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          set -e
          LIST=$(curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/$REPO/actions/workflows)
          WID=$(echo "$LIST" | jq -r '.workflows[] | select((.name|ascii_downcase|test("public.*change.*poller")) or (.path|test("public-change-poller"))) | .id' | head -n1)
          if [ -z "$WID" ]; then
            echo "::error::No Public Change Poller workflow found"; exit 1
          fi
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$REPO/actions/workflows/$WID/dispatches \
            -d "{\"ref\":\"$REF\",\"inputs\":{}}"
          echo "OK"
