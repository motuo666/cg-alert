name: Check Secrets

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Validate required vars/secrets
      shell: bash
      env:
        SITE_ORIGIN:            ${{ vars.SITE_ORIGIN }}
        INTAKE_FORM_URL:        ${{ vars.INTAKE_FORM_URL }}
        STRIPE_LINK_PORTFOLIO:  ${{ vars.STRIPE_LINK_PORTFOLIO }}

        SLACK_WEBHOOK_URL:      ${{ secrets.SLACK_WEBHOOK_URL }}

        SMTP_HOST:              ${{ secrets.SMTP_HOST }}
        SMTP_PORT:              ${{ secrets.SMTP_PORT }}
        SMTP_USER:              ${{ secrets.SMTP_USER }}
        SMTP_PASS:              ${{ secrets.SMTP_PASS }}
        MAIL_FROM:              ${{ secrets.MAIL_FROM }}

        IMAP_HOST:              ${{ secrets.IMAP_HOST }}
        IMAP_PORT:              ${{ secrets.IMAP_PORT }}
        IMAP_USER:              ${{ secrets.IMAP_USER }}
        IMAP_PASS:              ${{ secrets.IMAP_PASS }}

        CF_API_TOKEN:           ${{ secrets.CF_API_TOKEN }}
        STRIPE_WEBHOOK_SECRET:  ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        UNSUB_HMAC_SECRET:      ${{ secrets.UNSUB_HMAC_SECRET }}
      run: |
        missing=0

        req_vars=(SITE_ORIGIN INTAKE_FORM_URL STRIPE_LINK_PORTFOLIO)
        req_secrets=(SLACK_WEBHOOK_URL SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS MAIL_FROM IMAP_HOST IMAP_PORT IMAP_USER IMAP_PASS CF_API_TOKEN STRIPE_WEBHOOK_SECRET UNSUB_HMAC_SECRET)

        echo "=== Checking required Action variables ==="
        for v in "${req_vars[@]}"; do
          if [ -z "${!v}" ]; then
            echo "::error::$v missing (Actions → Variables)"
            missing=1
          else
            echo "OK $v"
          fi
        done

        echo "=== Checking required Action secrets ==="
        for s in "${req_secrets[@]}"; do
          if [ -z "${!s}" ]; then
            echo "::error::$s missing (Actions → Secrets)"
            missing=1
          else
            echo "OK $s"
          fi
        done

        # Don't print actual values, just OK/missing.
        if [ "$missing" != "0" ]; then
          exit 1
        fi
