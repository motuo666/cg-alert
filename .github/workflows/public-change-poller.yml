name: Public Change Poller
on:
  schedule: [ { cron: "5 0,6,12,18 * * 1-5" } ]
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  poll:
    runs-on: ubuntu-latest
    concurrency: { group: cg-write, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: node scripts/endpoint_inventory.js
      - env: { MAX_ENDPOINTS: "300", PER_HOST: "4" }
        run: node scripts/poll_public_endpoints.js
      - run: |
          node scripts/build_updates.js
          node scripts/seo_inject.js
      - name: Safe push
        run: |
          chmod +x scripts/git_safe_push.sh
          bash scripts/git_safe_push.sh "poller: evidence updates + site"
