name: Daily Bounce
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (if package.json present)
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run bounce sweep if present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/bounce_sweep.js ]; then
            if [ -f package.json ]; then npm ci || npm i; fi
            node scripts/bounce_sweep.js
          elif [ -f scripts/bounce_sweep.mjs ]; then
            if [ -f package.json ]; then npm ci || npm i; fi
            node scripts/bounce_sweep.mjs
          elif [ -f scripts/bounce_sweep.sh ]; then
            bash scripts/bounce_sweep.sh
          else
            echo "No bounce sweep script found; skipping."
          fi
