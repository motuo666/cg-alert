name: All Systems Go
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard workflows for forbidden placeholders
        shell: bash
        run: |
          set -euo pipefail
          bad='(<<ImageDisplayed>>|【turn[0-9]+[a-z]+[0-9]+】|PLACEHOLDER_|YOUR_TOKEN_HERE|CHANGE_ME)'
          # Exclude this workflow and final-acceptance from scan to avoid self-matching
          hits=$(grep -RInE "$bad" .github/workflows --exclude='all-systems-go.yml' --exclude='final-acceptance.yml' || true)
          if [[ -n "$hits" ]]; then
            echo "::error::Forbidden placeholder tokens detected:"
            echo "$hits"
            exit 1
          fi
          echo "OK: no placeholder tokens in workflows"
