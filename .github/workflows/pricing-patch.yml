  name: Pricing Patch

  on:
    workflow_dispatch:
      inputs:
        dry:
          description: "Dry run? (true/false)"
          required: true
          default: "true"
          type: choice
          options: ["true","false"]
        limit:
          description: "Soft limit / batch size"
          required: false
          default: "12"
        window_h:
          description: "Primary window hours"
          required: false
          default: "336"
    schedule:
      - cron: '17 3 * * *'

  permissions:
    contents: read

  jobs:
    job:
      runs-on: ubuntu-latest
      env:
        DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry || 'true' }}
        LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '12' }}
        WINDOW_H: ${{ github.event_name == 'workflow_dispatch' && inputs.window_h || '336' }}
        SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
        WORKER_URL: ${{ vars.WORKER_URL }}
      steps:
        - name: Checkout
          uses: actions/checkout@v4
        - name: Setup Node
          uses: actions/setup-node@v4
          with:
            node-version: '20'
            cache: 'npm'
        - name: Install deps
          run: |
            set -euo pipefail
            if [ -f package-lock.json ] || [ -f package.json ]; then
              npm ci || npm i
            fi
        - name: Pricing patch
shell: bash
run: |
  set -euo pipefail
  if [ -f scripts/pricing_patch.mjs ]; then
    node scripts/pricing_patch.mjs || true
  else
    echo "skip: scripts/pricing_patch.mjs not found"
  fi

