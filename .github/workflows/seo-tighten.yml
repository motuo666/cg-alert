name: SEO Tighten

on:
  push:
    paths:
      - 'vendors/**'
      - 'updates/**'
      - 'evidence/**'
  workflow_dispatch: {}

permissions: { contents: write }

jobs:
  seo:
    runs-on: ubuntu-latest
    env:
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://www.cg-alert.com' }}
      INTAKE_FORM_URL: ${{ vars.INTAKE_FORM_URL || secrets.INTAKE_FORM_URL || '' }}
      STRIPE_LINK_PORTFOLIO: ${{ vars.STRIPE_LINK_PORTFOLIO || secrets.STRIPE_LINK_PORTFOLIO || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci || npm i --no-audit --no-fund || true

      - name: Inject SEO
        run: node scripts/seo_inject.js || true

      - name: Inject CTA (Enable alerts / Buy Portfolio)
        run: node scripts/cta_inject.js

      - name: Safe push
        run: |
          git add -A vendors updates reports || true
          if [ -n "$(git status --porcelain)" ]; then
            chmod +x scripts/git_safe_push.sh || true
            bash scripts/git_safe_push.sh "seo tighten + CTA inject"
          else
            echo "no changes to commit"
          fi
