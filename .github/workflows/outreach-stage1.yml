name: Outreach S1 (daily)
on:
  schedule:
    - cron: "15 3 * * 1-5"   # 每个工作日 11:15 AM 北京/晚 3:15 UTC-7 自行换算
  workflow_dispatch:
    inputs:
      limit:
        description: "count"
        required: true
        default: "30"
jobs:
  s1:
    runs-on: ubuntu-latest
    concurrency: outreach
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm init -y && npm install nodemailer csv-parse csv-stringify
      - name: Segment S1
        run: node scripts/segment.js 1 0 "${{ github.event.inputs.limit || 30 }}"
      - name: Send S1
        env:
          CG_STAGE: "1"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: node scripts/send_bulk.js "data/targets_stage1.csv" "${{ github.event.inputs.limit || 30 }}" "0"
