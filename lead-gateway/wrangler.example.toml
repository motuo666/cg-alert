# lead-gateway/wrangler.example.toml
# Keep secrets out of VCS. This file is safe to commit.
name = "lead-gateway"
main = "src/index.js"
account_id = "YOUR_CF_ACCOUNT_ID"
compatibility_date = "2025-01-15"

# Real secrets to be set via:
#   wrangler secret put AUTH_USER
#   wrangler secret put AUTH_PASS
#   wrangler secret put GITHUB_REPO
#   wrangler secret put GITHUB_TOKEN
#   wrangler secret put KV_NAMESPACE_ID
