name: Lead Enrich

on:
  schedule:
    - cron: "0 */6 * * *" # every 6h
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lead-enrich
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    env:
      ENRICH_API_URL: ${{ vars.ENRICH_API_URL }}
      ENRICH_API_TOKEN: ${{ secrets.ENRICH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install

      - name: Enrich leads
        run: node scripts/lead_enrich_sync.js

      - name: Commit & push leads.csv
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add data/leads.csv || true
          if git diff --cached --quiet; then
            echo "no leads changes"
          else
            git commit -m "lead-enrich: updated leads.csv from enrichment API"
            git pull --rebase --autostash || true
            git push
          fi
