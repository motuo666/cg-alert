name: SEO Meta Inject
on:
  workflow_dispatch:
  schedule:
    - cron: '33 0 * * *'

permissions:
  contents: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Inject meta tags
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/inject_meta.mjs ]; then
            node scripts/inject_meta.mjs
          else
            echo "::warning::scripts/inject_meta.mjs not found"
          fi
