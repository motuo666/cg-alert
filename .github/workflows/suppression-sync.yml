name: Suppression Sync

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sync unsub from Cloudflare KV
        run: node scripts/sync_cf_kv.js
      - name: Commit
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add suppression/unsub.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "sync: unsub from KV"
            git pull --rebase --autostash || true
            git push
          fi
      - name: Install deps
        run: npm ci
