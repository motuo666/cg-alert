name: Normalize Evidence
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Run normalizer
        run: node scripts/normalize_evidence.mjs
      - name: Commit & push if changed
        shell: bash
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          # 必须包含 evidence 和 public/evidence
          git add -A evidence public/evidence
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "normalize evidence: fill missing hash + snapshots"
          git pull --rebase --autostash || true
          git push
