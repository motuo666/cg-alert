name: KPI Jumpstart
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    concurrency: { group: cg-write, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - name: Expand domains from pool (+150)
        run: node scripts/domains_expand_from_pool.js 150
      - run: node scripts/endpoint_inventory.js
      - name: Poll public endpoints (robots-aware)
        env:
          MAX_ENDPOINTS: "1000"
          PER_HOST: "6"
          VENDOR_DAILY_MAX: "2"   # ★ 新增：每 vendor 每天最多 2 条
        run: node scripts/poll_public_endpoints.js
      - run: |
          node scripts/build_updates.js
          node scripts/seo_inject.js
      - name: Safe push
        run: |
          chmod +x scripts/git_safe_push.sh
          bash scripts/git_safe_push.sh "kpi: expand domains + poll + site update"
