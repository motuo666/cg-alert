      TTD_LOOKBACK_HOURS: ${{ vars.TTD_LOOKBACK_HOURS }}
      UNSUB_7D_MAX: ${{ vars.UNSUB_7D_MAX }}
      COMPLAINT_7D_MAX: ${{ vars.COMPLAINT_7D_MAX }}
      BOUNCE_7D_MAX: ${{ vars.BOUNCE_7D_MAX }}
      REQUIRE_CHANGED_VENDORS: ${{ vars.REQUIRE_CHANGED_VENDORS }}
      DIGEST_MODE: daily
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - run: npm i nodemailer@6 fast-xml-parser@4.4.0 --no-save
    - name: Send weekly digest
      env:
        SMTP_HOST: ${{ secrets.SMTP_HOST }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASS: ${{ secrets.SMTP_PASS }}
        MAIL_FROM: ${{ vars.MAIL_FROM }}
        REPLY_TO: ${{ vars.REPLY_TO }}
        DIGEST_MODE: weekly
      run: node scripts/customer_digest.js
  seo_ping:
    runs-on: ubuntu-latest
    needs: feeds_and_sitemap
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Ping IndexNow
      env:
        SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://www.cg-alert.com' }}
        INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY || vars.INDEXNOW_KEY }}
      run: node scripts/seo/ping_indexnow.js
