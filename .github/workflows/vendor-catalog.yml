name: Vendor Catalog
on:
  schedule:
    - cron: '10 15 * * 1'  # 每周一 09:10 MT
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with: { node-version: '18' }
      - name: Build vendor catalog
        env:
          SITE_ORIGIN: 'https://www.cg-alert.com'
        run: node scripts/build_vendor_catalog.js
      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vendors/** api/vendors.json sitemap-vendors.xml || true
          git commit -m "chore(vendors): weekly refresh" || echo "nothing to commit"
          git push
