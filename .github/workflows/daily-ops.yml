name: Daily Ops (scheduled)
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v6
      with:
        node-version: 20
    - name: Install deps (if package.json exists)
      run: 'if [ -f package.json ]; then npm ci || npm i; fi

        '
    - name: Daily ops snapshot
      run: 'set -euo pipefail

        node scripts/daily_ops_report.js || true

        node scripts/fix_sent_today.js || true

        echo ''snapshot_ok=''$(test -f artifacts/daily_ops.json && echo 1 || echo
        0) >> $GITHUB_OUTPUT

        '
    - name: Append Job Summary
      if: always()
      run: "set -euo pipefail\necho \"## Daily Ops Snapshot (UTC)\" >> \"$GITHUB_STEP_SUMMARY\"\
        \nif [ -f artifacts/daily_ops.json ]; then\n  cat artifacts/daily_ops.json\
        \ >> \"$GITHUB_STEP_SUMMARY\"\nelse\n  echo '{\"note\":\"no daily_ops.json\
        \ produced\"}' >> \"$GITHUB_STEP_SUMMARY\"\nfi\n"
'on':
  workflow_dispatch: {}
  schedule:
  - cron: 12 * * * *
