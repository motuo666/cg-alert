name: Stripe Webhook → Intake

on:
  repository_dispatch:
    types: [stripe_webhook_intake]

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append to data/intakes.csv
        env:
          EMAIL: ${{ github.event.client_payload.email }}
          COMPANY: ${{ github.event.client_payload.company }}
          VENDORS: ${{ github.event.client_payload.vendors }}
          CADENCE: ${{ github.event.client_payload.cadence }}
        run: |
          set -euo pipefail
          mkdir -p data
          ts=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          printf "%s,%s,%s,%s,%s\n" "$ts" "${EMAIL:-}" "${COMPANY:-}" "${VENDORS:-}" "${CADENCE:-}" >> data/intakes.csv
      - name: Commit
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add data/intakes.csv
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "intake: append from webhook"
            git push
          fi
