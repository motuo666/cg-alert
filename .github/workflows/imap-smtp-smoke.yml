name: Imap/Smtp Smoke
on:
  schedule:
    - cron: '50 0 * * *'
  workflow_dispatch:
permissions: { contents: read }
jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      IMAP_HOST: ${{ secrets.IMAP_HOST || vars.IMAP_HOST }}
      IMAP_USER: ${{ secrets.IMAP_USER || vars.IMAP_USER }}
      IMAP_PASS: ${{ secrets.IMAP_PASS || vars.IMAP_PASS }}
      SMTP_HOST: ${{ secrets/SMTP_HOST || vars.SMTP_HOST }}
      SMTP_USER: ${{ secrets/SMTP_USER || vars.SMTP_USER }}
      SMTP_PASS: ${{ secrets/SMTP_PASS || vars/SMTP_PASS }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL || vars.SLACK_WEBHOOK_URL }}
    steps:
      - name: IMAP login (993)
        run: |
          set -e
          if [ -z "${IMAP_HOST}" ] || [ -z "${IMAP_USER}" ] || [ -z "${IMAP_PASS}" ]; then
            echo "IMAP secrets missing, skipping"; exit 0; fi
          sudo apt-get update -y >/dev/null && sudo apt-get install -y openssl >/dev/null
          echo -e "a1 LOGIN ${IMAP_USER} ${IMAP_PASS}\na2 LOGOUT" | \
            openssl s_client -crlf -quiet -connect "${IMAP_HOST}:993" -servername "${IMAP_HOST}" | tee imap.log
          grep -E "a1 OK|a2 OK" imap.log >/dev/null || (echo "::error::IMAP login failed" && false)
      - name: SMTP auth (587) (best-effort)
        run: |
          set -e
          if [ -z "${SMTP_HOST}" ] || [ -z "${SMTP_USER}" ] || [ -z "${SMTP_PASS}" ]; then
            echo "SMTP secrets missing, skipping"; exit 0; fi
          sudo apt-get update -y >/dev/null && sudo apt-get install -y swaks >/dev/null || true
          if command -v swaks >/dev/null; then
            swaks --server "${SMTP_HOST}" --port 587 --auth LOGIN --au "${SMTP_USER}" --ap "${SMTP_PASS}" --quit-after RCPT >/dev/null || (echo "::error::SMTP auth failed" && false)
          else
            echo "swaks not installed; skipping SMTP smoke"
          fi
      - name: Slack notify on failure
        if: failure()
        run: |
          if [ -n "${SLACK_WEBHOOK_URL}" ]; then
            curl -s -X POST -H 'Content-type: application/json' --data '{"text":"🚨 IMAP/SMTP Smoke 失败，请检查凭证或服务状态。"}' "${SLACK_WEBHOOK_URL}" || true
          fi
