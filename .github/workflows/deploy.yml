name: Deploy website to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - run: npm ci
    - run: npm run build
    - name: Prepare Pages artifact
      run: '# 把下面的 dist 改成你的真实构建产物目录（如 out、build、public）

        echo "www.cg-alert.com" > dist/CNAME

        touch dist/.nojekyll

        '
    - uses: actions/upload-pages-artifact@v4
      with:
        path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
'on':
  workflow_dispatch: null
  push:
    branches:
    - main
