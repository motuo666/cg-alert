name: Site UI Patch (pricing cleanup)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI patch
        run: node scripts/patch_pricing_ui.js
      - name: Commit
        run: |
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add index.html
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "site: pricing UI cleanup (drop compliance, rewrite CTA)"; git pull --rebase --autostash || true; git push; fi
