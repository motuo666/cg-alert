name: Outreach S1
on:
  schedule:
    - cron: '30 17 * * 1-5'   # 工作日 11:30 MT（夏令时）。冬令时记得换成 18:30 UTC
  workflow_dispatch:
permissions: { contents: write }
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '18' }
      - name: Install deps
        run: npm install nodemailer csv-parse csv-stringify
      - name: Run sender (S1)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          MAX_SEND_PER_RUN: '30'
          MIN_DELAY_SEC: '45'
          MAX_DELAY_SEC: '90'
          PER_DOMAIN_CAP: '2'
        run: node scripts/send_bulk.js
      - name: Commit updates (logs & marks)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/leads.csv logs/*.jsonl || true
          git commit -m "chore(outreach): S1 marks & logs" || echo "nothing to commit"
          git push
