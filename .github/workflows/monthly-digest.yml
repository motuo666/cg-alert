name: Monthly Digest
on:
  schedule:
    - cron: '0 0 1 * *'   # 09:00 JST on the 1st day of month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build monthly digest
        run: node scripts/monthly_digest.js
      - name: Commit
        run: |
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add public/digests || true
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "digest: publish" && git push; fi
