name: Workflows Lint
on:
  pull_request:
  push:
    paths:
      - ".github/workflows/**.yml"
      - ".github/workflows/**.yaml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-actionlint@v1
        with:
          reporter: local        # 输出到日志；不要求 checks: write
          fail_level: error      # 替代 fail_on_error，出现 error 级别即失败
          actionlint_version: latest
