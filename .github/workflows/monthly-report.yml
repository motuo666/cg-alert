name: Monthly Report
on:
  schedule: [ { cron: '0 1 1 * *' } ]  # UTC 01:00 on the 1st (JST 10:00)
  workflow_dispatch:
permissions: { contents: write }
jobs:
  monthly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/ops/monthly_report.js
      - name: Commit monthly report
        run: |
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add -A ops/monthly
          if git diff --cached --quiet; then echo "no monthly changes"; else git commit -m "ops: monthly report"; git pull --rebase --autostash || true; git push; fi
