name: Daily Outreach (APAC)

on:
  workflow_dispatch:
    inputs:
      dry:
        description: "Dry run? (true/false)"
        required: true
        default: "true"
        type: choice
        options: ["true","false"]
      limit:
        description: "Soft limit / batch size"
        required: false
        default: "12"
      window_h:
        description: "Primary window hours"
        required: false
        default: "336"
  schedule:
    - cron: '22 5 * * *'

permissions:
  contents: read

jobs:
  job:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        region: ["apac"]
    env:
      DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry || 'true' }}
      LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '12' }}
      WINDOW_H: ${{ github.event_name == 'workflow_dispatch' && inputs.window_h || '336' }}
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install deps
        run: |
          set -euo pipefail
          if [ -f package-lock.json ] || [ -f package.json ]; then
            npm ci || npm i
          fi
      - name: Send outreach
        shell: bash
        env:
          REGION: "${{ matrix.region }}"
        run: |
          set -euo pipefail
          SCRIPT="scripts/send_triggered.js"
          if [ -f "$SCRIPT" ]; then
            if [ "${DRY}" = "true" ]; then
              node "$SCRIPT" --dry --limit "${LIMIT}" --window "${WINDOW_H}" --region "${REGION}" || true
            else
              node "$SCRIPT" --limit "${LIMIT}" --window "${WINDOW_H}" --region "${REGION}" || true
            fi
          else
            echo "skip: $SCRIPT not found"
          fi
