name: Heartbeat
on:
  schedule:
    - cron: "0 * * * *"   # 每小时
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  beat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm i dayjs fs-extra
      - name: Check snapshot freshness
        env:
          HB_MAX_HOURS: "26"
        run: node scripts/heartbeat_check.js
