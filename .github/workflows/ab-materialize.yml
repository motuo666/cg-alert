name: AB Materialize
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "A/B variant name"
        required: false
        default: "A"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize AB templates
        shell: bash
        run: |
          set -euo pipefail
          echo "[ab] variant=${{ inputs.variant }}"
          [ -f outreach/templates/A.html ] || echo "::warning::missing outreach/templates/A.html"
          [ -f outreach/templates/B.html ] || echo "::warning::missing outreach/templates/B.html"
          echo "[ab] done"
