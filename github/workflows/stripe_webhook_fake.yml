name: Stripe Webhook Fake
on:
  workflow_dispatch:
    inputs:
      worker_url:
        description: "Cloudflare Worker 端点（以 /stripe 结尾）"
        required: true
      email:
        description: "测试邮箱"
        required: true
        default: "buyer@example.com"
jobs:
  fake:
    runs-on: ubuntu-latest
    steps:
      - name: Fake checkout.session.completed
        run: |
          curl -sS -X POST "${{ github.event.inputs.worker_url }}" \
            -H "Content-Type: application/json" \
            -d @- <<'JSON'
          {
            "id": "evt_test_checkout",
            "type": "checkout.session.completed",
            "data": {
              "object": {
                "amount_total": 298800,
                "currency": "usd",
                "customer_details": { "email": "${{ github.event.inputs.email }}" },
                "metadata": { "plan": "Portfolio" }
              }
            }
          }
          JSON
      - name: Fake invoice.paid
        run: |
          curl -sS -X POST "${{ github.event.inputs.worker_url }}" \
            -H "Content-Type: application/json" \
            -d @- <<'JSON'
          {
            "id": "evt_test_invoice",
            "type": "invoice.paid",
            "data": {
              "object": {
                "customer_email": "${{ github.event.inputs.email }}",
                "amount_paid": 600000,
                "currency": "usd",
                "lines": { "data": [ { "description": "Business annual" } ] }
              }
            }
          }
          JSON
