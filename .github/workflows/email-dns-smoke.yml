name: Email DNS Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "7 2 * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SPF/DKIM/DMARC (log-only)
        shell: bash
        run: |
          set -euo pipefail
          domain="cg-alert.com"
          out="dns-smoke.txt"
          {
            echo "[dns] $(date -u +%FT%TZ)"
            echo "[spf]"; dig +short TXT ${domain} || true
            echo "[dmarc]"; dig +short TXT _dmarc.${domain} || true
            echo "[dkim] (selector=default)"; dig +short TXT default._domainkey.${domain} || true
          } >> "${out}"
          echo "wrote ${out}"
