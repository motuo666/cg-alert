name: Auto Append Domains
on:
  schedule:
    - cron: '45 14 * * 1'   # 每周一 08:45 MT（夏令时）= 14:45 UTC
  workflow_dispatch:
permissions: { contents: write }
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: '18' }
      - name: Install deps
        run: npm install csv-parse csv-stringify
      - name: Append 10-20 domains
        env:
          BATCH_MIN: '30'
          BATCH_MAX: '50'
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/auto_append_domains.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/domains.csv || true
          git commit -m "chore(domains): weekly auto-append targets" || echo "nothing to commit"
          git push
