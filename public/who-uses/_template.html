  <!-- 统一追加页面级 UTM；自动给 Stripe/表单链接补 lid（幂等、不中断） -->
  <script>
  (function () {
    "use strict";
    function getCookie(name){
      var m = document.cookie.match(new RegExp('(?:^|;\\s*)'+name+'=([^;]+)'));
      return m ? decodeURIComponent(m[1]) : '';
    }
    // 只补缺失参数，不覆盖已有值；保持幂等
    function mergeParams(url, defaults){
      try{
        var u = new URL(url, location.origin);
        var page = new URL(location.href);
        // 把页面上的 utm_* 补到链接（链接已有则不覆盖）
        page.searchParams.forEach(function(v,k){
          if(/^utm_/.test(k) && !u.searchParams.has(k) && v) u.searchParams.set(k,v);
        });
        // 追加默认值
        for (var k in defaults){
          if (Object.prototype.hasOwnProperty.call(defaults,k) && !u.searchParams.has(k) && defaults[k] !== ''){
            u.searchParams.set(k, defaults[k]);
          }
        }
        return u.toString();
      }catch(e){ return url; }
    }

    var lid = getCookie('cg_lead_id'); // 无则由 lead.js 创建；这里不强制
    // —— 1) 标准购买按钮（保留你原有的 ID）
    var buy = document.getElementById('cg-buy-portfolio');
    if (buy && buy.href){
      buy.href = mergeParams(buy.href, {utm_source:'site',utm_medium:'cta',utm_campaign:'buy'});
      if (lid) {
        try {
          var u = new URL(buy.href, location.origin);
          if (!u.searchParams.get('lid')) u.searchParams.set('lid', lid);
          buy.href = u.toString();
        } catch(e){}
      }
    }

    // —— 2) 给页面内所有 Stripe 链接兜底补齐（避免漏网之鱼）
    try {
      var links = document.querySelectorAll('a[href*="buy.stripe.com"]');
      links.forEach(function(a){
        a.href = mergeParams(a.href, {utm_source:'site',utm_medium:'cta',utm_campaign:'buy'});
        if (lid) {
          var u3 = new URL(a.href, location.origin);
          if (!u3.searchParams.get('lid')) u3.searchParams.set('lid', lid);
          a.href = u3.toString();
        }
      });
    } catch(e){}

    // —— 3) 可选：给 Google Form 也带上页面级 UTM 与 lid（便于回填关联）
    var enable = document.getElementById('cg-enable-alerts');
    if (enable && enable.href){
      enable.href = mergeParams(enable.href, {});
      if (lid){
        try{
          var u2 = new URL(enable.href, location.origin);
          if (!u2.searchParams.get('lid')) u2.searchParams.set('lid', lid);
          enable.href = u2.toString();
        }catch(e){}
      }
    }
  })();
  </script>
