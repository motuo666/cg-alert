name: Weekly Evidence Hash
true:
  workflow_dispatch: {}
  schedule:
  - cron: 15 6 * * 1
permissions:
  contents: write
jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Compute weekly hash
      run: 'chmod +x scripts/compute_weekly_hash.sh || true

        bash scripts/compute_weekly_hash.sh public/reports/weekly_hash.json

        '
    - name: Commit + tag + push
      run: "git config user.email \"bot@cg-alert.com\"\ngit config user.name  \"cg-alert-bot\"\
        \ngit add -A public/reports/weekly_hash.json\nif git diff --cached --quiet;\
        \ then\n  echo \"no hash changes\"\nelse\n  git commit -m \"weekly: evidence\
        \ aggregate hash\"\nfi\ngit pull --rebase --autostash || true\ngit push --follow-tags\
        \ || git push --tags || true\n"
    - name: Summary
      run: 'echo "## Weekly Evidence Hash" >> $GITHUB_STEP_SUMMARY

        test -f public/reports/weekly_hash.json && cat public/reports/weekly_hash.json
        >> $GITHUB_STEP_SUMMARY || true

        '
'on':
  workflow_dispatch: null
