name: notify-new-contacts

on:
  workflow_dispatch:
    # 你想手动点一下就跑
  schedule:
    - cron: "*/15 * * * *"
    # 这行表示周期性跑（GitHub托管runner允许定时任务）
    # 作用：15分钟内新线索/新成交就会被发邮件

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install deps
        run: npm install nodemailer node-fetch@2

      - name: Notify leads/sales
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          WORKER_URL: "https://lead-gateway.manningtopps.workers.dev"
        run: node scripts/notify-new-contacts.js
