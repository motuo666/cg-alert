name: Outreach S3 (auto)
on:
  schedule: [ { cron: "45 16 * * *" } ]   # 每天 16:45 UTC
  workflow_dispatch: {}
jobs:
  s3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install nodemailer csv-parse csv-stringify --silent
      - name: Segment S3 (≥7天未回)
        run: node scripts/segment.js 3 7 30
      - name: Abort if no targets
        run: '[ -s data/targets_stage3.csv ] || { echo "no targets"; exit 0; }'
      - name: Send S3
        env:
          CG_STAGE: "3"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: node scripts/send_bulk.js "data/targets_stage3.csv" "30" "75"
