name: On Stripe Paid → Reconcile
on:
  repository_dispatch:
    types: [stripe_paid]
  workflow_dispatch:
    inputs:
      email:
        description: "Buyer email"
        required: true
        type: string
        default: "buyer@testco.com"
      plan:
        description: "Plan (portfolio|business|enterprise)"
        required: true
        type: choice
        options: ["portfolio","business","enterprise"]
        default: "portfolio"
      vendors:
        description: "Comma-separated domains (e.g. okta.com, slack.com)"
        required: false
        type: string
        default: "okta.com, slack.com"
      rhythm:
        description: "Delivery rhythm"
        required: true
        type: choice
        options: ["daily","weekly"]
        default: "weekly"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse event/inputs
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          payload="$(cat "$GITHUB_EVENT_PATH" 2>/dev/null || echo '{}')"
          email="$(jq -r '.client_payload.email // .inputs.email // ""' <<<"$payload")"
          plan="$(jq -r '.client_payload.plan // .inputs.plan // ""' <<<"$payload")"
          vendors="$(jq -r '.client_payload.vendors // .inputs.vendors // ""' <<<"$payload")"
          rhythm="$(jq -r '.client_payload.rhythm // .inputs.rhythm // "weekly"' <<<"$payload")"

          if [ -z "$email" ]; then
            echo "::error::email is required"; exit 1
          fi
          case "$plan" in
            portfolio|business|enterprise) ;;
            *) echo "::error::invalid plan: $plan (expect portfolio|business|enterprise)"; exit 1 ;;
          esac
          case "$rhythm" in
            daily|weekly) ;;
            *) echo "::error::invalid rhythm: $rhythm (expect daily|weekly)"; exit 1 ;;
          esac

          {
            echo "email=$email"
            echo "plan=$plan"
            echo "vendors=$vendors"
            echo "rhythm=$rhythm"
          } >> "$GITHUB_OUTPUT"

      - name: Upsert customers.csv
        shell: bash
        env:
          EMAIL: ${{ steps.parse.outputs.email }}
          PLAN: ${{ steps.parse.outputs.plan }}
          VENDORS: ${{ steps.parse.outputs.vendors }}
          RHYTHM: ${{ steps.parse.outputs.rhythm }}
        run: |
          set -euo pipefail
          file="customers.csv"
          test -f "$file" || echo 'email,company,plan,rhythm,vendors,created_at' > "$file"
          ts="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          tmp="$(mktemp)"
          awk -F, -v em="$EMAIL" 'BEGIN{IGNORECASE=1} NR==1{print; next} {gsub(/^\"|\"$/,"",$1); if($1!=em) print $0}' "$file" > "$tmp" || true
          mv "$tmp" "$file"
          printf '"%s","","%s","%s","%s","%s"\n' "$EMAIL" "$PLAN" "$RHYTHM" "$VENDORS" "$ts" >> "$file"

      - name: Commit reconciliation
        shell: bash
        env:
          EMAIL: ${{ steps.parse.outputs.email }}
        run: |
          set -euo pipefail
          if [ -x scripts/ci/commit_or_skip.sh ]; then
            chmod +x scripts/ci/commit_or_skip.sh
            scripts/ci/commit_or_skip.sh "stripe: reconcile customers ($EMAIL)"
          else
            git config user.email "bot@cg-alert.com"
            git config user.name  "cg-alert-bot"
            git add -A customers.csv
            if git diff --cached --quiet; then
              echo "no changes to commit"
            else
              git commit -m "stripe: reconcile customers ($EMAIL)"
              git pull --rebase --autostash || true
              git push || true
            fi
          fi

      - name: Slack notify
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL || vars.SLACK_WEBHOOK_URL }}
          EMAIL: ${{ steps.parse.outputs.email }}
          PLAN: ${{ steps.parse.outputs.plan }}
          VENDORS: ${{ steps.parse.outputs.vendors }}
          RHYTHM: ${{ steps.parse.outputs.rhythm }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          test -z "$SLACK_WEBHOOK_URL" && exit 0
          msg="✅ Stripe reconcile: $PLAN → $EMAIL"$'\n'"vendors=$VENDORS rhythm=$RHYTHM"$'\n'"$RUN_URL"
          jq -n --arg t "$msg" '{text: $t}'             | curl -sS -X POST -H 'Content-Type: application/json' -d @- "$SLACK_WEBHOOK_URL" >/dev/null
