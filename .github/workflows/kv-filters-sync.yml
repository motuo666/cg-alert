name: KV Filters Sync

on:
  schedule:
    - cron: "11 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply suppression filters (KV sync)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN || vars.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -f scripts/suppression_apply.js ]; then
            node scripts/suppression_apply.js
          else
            echo "::warning::scripts/suppression_apply.js not found. Skipping."
          fi
      - name: Commit changes (if any)
        run: |
          set -euo pipefail
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add -A || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "KV filters sync (auto)"
            git pull --rebase --autostash || true
            git push
          fi
