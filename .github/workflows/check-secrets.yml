name: Check Secrets
on: workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Show which secrets are present (no values printed)
        run: |
          test -n "${{ secrets.IMAP_HOST }}" && echo IMAP_HOST=OK || echo IMAP_HOST=MISSING
          test -n "${{ secrets.IMAP_PORT }}" && echo IMAP_PORT=OK || echo IMAP_PORT=MISSING
          test -n "${{ secrets.IMAP_USER }}" && echo IMAP_USER=OK || echo IMAP_USER=MISSING
          test -n "${{ secrets.IMAP_PASS }}" && echo IMAP_PASS=OK || echo IMAP_PASS=MISSING
          test -n "${{ secrets.SLACK_WEBHOOK }}" && echo SLACK_WEBHOOK=OK || echo SLACK_WEBHOOK=MISSING
