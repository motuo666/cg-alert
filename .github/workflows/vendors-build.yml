name: Vendors Build

on:
  schedule:
    - cron: '12 2 * * *'  # daily 02:12 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build vendors index & timelines
        run: |
          set -e
          node scripts/build_vendors_index.js
          node scripts/build_vendors_timeline.js
      - name: Commit & push
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add vendors api vendors.json || true
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "vendors: rebuild index & timelines"
            git pull --rebase --autostash || true
            git push
          fi