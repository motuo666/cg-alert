<!doctype html>
<html lang="en">
<head>
<meta name="worker-url" content="https://api.cg-alert.com">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Request Enterprise — CG Alert</title>
  <meta name="description" content="Tell us your vendors and delivery preferences.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; connect-src 'self' https://api.cg-alert.com; frame-src https://buy.stripe.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'self' https://buy.stripe.com https://forms.gle;"self'; img-src 'self' data:; connect-src 'self' https://buy.stripe.com https://api.cg-alert.com; frame-src https://buy.stripe.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'self' https://buy.stripe.com https://forms.gle;">
  <link rel="canonical" href="https://www.cg-alert.com/intake/">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">

<link rel="stylesheet" href="/assets/home-v3c.css">
</head>
<body>
<header class="cg-topbar">
  <div class="cg-wrap cg-nav">
    <a class="cg-brand" href="/"><img src="/icon.svg" alt="CG Alert" width="40" height="40"><span>CG&nbsp;Alert</span></a>
    <nav class="cg-links" id="topnav">
      <a href="/#pricing">Pricing</a>
      <a href="/#how">How it works</a>
      <a href="/#evidence">Evidence</a>
      <a href="/#compare">Compare</a>
      <a href="/#faq">FAQ</a>
      
    </nav>
  </div>
</header>
<section class="cg-wrap">
<form id="intake" novalidate data-worker="" data-form="">
    <input type="hidden" name="plan" value="enterprise">
    <label>Company Email<br><input name="email" type="email" required placeholder="you@company.com" style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;"></label>
    <div style="height:12px"></div>
    <label>Company Name<br><input name="company" required placeholder="Acme Inc." style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;"></label>
    <div style="height:12px"></div>
    <label>Vendors (comma separated)<br><input name="vendors" placeholder="okta.com, slack.com, ... " style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;"></label>
    <div style="height:12px"></div>
    <label>Frequency<br>
      <select name="cadence" style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;">
        <option value="weekly">Weekly</option>
        <option value="daily">Daily</option>
      </select>
    </label>
    <div style="height:16px"></div>
    <button type="submit" style="background:#0e7490;color:white;border:none;padding:10px 16px;border-radius:10px;">Submit</button>
    <div id="notice" aria-live="polite"></div>
  </form>

  <script>
    // If you deploy with ENV replacements, set window.WORKER_URL / window.INTAKE_FORM_URL here.
    window.WORKER_URL = window.WORKER_URL || "";
    window.INTAKE_FORM_URL = window.INTAKE_FORM_URL || "";
  </script>
  <script src="/assets/app-intake.js" defer></script>
</section>

<footer class="cg-footer">

  </div>
</footer>

</body>
</html>
