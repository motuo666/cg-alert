name: All Systems Go
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fail if placeholder/debug tokens exist
        shell: bash
        run: |
          set -euo pipefail
          bad='(<<ImageDisplayed>>|【turn[0-9]+[a-z]+[0-9]+】|PLACEHOLDER_|YOUR_TOKEN_HERE|CHANGE_ME)'
          hits=$(grep -RInE "$bad" .github/workflows || true)
          if [[ -n "$hits" ]]; then
            echo "::error::Forbidden placeholder tokens detected:"
            echo "$hits"
            exit 1
          fi
          echo "OK: no placeholder tokens in workflows"
