name: Migrate WORKER_URL
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/patch_workflows.js
      - name: Commit changes (if any)
        run: |
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add -A .github/workflows
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "migrate: replace hardcoded workers.dev with \${{ vars.WORKER_URL }}"; git pull --rebase --autostash || true; git push; fi
