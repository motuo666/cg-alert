name: Check Secrets / Vars

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required configuration
        env:
          # ---- repo Variables (non-secret) ----
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
          INTAKE_FORM_URL: ${{ vars.INTAKE_FORM_URL }}
          STRIPE_LINK_RENEWAL_DESK: ${{ vars.STRIPE_LINK_RENEWAL_DESK }}
          STRIPE_LINK_PORTFOLIO: ${{ vars.STRIPE_LINK_PORTFOLIO }}
          STRIPE_LINK_COMPLIANCE: ${{ vars.STRIPE_LINK_COMPLIANCE }}
          SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
          COMPANY_LEGAL_NAME: ${{ vars.COMPANY_LEGAL_NAME }}
          MAIL_POSTAL_ADDRESS: ${{ vars.MAIL_POSTAL_ADDRESS }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          UNSUB_HMAC_SECRET: ${{ vars.UNSUB_HMAC_SECRET }}

          # ---- repo Secrets (sensitive) ----
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}

          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}

          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

          # optional enrich/discovery
          ENRICH_API_TOKEN: ${{ secrets.ENRICH_API_TOKEN }}
          TARGET_DISCOVERY_API_TOKEN: ${{ secrets.TARGET_DISCOVERY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          red()   { printf "\e[31m%s\e[0m\n" "$1"; }
          green() { printf "\e[32m%s\e[0m\n" "$1"; }
          yellow(){ printf "\e[33m%s\e[0m\n" "$1"; }

          missing=0

          must_have () {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              red "$name missing"
              missing=$((missing+1))
            else
              echo "$name ok"
            fi
          }

          nice_to_have () {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              yellow "(optional) $name missing"
            else
              echo "$name ok (optional)"
            fi
          }

          echo "=== Checking required repo Variables (Actions → Variables) ==="
          must_have "SITE_ORIGIN" "$SITE_ORIGIN"
          must_have "INTAKE_FORM_URL" "$INTAKE_FORM_URL"

          must_have "STRIPE_LINK_RENEWAL_DESK" "$STRIPE_LINK_RENEWAL_DESK"
          must_have "STRIPE_LINK_PORTFOLIO" "$STRIPE_LINK_PORTFOLIO"
          must_have "STRIPE_LINK_COMPLIANCE" "$STRIPE_LINK_COMPLIANCE"

          must_have "SLACK_WEBHOOK_URL" "$SLACK_WEBHOOK_URL"
          must_have "COMPANY_LEGAL_NAME" "$COMPANY_LEGAL_NAME"
          must_have "MAIL_POSTAL_ADDRESS" "$MAIL_POSTAL_ADDRESS"

          must_have "CF_ACCOUNT_ID" "$CF_ACCOUNT_ID"
          must_have "KV_NAMESPACE_ID" "$KV_NAMESPACE_ID"
          must_have "WORKER_URL" "$WORKER_URL"
          must_have "UNSUB_HMAC_SECRET" "$UNSUB_HMAC_SECRET"

          echo
          echo "=== Checking required repo Secrets (Actions → Secrets) ==="
          must_have "SMTP_HOST" "$SMTP_HOST"
          must_have "SMTP_PORT" "$SMTP_PORT"
          must_have "SMTP_USER" "$SMTP_USER"
          must_have "SMTP_PASS" "$SMTP_PASS"

          must_have "IMAP_HOST" "$IMAP_HOST"
          must_have "IMAP_PORT" "$IMAP_PORT"
          must_have "IMAP_USER" "$IMAP_USER"
          must_have "IMAP_PASS" "$IMAP_PASS"

          must_have "CF_API_TOKEN" "$CF_API_TOKEN"
          must_have "STRIPE_WEBHOOK_SECRET" "$STRIPE_WEBHOOK_SECRET"

          echo
          echo "=== Optional tokens ==="
          nice_to_have "ENRICH_API_TOKEN" "$ENRICH_API_TOKEN"
          nice_to_have "TARGET_DISCOVERY_API_TOKEN" "$TARGET_DISCOVERY_API_TOKEN"

          echo
          if [ "$missing" -gt 0 ]; then
            red "✗ Missing $missing required variables/secrets"
            exit 1
          else
            green "✓ All required variables/secrets are set"
          fi
