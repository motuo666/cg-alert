name: Daily Ops
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm ci || npm i

      - name: Daily Ops Report (original)
        run: node scripts/daily_ops_report.js

      - name: Fix sent_today from sent_log.csv (UTC)
        run: |
          node scripts/fix_sent_today.js
          ST=$(node -e "console.log(require('fs').existsSync('artifacts/daily_ops.json')?JSON.parse(require('fs').readFileSync('artifacts/daily_ops.json','utf8')).sent_today:0)")
          echo "### Corrections (UTC)" >> "$GITHUB_STEP_SUMMARY"
          echo "- sent_today (from sent_log.csv): ${ST}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily_ops
          path: artifacts/daily_ops.json
          if-no-files-found: warn
