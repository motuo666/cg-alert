name: Outreach S3 (last touch)
on: workflow_dispatch:
  inputs:
    limit: { description: "count", required: true, default: "20" }
    min_days: { description: "days since S2", required: true, default: "7" }
jobs:
  s3:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm init -y && npm install nodemailer csv-parse csv-stringify
      - name: Segment S3
        run: node scripts/segment.js 3 "${{ github.event.inputs.min_days }}" "${{ github.event.inputs.limit }}"
      - name: Send S3
        run: node scripts/send_bulk.js "data/targets_stage3.csv" "${{ github.event.inputs.limit }}" "0" "Last ping — keep you posted on vendor changes?" "Last note from me.\n\nIf vendor changes are not on your radar this quarter, I’ll stop here. If helpful, we can quietly monitor {v1}/{v2}/{v3} and only alert on high-impact changes (pricing/auto-renewal/DPA/subprocessors). 7-day pilot, no login.\n\nReply “1” to start, “9” to opt out.\n\n— CG Alert"
        env:
          CG_STAGE: "3"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
