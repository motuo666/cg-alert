name: lead-drip

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  drip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run lead drip (if script exists)
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -x scripts/lead_drip.sh ]]; then
            bash scripts/lead_drip.sh
          elif [[ -f scripts/lead_drip.js ]]; then
            node scripts/lead_drip.js
          else
            echo "No lead drip script found; skipping."
          fi
