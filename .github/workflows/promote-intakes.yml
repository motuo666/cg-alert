name: Promote Intakes

on:
  schedule: [{ cron: "*/15 * * * *" }]  # 每15分钟
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    # 单独并发组，避免和其它会写仓库的任务互相取消
    concurrency: { group: cg-write-promote, cancel-in-progress: false }

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      # 脚本只用内置模块；保留安装步骤以统一环境（ci失败则退回普通install）
      - name: Install deps
        run: npm ci || npm install --no-audit --no-fund

      # 预检：路径、脚本、数据目录与文件；缺就创建空文件，保证脚本不报错
      - name: Preflight & prepare
        shell: bash
        run: |
          set -euxo pipefail
          echo "Node: $(node -v)"
          test -f scripts/promote-intakes.js && echo "script ok" || (echo "ERROR: scripts/promote-intakes.js missing"; exit 1)
          mkdir -p data .tmp
          # 若不存在则创建空文件，脚本会幂等处理
          [ -f data/intakes.csv ]   || : > data/intakes.csv
          [ -f data/customers.csv ] || : > data/customers.csv
          echo "---- ls -la"; ls -la
          echo "---- ls data"; ls -la data
          echo "---- head intakes"; head -n 5 data/intakes.csv || true
          echo "---- head customers"; head -n 5 data/customers.csv || true

      # 运行脚本（带一次自愈重试）：第一次失败→自动补文件/清锁后再试一次
      - name: Run promote (with retry)
        id: runpromote
        shell: bash
        env:
          # 可控开关（默认真实写入；调试可设PROMOTE_DRY=1）
          PROMOTE_DRY: "0"
          PROMOTE_MAX: "0"        # 每次最多追加 0=不限
          PROMOTE_STRICT_HEADER: "0"
        run: |
          set +e
          echo "[1st try] promote-intakes.js"
          OUT1="$(node scripts/promote-intakes.js 2>&1)"; EC1=$?
          echo "${OUT1}"
          # 成功 or 无事可做，直接通过
          if [ $EC1 -eq 0 ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "[auto-fix] ensure dirs/files & clear lock then retry"
          mkdir -p data .tmp
          rm -f .tmp/promote-intakes.lock || true
          [ -f data/customers.csv ] || : > data/customers.csv
          [ -f data/intakes.csv ] || : > data/intakes.csv
          OUT2="$(node scripts/promote-intakes.js 2>&1)"; EC2=$?
          echo "${OUT2}"
          if [ $EC2 -eq 0 ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=0" >> "$GITHUB_OUTPUT"
          echo "Promote still failing after retry."
          exit 1

      # 只有真的有变更才提交（避免空 push & 并发冲突）
      - name: Detect changes
        id: diff
        if: steps.runpromote.outputs.ok == '1'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit customers list
        if: steps.diff.outputs.changed == '1'
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "CG Bot"
          git config user.email "bot@cg-alert.com"
          git add -A
          git commit -m "promote: intakes -> customers (dedup)"

      - name: Safe push with rebase & retry
        if: steps.diff.outputs.changed == '1'
        shell: bash
        run: |
          set -euo pipefail
          tries=0
          until [ $tries -ge 3 ]
          do
            git pull --rebase --autostash origin main || (git rebase --abort || true)
            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi
            tries=$((tries+1))
            echo "Push failed. Retry #$tries ..."
            sleep 3
          done
          echo "Push failed after retries."
          exit 1
