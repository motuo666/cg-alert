name: Check Web
on:
  pull_request:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - uses: actions/setup-python@v5
      with:
        python-version: 3.11
    - name: Build and static checks
      env:
        SITE_ORIGIN: https://www.cg-alert.com
        PUBLISH_DIR: .
      shell: bash
      run: 'set -euo pipefail

        python3 scripts/normalize_events.py --root .

        python3 scripts/auto_fix_links.py --root .

        python3 scripts/normalize_canonical.py --root . --site-origin "${SITE_ORIGIN}"

        node scripts/build_sitemap.mjs

        python3 scripts/harden_html.py .

        python3 scripts/check_links.py --root .

        '
concurrency:
  group: cg-full-pipeline
  cancel-in-progress: false
