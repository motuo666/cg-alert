name: Bounce Sweep

on:
  schedule:
    - cron: "0 */6 * * *"        # 每 6 小时
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "回捞窗口（小时），留空则用 Secrets 或 168"
        required: false
        default: ""

permissions:
  contents: read

# 防止并发重叠执行
concurrency:
  group: bounce-sweep
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps (imapflow only)
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund --silent imapflow@latest

      # 校验必需 Secrets 与 Vars，提前失败给出清晰提示
      - name: Validate required secrets & vars
        env:
          IMAP_HOST:       ${{ secrets.IMAP_HOST }}
          IMAP_USER:       ${{ secrets.IMAP_USER }}
          IMAP_PASS:       ${{ secrets.IMAP_PASS }}
          CF_API_TOKEN:    ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID:   ${{ vars.CF_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
        run: |
          miss=""
          for k in IMAP_HOST IMAP_USER IMAP_PASS CF_API_TOKEN CF_ACCOUNT_ID KV_NAMESPACE_ID; do
            if [ -z "${!k}" ]; then echo "::error::missing $k"; miss=1; fi
          done
          if [ -n "$miss" ]; then exit 1; fi

      # 统一回捞窗口优先级：手动输入 > Secrets > 默认 168
      - name: Resolve LOOKBACK_HOURS
        env:
          INP:  ${{ inputs.lookback_hours }}
          SEC:  ${{ secrets.LOOKBACK_HOURS }}
        run: |
          L="$INP"
          if [ -z "$L" ]; then L="$SEC"; fi
          if [ -z "$L" ]; then L=168; fi
          echo "LOOKBACK_HOURS=$L" >> $GITHUB_ENV
          echo "::notice::bounce-sweep lookback_h=$L"

      - name: Sweep IMAP bounces -> suppress
        env:
          IMAP_HOST:        ${{ secrets.IMAP_HOST }}
          IMAP_USER:        ${{ secrets.IMAP_USER }}
          IMAP_PASS:        ${{ secrets.IMAP_PASS }}
          CF_ACCOUNT_ID:    ${{ vars.CF_ACCOUNT_ID }}
          KV_NAMESPACE_ID:  ${{ vars.KV_NAMESPACE_ID }}
          CF_API_TOKEN:     ${{ secrets.CF_API_TOKEN }}
          LOOKBACK_HOURS:   ${{ env.LOOKBACK_HOURS }}
        run: |
          set -e
          node scripts/imap_bounce_sweep.js | tee sweep.log

      - name: Upload sweep log (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounce-sweep-log
          path: sweep.log
          retention-days: 7

      - name: Notify Slack (optional)
        if: ${{ always() && secrets.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LOOKBACK_HOURS:    ${{ env.LOOKBACK_HOURS }}
        run: |
          printf '{"text":"✅ bounce-sweep finished (lookback_h=%s)"}' "$LOOKBACK_HOURS" \
          | curl -sS -X POST -H "content-type: application/json" --data @- "$SLACK_WEBHOOK_URL"
