name: Outreach S1

on:
  schedule: [ { cron: "30 17 * * 1-5" } ]  # 工作日 17:30 UTC
  workflow_dispatch:
    inputs:
      dry:
        description: "dry run"
        default: "true"
        required: true
      limit:
        description: "max emails"
        default: "20"
        required: true

permissions: {}  # 不写仓，无需额外权限
concurrency:
  group: outreach-s1
  cancel-in-progress: true

jobs:
  s1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci || npm i --no-audit --no-fund || true

      - name: Guard & Validate leads
        run: node scripts/leads_guard.js && node scripts/validate_leads.js

      - name: Gate (48h evidence)
        id: gate
        env:
          TRIGGER_WINDOW_H: 48
        run: node scripts/s1_gate.js

      - name: Send S1
        if: ${{ steps.gate.outputs.ok == '1' }}
        env:
          # 邮件发送（Secrets 必须已配置）
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          BCC_TO: ${{ secrets.BCC_TO }}
          # 可选：站点域名，供模板生成 Pack 链接（未设则脚本里有默认）
          SITE_ORIGIN: https://www.cg-alert.com
          # 兼容 schedule 触发时无 inputs 的情况（使用默认值）
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry || 'true' }}
          LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '20' }}
        run: node scripts/send_bulk.js --dry=${{ env.DRY }} --limit=${{ env.LIMIT }}

      - name: Skip
        if: ${{ steps.gate.outputs.ok != '1' }}
        run: echo "No fresh evidence → skip"
