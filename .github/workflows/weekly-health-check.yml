name: Weekly Health Check
on:
  schedule:
    - cron: '20 0 * * 0'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: |
          npm ci || npm install

      - name: Rebuild static site pages (reports/vendor/evidence/rss)
        run: |
          node scripts/build_change_pack.js
          node scripts/build_evidence_pages.js
          node scripts/generate_reports_index.js
          node scripts/generate_sitemap_rss.js
          node scripts/build_rss.js

      - name: Commit updated pages
        run: |
          git add -A public vendors reports updates _redirects _headers || true
          if [ -n "$(git status --porcelain)" ]; then
            git -c user.name="cg-bot" -c user.email="bot@cg-alert.com" commit -m "weekly: rebuild site pages (reports/evidence/rss)"
            git pull --rebase --autostash || true
            git push
          else
            echo "no changes to commit"
          fi
