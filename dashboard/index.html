<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CG Alert — Evidence Dashboard</title>
<link rel="stylesheet" href="/enterprise.css">
</head><body>
<main class="wrap">
  <h1 class="sticky">Evidence Dashboard</h1>
  <div class="search">
    <span>🔎</span>
    <input id="q" type="search" placeholder="Filter vendors (e.g., okta, pricing, dpa)…">
    <span class="counter" id="count"></span>
  </div>
  <section class="card">
    <table id="tbl">
      <thead><tr><th>Vendor</th><th>Latest</th><th>Open</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</main>
<script>
(function(){
  const rowsEl=document.getElementById('rows');
  const data = [];
  function add(v,ts){
    const href = `/evidence/${encodeURIComponent(v)}/${ts}/index0.html`;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${v}</td><td>${ts}</td><td><a data-fallback href="${href}" data-vendor="${v}" data-ts="${ts}">Open</a></td>`;
    rowsEl.appendChild(tr);
  }
  rowsEl.innerHTML='';
  if(data.length===0){
    rowsEl.innerHTML='<tr><td colspan="3"><em>No evidence yet. See <a href="/reports/">Reports</a>.</em></td></tr>';
  } else {
    data.forEach(([v,ts])=>add(v,ts));
  }
  // Fallback: check target; if 404 jump to /reports/YYYY-MM/vendor/
  document.querySelectorAll('a[data-fallback]').forEach(a=>{
    a.addEventListener('click', async (e)=>{
      try{
        const url=a.getAttribute('href');
        const r=await fetch(url, {method:'HEAD'});
        if(r.ok) return;
        const v=a.dataset.vendor, ts=a.dataset.ts;
        const ym=ts.slice(0,7);
        const fallback='/reports/'+ym+'/'+encodeURIComponent(v)+'/';
        window.location=fallback; e.preventDefault();
      }catch(_){}
    });
  });
  const q=document.getElementById('q'), count=document.getElementById('count');
  function apply(){
    const s=(q.value||'').toLowerCase(); let n=0;
    rowsEl.querySelectorAll('tr').forEach(tr=>{
      const ok=tr.textContent.toLowerCase().includes(s);
      tr.style.display = ok?'':'none'; if(ok) n++;
    });
    count.textContent = n+' vendors';
  }
  q.addEventListener('input', apply); apply();
})();
</script>
</body></html>
