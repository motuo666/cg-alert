name: Evidence QC (weekly)

on:
  schedule:
    - cron: '10 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install XML parser
        run: npm install fast-xml-parser@4.4.0 --no-save
      - name: Run evidence QC (pick 3)
        run: node scripts/evidence_qc.js
      - name: Commit QC report
        run: |
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add data/qc/latest.md || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "qc: weekly evidence spot-check (3 items)" || echo "WARN: commit failed (maybe no staged changes)."
            git push || echo "WARN: git push failed (non-fast-forward); will retry on next run."

concurrency:
  group: cg-full-pipeline
  cancel-in-progress: false
