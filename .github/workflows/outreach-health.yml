name: Outreach Health
on:
  schedule:
    - cron: "30 14 * * *"   # 每天 08:30 MT ≈ 14:30 UTC
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm init -y && npm install imapflow
      - name: Send health to Slack
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          IMAP_SENT_BOX: ${{ secrets.IMAP_SENT_BOX }}   # 可不配，默认 'Sent'
          IMAP_BOUNCE_FROM: ${{ secrets.IMAP_BOUNCE_FROM }} # 可不配
        run: node scripts/outreach_health.js
