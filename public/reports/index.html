<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reports — CG Alert</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- We rely on site-wide CSS via absolute assets; below is only minimal fallback -->
  <style>
    main{max-width:1100px;margin:32px auto;padding:0 16px}
    .hero{display:flex;align-items:baseline;gap:12px;margin:8px 0 20px}
    .hero h1{font-size:28px;margin:0}
    .sub{color:#6b7280}
    .month{margin:18px 0 6px;font-weight:700;border-bottom:1px solid #eee;padding-bottom:4px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:8px 0 20px}
    .chip{display:block;padding:12px 14px;border:1px solid #e5e7eb;border-radius:12px;text-decoration:none}
    .chip:hover{box-shadow:0 6px 20px rgba(0,0,0,.06)}
  </style>
</head>
<body>
<header><!-- header is provided by the site's global shell; if missing, page still works --></header>
<main>
  <div class="hero">
    <h1>Vendor Change Packs</h1>
    <span class="sub">Verified change packs by month and vendor. All times in UTC.</span>
  </div>
  <div id="reports-root"><p class="sub">Loading…</p></div>
</main>
<footer></footer>
<script>
// Render from JSON if available, else fall back to basic list.
(function(){
  const root = document.getElementById('reports-root');
  fetch('/reports/index.json', {cache:'no-store'})
    .then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(data=>{
      const months = data.months || data;
      const keys = Object.keys(months).sort().reverse();
      const frag = document.createDocumentFragment();
      keys.forEach(m=>{
        const h = document.createElement('div'); h.className='month'; h.textContent=m; frag.appendChild(h);
        const grid = document.createElement('div'); grid.className='grid';
        (months[m]||[]).forEach(v=>{
          const a = document.createElement('a'); a.className='chip'; a.href = `/reports/${m}/${v}/`; a.textContent = v;
          grid.appendChild(a);
        });
        frag.appendChild(grid);
      });
      root.innerHTML=''; root.appendChild(frag);
    })
    .catch(_=>{ root.innerHTML = '<p class="sub">No index.json yet.</p>'; });
})();
</script>
</body>
</html>
