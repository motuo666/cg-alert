name: SEO Sitemap & IndexNow

on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo:
    runs-on: ubuntu-latest
    env:
      SITE_ORIGIN:  ${{ vars.SITE_ORIGIN || 'https://www.cg-alert.com' }}
      INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
      PUBLISH_DIR:  ${{ vars.PUBLISH_DIR || '.' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build sitemap
        run: node scripts/build_sitemap.mjs
      - name: Commit sitemap
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add "$PUBLISH_DIR/sitemap.xml"
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "seo: update sitemap"
            git pull --rebase --autostash || true
            git push
          fi
      - name: Ensure IndexNow key file
        run: |
          set -e
          mkdir -p "$PUBLISH_DIR"
          KEYFILE="$PUBLISH_DIR/indexnow-${INDEXNOW_KEY}.txt"
          if [ ! -f "$KEYFILE" ]; then
            echo "${INDEXNOW_KEY}" > "$KEYFILE"
            git add "$KEYFILE" && git commit -m "seo: add indexnow key" || true
            git pull --rebase --autostash || true
            git push || true
          fi

      - name: Ping IndexNow
        run: |
          set -e
          URL="${SITE_ORIGIN}/sitemap.xml"
          curl -sS "https://api.indexnow.org/IndexNow?url=${URL}&key=${INDEXNOW_KEY}" || true
