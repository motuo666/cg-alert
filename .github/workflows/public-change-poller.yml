name: Public Change Poller

on:
  workflow_dispatch:
    inputs:
      sample:
        description: "Sampling ratio for polling (0~1)"
        required: false
        default: "1.0"
      concurrency:
        description: "Fetch concurrency"
        required: false
        default: "8"
      force_seed:
        description: "Ensure at least N verified evidences today (seed if lacking)"
        required: false
        default: "10"
  schedule:
    - cron: "25 03 * * *" # daily 03:25 UTC

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max_old_space_size=4096
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://www.cg-alert.com' }}
      # 关键：支持 vars 或 secrets 任一来源
      INTAKE_FORM_URL: ${{ vars.INTAKE_FORM_URL || secrets.INTAKE_FORM_URL || '' }}
      STRIPE_LINK_PORTFOLIO: ${{ vars.STRIPE_LINK_PORTFOLIO || secrets.STRIPE_LINK_PORTFOLIO || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install deps (best-effort)
        run: npm ci || npm i --no-audit --no-fund || true

      - name: Endpoint Inventory
        run: |
          if [ -f scripts/endpoint_inventory.js ]; then node scripts/endpoint_inventory.js; else echo "skip"; fi

      - name: Poll public endpoints
        env:
          POLL_SAVE_BODY: '1'
          POLL_FETCH_MODE: 'GET'
          POLL_SAMPLE: ${{ inputs.sample || '1.0' }}
          POLL_CONCURRENCY: ${{ inputs.concurrency || '8' }}
        run: node scripts/poll_public_endpoints.js

      - name: Normalize evidence
        run: node scripts/normalize_evidence.js

      - name: Ensure min evidence today
        run: |
          if [ -f scripts/evidence_force_seed.js ]; then node scripts/evidence_force_seed.js --min-today=${{ inputs.force_seed || '10' }}; fi

      - name: Enrich evidence provenance
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GIT_COMMIT: ${{ github.sha }}
        run: node scripts/evidence_enrich_provenance.js

      - name: Extract diff excerpts
        run: |
          if [ -f scripts/extract_diff_excerpt.js ]; then node scripts/extract_diff_excerpt.js; fi

      - name: Build evidence index
        run: node scripts/build_evidence_index.js

      - name: Compute materiality score
        run: |
          if [ -f scripts/materiality_score.js ]; then node scripts/materiality_score.js; fi

      - name: Build Change Packs
        run: node scripts/build_change_pack.js

      - name: Build subprocessor reverse index
        run: |
          if [ -f scripts/build_who_uses.js ]; then node scripts/build_who_uses.js; fi

      - name: Build updates & categories
        run: |
          if [ -f scripts/build_updates.js ]; then node scripts/build_updates.js || true; fi
          if [ -f scripts/build_categories.js ]; then node scripts/build_categories.js || true; fi

      - name: Build vendor catalog
        run: |
          if [ -f scripts/build_vendor_catalog.js ]; then node scripts/build_vendor_catalog.js || true; fi

      - name: Inject SEO
        run: |
          if [ -f scripts/seo_inject.js ]; then node scripts/seo_inject.js || true; fi

      # 关键：CTA 注入（双按钮，携带 UTM）
      - name: Inject CTA (Enable alerts / Buy Portfolio)
        run: node scripts/cta_inject.js

      - name: Summarize
        run: |
          YM=$(date -u +%Y-%m)
          TODAY=$(date -u +%F)
          CHANGED=$(find evidence -type f -name "${TODAY}-*.json" 2>/dev/null | grep -v "00000000" | wc -l)
          BASELINES=$(find evidence -type f -name "${TODAY}-*00000000.json" 2>/dev/null | wc -l)
          INDEX_ROWS=$(test -f data/evidence.ndx && wc -l < data/evidence.ndx || echo 0)
          PACKS=$(find "reports/$YM" -type f -name index.html 2>/dev/null | wc -l)
          HASH_OK=$(awk -F'\t' '($4!="") && $4!~/^0+$/ {ok++} END{print ok+0}' data/evidence.ndx 2>/dev/null || echo 0)
          {
            echo "### Public Change Poller"
            echo "- New evidence today (non-zero hash): $CHANGED"
            echo "- Baselines today: $BASELINES"
            echo "- Index rows: $INDEX_ROWS"
            echo "- Hash (non-zero) rows: $HASH_OK"
            echo "- Change Packs this month ($YM): $PACKS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Safe push changes
        run: |
          git add -A vendors reports updates data/evidence.ndx data/materiality.csv data/vendor_catalog.csv evidence public/who-uses || true
          if [ -n "$(git status --porcelain)" ]; then
            chmod +x scripts/git_safe_push.sh || true
            bash scripts/git_safe_push.sh "poll: packs/updates/seo + CTA inject"
          else
            echo "no changes to commit"
          fi
