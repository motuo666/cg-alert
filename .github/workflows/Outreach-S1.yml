name: Outreach S2 (Follow-up)

on:
  schedule:
    - cron: '00 18 * * 1-5'  # 12:00 MT
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "outreach-s2-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  send:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: '18' }

      - name: Debug context
        run: |
          echo "ref=$GITHUB_REF"
          echo "event=$GITHUB_EVENT_NAME"
          echo "default_branch=${{ github.event.repository.default_branch }}"
          node -v
          echo "repo files:" && ls -al
          echo "scripts dir:" && ls -al scripts || true

      - name: Pick script
        id: pick
        run: |
          set -e
          for c in scripts/send_followup.js scripts/outreach_s2.js scripts/send_follow.js; do
            if [ -f "$c" ]; then echo "script=$c" >> $GITHUB_OUTPUT; echo "USING=$c"; exit 0; fi
          done
          echo "找不到 S2 发送脚本（期待 scripts/send_followup.js 或 outreach_s2.js）" >&2
          exit 1

      - name: Send S2
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DRY_RUN: '0'
        run: node "${{ steps.pick.outputs.script }}"
