name: Internal Linking
on:
  push:
    branches: [ main ]
    paths:
      - "vendors/**"
      - "reports/**"
      - "updates/**"
      - "data/vendor_tags.csv"
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  linkify:
    runs-on: ubuntu-latest
    concurrency: { group: cg-write, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/internal_linking.js
      - name: Safe push
        run: |
          chmod +x scripts/git_safe_push.sh
          bash scripts/git_safe_push.sh "internal: related vendors & browse sections"
