<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reports — CG Alert</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <!-- keep existing site header if present; the guard below will remove the first if duplicated -->
  <main>
    <h1>Vendor Change Packs</h1>
    <p class="sub">Verified change packs by month and vendor. All times in UTC.</p>
    <div id="reports-root"><p>Loading…</p></div>
  </main>
  <script>
  (function(){
    const root = document.getElementById('reports-root');
    fetch('/reports/index.json', {cache:'no-store'})
      .then(r=>r.ok?r.json():Promise.reject(r.status))
      .then(data=>{
        const months = data.months || data;
        const keys = Object.keys(months).sort().reverse();
        const frag = document.createDocumentFragment();
        keys.forEach(m=>{
          const h2 = document.createElement('h2'); h2.textContent = m; frag.appendChild(h2);
          const ul = document.createElement('ul');
          (months[m]||[]).forEach(v=>{
            const li = document.createElement('li');
            const a = document.createElement('a'); a.href = `/reports/${m}/${v}/`; a.textContent = v;
            li.appendChild(a); ul.appendChild(li);
          });
          frag.appendChild(ul);
        });
        root.innerHTML=''; root.appendChild(frag);
      })
      .catch(_=>{ root.innerHTML = '<p class="sub">No index.json yet.</p>'; });
  })();
  </script>
  <!-- runtime guard: if two top-level headers exist, drop the first one -->
  <script>
  (function(){
    try{
      var headers = document.querySelectorAll('body > header');
      if (headers.length >= 2) headers[0].remove();
    }catch(e){}
  })();
  </script>
</body>
</html>
