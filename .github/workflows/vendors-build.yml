name: Vendors Build
on:
  schedule:
    - cron: '13 3 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLISH_DIR: .
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm ci || npm install
      - name: Build vendors index (CJS)
        run: node scripts/build_vendors_index.js
      - name: Render evidence pages (ESM)
        run: node scripts/render_evidence_pages.mjs
      - name: Generate reports index (ESM)
        run: node scripts/generate_reports_index.mjs
