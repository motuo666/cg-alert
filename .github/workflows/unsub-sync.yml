name: Unsub Sync (KV → repo)
on:
  schedule: [ { cron: '10 3 * * *' } ]  # daily UTC
  workflow_dispatch:
permissions: { contents: write }
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/kv_unsub_sync.js
      - name: Commit suppressions
        run: |
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add -A data/suppressions.csv
          if git diff --cached --quiet; then echo "no new unsubs"; else git commit -m "unsub: sync KV → repo"; git pull --rebase --autostash || true; git push; fi
