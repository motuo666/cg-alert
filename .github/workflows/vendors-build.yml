name: Vendors Build
on:
  schedule:
    - cron: '7 2 * * *'   # daily 11:07 JST
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm ci || npm install
      - name: Build reports (cards + index.json + RSS)
        run: node scripts/reports_build.mjs
      - name: Commit & push
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add -A reports rss
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "Reports build: cards/index.json/rss"
            git pull --rebase --autostash || true
            git push
          fi
