name: Check Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Validate required vars & secrets
      shell: bash
      env:
        # Vars (GitHub Actions → Variables)
        SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
        INTAKE_FORM_URL: ${{ vars.INTAKE_FORM_URL }}
        STRIPE_LINK_PORTFOLIO: ${{ vars.STRIPE_LINK_PORTFOLIO }}
        STRIPE_LINK_BUSINESS: ${{ vars.STRIPE_LINK_BUSINESS }}

        # Secrets (GitHub Actions → Secrets)
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        SMTP_HOST: ${{ secrets.SMTP_HOST }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASS: ${{ secrets.SMTP_PASS }}
        MAIL_FROM: ${{ secrets.MAIL_FROM }}

        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        UNSUB_HMAC_SECRET: ${{ secrets.UNSUB_HMAC_SECRET }}

        # Optional IMAP (inbox/bounce tracking). If you haven't wired IMAP yet,
        # 这些可以暂时为空；我们只报告，不阻断构建
        IMAP_HOST: ${{ secrets.IMAP_HOST }}
        IMAP_PORT: ${{ secrets.IMAP_PORT }}
        IMAP_USER: ${{ secrets.IMAP_USER }}
        IMAP_PASS: ${{ secrets.IMAP_PASS }}
      run: |
        set -Eeuo pipefail

        missing=0

        echo "## Required VARS" >> "$GITHUB_STEP_SUMMARY"
        req_vars=(SITE_ORIGIN INTAKE_FORM_URL STRIPE_LINK_PORTFOLIO)
        for key in "${req_vars[@]}"; do
          val="${!key:-}"
          if [ -z "$val" ]; then
            echo "::error::$key missing (Actions → Variables)"
            echo "- $key: MISSING" >> "$GITHUB_STEP_SUMMARY"
            missing=1
          else
            echo "- $key: OK" >> "$GITHUB_STEP_SUMMARY"
          fi
        done

        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "## Optional VARS" >> "$GITHUB_STEP_SUMMARY"
        opt_vars=(STRIPE_LINK_BUSINESS)
        for key in "${opt_vars[@]}"; do
          val="${!key:-}"
          if [ -z "$val" ]; then
            echo "- $key: (optional) not set" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- $key: OK" >> "$GITHUB_STEP_SUMMARY"
          fi
        done

        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "## Required SECRETS" >> "$GITHUB_STEP_SUMMARY"
        req_secrets=(SLACK_WEBHOOK_URL SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS MAIL_FROM CF_API_TOKEN STRIPE_WEBHOOK_SECRET UNSUB_HMAC_SECRET)
        for key in "${req_secrets[@]}"; do
          val="${!key:-}"
          if [ -z "$val" ]; then
            echo "::error::$key missing (Actions → Secrets)"
            echo "- $key: MISSING" >> "$GITHUB_STEP_SUMMARY"
            missing=1
          else
            echo "- $key: OK" >> "$GITHUB_STEP_SUMMARY"
          fi
        done

        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "## Optional SECRETS (IMAP / bounce tracking)" >> "$GITHUB_STEP_SUMMARY"
        opt_secrets=(IMAP_HOST IMAP_PORT IMAP_USER IMAP_PASS)
        for key in "${opt_secrets[@]}"; do
          val="${!key:-}"
          if [ -z "$val" ]; then
            echo "- $key: (optional) not set" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- $key: OK" >> "$GITHUB_STEP_SUMMARY"
          fi
        done

        exit $missing
