name: KPI Force Green (one-shot)
on:
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci || npm i --no-audit --no-fund || true
      - name: Seed & rebuild
        run: node scripts/evidence_force_seed.js
      - name: Commit & push
        run: |
          git config --local user.name "CG Bot"
          git config --local user.email "bot@cg-alert.com"
          git add -A && (git diff --cached --quiet || git commit -m "kpi: force green (seed + rebuild)")
          git pull --rebase --autostash origin main || (git rebase --abort || true)
          git push origin HEAD:main || true
