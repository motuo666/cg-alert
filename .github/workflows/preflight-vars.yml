name: Preflight Vars
on:
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN || secrets.SITE_ORIGIN }}
      WORKER_URL: ${{ vars.WORKER_URL || secrets.WORKER_URL }}
      INTAKE_FORM_URL: ${{ vars.INTAKE_FORM_URL || secrets.INTAKE_FORM_URL }}
      MAIL_FROM: ${{ vars.MAIL_FROM || secrets.MAIL_FROM }}
      REPLY_TO: ${{ vars.REPLY_TO || secrets.REPLY_TO }}
      SENDER_NAME: ${{ vars.SENDER_NAME || secrets.SENDER_NAME }}
      MAIL_POSTAL_ADDRESS: ${{ vars.MAIL_POSTAL_ADDRESS || secrets.MAIL_POSTAL_ADDRESS
        }}
      MAIL_RETURN_PATH: ${{ vars.MAIL_RETURN_PATH || secrets.MAIL_RETURN_PATH }}
      SMTP_PORT: ${{ vars.SMTP_PORT || secrets.SMTP_PORT }}
      IMAP_PORT: ${{ vars.IMAP_PORT || secrets.IMAP_PORT }}
      STRIPE_LINK_PORTFOLIO: ${{ vars.STRIPE_LINK_PORTFOLIO || secrets.STRIPE_LINK_PORTFOLIO
        }}
      STRIPE_LINK_BUSINESS: ${{ vars.STRIPE_LINK_BUSINESS || secrets.STRIPE_LINK_BUSINESS
        }}
      SMTP_HOST: ${{ secrets.SMTP_HOST || vars.SMTP_HOST }}
      SMTP_USER: ${{ secrets.SMTP_USER || vars.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS || vars.SMTP_PASS }}
      IMAP_HOST: ${{ secrets.IMAP_HOST || vars.IMAP_HOST }}
      IMAP_USER: ${{ secrets.IMAP_USER || vars.IMAP_USER }}
      IMAP_PASS: ${{ secrets.IMAP_PASS || vars.IMAP_PASS }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL || vars.SLACK_WEBHOOK_URL }}
      UNSUB_HMAC_SECRET: ${{ secrets.UNSUB_HMAC_SECRET || vars.UNSUB_HMAC_SECRET }}
      CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
      CF_KV_NAMESPACE: ${{ vars.CF_KV_NAMESPACE || vars.KV_NAMESPACE_ID || secrets.CF_KV_NAMESPACE
        || secrets.KV_NAMESPACE_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      BCC_TO: ${{ secrets.BCC_TO }}
    steps:
    - name: Check presence & format
      shell: bash
      run: "set -euo pipefail\nfail=0\n\ncheck_nonempty() { var=\"$1\"; val=\"${!1:-}\"\
        ; if [ -z \"$val\" ]; then echo \"::error ::$var is EMPTY\"; fail=1; else\
        \ echo \"✔ $var present\"; fi; }\ncheck_url() { var=\"$1\"; val=\"${!1:-}\"\
        ; if [[ -n \"$val\" && ! \"$val\" =~ ^https:// ]]; then echo \"::error ::$var\
        \ must start with https://\"; fail=1; fi; }\ncheck_now_trailing_slash() {\
        \ var=\"$1\"; val=\"${!1:-}\"; if [[ -n \"$val\" && \"$val\" =~ /$ ]]; then\
        \ echo \"::warning ::$var should NOT end with /\"; fi; }\ncheck_prefix() {\
        \ var=\"$1\"; prefix=\"$2\"; val=\"${!1:-}\"; if [[ -n \"$val\" && \"$val\"\
        \ != ${prefix}* ]]; then echo \"::error ::$var must start with ${prefix}\"\
        ; fail=1; fi; }\n\nfor v in SITE_ORIGIN WORKER_URL MAIL_FROM REPLY_TO SENDER_NAME\
        \ MAIL_RETURN_PATH SMTP_PORT IMAP_PORT STRIPE_LINK_PORTFOLIO STRIPE_LINK_BUSINESS;\
        \ do\n  check_nonempty \"$v\"\ndone\n\nfor s in SMTP_HOST SMTP_USER SMTP_PASS\
        \ IMAP_HOST IMAP_USER IMAP_PASS SLACK_WEBHOOK_URL UNSUB_HMAC_SECRET; do\n\
        \  check_nonempty \"$s\"\ndone\n\ncheck_url SITE_ORIGIN\ncheck_url WORKER_URL\n\
        check_now_trailing_slash WORKER_URL\ncheck_prefix STRIPE_LINK_PORTFOLIO \"\
        https://buy.stripe.com/\"\ncheck_prefix STRIPE_LINK_BUSINESS \"https://buy.stripe.com/\"\
        \nif [[ -n \"${SLACK_WEBHOOK_URL:-}\" && \"$SLACK_WEBHOOK_URL\" != https://hooks.slack.com/services/*\
        \ ]]; then\n  echo \"::error ::SLACK_WEBHOOK_URL must start with https://hooks.slack.com/services/\"\
        ; fail=1\nfi\n\nif [ $fail -ne 0 ]; then\n  echo \"::error ::Preflight failed.\
        \ Fix items above.\"\n  exit 1\nfi\necho \"✅ Preflight passed.\"\n"
concurrency:
  group: cg-full-pipeline
  cancel-in-progress: false
