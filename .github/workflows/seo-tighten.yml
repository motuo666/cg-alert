name: SEO Tighten

on:
  push:
    branches: [ main ]
    paths:
      - "vendors/**"
      - "updates/**"
      - "evidence/**"
  workflow_dispatch: {}

permissions: { contents: write }

jobs:
  tighten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 18 }
      - name: Run injector
        run: |
          node -e "process.exit(require('fs').existsSync('node_modules')?0:1)" || true
          node scripts/seo_inject.js
      - name: Commit SEO injections
        run: |
          git config user.name "CG Bot"
          git config user.email "bot@cg-alert.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "seo: inject json-ld/canonical/meta"
            git push
          else
            echo "No SEO changes."
          fi
