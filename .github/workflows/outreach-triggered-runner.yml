name: Outreach Triggered Runner

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max emails"
        required: false
        default: "12"
      window_h:
        description: "Primary window (h)"
        required: false
        default: "168"
      dry:
        description: "Dry run first?"
        required: false
        default: "true"

jobs:
  call:
    uses: ./.github/workflows/outreach-triggered.yml
    with:
      limit: ${{ inputs.limit }}
      window_h: ${{ inputs.window_h }}
      dry: ${{ inputs.dry }}
    secrets: inherit
