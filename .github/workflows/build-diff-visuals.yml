name: Build Diff Visuals

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  build-diffs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Normalize evidence pairs
        run: node scripts/normalize_evidence_pairs.js

      - name: Generate diff visuals
        run: node scripts/generate_diff_visuals.js

      - name: Inject diff links
        run: node scripts/inject_diff_links.js

      - name: Commit diffs (if any)
        shell: bash
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add public/evidence || true
          if git diff --cached --quiet; then
            echo "No diffs to commit"
          else
            git commit -m "evidence: add word-level diffs and links"
            git pull --rebase --autostash || true
            git push
          fi
