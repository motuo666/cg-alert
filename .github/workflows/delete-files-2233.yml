name: Delete files by list (2233)

on:
  workflow_dispatch:
    inputs:
      list_path:
        description: "JSON 路径（默认：patch-2233/delete-files-2233.json）"
        required: true
        default: "patch-2233/delete-files-2233.json"
      dry_run:
        description: "Dry run? true=仅预览，false=实际删除"
        required: true
        default: "true"
        type: choice
        options: ["true","false"]
      commit_msg:
        description: "提交信息"
        required: true
        default: "chore(2233): remove legacy files from delete-files-2233.json"

permissions:
  contents: write

concurrency:
  group: delete-files-2233
  cancel-in-progress: true

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete by list
        env:
          LIST_PATH: ${{ inputs.list_path }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -e
          python3 - <<'PY'
          import os, json, shutil, sys
          list_path=os.environ.get('LIST_PATH','patch-2233/delete-files-2233.json')
          dry=os.environ.get('DRY_RUN','true').lower()=='true'
          if not os.path.exists(list_path):
              print(f"::error::List file not found: {list_path}")
              sys.exit(1)
          try:
              items=json.load(open(list_path,'r',encoding='utf-8'))
          except Exception as e:
              print(f"::error::Cannot parse JSON: {e}")
              sys.exit(1)
          if not isinstance(items,(list,tuple)):
              print("::error::List must be a JSON array of file paths")
              sys.exit(1)
          removed, missing, failures = [], [], []
          cwd=os.getcwd()
          for rel in items:
              if not isinstance(rel,str): continue
              rel=rel.strip().lstrip("./")
              p=os.path.join(cwd, rel)
              if not os.path.exists(p):
                  missing.append(rel); continue
              try:
                  if dry:
                      print(f"[DRY] would delete: {rel}")
                  else:
                      if os.path.isdir(p):
                          shutil.rmtree(p)
                      else:
                          os.remove(p)
                      removed.append(rel)
              except Exception as e:
                  failures.append((rel,str(e)))
          report={"list_path":list_path,"removed":removed,"missing":missing,"failures":failures,"dry_run":dry}
          open('delete-report.json','w',encoding='utf-8').write(json.dumps(report,ensure_ascii=False,indent=2))
          print(f"Removed: {len(removed)} | Missing: {len(missing)} | Failures: {len(failures)} | DryRun: {dry}")
          if failures and not dry:
              print("::warning::Some deletions failed, see delete-report.json")
          PY

      - name: Commit deletions
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "${{ inputs.commit_msg }}"
            git push
          fi

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: delete-report
          path: delete-report.json
