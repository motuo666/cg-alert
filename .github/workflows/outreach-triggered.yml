name: Outreach Triggered

on:
  schedule:
    - cron: "5 16 * * 1-5"
  workflow_dispatch:
    inputs:
      dry:      { description: "Dry run (true/false)", required: true, default: "false" }
      limit:    { description: "Max emails to send",    required: true, default: "20" }
      window_h: { description: "Evidence window hours", required: true, default: "48" }

concurrency: { group: outreach-triggered, cancel-in-progress: false }

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      DRY:   ${{ inputs.dry   || 'false' }}
      LIMIT: ${{ inputs.limit || '20'  }}
      WINDOW_H: ${{ inputs.window_h || '48' }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      BCC_TO: ${{ secrets.BCC_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with: { node-version: "20" }
      - name: Install deps
        run: npm ci

      - name: Send Triggered (auto-detect changes)
        run: node scripts/send_triggered.js --dry=${DRY} --limit=${LIMIT} --window-h=${WINDOW_H}

      - name: Slack notify
        if: always()
        run: |
          STATUS="${{ job.status }}"
          MSG="Outreach Triggered • status=${STATUS} • dry=${DRY} • limit=${LIMIT} • window_h=${WINDOW_H}"
          curl -sS -X POST -H 'Content-type: application/json' --data "$(jq -n --arg t "$MSG" '{text:$t}')" "$SLACK_WEBHOOK"
