name: Public Change Poller

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"  # 每 3 小时（UTC）

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    env:
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
      POLL_SAVE_BODY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm ci || npm i

      - name: Poll & Build Change Packs
        run: |
          set -euo pipefail
          # 确保保存 body（hash 计算依赖）
          export POLL_SAVE_BODY="${POLL_SAVE_BODY:-1}"
          node scripts/poll_public_endpoints.js
          node scripts/normalize_evidence.js
          node scripts/evidence_enrich_provenance.js
          node scripts/extract_diff_excerpt.js
          node scripts/materiality_score.js
          node scripts/build_evidence_index.js
          node scripts/build_change_pack.js
          node scripts/build_who_uses.js
          node scripts/build_updates.js
          node scripts/monthly_checksum.js

      - name: Public index / sitemap / RSS
        # 不在 env 里做表达式回退，默认值在脚本内处理
        env:
          SITE_ORIGIN: ${{ env.SITE_ORIGIN }}
        run: |
          node scripts/generate_reports_index.js
          node scripts/generate_sitemap_rss.js

      - name: Daily Ops snapshot (UTC)
        run: |
          node scripts/daily_ops_report.js || true
          node scripts/fix_sent_today.js || true
          if [ -f artifacts/daily_ops.json ]; then
            echo "### Poller Summary (UTC)" >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/daily_ops.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit changes (if any)
        run: |
          git add -A reports public data artifacts || true
          if [ -n "$(git status --porcelain)" ]; then
            git -c user.name="cg-bot" -c user.email="bot@cg-alert.com" commit -m "poller: packs+index+sitemap/rss"
            git pull --rebase --autostash || true
            git push
          else
            echo "no changes to commit"
          fi
