name: All Systems Go
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dryrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Doctor
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking required paths..."
          for p in index.html pricing/index.html reports/index.html rss/index.html intake/index.html assets; do
            if [ ! -e "$p" ]; then
              echo "::warning::missing $p"
            fi
          done

          echo "Scanning for placeholder artifacts in HTML/MD only…"
          # Only check site content files; skip code/evidence/ops to avoid误报
          if grep -RIn --exclude-dir=.git               --include="*.html" --include="*.md"               -E "<<ImageDisplayed>>|conversation too long; truncated"               . ; then
            echo "::error::Found truncation placeholders in site content. Replace these before going live."
            exit 1
          else
            echo "OK: no truncation placeholders in HTML/MD."
          fi

          echo "Optional check: warn on obvious '...' URL placeholders in HTML/MD"
          if grep -RIn --exclude-dir=.git               --include="*.html" --include="*.md"               -E "https://buy\.stripe\.com/\.\.\.|https://forms\.gle/\.\.\."               . ; then
            echo "::warning::Found URL placeholders (...) in HTML/MD. Replace with real links."
          fi
