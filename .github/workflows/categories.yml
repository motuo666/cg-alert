name: Categories Build
permissions:
  contents: write
concurrency:
  group: categories
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v6
      with:
        node-version: 20
    - run: npm ci || npm i --no-audit --no-fund
    - name: Build category pages
      env:
        SITE_ORIGIN: https://www.cg-alert.com
      run: node scripts/build_categories.js
    - name: Safe Push
      run: 'chmod +x scripts/git_safe_push.sh

        bash scripts/git_safe_push.sh "categories: weekly refresh"

        '
'on':
  workflow_dispatch: {}
  schedule:
  - cron: 12 15 * * 1
