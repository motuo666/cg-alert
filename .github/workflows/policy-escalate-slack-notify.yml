name: Policy Auto-Escalate Slack Notify
on:
  workflow_run:
    workflows:
    - Policy Auto-Escalate
    types:
    - completed
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name
      == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL || vars.SLACK_WEBHOOK_URL }}
    steps:
    - uses: actions/checkout@v4
    - name: Build Slack payload
      id: build
      run: "set -e\ncur=$(node -e \"process.stdout.write(String(require('./config/volume_policy.json').max))\"\
        \ || echo \"unknown\")\nif [ -f reports/metrics/rolling.json ]; then\n  kpi=$(cat\
        \ reports/metrics/rolling.json)\n  gate=$(echo \"$kpi\" | jq -r '.ok // empty')\n\
        \  reason=$(echo \"$kpi\" | jq -r '(.reasons|join(\"; \")) // empty')\n  sent7=$(echo\
        \ \"$kpi\" | jq -r '.sent7 // empty')\n  unsub=$(echo \"$kpi\" | jq -r '.unsub7_pct\
        \ // empty')\n  bounce=$(echo \"$kpi\" | jq -r '.bounce7_pct // empty')\n\
        \  complaint=$(echo \"$kpi\" | jq -r '.complaint7_pct // empty')\n  evidence1=$(echo\
        \ \"$kpi\" | jq -r '.evidence1 // empty')\nfi\ntext=\"Policy Auto-Escalate\
        \ • policy.max=${cur}\"\nif [ -n \"${gate}\" ]; then\n  gate_human=$([ \"\
        $gate\" = \"true\" ] && echo \"OK\" || echo \"FAIL\")\n  text=\"$text • Gate=${gate_human}\
        \ • ${reason:-no-reason} • sent7=${sent7:-na} • unsub7%=${unsub:-na} • bounce7%=${bounce:-na}\
        \ • complaint7%=${complaint:-na} • evidence1=${evidence1:-na}\"\nfi\necho\
        \ \"text=$text\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Send to Slack
      run: 'set -e

        [ -n "$SLACK_WEBHOOK_URL" ] || { echo "::error::SLACK_WEBHOOK_URL missing";
        exit 1; }

        jq -n --arg t "${{ steps.build.outputs.text }}" ''{text:$t}'' \

        | curl -sS -H ''Content-Type: application/json'' -d @- "$SLACK_WEBHOOK_URL"
        >/dev/null

        '
concurrency:
  group: cg-full-pipeline
  cancel-in-progress: false
