name: E2E Full Chain

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1" # 周一 06:00 UTC

permissions: { contents: read }

jobs:
  e2e:
    runs-on: ubuntu-latest
    concurrency: { group: cg-e2e, cancel-in-progress: true }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install deps
        run: npm ci || npm install --no-audit --no-fund

      - name: Run E2E (DRY; gate=0 也算通过)
        env:
          DRY_RUN: "true"
          # 防守：有些发送脚本即便 dry 也会 init transport，给占位避免 verify 报错
          SMTP_HOST: "localhost"
          SMTP_PORT: "25"
          SMTP_USER: "dummy"
          SMTP_PASS: "dummy"
          MAIL_FROM: "outreach@cg-alert.com"
        run: node scripts/e2e_fullchain.js
