name: Workflows Lint

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint (latest)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./bin
          curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- latest ./bin
          ./bin/actionlint -version
      - name: Lint workflows
        shell: bash
        run: |
          set -euo pipefail
          ./bin/actionlint -color
