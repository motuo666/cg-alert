name: Monthly Public Report

on:
  schedule:
    - cron: "10 15 1 * *"   # 每月 1 日 15:10 UTC
  workflow_dispatch:
    inputs:
      month:
        description: "YYYY-MM（空=当前月）"
        required: false

permissions:
  contents: write

concurrency:
  group: monthly-public-report
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://www.cg-alert.com' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps (best effort)
        run: npm ci || npm i --no-audit --no-fund || true

      - name: Compute month
        id: month
        run: |
          if [ -n "${{ inputs.month }}" ]; then
            VAL="${{ inputs.month }}"
          else
            VAL="$(date -u +%Y-%m)"
          fi
          # Guard: YYYY-MM 格式
          if ! echo "$VAL" | grep -Eq '^[0-9]{4}-[0-9]{2}$'; then
            echo "Bad month format: $VAL" >&2
            exit 1
          fi
          echo "val=$VAL" >> "$GITHUB_OUTPUT"
          echo "resolved=$VAL"

      - name: Build public monthly pages
        env:
          REPORT_MONTH: ${{ steps.month.outputs.val }}
          SITE_ORIGIN: ${{ env.SITE_ORIGIN }}
        run: |
          if [ -f scripts/build_public_monthly.js ]; then
            node scripts/build_public_monthly.js
          else
            echo "scripts/build_public_monthly.js not found"; exit 1
          fi

      - name: Rebuild evidence index (ndx)
        run: |
          if [ -f scripts/build_evidence_index.js ]; then
            node scripts/build_evidence_index.js
          else
            echo "scripts/build_evidence_index.js not found"; exit 1
          fi

      - name: Monthly prune & create artifact zip
        env:
          REPORT_MONTH: ${{ steps.month.outputs.val }}
        run: |
          if [ -f scripts/prune_evidence_monthly.js ]; then
            node scripts/prune_evidence_monthly.js
          else
            echo "scripts/prune_evidence_monthly.js not found"; exit 1
          fi

      # —— 发布当月 checksum（对当月 evidence.ndx 行做 sha256，输出 reports/<YYYY-MM>/checksum.txt）
      - name: Publish monthly checksum
        env:
          REPORT_MONTH: ${{ steps.month.outputs.val }}
        run: |
          if [ -f scripts/monthly_checksum.js ]; then
            node scripts/monthly_checksum.js
          else
            echo "scripts/monthly_checksum.js not found"; exit 1
          fi

      - name: Upload Artifact (evidence zip)
        if: ${{ hashFiles('artifacts/*.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ steps.month.outputs.val }}
          path: artifacts/*.zip
          if-no-files-found: ignore

      - name: Create GitHub Release
        if: ${{ hashFiles('artifacts/*.zip') != '' }}
        uses: ncipollo/release-action@v1
        with:
          tag: evidence-${{ steps.month.outputs.val }}
          name: Evidence Pack ${{ steps.month.outputs.val }}
          artifacts: "artifacts/*.zip"
          artifactErrorsFailBuild: false
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # —— 免费补丁：Sitemap Ping，加速收录 /reports/
      - name: Ping sitemaps
        run: |
          set -e
          echo "Pinging sitemaps for ${SITE_ORIGIN}"
          curl -s "https://www.google.com/ping?sitemap=${SITE_ORIGIN}/sitemap.xml" || true
          curl -s "https://www.bing.com/ping?sitemap=${SITE_ORIGIN}/sitemap.xml" || true

      # —— Run Summary（可视化产出指标）
      - name: Summarize
        env:
          REPORT_MONTH: ${{ steps.month.outputs.val }}
        run: |
          YM="${REPORT_MONTH}"
          PAGES=$(find "reports/${YM}" -type f -name index.html 2>/dev/null | wc -l | tr -d ' ')
          NDX_ROWS=$(test -f data/evidence.ndx && awk -F'\t' -v ym="$YM" '$1 ~ ym {c++} END{print c+0}' data/evidence.ndx || echo 0)
          ZIP_OK=$(ls -1 artifacts/*.zip 2>/dev/null | wc -l | tr -d ' ')
          {
            echo "### Monthly Public Report"
            echo "- Month: ${YM}"
            echo "- Report pages: ${PAGES}"
            echo "- evidence.ndx rows for ${YM}: ${NDX_ROWS}"
            echo "- Artifact zip(s): ${ZIP_OK}"
            echo "- Checksum: reports/${YM}/checksum.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Safe Push
        run: |
          chmod +x scripts/git_safe_push.sh || true
          bash scripts/git_safe_push.sh "report: public monthly ${{ steps.month.outputs.val }}"
