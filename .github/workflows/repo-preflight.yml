  name: Repo Preflight
on:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/**"
      - "data/**"
      - "evidence/**"
  workflow_dispatch:
permissions: { contents: read }
jobs:
  lint-and-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint GitHub Workflows
        uses: rhysd/actionlint@v1
      - uses: actions/setup-node@v4
        with: { node-version: '18' }
      - name: Run preflight checks
        run: node scripts/preflight_check.js
      - name: Build updates (dry)
        env:
          UPDATES_DAYS: '30'
          UPDATES_LIMIT: '5'
          SITE_ORIGIN: 'https://www.cg-alert.com'
        run: |
          node scripts/build_updates.js
          test -f updates/index.html
          test -f updates/rss.xml
          echo "updates generated OK"
      - name: Check required secrets presence
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          missing=0
          for k in SMTP_HOST SMTP_USER SMTP_PASS FROM_EMAIL SLACK_WEBHOOK_URL; do
            v="${!k}"
            if [ -z "$v" ]; then
              echo "::warning ::Missing secret $k"
              missing=1
            fi
          done
          exit 0  # 只告警不失败，防止阻断其它流水线
      - name: Upload updates preview
        uses: actions/upload-artifact@v4
        with:
          name: updates-preview
          path: |
            updates/index.html
            updates/rss.xml
          if-no-files-found: warn
