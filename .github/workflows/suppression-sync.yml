name: Suppression Sync

on:
  schedule:
    - cron: "30 * * * *" # hourly offset
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: suppression-sync
  cancel-in-progress: true

jobs:
  suppression:
    if: ${{ false }}  # disabled by overlay on 2025-11-02
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install

      - name: Apply suppression to leads.csv
        run: node scripts/suppression_apply.js

      - name: Commit & push leads.csv after suppression
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add data/leads.csv || true
          if git diff --cached --quiet; then
            echo "no suppression changes"
          else
            git commit -m "suppression-sync: applied suppression to leads"
            git pull --rebase --autostash || true
            git push
          fi