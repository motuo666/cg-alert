name: Outreach Rescue
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "0=真发, 1=干跑"
        default: "1"
        required: true

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Rescue is alive (dry_run=${{ github.event.inputs.dry_run }})"
