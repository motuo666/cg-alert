name: Vendors Build
on:
  workflow_dispatch: {}
  push:
    paths:
      - 'evidence/**'
      - 'scripts/render_evidence_pages.mjs'
      - 'scripts/build_vendors_index.mjs'
      - 'assets/overrides.css'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLISH_DIR: .
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm bootstrap (noop)
        run: npm ci || npm install
      - name: Render reports & RSS (ESM)
        run: |
          node scripts/build_vendors_index.mjs
          node scripts/render_evidence_pages.mjs
      - name: Commit & push
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add -A reports rss assets/overrides.css index.html about terms privacy
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "build: render reports/rss + homepage/pricing overrides"
            git push
          fi
