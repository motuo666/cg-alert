name: Public Change Poller
on:
  schedule:
    - cron: '10 */6 * * *'   # every 6 hours, before Build Content (15 */6 * * *)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: poller
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Generate evidence (placeholder if none today)
        run: node scripts/poller.js

      - name: Render evidence pages
        run: node scripts/render_evidence_pages.js

      - name: Build RSS
        run: node scripts/evidence_to_rss.js

      - name: Build sitemap
        run: node scripts/build_sitemap.js

      - name: Commit content
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add -A public/evidence public/vendors public/rss public/sitemap.xml sitemap*.xml || true
          if git diff --cached --quiet; then
            echo "no content changes"
          else
            git commit -m "poller: evidence+pages+rss+sitemap"
            git pull --rebase --autostash || true
            git push
          fi
