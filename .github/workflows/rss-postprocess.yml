name: RSS Postprocess (styled + cg fields)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  postprocess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install XML tool
        run: npm i fast-xml-parser@4.4.0
      - name: Postprocess RSS
        run: node scripts/rss_postprocess.js
      - name: Commit changes
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add -A reports/
          if git status --porcelain | grep -q .; then
            git commit -m "chore(rss): inject stylesheet + ensure cg fields"
            git pull --rebase --autostash || true
            git push
          else
            echo "no changes"
          fi
