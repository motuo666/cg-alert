name: E2E Full Chain
on:
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with: { node-version: '20' }
      - name: Install deps
        run: npm ci
      - name: E2E (DRY chain)
        run: node scripts/e2e_fullchain.js
