name: check
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 20
    - name: Install deps
      shell: bash
      run: 'npm ci || npm i

        '
    - name: Run pipeline (fix -> show)
      shell: bash
      run: 'set -euo pipefail

        # 1) 生成快照

        node scripts/daily_ops_report.js || true

        # 2) 修正 sent_today 等

        node scripts/fix_sent_today.js || true

        # 3) 做自动验收（以修正后的数据为准）

        node scripts/acceptance_check.js

        '
    - name: Summaries to GitHub Step Summary
      if: always()
      shell: bash
      run: "set -euo pipefail\necho \"## Daily Ops Snapshot (UTC)\" >> \"$GITHUB_STEP_SUMMARY\"\
        \nif [ -f artifacts/daily_ops.json ]; then\n  cat artifacts/daily_ops.json\
        \ >> \"$GITHUB_STEP_SUMMARY\"\nelse\n  echo '{\"note\":\"no daily_ops.json\
        \ produced\"}' >> \"$GITHUB_STEP_SUMMARY\"\nfi\necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\
        \necho \"## Auto Acceptance\" >> \"$GITHUB_STEP_SUMMARY\"\nif [ -f artifacts/acceptance.md\
        \ ]; then\n  cat artifacts/acceptance.md >> \"$GITHUB_STEP_SUMMARY\"\nelse\n\
        \  echo \"_acceptance.md missing — check acceptance_check.js execution_\"\
        \ >> \"$GITHUB_STEP_SUMMARY\"\nfi\n"
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: daily_ops
        path: 'artifacts/daily_ops.json

          artifacts/acceptance.md

          '
        if-no-files-found: warn
'on':
  workflow_dispatch: {}
