name: Intake Sync

on:
  schedule:
    - cron: "*/15 * * * *" # every 15 min
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: intake-sync
  cancel-in-progress: true

jobs:
  intake:
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install

      - name: Sync intake + unsub from KV
        run: |
          node scripts/intake_sync_kv.js
          node scripts/sync_unsub_kv.js

      - name: Commit & push intake/unsub updates
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add data/intakes.csv data/customers.csv data/unsubscribes.csv || true
          if git diff --cached --quiet; then
            echo "no intake changes"
          else
            git commit -m "intake-sync: synced KV intake/unsubs"
            git pull --rebase --autostash || true
            git push
          fi
