name: Programmatic SEO Pages
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    concurrency:
      group: seo-pages
      cancel-in-progress: true
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install deps
      run: npm i dayjs fs-extra glob@10
    - name: Generate SEO pages + sitemap
      env:
        SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
      run: 'node scripts/generate_seo_pages.js

        node scripts/build_sitemap.js

        '
    - name: Commit SEO pages
      run: "set -e\ngit config user.name \"bot\"\ngit config user.email \"bot@users.noreply.github.com\"\
        \ngit add -A public/seo public/sitemap.xml\nif git diff --staged --quiet;\
        \ then\n  echo \"No changes.\"\nelse\n  git commit -m \"chore(seo): daily\
        \ programmatic pages & sitemap\"\n  git push\nfi\n"
'on':
  workflow_dispatch: {}
  schedule:
  - cron: 30 2 * * *
