name: Outreach Brand Compile
on:
  workflow_dispatch:
  push:
    paths:
      - 'config/brand.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Build outreach templates from brand.json
        run: node scripts/build_outreach_from_brand.js
      - name: Commit templates
        run: |
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add config/outreach_active.* config/templates/outreach_*.*
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "outreach: compile from brand.json"
            git pull --rebase --autostash || true
            git push
          fi
