name: Site QA (assets only)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Assets Check
        run: node scripts/qa/assets_check.js
      - name: Commit artifacts
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add artifacts/assets_check.json || true
          if git diff --cached --quiet; then echo 'no changes'; else git commit -m "qa: assets check"; git pull --rebase --autostash || true; git push; fi
