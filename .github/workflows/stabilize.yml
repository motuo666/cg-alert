name: Stabilize Site

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stabilize
  cancel-in-progress: true

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install

      - name: Repair pages / redirects / CTA
        run: node scripts/repair_pages.js

      - name: Commit & push repaired pages
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add index.html enterprise/index.html dashboard _redirects || true
          if git diff --cached --quiet; then
            echo "no stabilize changes"
          else
            git commit -m "stabilize: repaired CTA/redirects/pages"
            git pull --rebase --autostash || true
            git push
          fi
