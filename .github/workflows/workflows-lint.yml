name: Workflows Lint

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/**.yml"
      - ".github/workflows/**.yaml"
  pull_request:
    paths:
      - ".github/workflows/**.yml"
      - ".github/workflows/**.yaml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download actionlint (latest)
        run: |
          set -euo pipefail
          curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- latest ./bin
          ./bin/actionlint -version

      - name: Run actionlint (ignore _archive/)
        run: |
          set -euo pipefail
          files=$(git ls-files ".github/workflows/*.yml" ".github/workflows/*.yaml" | grep -v "^.github/workflows/_archive/") || true
          if [ -n "$files" ]; then
            echo "$files" | xargs -r ./bin/actionlint -color
          else
            echo "No workflows to lint"
          fi
