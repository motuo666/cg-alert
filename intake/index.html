<!doctype html><html lang='en'><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CG Alert — Enterprise intake</title>
<meta name="description" content="Tell us your vendors and preferred cadence. We'll set up enterprise monitoring and deliver evidence-backed alerts.">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/site.webmanifest">
<link rel="canonical" href="https://www.cg-alert.com/intake/">
<meta name="worker-url" content="https://api.cg-alert.com">
<link rel="preconnect" href="https://buy.stripe.com" crossorigin>
<link rel="stylesheet" href="/assets/home-v3c.css">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; connect-src 'self' https://api.cg-alert.com https://buy.stripe.com; frame-src https://buy.stripe.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'self' https://buy.stripe.com https://forms.gle;">
<script src="/assets/app-intake.js" defer></script>
</head><body><header class="cg-topbar">
  <div class="cg-wrap cg-nav">
    <a class="cg-brand" href="/"><img src="/icon.svg" alt="CG Alert" width="40" height="40"><span>CG&nbsp;Alert</span></a>
    <nav class="cg-links" id="topnav">
      <a href="/#pricing">Pricing</a>
      <a href="/#how">How it works</a>
      <a href="/#evidence">Evidence</a>
      <a href="/#compare">Compare</a>
      <a href="/#faq">FAQ</a>
      
    </nav>
  </div>
</header>
<main class="cg-container py-10">
  <section class="max-w-3xl mx-auto">
    <h1 class="h1 mb-4">Enterprise Intake</h1>
    <p class="muted mb-8">符合 Enterprise（200+ vendors / 风险与合规）的客户信息收集。我们会在 1 个工作日内回邮开启监控。</p>

    <div class="notice" role="status" aria-live="polite" style="display:none;"></div>

    <form id="enterprise-intake" class="cg-form" method="post" action="" data-worker="">
      <div class="grid gap-6">
        <label class="block">
          <span class="label">工作邮箱</span>
          <input required type="email" name="email" placeholder="you@company.com" class="input">
        </label>

        <label class="block">
          <span class="label">公司名称</span>
          <input required type="text" name="company" placeholder="Your company" class="input">
        </label>

        <label class="block">
          <span class="label">套餐</span>
          <select name="plan" class="input">
            <option value="enterprise" selected>Enterprise (200+ vendors)</option>
            <option value="business">Business (≤50 vendors)</option>
            <option value="portfolio">Portfolio (≤25 vendors)</option>
          </select>
        </label>

        <label class="block">
          <span class="label">供应商域名（逗号/换行分隔，可后续补充）</span>
          <textarea name="vendors" rows="6" placeholder="example.com, vendor2.com, ..." class="input"></textarea>
        </label>

        <div class="flex items-center gap-3">
          <button id="submitBtn" type="submit" class="btn btn-primary">Submit</button>
          <a class="btn btn-ghost" href="/who-uses/">Who uses CG Alert</a>
        </div>
      </div>
    </form>
  </section>
</main>
<footer class="cg-footer">
  <div class="cg-wrap cg-footlinks">
    <a href="/who-uses/">Who uses</a>
    <a href="/about/">About</a>
    <a href="/reports/">Reports</a>
    <a href="/rss/index.xml">RSS</a>
    <a href="/terms/">Terms</a>
    <a href="/privacy/">Privacy</a>
    <span>© CG Alert — evidence-backed vendor change alerts.</span>
  </div>
</footer></body></html>
