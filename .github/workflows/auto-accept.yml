name: Auto Acceptance
on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Daily Ops (scheduled)"]
    types: [completed]
permissions:
  contents: read

jobs:
  accept:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps (if needed)
        run: |
          if [ -f package.json ]; then npm ci || npm i; fi
      - name: Acceptance check
        run: |
          set -euo pipefail
          node scripts/acceptance_check.js
      - name: Publish Acceptance Summary
        if: always()
        run: |
          set -euo pipefail
          echo "## Auto Acceptance (UTC)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifacts/acceptance.md ]; then
            cat artifacts/acceptance.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_acceptance.md missing — check acceptance_check.js execution_" >> "$GITHUB_STEP_SUMMARY"
          fi
