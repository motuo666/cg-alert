name: CG Full Pipeline

on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cg-full-pipeline
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      is_monday: ${{ steps.dow.outputs.is_monday }}
    steps:
      - name: Compute day-of-week
        id: dow
        run: |
          DOW=$(date -u +%u)   # 1..7 (Mon..Sun)
          if [ "$DOW" = "1" ]; then
            echo "is_monday=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_monday=false" >> "$GITHUB_OUTPUT"
          fi

  poller:
    runs-on: ubuntu-latest
    needs: prepare
    env:
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://www.cg-alert.com' }}
      R2_EVIDENCE_WRITE_URL: ${{ vars.R2_EVIDENCE_WRITE_URL || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm ci || true
      - name: Poll vendors (two-stage confirmation)
        run: node scripts/poller.mjs
      - name: Build sitemap
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://www.cg-alert.com' }}
        run: node scripts/build_sitemap.mjs
      - name: Commit poller content
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"

          git add -A evidence reports rss/index.xml sitemap.xml || true

          if git diff --cached --quiet; then
            echo "no content changes"
          else
            git commit -m "poller: evidence+pages+rss+sitemap (full pipeline)" || echo "WARN: commit failed (maybe no staged changes)."
            git pull --rebase --autostash || echo "WARN: git pull --rebase failed (likely race)."
            git push || echo "WARN: git push failed (non-fast-forward); will retry on next run."
          fi

  vendors_build:
    runs-on: ubuntu-24.04
    needs: poller
    env:
      NODE_OPTIONS: --max-old-space-size=2048
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm ci || npm install
      - name: Build vendors + reports + RSS
        run: |
          node scripts/vendors_build.mjs
          node scripts/reports_build.mjs
          node scripts/build_reports_rss.js
      - name: Commit & push reports
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"

          git add -A reports rss || true

          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "Reports build (full pipeline)" || echo "WARN: commit failed (maybe no staged changes)."
            git pull --rebase --autostash || echo "WARN: git pull --rebase failed (likely race)."
            git push || echo "WARN: git push failed (non-fast-forward); will retry on next run."
          fi

  feeds_and_sitemap:
    runs-on: ubuntu-24.04
    needs: vendors_build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install pyyaml
      - name: Generate feeds & pages
        env:
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: |
          python scripts/gen_feeds.py
      - name: Build sitemap
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://www.cg-alert.com' }}
        run: node scripts/build_sitemap.mjs
      - name: Commit feeds/sitemap
        run: |
          git config user.name "cg-alert-bot"
          git config user.email "bot@cg-alert.com"

          # 暂存需要的文件，失败不致命
          git add rss/index.xml sitemap.xml reports/index.html || true

          # 如果没有任何变化，直接跳过
          if git diff --cached --quiet; then
            echo "No RSS/sitemap changes; skipping commit & push."
            exit 0
          fi

          # 尝试 commit（如果已经没 staged 也不会炸）
          git commit -m "chore: auto-update rss/sitemap/reports index (full pipeline)" || echo "WARN: commit failed (likely no staged changes)."

          # 远端可能被其他 Job 推新了，轻量尝试 rebase
          git pull --rebase --autostash || echo "WARN: git pull --rebase failed (likely race); continuing."

          # push 如果失败，只打警告，不让 Job 红
          git push || echo "WARN: git push failed (non-fast-forward). Another job updated main; will retry on next run."

  latest_board:
    runs-on: ubuntu-24.04
    needs: feeds_and_sitemap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build latest board
        env:
          LATEST_N: 12
        run: node scripts/build_latest_board.mjs
      - name: Commit latest board
        run: |
          git config user.name "cg-alert-bot"
          git config user.email "bot@cg-alert.com"

          git add reports/latest.html || true

          if git diff --cached --quiet; then
            echo "no latest board changes"
          else
            git commit -m "chore: add reports/latest.html" || echo "WARN: commit failed (maybe no staged changes)."
            git pull --rebase --autostash || echo "WARN: git pull --rebase failed (likely race)."
            git push || echo "WARN: git push failed (non-fast-forward); will retry on next run."
          fi

  pricing_sync:
    runs-on: ubuntu-latest
    needs: vendors_build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync pricing
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://www.cg-alert.com' }}
          STRIPE_LINK_PORTFOLIO: ${{ secrets.STRIPE_LINK_PORTFOLIO || vars.STRIPE_LINK_PORTFOLIO }}
          STRIPE_LINK_BUSINESS:  ${{ secrets.STRIPE_LINK_BUSINESS  || vars.STRIPE_LINK_BUSINESS  }}
        run: node scripts/pricing_sync.mjs

  daily_digest:
    runs-on: ubuntu-24.04
    needs:
      - vendors_build
      - feeds_and_sitemap
      - pricing_sync
    env:
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
      WORKER_URL: ${{ vars.WORKER_URL }}
      UNSUB_ORIGIN: ${{ vars.UNSUB_ORIGIN || secrets.UNSUB_ORIGIN }}
      INTAKE_FORM_URL: ${{ vars.INTAKE_FORM_URL }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
      REPLY_TO: ${{ vars.REPLY_TO }}
      SENDER_NAME: ${{ vars.SENDER_NAME }}
      MAIL_POSTAL_ADDRESS: ${{ vars.MAIL_POSTAL_ADDRESS }}
      MAIL_RETURN_PATH: ${{ vars.MAIL_RETURN_PATH }}
      BCC_TO: ${{ secrets.BCC_TO }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL || vars.SLACK_WEBHOOK_URL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      IMAP_HOST: ${{ secrets.IMAP_HOST }}
      IMAP_PORT: ${{ secrets.IMAP_PORT }}
      IMAP_USER: ${{ secrets.IMAP_USER }}
      IMAP_PASS: ${{ secrets.IMAP_PASS }}
      CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID || secrets.KV_NAMESPACE_ID }}
      KV_LEADS_ID: ${{ vars.KV_LEADS_ID || secrets.KV_LEADS_ID }}
      STRIPE_LINK_PORTFOLIO: ${{ vars.STRIPE_LINK_PORTFOLIO || secrets.STRIPE_LINK_PORTFOLIO }}
      STRIPE_LINK_BUSINESS:  ${{ vars.STRIPE_LINK_BUSINESS  || secrets.STRIPE_LINK_BUSINESS  }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      OBS_KEY: ${{ secrets.OBS_KEY }}
      ENRICH_API_TOKEN: ${{ secrets.ENRICH_API_TOKEN }}
      TARGET_DISCOVERY_API_URL: ${{ vars.TARGET_DISCOVERY_API_URL }}
      TARGET_DISCOVERY_API_TOKEN: ${{ secrets.TARGET_DISCOVERY_API_TOKEN }}
      MIN_HASH_RATIO: ${{ vars.MIN_HASH_RATIO }}
      MIN_SENT7_FOR_DLVR: ${{ vars.MIN_SENT7_FOR_DLVR }}
      P95_TTD_MAX_HOURS: ${{ vars.P95_TTD_MAX_HOURS }}
      TARGET_EVID_TODAY: ${{ vars.TARGET_EVID_TODAY }}
      TARGET_SENT: ${{ vars.TARGET_SENT }}
      TTD_LOOKBACK_HOURS: ${{ vars.TTD_LOOKBACK_HOURS }}
      UNSUB_7D_MAX: ${{ vars.UNSUB_7D_MAX }}
      COMPLAINT_7D_MAX: ${{ vars.COMPLAINT_7D_MAX }}
      BOUNCE_7D_MAX: ${{ vars.BOUNCE_7D_MAX }}
      REQUIRE_CHANGED_VENDORS: ${{ vars.REQUIRE_CHANGED_VENDORS }}
      DIGEST_MODE: daily
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm i nodemailer@6 fast-xml-parser@4.4.0 --no-save
      - name: Send daily digest
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          REPLY_TO: ${{ vars.REPLY_TO }}
          DIGEST_MODE: daily
        run: node scripts/customer_digest.js

