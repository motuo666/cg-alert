name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  schedule:
    - cron: "17 5 * * *"  # 每日例行检查

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install pre-commit
        run: |
          pip install pre-commit
          pre-commit install-hooks
      - name: Run pre-commit
        run: pre-commit run --all-files

  python:
    if: ${{ hashFiles('**/requirements.txt', '**/pyproject.toml') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install .; fi
      - name: Run tests (if exist)
        run: |
          if [ -d tests ]; then pytest -q; else echo "no tests"; fi

  node:
    if: ${{ hashFiles('**/package.json') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm ci || npm install
      - name: Lint & Test (if exist)
        run: |
          if [ -f package.json ]; then             if npm run | grep -q "lint"; then npm run lint || true; fi;             if npm run | grep -q "test"; then npm test || true; fi;           fi

