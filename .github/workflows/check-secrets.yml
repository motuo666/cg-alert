name: Check Secrets & Vars
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify required variables/secrets
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
          INTAKE_FORM_URL: ${{ vars.INTAKE_FORM_URL }}
          STRIPE_LINK_PORTFOLIO: ${{ vars.STRIPE_LINK_PORTFOLIO }}
          STRIPE_LINK_BUSINESS: ${{ vars.STRIPE_LINK_BUSINESS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          UNSUB_HMAC_SECRET: ${{ secrets.UNSUB_HMAC_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
        run: |
          set -e
          req=(SITE_ORIGIN SMTP_HOST SMTP_USER SMTP_PASS UNSUB_HMAC_SECRET)
          miss=0
          for v in "${req[@]}"; do
            if [ -z "${!v}" ]; then echo "::error::Missing $v"; miss=$((miss+1)); else echo "OK $v"; fi
          done
          opt=(INTAKE_FORM_URL STRIPE_LINK_PORTFOLIO STRIPE_LINK_BUSINESS SLACK_WEBHOOK_URL IMAP_HOST IMAP_USER IMAP_PASS)
          for v in "${opt[@]}"; do
            if [ -z "${!v}" ]; then echo "::warning::Optional missing $v"; else echo "OK $v"; fi
          done
          [ "$miss" -eq 0 ] || exit 1
