name: Reports Build
on:
  workflow_dispatch:
  push:
    paths: [ 'public/evidence/**' ]
permissions: { contents: write }
jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: |
          node scripts/build_change_pack.js || true
          node scripts/generate_reports_index.js || true
          node scripts/build_rss.js || true
      - name: Commit
        run: |
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add -A reports rss.xml
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "reports: rebuild"; git pull --rebase --autostash || true; git push; fi
