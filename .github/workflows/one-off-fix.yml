name: one-off-fix
on:
  workflow_dispatch: {}

jobs:
  migrate-proof-to-snapshots:
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Install deps
        run: npm ci || npm i

      # 先“修”数据（去掉 run 链接等内部字段）
      - name: Redact internal fields
        run: node scripts/redact_public_fields.js || true

      # 生成站内快照到 public/proof，并把链接写成 /proof/...
      - name: Build local proof snapshots
        env:
          PROOF_OUT_DIR: public/proof
          PROOF_BASE: /proof
        run: node scripts/build_proof_from_evidence.js

      # 用站内快照替换报告里的 Proof 列
      - name: Rebuild change pages
        env:
          PROOF_BASE: /proof
        run: node scripts/build_change_pack.js

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/proof reports/ || true
          git commit -m "migrate Proof to /proof snapshots; remove run links" || echo "Nothing to commit"
          git push
