name: Secret Scan (Gitleaks)
on:
  push:
  pull_request:
  schedule:
    - cron: '20 14 * * 1'  # 每周一 08:20 MT
permissions: { contents: read }
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        with: { args: detect --redact --verbose }
