name: Target Discovery Autopilot
on:
  schedule: [ { cron: '25 */6 * * *' } ]
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install deps (light)
        run: |
          set -e
          if [ -f package.json ]; then
            npm pkg set engines.node=">=20"
            npm i --no-audit --no-fund fast-xml-parser
          fi
      - name: Run target discovery
        env: { ALSO_BUILD: "false" }
        run: node scripts/target_discovery.mjs
      - name: Commit & push candidates
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add -A data/seed_domains.txt data/leads.csv config/expand_rules.json || true
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "autopilot: discovery update"
            git pull --rebase --autostash || true
            git push
          fi
      - name: Install deps
        run: npm ci
