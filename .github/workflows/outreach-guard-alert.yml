name: Outreach Guard Alert
on:
  schedule:
    - cron: '40 0 * * *'   # 09:40 JST 每日
  workflow_dispatch:
permissions: { contents: read }
jobs:
  guard:
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL || vars.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: node scripts/ops/outreach_guard_alert.js
