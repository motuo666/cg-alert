nalInformation":"\tUnlimited","relevantPlan":[{"planTitleExternal":"Standard","__typename":"ContentPlatformPlan"},{"planTitleExternal":"Premium","__typename":"ContentPlatformPlan"}],"__typename":"ContentPlatformFeatureAdditionalInformation"}],"__typename":"ContentPlatformFeature"},{"callOut":null,"featureNameExternal":"Build minutes","description":"<p>Build minutes are minutes executing a pipeline for building, testing, and deploying with Bitbucket Pipelines. Think of build minutes as those minutes when your pipeline status is &quot;In progress.&quot; <a href=\"https://support.atlassian.com/bitbucket-cloud/docs/build-test-and-deploy-with-pipelines\">Learn more</a>.</p>","relevantPlan":null,"relevantUrl":null,"featureAdditionalInformation":[{"featureAdditionalInformation":"50 minutes per month","relevantPlan":[{"planTitleExternal":"Free","__typename":"ContentPlatformPlan"}],"__typename":"ContentPlatformFeatureAdditionalInformation"},{"featureAdditionalInformation":"2,500 minutes per month","relevantPlan":[{"planTitleExternal":"Standard","__typename":"ContentPlatformPlan"}],"__typename":"ContentPlatformFeatureAdditionalInformation"},{"featureAdditionalInformation":"3,500 minutes per month\n","relevantPlan":[{"planTitleExternal":"Premium","__typename":"ContentPlatformPlan"}],"__typename":"ContentPlatformFeatureAdditionalInformation"}],"__typename":"ContentPlatformFeature"},{"callOut":null,"featureNameExternal":"Additional build minutes","description":"<p>If you need more build minutes than your plan allows, you can buy 1,000 more minutes for $10 a month. <a href=\"https://support.atlassian.com/bitbucket-cloud/docs/manage-your-plan-and-billing\">See how</a> to buy more minutes.</p>","relevantPlan":null,"relevantUrl":null,"featureAdditionalInformation":[{"featureAdditionalInformation":"$10 per 1,000 additional build minutes, per month","relevantPlan":[{"planTitleExternal":"Free","__typename":"ContentPlatformPlan"},{"planTitleExternal":"Standard","__typename":"ContentPlatformPlan"},{"planTitleExternal":"Premium","__typename":"ContentPlatformPlan"}],"__typename":"ContentPlatformFeatureAdditionalInformation"}],"__typename":"ContentPlatformFeature"},{"callOut":null,"featureNameExternal":"Git LFS (Large File Storage)","description":"<p>Using Git LFS, large files are kept in parallel storage to your code and lightweight references are stored in your Git repository. This feature is useful for teams that work with large media files like video. <a href=\"https://support.atlassian.com/bitbucket-cloud/docs/manage-large-files-with-git-large-file-storage-lfs\">Learn more</a>.</p><p>If you need to buy more LFS, you can buy 100 GB more for $10 a month. <a href=\"https://support.atlassian.com/bitbucket-cloud/docs/manage-your-plan-and-billing\">See how</a> to buy more storage.</p>","relevantPlan":null,"relevantUrl":null,"featureAdditionalInformation":[{"featureAdditionalInformation":"1 GB","relevantPlan":[{"planTitleExternal":"Free","__typename":"ContentPlatformPlan"}],"__typename":"ContentPlatformFeatureAdditionalInformation"},{"featureAdditionalInformation":"5 GB","relevantPlan":[{"planTitleExternal":"Standard","__typename":"ContentPlatformPlan"}],"__typename":"ContentPlatformFeatureAdditionalInformation"},{"featureAdditionalInformation":"10 GB","relevantPlan":[{"planTitleExternal":"Premium","__typename":"ContentPlatformPlan"}],"__typename":"ContentPlatformFeatureAdditionalInformation"}],"__typename":"ContentPlatformFeature"},{"callOut":null,"featureNameExternal":"Code insights","description":"<p>Code insights compiles results from scanning, testing, and analysis tools in a pull request, giving reviewers context before approving changes.</p><p>The free plan provides results from up to three third-party integrations. Paid plans give you results from an unlimited number of integrations.</p><p><a href=\"https://support.atlassian.com/bitbucket-cloud/docs/code-insights\">Learn More</a></p>","relevantPlan":null,"relevantUrl":null,"featureAdditionalInformation":[{"featureAdditionalInformation":"Three integrations\t","relevantPlan":[{"planTitleExternal":"Free","__typename":"ContentPlatformPlan"},{"planTitleExternal":"Standard","__typename":"ContentPlatformPlan"}],"__typename":"ContentPlatformFeatureAdditionalInformation"},{"featureAdditionalInformation":"Unlimited","relevantPlan":[{"planTitleExternal":"Premium","__typename":"ContentPlatformPlan"}],"__typename":"ContentPlatformFeatureAdditionalInformation"}],"__typename":"ContentPlatformFeature"},{"callOut":null,"featureNameExternal":"Deployment environments","description":"<p>Monitor all the deployments you run through Bitbucket Pipelines so your team gets visibility into what’s running in each environment and each deployment’s status.</p><p>The free plans lets teams track up to 10 deployment environments. Paid plans let you view up to 50 deployment environments.</p><p><a href=\"https://support.atlassian.com/bitbucket-cloud/docs/set-up-and-monitor-bitbucket-deployments\">Learn More</a></p>","relevantPlan":null,"relevantUrl":null,"featureAdditionalInformation":[{"featureAdditionalInformation":"10","relevantPlan":[{"planTitleExternal":"Free","__typename":"ContentPlatformPlan"}],"__typename":"ContentPlatformFeatureAdditionalInformation"},{"featureAdditionalInformation":"100","relevantPlan":[{"planTitleExternal":"Standard","__typename":"ContentPlatformPlan"},{"planTitleExternal":"Premium","__typename":"ContentPlatformPlan"}],"__typename":"ContentPlatformFeatureAdditionalInformation"}],"__typename":"ContentPlatformFeature"},{"callOut":null,"featureNameExternal":"Unlimited private repositories","description":null,"relevantPlan":[{"planTitleExternal":"Free","__typename":"ContentPlatformPlan"},{"planTitleExternal":"Standard","__typename":"ContentPlatformPlan"},{"planTitleExternal":"Premium","__typename":"ContentPlatformPlan"}],"relevantUrl":null,"featureAdditionalInformation":null,"__typename":"ContentPlatformFeature"},{"callOut":null,"featureNameExternal":"Jira integration","description":"<p>Create branches and view contextual development and deployment info from Bitbucket within a Jira issue. This integration lets you automatically transition issues when Bitbucket actions (for example, after a pull request is created or closed) are performed. View and edit issues directly in Bitbucket.</p><p><a href=\"https://www.atlassian.com/software/jira/bitbucket-integration\">Learn More</a></p>","relevantPlan":[{"planTitleExternal":"Free","__typename":"ContentPlatformPlan"},{"planTitleExternal":"Standard","__typename":"ContentPlatformPlan"},{"planTitleExternal":"Premium","__typename":"ContentPlatformPlan"}],"relevantUrl":null,"featureAdditionalInformation":null,"__typename":"ContentPlatformFeature"},{"callOut":null,"featureNameExternal":"CI/CD (continuous integration and continuous delivery)","description":"<p>Automatically start builds, tests, and deploys through integrated CI/CD with Bitbucket Pipelines.</p><p>Bitbucket Pipelines is managed as code: commit a yaml file with your CLI (command line interface) commands and environment variables, then kick builds off instantly. Whether you want to deploy, test, monitor, or analyze code, Pipelines gives you integrations with the tools you know.</p><p><a href=\"https://www.atlassian.com/software/bitbucket/features/pipelines\">Learn More</a></p>","relevantPlan":[{"planTitleExternal":"Free","__typename":"ContentPlatformPlan"},{"planTitleExternal":"Standard","__typename":"ContentPlatformPlan"},{"planTitleExternal":"Premium","__typename":"ContentPlatformPlan"}],"relevantUrl":null,"featureAdditionalInformation":null,"__typename":"ContentPlatformFeature"},{"callOut":null,"featureNameExternal":"Unlimited pull request reviewers","description":"<p><br />With pull requests in Bitbucket, there are no limits to how many reviewers you can add, helping ensure the correct people are always able to see and approve changes.</p>","relevantPlan":[{"planTitleExternal":"Free","__typename":"ContentPlatformPlan"},{"planTitleExternal":"Standard","__typename":"ContentPlatformPlan"},{"planTitleExternal":"Premium","__typename":"ContentPlatformPlan"}],"relevantUrl":null,"featureAdditionalInformation":null,"__typename":"ContentPlatformFeature"},{"callOut":null,"featureNameExternal":"Merge checks","description":"<p>Merge checks let you recommend certain conditions on pull request merges are met for individual branches.</p><p>These checks include builds passing, minimum number of reviewers, and completion of all pull request tasks.</p><p><a href=\"https://support.atlassian.com/bitbucket-cloud/docs/suggest-or-require-checks-before-a-merge\">Learn More</a></p>","relevantPlan":[{"planTitleExternal":"Free","__typename":"ContentPlatformPlan"},{"planTitleExternal":"Standard","__typename":"ContentPlatformPlan"},{"planTitleExternal":"Premium","__typename":"ContentPlatformPlan"}],"relevantUrl":null,"featureAdditionalInformation":null,"__typename":"ContentPlatformFeature"},{"callOut":null,"featureNameExternal":"AI-powered pull request descriptions","description":"<p>Atlassian Intelligence (AI)-assisted pull request descriptions analyzes your code changes and commit messages to gain a deep understanding of the context behind your work. It then uses this information to generate a PR description that effectively captures the key aspects of your changes.</p><p><a href=\"https://support.atlassian.com/bitbucket-cloud/docs/use-atlassian-intelligence-to-help-write-or-edit-content\">Learn More</a></p>","relevantPlan":[{"planTitleExternal":"Premium","__typename":"ContentPlatformPlan"},{"planTitleExternal":"Standard","__typename":"ContentPlatformPlan"}],"relevantUrl":null,"featureAdditionalInformation":null,"__typename":"ContentPlatformFeature"},{"callOut":null,"featureNameExternal":"AI-enhanced summaries in editor prompts","description":"<p>Elevate your editing experience with summaries generated by Atlassian Intelligence directly in the Bitbucket editor prompt, providing quick insights and context for efficient content creation.</p><p><a href=\"https://support.atlassian.com/bitbucket-cloud/docs/use-atlassian-intelligence-to-help-write-or-edit-content\">Learn More</a></p>","relevantPlan":[{"planTitleExternal":"Premium","__typename":"ContentPlatformPlan"},{"planTitleExternal":"Standard","__typename":"ContentPlatformPlan"}],"relevantUrl":null,"featureAdditionalInformation":null,"__typename":"ContentPlatformFeature"},{"callOut":null,"featureNameExternal":"AI-driven pull request comment creation with custom prompts","description":"<p>Reviewers can use Atlassian Intelligence to interactively suggest code changes, and more.</p><p><a href=\"https://support.atlassian.com/bitbucket-cloud/docs/use-atlassian-intelligence-to-help-write-or-edit-content\">Learn More</a></p>","relevantPlan":[{"planTitleExternal":"Premium","__typename":"ContentPlatformPlan"},{"planTitleExternal":"Standard","__typename":"ContentPlatformPlan"}],"relevantUrl":null,"featureAdditionalInformation":null,"__typename":"ContentPlatformFeature"},{"callOut":null,"featureNameExternal":"AI-enabled spelling, grammar, and tone editing in pull requests","description":"<p>Atlassian Intelligence (AI)-assisted editing in Bitbucket can be used to:</p><ul><li><p>Improve writing</p></li><li><p>Shorten writing</p></li><li><p>Fix spelling &amp; grammar</p></li><li><p>Change tone (casual, educational, empathetic, neutral, professional)</p></li></ul><p><a href=\"https://support.atlassian.com/bitbucket-cloud/docs/use-atlassian-intelligence-to-help-write-or-edit-content\">Learn More</a></p>","relevantPlan":[{"planTitleExternal":"Premium","__typename":"ContentPlatformPlan"},{"planTitleExternal":"Standard","__typename":"ContentPlatformPlan"}],"relevantUrl":null,"featureAdditionalInformation":null,"__typename":"ContentPlatformFeature"},{"callOut":null,"featureNameExternal":"Dynamic CI/CD pipelines","description":"<p>Manage intelligent CI/CD workflows at both the repo and workspace level (at scale) via logic stored in-code. Developers can dynamically modify their CI/CD workflow at runtime based on their code changes, internal compliance policies, or information stored in other tools. This enables better pipeline governance and allows developers to focus on their code instead of writing CI/CD scripts.</p>","relevantPlan":[{"planTitleExternal":"Premium","__typename":"ContentPlatformPlan"}],"relevantUrl":null,"featureAdditionalInformation":null,"__typename":"ContentPlatformFeature"}],"__typename":"ContentPlatformFeatureGroup"},{"featureGroupTitleExternal":"Security & Compliance","features":[{"callOut":null,"featureNameExternal":"Atlassian Guard (SSO, audit logs)","description":"<p>An Atlassian Guard subscription enables centralized security and governance across all your Atlassian cloud products. Gain peace of mind with enterprise-grade security controls, including:</p><ul><li><p>SAML single sign-on (SSO)</p></li><li><p>Organization audit log</p></li></ul><p><a href=\"https://www.atlassian.com/software/access\">Learn more</a> about Atlassian Guard.</p>","relevantPlan":null,"relevantUrl":null,"featureAdditionalInformation":[{"featureAdditionalInformation":"Requires Atlassian Guard subscription","relevantPlan":[{"planTitleExternal":"Free","__typename":"ContentPlatformPlan"},{"planTitleExternal":"Standard","__typename":"ContentPlatformPlan"},{"planTitleExternal":"Premium","__typename":"ContentPlatformPlan"}],"__typename":"ContentPlatformFeatureAdditionalInformation"}],"__typename":"ContentPlatformFeature"},{"callOut":null,"featureNameExternal":"Resource-scoped Access Tokens","description":"<p>Access Tokens are linked to a repository, project, or workspace. Tokens can be used for scripting tasks and integrating tools with Bitbucket Cloud.</p><p>Access Tokens are designed to be used for a single application with limited permissions, so they don&#39;t require two-step verification.</p><p>These tokens aren’t connected to a user account, so integrations don’t break when users change roles or leave the company.</p><p><a href=\"https://support.atlassian.com/bitbucket-cloud/docs/access-tokens\">Learn More</a></p>","relevantPlan":null,"relevantUrl":null,"featureAdditionalInformation":[{"featureAdditionalInformation":"Repository level","relevantPlan":[{"planTitleExternal":"Free","__typename":"ContentPlatformPlan"},{"planTitleExternal":"Standard","__typename":"ContentPlatformPlan"}],"__typename":"ContentPlatformFeatureAdditionalInformation"},{"featureAdditionalInformation":"Repository, project, and workspace","relevantPlan":[{"planTitleExternal":"Premium","__typename":"ContentPlatformPlan"}],"__typename":"ContentPlatformFeatureAdditionalInformation"}],"__typename":"ContentPlatformFeature"},{"callOut":null,"featureNameExternal":"Encryption in transit and at rest","description":"<p></p><p>All customer data stored within Atlassian cloud products and services is encrypted in transit over public networks using Transport Layer Security (TLS) 1.2+ with Perfect Forward Secrecy (PFS) to protect it from unauthorized disclosure or modification.</p><p>Data drives on servers holding code, customer data and attachments use full disk, industry-standard AES-256 encryption at rest.</p><p><a href=\"https://www.atlassian.com/trust/security/security-practices#tenant-separation\">Learn more</a> about encryption.</p>","relevantPlan":[{"planTitleExternal":"Free","__typename":"ContentPlatformPlan"},{"planTitleExternal":"Standard","__typename":"ContentPlatformPlan"},{"planTitleExternal":"Premium","__typename":"ContentPlatformPlan"}],"relevantUrl":null,"featureAdditionalInformation":null,"__typename":"ContentPlatformFeature"},{"callOut":null,"featureNameExternal":"Business continuity and disaster recovery","description":"<p>Our Disaster Recovery Program consists of a several practices to ensure the appropriate levels of governance, oversight, and testing.</p><p><a href=\"https://www.atlassian.com/trust/security/security-practices#managing-changes-in-our-environment\">Learn more</a> about security practices.</p>","relevantPlan":[{"planTitleExternal":"Free","__typename":"ContentPlatformPlan"},{"planTitleExternal":"Standard","__typename":"ContentPlatformPlan"},{"planTitleExternal":"Premium","__typename":"ContentPlatformPlan"}],"relevantUrl":null,"featureAdditionalInformation":null,"__typename":"ContentPlatformFeature"},{"callOut":null,"featureNameExternal":"IP allowlisting","description":"<p>With IP allowlisting, users will only be able to interact (view, push, clone, and more) with your account’s private content if they&#39;re accessing Bitbucket from an IP address you’ve designated and know is safe.</p><p><a href=\"https://bitbucket.org/blog/big-strides-cloud-security-ip-whitelisting-required-2-step-verification-bitbucket\">Learn More</a></p>","relevantPlan":[{"planTitleExternal":"Premium","__typename":"ContentPlatformPlan"}],"relevantUrl":null,"featureAdditionalInformation":null,"__typename":"ContentPlatformFeature"},{"callOut":null,"featureNameExternal":"Enforced merge checks","description":"<p>Enforced merge checks let you require certain conditions are met on pull request merges for individual branches or branch patterns. These checks include builds passing, minimum number of reviewers, and completion of all pull request tasks.</p><p>If these conditions aren’t met, Bitbucket won’t allow the pull request to merge. You can also reset approvals when the source branch is modified.</p><p><a href=\"https://support.atlassian.com/bitbucket-cloud/docs/suggest-or-require-checks-before-a-merge\">Learn More</a></p>","relevantPlan":[{"planTitleExternal":"Premium","__typename":"ContentPlatformPlan"}],"relevantUrl":null,"featureAdditionalInformation":null,"__typename":"ContentPlatformFeature"},{"callOut":null,"featureNameExternal":"Required two-step verification","description":"<p>Required two-step verification (also known as &quot;2FA&quot;) means users will need to have 2FA enabled to interact (view, push, clone, and more) with your account’s private content.</p><p><a href=\"https://bitbucket.org/blog/big-strides-cloud-security-ip-whitelisting-required-2-step-verification-bitbucket\">Learn More</a></p>","relevantPlan":[{"planTitleExternal":"Premium","__typename":"ContentPlatformPlan"}],"relevantUrl":null,"featureAdditionalInformation":null,"__typename":"ContentPlatformFeature"},{"callOut":null,"featureNameExternal":"Scale CI workflows","description":"<p></p><p>Reduce duplication and simplify management of pipeline configurations. Create CI workflows that meet your organizations needs and enable all your teams to use the same workflow.</p><p><a href=\"https://bitbucket.org/blog/share-ci-config\">Learn More</a></p>","relevantPlan":[{"planTitleExternal":"Premium","__typename":"ContentPlatformPlan"}],"relevantUrl":null,"featureAdditionalInformation":null,"__typename":"ContentPlatformFeature"},{"callOut":null,"featureNameExternal":"Deployment permissions","description":"<p>Configure deployment permissions to control who can do deployments, and from which branch. This is customizable for each environment to help protect your customers without slowing down your team.</p><p>For example, you can enable only admins to deploy to a critical environment such as production, ensuring that only trusted users can trigger a deployment.</p><p><a href=\"https://bitbucket.org/blog/deployment-permissions-now-available-in-bitbucket-pipelines\">Learn More</a></p>","relevantPlan":[{"planTitleExternal":"Premium","__typename":"ContentPlatformPlan"}],"relevantUrl":null,"featureAdditionalInformation":null,"__typename":"ContentPlatformFeature"},{"callOut":null,"featureNameExternal":"Enforced signed commits","description":"<p> Strengthen security and compliance by requiring that every commit in your repository is authenticated.</p>","relevantPlan":[{"planTitleExternal":"Premium","__typename":"ContentPlatformPlan"}],"relevantUrl":null,"featureAdditionalInformation":null,"__typename":"ContentPlatformFeature"}],"__typename":"ContentPlatformFeatureGroup"},{"featureGroupTitleExternal":"Support","features":[{"callOut":null,"featureNameExternal":"Support","description":null,"relevantPlan":null,"relevantUrl":"https://www.atlassian.com/enterprise/support-services","featureAdditionalInformation":[{"featureAdditionalInformation":"Community only","relevantPlan":[{"planTitleExternal":"Free","__typename":"ContentPlatformPlan"}],"__typename":"ContentPlatformFeatureAdditionalInformation"},{"featureAdditionalInformation":"Standard","relevantPlan":[{"planTitleExternal":"Standard","__typename":"ContentPlatformPlan"}],"__typename":"ContentPlatformFeatureAdditionalInformation"},{"featureAdditionalInformation":"Premium","relevantPlan":[{"planTitleExternal":"Premium","__typename":"ContentPlatformPlan"}],"__typename":"ContentPlatformFeatureAdditionalInformation"}],"__typename":"ContentPlatformFeature"},{"callOut":null,"featureNameExternal":"Guaranteed uptime SLA","description":null,"relevantPlan":null,"relevantUrl":"https://www.atlassian.com/enterprise/support-services","featureAdditionalInformation":[{"featureAdditionalInformation":"99.9%","relevantPlan":[{"planTitleExternal":"Premium","__typename":"ContentPlatformPlan"}],"__typename":"ContentPlatformFeatureAdditionalInformation"}],"__typename":"ContentPlatformFeature"}],"__typename":"ContentPlatformFeatureGroup"}],"getMoreDetailsTitle":"Get more details","additionalDetails":[{"planAdditionalDetailsTitleExternal":"Definitions of user, workspace, build minute, and file storage","planAdditionalDetails":"<p>A <b>user</b> is anyone who is a member of your Bitbucket workspace.</p><p>A <b>workspace</b> is a collaborative model that provides a single default user experience for how you collaborate across your organization. A workspace houses all repositories, users, and groups in one centralized space. Workspaces are elastic, growing with your team to be as big as you need, supporting thousands of users, or staying as small as you want, down to a single user. A workspace allows you to more easily invite others to work together on repositories, monitor and control access to repositories, and manage third-party apps.</p><p>A <b>build</b> minute is one minute of machine time running a <a href=\"https://www.atlassian.com/software/bitbucket/features/pipelines\">Pipelines</a> build.</p><p>1 GB of <b>file storage</b> is the available storage space, currently through <a href=\"https://support.atlassian.com/bitbucket-cloud/docs/manage-large-files-with-git-large-file-storage-lfs\">LFS</a>, for media or other large files. This storage space is in addition to 1 GB of storage per repository. You share build minutes and storage with all users on your workspace.</p>","__typename":"ContentPlatformPlanDetails"},{"planAdditionalDetailsTitleExternal":"Payment info","planAdditionalDetails":"<p>We accept credit cards (including MasterCard, Visa or American Express) on our secure online order form, which you’ll see at the end of your signup.</p>","__typename":"ContentPlatformPlanDetails"},{"planAdditionalDetailsTitleExternal":"Free, Standard, and Premium plan details","planAdditionalDetails":"<p>Bitbucket is <b>free</b> for individuals and small teams with up to 5 users, with unlimited public and private repositories. You also get 1 GB file storage for LFS and 50 build minutes to get started with Pipelines. You share build minutes and storage with all users in your workspace.</p><p><b>You can always change your plan</b> at a later time. If you’re an admin, change your plan from Standard to Premium (or vice versa) by opening your team or personal account settings, selecting ‘Plan details’ then ‘Change plan.’</p><p>The <b>Standard plan</b> includes all the current features in Bitbucket including <a href=\"https://support.atlassian.com/bitbucket-cloud/docs/manage-large-files-with-git-large-file-storage-lfs\">LFS</a> and <a href=\"https://www.atlassian.com/software/bitbucket/features/pipelines\">Pipelines</a>.</p><p>The <b>Premium plan</b> is a pricing tier for teams that require granular admin controls, security, and auditing capabilities. In addition to everything the Standard plan offers, the Premium plan includes merge checks, IP allowlisting, deployment permissions, required two-step verification and smart mirroring. <a href=\"https://www.atlassian.com/software/bitbucket/premium\">See more</a> about the Bitbucket Cloud Premium plan.</p>","__typename":"ContentPlatformPlanDetails"},{"planAdditionalDetailsTitleExternal":"Get a free community or academic subscription","planAdditionalDetails":"<p>Community or academic subscriptions include unlimited private repositories for unlimited contributors which also includes 5 GB file storage for LFS and 500 build minutes for Pipelines to help you get started. You share build minutes and storage with all users on your team or personal account. Fees will apply for additional build minutes and file storage.</p><p><b>For academic subscriptions:</b> When you sign up with your academic email address, we’ll automatically convert your account to an unlimited academic plan. If your account doesn&#39;t automatically convert, <a href=\"https://www.atlassian.com/solutions/survey/academic-license-request\">apply to have your institution added</a>.</p><p><b>For community subscriptions:</b> Atlassian supports organizations that seek to do good in the world. If yours is a non-profit charitable organization, you can <a href=\"https://www.atlassian.com/software/views/community-license-request\">apply for an Atlassian Bitbucket Cloud Community subscription</a>.</p>","__typename":"ContentPlatformPlanDetails"},{"planAdditionalDetailsTitleExternal":"About cloud and self-managed options","planAdditionalDetails":"<p><b>Important notice:</b> We’re making changes to our Data Center products, including giving Bitbucket Data Center customers access to our new Bitbucket Hybrid License offering, which allows customers to continue using Bitbucket Data Center while unlocking the latest Bitbucket Cloud innovations, including AI and CI/CD, all under a single license. <a href=\"https://www.atlassian.com/migration/bitbucket-hybrid-license\">Learn more here</a>.</p><p>Our <b>Cloud</b> products provide a complete SaaS solution, ready-made for all Atlassian customers. With Cloud, we do the heavy lifting for you by providing built-in platform security and compliance, quick and simple set up, and financially backed SLAs for uptime and performance. Cloud comes with the added benefit of continuous innovation so your end-users will always have the latest and greatest features and functionality.</p><p>Our <b>Data Center</b> products enable you the flexibility to deploy on an infrastructure of your choice. It’s best for those who have unique or complex operating requirements or need to scale beyond our current cloud user tiers. You’ll have complete control over data management, security, and compliance when you upgrade, and how you manage uptime and performance. We recommend Data Center for those who have stricter requirements and can’t move to cloud just yet.</p><p><a href=\"https://www.atlassian.com/migration/assess/compare-cloud-data-center\">Learn more about the differences</a>.</p>","__typename":"ContentPlatformPlanDetails"},{"planAdditionalDetailsTitleExternal":"Buying additional build minutes and Git LFS","planAdditionalDetails":"<p>If you need more build minutes or Git LFS than your plan allows, you can buy additional minutes and storage. Get 1,000 more minutes or 100 GB for $10 a month. <a href=\"https://support.atlassian.com/bitbucket-cloud/docs/manage-your-plan-and-billing/\">Learn more</a>.</p>","__typename":"ContentPlatformPlanDetails"}],"relatedProduct":[{"productName":"Bitbucket","productNameId":"bitbucket","__typename":"ContentPlatformPricingProductName"}],"callToActionContainer":[{"__typename":"ContentPlatformCallToAction","title":"Migrating from Bitbucket Data Center?","valueProposition":"Try Bitbucket Cloud Premium at scale for the same number of users and duration as your Data Center license.","text":"Cloud migration trial","url":"https://www.atlassian.com/migration/assess/cloud-migration-trial","asset":{"title":"bitbucket-questions-cta-image","description":"Questions illustration image","url":"//images.ctfassets.net/xjcz23wx147q/52nCRz0lhc6UjLEhBtPMj3/0c86ca6ab166d581c5cdf8edf31d4859/upload_Light_mode_spot.svg","__typename":"ContentPlatformTemplateImageAsset"}}],"datacenterPlans":[{"planTitleExternal":"Data Center Products","planOneLiner":"Data Center is our self-managed product offering for customers with strict regulatory or security requirements. To learn more about this offering, please contact us.","microCta":[{"__typename":"ContentPlatformCallToActionMicrocopy","ctaMicrocopyTitle":"Contact Us","ctaButtonText":"Contact Us","ctaUrl":null},{"__typename":"ContentPlatformCallToActionMicrocopy","ctaMicrocopyTitle":"Learn more","ctaButtonText":"Learn more","ctaUrl":null}],"highlightedFeaturesTitle":null,"highlightedFeaturesContainer":null,"__typename":"ContentPlatformPlan"}],"__typename":"ContentPlatformPricing"}
