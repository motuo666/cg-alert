name: About Pages — Cleanup & Rebuild
on: { workflow_dispatch: {} }
permissions: { contents: write }
concurrency: { group: about-refresh, cancel-in-progress: true }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Remove old about-like pages
        run: bash scripts/cleanup/remove_about_pages.sh
      - name: Generate redirects for removed pages
        run: bash scripts/cleanup/gen_redirects_about.sh
      - name: Ensure theme & canonical (if script exists)
        run: node scripts/derivatives/apply_theme.js || true
      - name: Ensure pricing on / (if script exists)
        run: |
          node scripts/derivatives/sync_pricing.js || true
          node scripts/derivatives/inject_pricing.js || true
      - name: Link check (internal)
        run: |
          node scripts/qa/link_check.js || true
          mkdir -p artifacts && [ -f artifacts/link_check.json ] || echo '{"missing":[]}' > artifacts/link_check.json
      - name: Commit
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add -A about who-uses _redirects artifacts/link_check.json || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "about: cleanup all variants + rebuild /about & /who-uses + redirects + link_check"
            git pull --rebase --autostash || true
            git push
          fi
