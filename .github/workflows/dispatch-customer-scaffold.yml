name: On Stripe Paid → Customer Scaffold

on:
  repository_dispatch:
    types: [stripe_paid]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps (if package.json exists)
        run: |
          if [ -f package.json ]; then
            npm ci || npm i
          fi
      - name: Customer scaffold
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://www.cg-alert.com' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node ./scripts/customer_scaffold.js || true
      - name: Commit changes
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Customer scaffold (auto)"
            git pull --rebase --autostash || true
            git push
          fi
