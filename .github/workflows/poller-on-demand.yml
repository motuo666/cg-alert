name: On-demand Poller

on:
  workflow_dispatch:
    inputs:
      vendors:
        description: "Comma-separated vendor domains (e.g. airtable.com,asana.com)"
        required: true
        type: string
      customer_id:
        description: "Optional customer id for commit messages / logs"
        required: false
        type: string

env:
  NODE_OPTIONS: --max-old-space-size=2048
  SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://www.cg-alert.com' }}
  R2_EVIDENCE_WRITE_URL: ${{ vars.R2_EVIDENCE_WRITE_URL || '' }}
  R2_EVIDENCE_API_KEY: ${{ secrets.R2_EVIDENCE_API_KEY || '' }}
  POLL_VENDOR_LIST: ${{ github.event.inputs.vendors }}
  CUSTOMERS_API_URL: ${{ vars.CUSTOMERS_API_URL || '' }}

jobs:
  poll-once:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run on-demand poller
        run: node scripts/poller.mjs

      - name: Rebuild sitemap
        run: node scripts/build_sitemap.mjs
