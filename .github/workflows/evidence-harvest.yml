name: Evidence Harvest
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: evidence-harvest, cancel-in-progress: true }
jobs:
  harvest:
    if: ${{ false }}  # disabled by overlay on 2025-11-02
    runs-on: ubuntu-latest
    env:
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install deps
        run: npm install
      - name: Harvest & rebuild
        run: |
          node scripts/poll_public_endpoints.js || true
          node scripts/build_dashboard.js || true
          node scripts/build_rss.js || true
          node scripts/build_reports_rss.js || true
          node scripts/repair_reports_rss_link.js || true
      - name: Commit & push evidence/dashboard/health
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add public/evidence dashboard artifacts/daily_ops.json artifacts/health_report.txt rss.xml reports/rss.xml || true
          if git diff --cached --quiet; then
            echo "no evidence changes"
          else
            git commit -m "evidence-harvest: new snapshots & dashboard rebuild"
            git pull --rebase --autostash || true
            git push
          fi
      - name: Notify Slack (optional)
        run: node scripts/notify_slack.js