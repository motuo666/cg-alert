name: Target Discovery

on:
  schedule:
    - cron: "0 */12 * * *"  # every 12h
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: target-discovery
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      TARGET_DISCOVERY_API_URL: ${{ vars.TARGET_DISCOVERY_API_URL }}
      TARGET_DISCOVERY_API_TOKEN: ${{ secrets.TARGET_DISCOVERY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install

      - name: Discover new ICP targets -> config/targets.csv
        run: node scripts/discover_targets.js

      - name: Commit & push updated targets.csv
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add config/targets.csv || true
          if git diff --cached --quiet; then
            echo "no new targets"
          else
            git commit -m "target-discovery: update targets.csv from discovery API"
            git pull --rebase --autostash || true
            git push
          fi
