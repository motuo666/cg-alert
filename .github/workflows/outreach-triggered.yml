name: Outreach Triggered

on:
  schedule:
    - cron: "0 */2 * * *" # every 2h
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: outreach-triggered
  cancel-in-progress: true

jobs:
  outreach:
    runs-on: ubuntu-latest
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
      MAIL_POSTAL_ADDRESS: ${{ vars.MAIL_POSTAL_ADDRESS }}
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install

      - name: Send outreach emails (or dry-run)
        run: node scripts/send_triggered.js

      - name: Commit & push outreach logs
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add data/sent_log.csv data/outreach_log.csv || true
          if git diff --cached --quiet; then
            echo "no outreach changes"
          else
            git commit -m "outreach-triggered: update outreach logs"
            git pull --rebase --autostash || true
            git push
          fi
