name: RSS Postprocess
on:
  workflow_dispatch:
  schedule:
    - cron: '7 1 * * *'

permissions:
  contents: write

jobs:
  rss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build site RSS/Index
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/sitemaps_full.cjs ]; then
            node scripts/sitemaps_full.cjs
          else
            echo "::warning::scripts/sitemaps_full.cjs not found"
          fi
