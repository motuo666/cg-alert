name: Build Vendors Pages

on:
  push:
    paths:
      - 'vendors/**'
      - 'scripts/build_vendors_index.js'
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build
        run: |
          node ./scripts/build_vendors_index.js
      - name: Commit
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add public/vendors
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Build vendors pages"
            git pull --rebase --autostash || true
            git push
          fi
