name: Pricing Sync

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pricing-sync
  cancel-in-progress: true

jobs:
  pricing:
    runs-on: ubuntu-latest
    env:
      STRIPE_LINK_PORTFOLIO: ${{ vars.STRIPE_LINK_PORTFOLIO }}
      INTAKE_FORM_URL: ${{ vars.INTAKE_FORM_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install

      - name: Sync pricing / CTA / redirects
        run: node scripts/pricing_sync.js

      - name: Commit & push pricing-sync changes
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add index.html enterprise/index.html dashboard _redirects || true
          if git diff --cached --quiet; then
            echo "no pricing changes"
          else
            git commit -m "pricing-sync: refreshed CTA text / redirects / dashboard CTAs"
            git pull --rebase --autostash || true
            git push
          fi
