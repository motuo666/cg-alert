name: Promote Intakes
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    concurrency:
      group: cg-write-promote
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps (best effort)
        run: npm ci || npm install --no-audit --no-fund || true

      - name: Preflight & prepare
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p scripts data .tmp
          # 确保安全推送脚本存在且可执行
          cat > scripts/_ci_safe_push.sh <<'EOSH'
#!/usr/bin/env bash
set -euo pipefail
BRANCH="${1:-main}"; MSG="${2:-chore: update}"
if ! git config --get user.name >/dev/null 2>&1; then git config --local user.name "${GIT_COMMIT_NAME:-CG Bot}"; fi
if ! git config --get user.email >/dev/null 2>&1; then git config --local user.email "${GIT_COMMIT_EMAIL:-bot@cg-alert.com}"; fi
if git diff --quiet; then
  echo "No changes."; [ -n "${GITHUB_OUTPUT:-}" ] && { echo "changed=0" >> "$GITHUB_OUTPUT"; echo "pushed=0" >> "$GITHUB_OUTPUT"; }; exit 0
fi
git add -A && git commit -m "$MSG"
pushed=0
for i in 1 2 3; do
  git pull --rebase --autostash origin "$BRANCH" || (git rebase --abort || true)
  if git push origin HEAD:"$BRANCH"; then pushed=1; break; fi
  echo "Push failed. Retry #$i ..." && sleep 3
done
[ -n "${GITHUB_OUTPUT:-}" ] && { echo "changed=1" >> "$GITHUB_OUTPUT"; echo "pushed=$pushed" >> "$GITHUB_OUTPUT"; }
exit 0
EOSH
          chmod +x scripts/_ci_safe_push.sh

          # 数据文件兜底
          [ -f data/intakes.csv ]   || : > data/intakes.csv
          [ -f data/customers.csv ] || : > data/customers.csv

      - name: Promote intakes -> customers
        env:
          PROMOTE_DRY: "0"
          PROMOTE_MAX: "0"   # 0=不限
        run: node scripts/promote-intakes.js

      - name: Commit & Safe push
        id: push
        run: scripts/_ci_safe_push.sh main "promote: intakes -> customers (dedup)"

      - name: Create PR fallback
        if: steps.push.outputs.changed == '1' && steps.push.outputs.pushed != '1'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "promote: intakes -> customers (dedup)"
          title: "Promote Intakes (auto PR fallback)"
          body: "Auto-created because direct push failed."
          branch: bot/promote-intakes
          base: main
