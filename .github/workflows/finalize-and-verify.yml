name: finalize-and-verify

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify SITE_ORIGIN
        run: |
          if [ -z "${{ secrets.SITE_ORIGIN || vars.SITE_ORIGIN }}" ]; then
            echo "::error ::SITE_ORIGIN is empty. Set Repository Variables or Secrets."
            exit 1
          fi
        shell: bash

      - name: Set Env
        run: |
          echo "SITE_ORIGIN=${{ secrets.SITE_ORIGIN || vars.SITE_ORIGIN }}" >> $GITHUB_ENV
          echo "PUBLISH_DIR=." >> $GITHUB_ENV

      - name: Normalize & Fix
        run: |
          python3 scripts/normalize_events.py --root .
          python3 scripts/auto_fix_links.py --root .
          python3 scripts/normalize_canonical.py --root . --site-origin "${SITE_ORIGIN}"
          node scripts/build_sitemap.mjs
        shell: bash

      - name: Harden HTML
        run: python3 scripts/harden_html.py .

      - name: Link Check
        run: python3 scripts/check_links.py --root .

      # - name: HTML Lint (optional)
      #   run: |
      #     pip install html5validator
      #     html5validator --root . --skip-non-html
      #   continue-on-error: true

      - name: Deploy
        if: success()
        run: |
          echo "Deploy step here (Pages/Cloudflare/Netlify)."
