
name: check-secrets
on: [push, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Assert required secrets
        run: |
          required=(SMTP_HOST SMTP_USER SMTP_PASS IMAP_HOST IMAP_USER IMAP_PASS SLACK_WEBHOOK_URL UNSUB_HMAC_SECRET)
          missing=0
          for k in "${required[@]}"; do
            v="${!k}"
            if [ -z "$v" ]; then echo "MISSING:$k"; missing=1; else echo "OK:$k"; fi
          done
          exit $missing
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          UNSUB_HMAC_SECRET: ${{ secrets.UNSUB_HMAC_SECRET }}
