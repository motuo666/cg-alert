name: Target Discovery Autopilot
on:
  workflow_dispatch:
    inputs:
      dry:
        description: "Dry run (true/false)"
        required: false
        default: "false"
      max_new:
        description: "Max new domains to add"
        required: false
        default: "200"
  schedule:
    - cron: "30 23 * * *"  # 08:30 JST daily
  repository_dispatch:
    types: [autopilot_kick]

permissions:
  contents: write
  actions: write

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      DRY: ${{ inputs.dry || 'false' }}
      DISCOVERY_MAX: ${{ inputs.max_new || '200' }}
      DISCOVERY_CONCURRENCY: "12"
      DISCOVERY_PER_HOST_DELAY_MS: "200"
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL || vars.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Discover targets
        run: node scripts/discovery/discover_targets.js
      - name: Expand endpoints
        run: node scripts/discovery/expand_endpoints.js
      - name: Commit updates
        run: |
          set -e
          if git diff --quiet; then
            echo "no changes"; exit 0
          fi
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add -A
          git commit -m "autopilot: discovery + endpoints expansion"
          git push
      - name: Slack summary (optional)
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          DISCOVERED=$(cat artifacts/discovery.json 2>/dev/null | jq -r '.discovered // 0')
          DOMAINS=$(cat artifacts/endpoints_count.txt 2>/dev/null || echo "0")
          PAYLOAD=$(jq -n --arg t "Target Discovery" --arg d "$DISCOVERED" --arg e "$DOMAINS" '{text: ($t + ": discovered=" + $d + ", endpoints=" + $e)}')
          curl -s -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL" || true
