name: Outreach AB Rotate (biweekly)
on:
  schedule:
    - cron: '0 1 */14 * *'   # 10:00 JST biweekly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Apply A/B template
        run: node scripts/ab_rotate.js
      - name: Commit active templates
        run: |
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add config/outreach_active.* config/outreach_ab.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "outreach: rotate active template"
            git pull --rebase --autostash || true
            git push
          fi
