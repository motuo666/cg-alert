name: obs-daily

on:
  schedule:
    - cron: "15 01 * * *"
  workflow_dispatch:

jobs:
  obs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run daily checks (if script exists)
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -x scripts/obs_daily.sh ]]; then
            bash scripts/obs_daily.sh
          elif [[ -f scripts/obs_daily.js ]]; then
            node scripts/obs_daily.js
          else
            echo "No obs_daily script found; skipping."
          fi
