name: SEO Ping
on:
  workflow_dispatch:
  schedule:
    - cron: '22 3 * * *'  # Daily 12:22 JST

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Google/Bing for sitemap
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
        run: |
          set -e
          curl -fsS "https://www.google.com/ping?sitemap=${SITE_ORIGIN%/}/sitemap.xml" || true
          curl -fsS "https://www.bing.com/ping?sitemap=${SITE_ORIGIN%/}/sitemap.xml" || true
