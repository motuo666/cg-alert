name: SEO Ping
on:
  workflow_dispatch:
  push:
    paths:
      - 'public/sitemap*.xml'
      - 'public/sitemaps/**'
  schedule:
    - cron: '5 1 * * *'
permissions: { contents: read }
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Google & Bing
        run: |
          set -e
          SITE="https://www.cg-alert.com/sitemap-index.xml"
          curl -s "https://www.google.com/ping?sitemap=${SITE}" || true
          curl -s "https://www.bing.com/ping?sitemap=${SITE}" || true
          echo "Pinged: $SITE"
