name: Imap/Smtp Smoke

on:
  schedule:
    - cron: '50 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      IMAP_HOST: ${{ secrets.IMAP_HOST || vars.IMAP_HOST }}
      IMAP_USER: ${{ secrets.IMAP_USER || vars.IMAP_USER }}
      IMAP_PASS: ${{ secrets.IMAP_PASS || vars.IMAP_PASS }}
      SMTP_HOST: ${{ secrets.SMTP_HOST || vars.SMTP_HOST }}
      SMTP_USER: ${{ secrets.SMTP_USER || vars.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS || vars.SMTP_PASS }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL || vars.SLACK_WEBHOOK_URL }}
    steps:
      - name: Check inputs
        run: |
          set -e
          for k in IMAP_HOST IMAP_USER IMAP_PASS SMTP_HOST SMTP_USER SMTP_PASS; do
            if [ -z "${!k}" ]; then echo "::error::Missing $k"; exit 1; fi
          done

      - name: IMAP login (993)
        run: |
          set -e
          printf "a1 login %s %s\r\n.a2 logout\r\n" "$IMAP_USER" "$IMAP_PASS" |             openssl s_client -quiet -connect "${IMAP_HOST}:993" -crlf > /dev/null

      - name: SMTP EHLO + STARTTLS (587)
        run: |
          set -e
          {
            printf "EHLO cg-alert.com\r\n"
            printf "STARTTLS\r\n"
          } | nc "${SMTP_HOST}" 587 > /dev/null
          # STARTTLS handshake
          printf "" | openssl s_client -quiet -starttls smtp -connect "${SMTP_HOST}:587" > /dev/null

      - name: Slack notify
        if: always() && env.SLACK_WEBHOOK_URL != ''
        run: |
          set -e
          status="${{ job.status }}"
          payload=$(jq -nc --arg s "$status" '{text: ("Outreach Health: IMAP/SMTP smoke " + $s)}')
          curl -sS -X POST -H 'Content-Type: application/json' -d "$payload" "$SLACK_WEBHOOK_URL" >/dev/null 2>&1 || true
