name: Public Change Poller

on:
  workflow_dispatch:
    inputs:
      sample:
        description: "Override POLL_SAMPLE (0.0–1.0). Leave blank to use default."
        required: false
        type: string
      concurrency:
        description: "POLL_CONCURRENCY (default 8)"
        required: false
        type: string
      force_seed:
        description: "Ensure at least N evidence today (0=disable; default 10)"
        required: false
        type: string
      save_body:
        description: "Save HTTP bodies to enable hashing (recommended)"
        required: false
        default: true
        type: boolean
      fetch_mode:
        description: "HTTP fetch mode"
        required: false
        default: GET
        type: choice
        options:
          - GET
          - HEAD
  schedule:
    # 按需保留/修改。示例：工作日 04:05 UTC 运行
    - cron: "5 4 * * 1-5"

permissions:
  contents: write

concurrency:
  group: public-change-poller
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max_old_space_size=4096
      SITE_ORIGIN: https://www.cg-alert.com
      # 可选：在仓库 Settings → Secrets and variables → Actions 配置
      INTAKE_FORM_URL: ${{ vars.INTAKE_FORM_URL }}
      STRIPE_LINK_PORTFOLIO: ${{ vars.STRIPE_LINK_PORTFOLIO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install (best-effort)
        run: npm ci || npm i --no-audit --no-fund || true

      # 1) 采集公共端点（强制保存正文，便于 hash/excerpt）
      - name: Poll public endpoints
        run: node scripts/poll_public_endpoints.js
        env:
          POLL_SAVE_BODY: ${{ inputs.save_body && '1' || '1' }}
          POLL_FETCH_MODE: ${{ inputs.fetch_mode || 'GET' }}
          POLL_SAMPLE: ${{ inputs.sample || '1.0' }}
          POLL_CONCURRENCY: ${{ inputs.concurrency || '8' }}

      # 2) 归一化（计算 sha256/fingerprint；不会报错则继续）
      - name: Normalize evidence
        run: |
          if [ -f scripts/normalize_evidence.js ]; then
            node scripts/normalize_evidence.js
          else
            echo "normalize_evidence.js not found"; exit 1
          fi

      # 3) 兜底：若今天不足 min 条，合规 seed 到 min（默认 10）
      - name: Ensure min evidence today (seed)
        run: |
          MIN="${{ inputs.force_seed || '10' }}"
          if [ "$MIN" != "0" ] && [ -f scripts/evidence_force_seed.js ]; then
            node scripts/evidence_force_seed.js --min-today="$MIN"
          else
            echo "skip seeding (force_seed=$MIN)"
          fi

      # 4) 再归一化一次（让 seed 的证据也有 hash/摘要/指纹）
      - name: Re-normalize evidence after seed
        run: |
          if [ -f scripts/normalize_evidence.js ]; then
            node scripts/normalize_evidence.js
          else
            echo "normalize_evidence.js not found"; exit 1
          fi

      # 5) 可核证链回填（commit/run_url）
      - name: Enrich evidence provenance
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          if [ -f scripts/evidence_enrich_provenance.js ]; then
            node scripts/evidence_enrich_provenance.js
          else
            echo "evidence_enrich_provenance.js not found (skip)"; true
          fi

      # 6) 变化片段摘要（before/after）
      - name: Extract diff excerpts
        run: |
          if [ -f scripts/extract_diff_excerpt.js ]; then
            node scripts/extract_diff_excerpt.js
          else
            echo "extract_diff_excerpt.js not found (skip)"; true
          fi

      # 7) 索引（写 data/evidence.ndx）
      - name: Build evidence index
        run: |
          if [ -f scripts/build_evidence_index.js ]; then
            node scripts/build_evidence_index.js
          else
            echo "build_evidence_index.js not found"; exit 1
          fi

      # 8) 材料性评分（输出 data/materiality.csv）
      - name: Compute materiality score
        run: |
          if [ -f scripts/materiality_score.js ]; then
            node scripts/materiality_score.js
          else
            echo "materiality_score.js not found (skip)"; true
          fi

      # 9) 构建 Change Pack（Verified/Impact 徽章）
      - name: Build change packs
        run: |
          if [ -f scripts/build_change_pack.js ]; then
            node scripts/build_change_pack.js
          else
            echo "build_change_pack.js not found"; exit 1
          fi

      # 10) Subprocessor 反查页
      - name: Build who-uses reverse index
        run: |
          if [ -f scripts/build_who_uses.js ]; then
            node scripts/build_who_uses.js
          else
            echo "build_who_uses.js not found (skip)"; true
          fi

      # 11) Updates & Categories（幂等）
      - name: Build updates/categories
        run: |
          if [ -f scripts/build_updates.js ]; then
            node scripts/build_updates.js || true
          else
            echo "build_updates.js not found (skip)"; true
          fi

      # 12) SEO 注入（title/desc/canonical + JSON-LD）
      - name: SEO inject
        run: |
          if [ -f scripts/seo_inject.js ]; then
            node scripts/seo_inject.js || true
          else
            echo "seo_inject.js not found (skip)"; true
          fi

      # 13) Run Summary（今日新增、索引行数、当月 Packs）
      - name: Summarize poll results
        shell: bash
        run: |
          set -euo pipefail
          YM="${YM:-}"
          if [ -z "$YM" ]; then YM=$(date -u +%Y-%m); fi
          TODAY=$(date -u +%F)
          CHANGED=$(find evidence -type f -name "${TODAY}-*.json" 2>/dev/null | wc -l)
          BASELINES=$(find evidence -type f -name "${TODAY}-*00000000.json" 2>/dev/null | wc -l)
          INDEX_ROWS=$(test -f data/evidence.ndx && wc -l < data/evidence.ndx || echo 0)
          PACKS=$(find "reports/$YM" -type f -name index.html 2>/dev/null | wc -l)
          HASH_OK=$(awk -F'\t' '($4!="") && $4!~/^0+$/ {ok++} END{print ok+0}' data/evidence.ndx 2>/dev/null || echo 0)
          {
            echo "### Public Change Poller"
            echo "- New evidence today: $CHANGED"
            echo "- Baselines today: $BASELINES"
            echo "- Index rows: $INDEX_ROWS"
            echo "- Hash (non-zero) rows: $HASH_OK"
            echo "- Change Packs this month ($YM): $PACKS"
          } >> "$GITHUB_STEP_SUMMARY"

      # 14) 提交变更（幂等 + 安全 Push）
      - name: Commit & push
        run: |
          git add -A reports updates data/evidence.ndx data/materiality.csv evidence public/who-uses || true
          if [ -n "$(git status --porcelain)" ]; then
            chmod +x scripts/git_safe_push.sh || true
            bash scripts/git_safe_push.sh "poll: public changes + provenance/excerpts + index/materiality + packs/updates/seo"
          else
            echo "no changes to commit"
          fi
