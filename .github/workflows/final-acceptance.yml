name: Final Acceptance Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - '_redirects'
      - '.github/workflows/final-acceptance-gate.yml'

permissions:
  contents: read

concurrency:
  group: final-acceptance-gate
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate sanity
        shell: bash
        run: |
          set -Eeuo pipefail

          # _redirects 必须存在
          test -f _redirects

          # 必须有 / -> /seo/ 的 301，防止根路径是空白页
          grep -E '^[[:space:]]*/[[:space:]]+/seo/[[:space:]]+301' _redirects >/dev/null || {
            echo "::error::/_redirects 缺少根路由 / -> /seo/ 301"
            exit 1
          }

          # 必须有 /feed -> /updates/rss.xml 的 301
          grep -E '^[[:space:]]*/feed[[:space:]]+/updates/rss\.xml[[:space:]]+301' _redirects >/dev/null || {
            echo "::error::/_redirects 缺少 /feed -> /updates/rss.xml 301"
            exit 1
          }

          # feed 目标文件必须真实存在
          test -f public/updates/rss.xml

          # reports 目录必须存在且非空（至少 1 项）
          test -d public/reports
          if [ "$(ls -A public/reports | wc -l)" -gt 0 ]; then
            echo "public/reports is non-empty"
          else
            echo "::error::public/reports is empty"
            exit 1
          fi
