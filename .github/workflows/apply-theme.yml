name: Apply Theme (Unify Pages)
true:
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  apply-theme:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Apply homepage theme to pages
      run: node scripts/theme_injector.js
    - name: Commit themed pages
      shell: bash
      run: "set -e\ngit config user.email \"bot@cg-alert.com\"\ngit config user.name\
        \  \"cg-alert-bot\"\ngit add -A\nif git diff --cached --quiet; then\n  echo\
        \ \"No changes to commit.\"\nelse\n  git commit -m \"ui(theme): unify pages\
        \ to homepage style (header/footer/stylesheet)\"\n  git pull --rebase --autostash\
        \ || true\n  git push\nfi\ngit add public reports || true\n"
'on':
  workflow_dispatch: null
