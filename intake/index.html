<!doctype html>
<meta charset="utf-8">
<title>Enable Alerts</title>
<meta name="robots" content="noindex">
<style>body{font-family:system-ui;line-height:1.5;padding:24px} .hint{color:#666}</style>
<p>Redirecting to request alerts… <span class="hint">(auto)</span></p>
<script>
(function(){
  const qs = new URLSearchParams(location.search);
  const vendor = qs.get('vendor') || '';
  const keep = ['utm_source','utm_medium','utm_campaign']
    .map(k => qs.get(k) ? `${k}=${encodeURIComponent(qs.get(k))}` : '')
    .filter(Boolean).join('&');
  // TODO 1: 把下面替换为你的 Google Form “空白表单链接”（不是预填链接）
  const FORM_BASE = 'https://forms.gle/gj8EiaaCdn63CEd89';
  // TODO 2: 把下面替换为 Google Form 里“Vendor”输入框的 entry id（用“获取预填链接”拿到，形如 1234567890）
  const ENTRY_VENDOR = '8453857452859865769';
  const url = `${FORM_BASE}?entry.${ENTRY_VENDOR}=${encodeURIComponent(vendor)}${keep?`&${keep}`:''}`;
  location.replace(url);
})();
</script>
