name: Outreach Triggered (Boost)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max emails to send this run"
        required: false
        default: "12"
      window_h:
        description: "Primary change lookback window (hours)"
        required: false
        default: "168"   # 第一次尝试窗口
      boost:
        description: "Auto-boost until final>=8 (discover->widen->relax->caps)"
        required: false
        default: "true"
      dry:
        description: "Dry run first?"
        required: false
        default: "true"
  schedule:
    - cron: "05 16 * * 1-5" # 工作日 16:05 UTC

permissions:
  contents: write

concurrency:
  group: outreach-triggered-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trig:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max_old_space_size=2048
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://www.cg-alert.com' }}
      PERSONA_RULES: ${{ vars.PERSONA_RULES || 'config/persona_rules.json' }}
      REGION_FILTER: ${{ vars.REGION_FILTER || 'config/region_filter.json' }}
      TRIGGER_WINDOW_H: ${{ inputs.window_h }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      BCC_TO: ${{ secrets.BCC_TO }}

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps (best-effort)
        run: npm ci || npm i --no-audit --no-fund || true

      # 0) 可选：前置送达风控，超阈值自动降频
      - name: Preflight deliverability gate
        id: gate
        run: |
          node scripts/diag_7d_report.js > diag.txt || true
          echo '### 7D Diagnosis' >> "$GITHUB_STEP_SUMMARY"
          cat diag.txt >> "$GITHUB_STEP_SUMMARY" || true
          # 若 sent7>=100 且退订/退信/投诉超阈，自动把 limit 降到 8
          L=${{ inputs.limit }}
          if grep -q "sent7:" diag.txt; then
            S7=$(grep -E "^- sent7:" diag.txt | awk '{print $3+0}')
            UR=$(grep -E "\| Unsub \|" diag.txt | awk -F'|' '{gsub(/ /,"");print $3+0}')
            BR=$(grep -E "\| Bounce \|" diag.txt | awk -F'|' '{gsub(/ /,"");print $3+0}')
            CR=$(grep -E "\| Complaint \|" diag.txt | awk -F'|' '{gsub(/ /,"");print $3+0}')
            if [ "$S7" -ge "${UNSUB_SENT7_MIN:-100}" ] && awk "BEGIN{exit !($UR > ${UNSUB_7D_MAX:-0.5})}"; then L=8; fi
            if [ "$S7" -ge "${BOUNCE_SENT7_MIN:-100}" ] && awk "BEGIN{exit !($BR > ${BOUNCE_7D_MAX:-8})}"; then L=8; fi
            if [ "$S7" -ge "${COMPL_SENT7_MIN:-100}" ] && awk "BEGIN{exit !($CR > ${COMPLAINT_7D_MAX:-0.1})}"; then L=8; fi
          fi
          echo "OUT_LIMIT=$L" >> $GITHUB_ENV
          echo "- send limit this run: $L" >> "$GITHUB_STEP_SUMMARY"

      # 1) 别名轻量归一（不改代码、就地修 leads.csv 的 vendor1/2/3）
      - name: Normalize vendor aliases (inline)
        run: |
          cat > /tmp/vendor_aliases.json <<'JSON'
          { "google":"google.com","google cloud":"google.com","gcp":"google.com","cloud.google.com":"google.com",
            "aws":"aws.amazon.com","amazon web services":"aws.amazon.com","amazonaws.com":"aws.amazon.com",
            "okta inc":"okta.com","auth0":"okta.com",
            "atlassian":"atlassian.com","jira":"atlassian.com","confluence":"atlassian.com",
            "microsoft":"microsoft.com","azure":"microsoft.com",
            "salesforce":"salesforce.com","zendesk":"zendesk.com","twilio":"twilio.com","stripe":"stripe.com",
            "box":"box.com","dropbox":"dropbox.com","new relic":"newrelic.com","algolia":"algolia.com",
            "sentry":"sentry.io","vercel":"vercel.com","figma":"figma.com","mailgun":"mailgun.com",
            "helpscout":"helpscout.com","checkout":"checkout.com","duo security":"duo.com",
            "cloudflare":"cloudflare.com","snowflake":"snowflake.com","notion":"notion.so" }
          JSON
          node -e '
            const fs=require("fs"),map=Object.fromEntries(Object.entries(JSON.parse(fs.readFileSync("/tmp/vendor_aliases.json","utf8"))).map(([k,v])=>[k.toLowerCase(),v]));
            const P="data/leads.csv"; if(!fs.existsSync(P)) process.exit(0);
            const L=fs.readFileSync(P,"utf8").split(/\r?\n/).map(l=>l.trimEnd());
            const O=L.map(ln=>{
              if(!ln) return ln;
              const c=ln.split(",");
              for(let j=3;j<=5;j++){ const s=(c[j]||"").trim().toLowerCase(); if(s) c[j]=map[s]||map[s.replace(/^www\./,"")]||c[j]; }
              return c.join(",");
            });
            fs.writeFileSync(P,O.join("\n"));
            console.log("leads.csv vendor1/2/3 normalized");
          '
          echo "aliases=done" >> "$GITHUB_STEP_SUMMARY"

      # 2) Link Guard（避免坏链发出）
      - name: Link guard
        run: node scripts/link_guard.js

      # 3) Try A：168h 窗口 DRY
      - name: Dry run (168h)
        id: dry1
        env:
          TRIGGER_WINDOW_H: ${{ inputs.window_h }}
        run: |
          node scripts/send_triggered.js --dry=true --limit=${{ env.OUT_LIMIT }} --pack | tee dry1.log
          echo "elig=$(grep -oE '\{.*\"final\":[0-9]+.*\}' -m1 dry1.log)" >> $GITHUB_OUTPUT || true
          F=$(grep -oE '"final":\s*[0-9]+' dry1.log | tail -1 | awk -F: '{print $2+0}');
          echo "final=$F" >> $GITHUB_OUTPUT
          echo "### Try A (168h) → final=$F" >> "$GITHUB_STEP_SUMMARY"

      # 3b) A 成功→ 真发
      - name: Send (168h)
        if: steps.dry1.outputs.final && fromJSON(steps.dry1.outputs.final) >= 8
        env:
          TRIGGER_WINDOW_H: ${{ inputs.window_h }}
        run: node scripts/send_triggered.js --dry=false --limit=${{ env.OUT_LIMIT }} --pack

      # 4) Try B：不足 8 → 先补池，再 336h 窗口 DRY
      - name: Discover Contacts (boost)
        if: steps.dry1.outputs.final && fromJSON(steps.dry1.outputs.final) < 8
        run: |
          node scripts/discover_contacts.js || true
          node scripts/validate_leads.js || true
          node scripts/leads_guard.js || true
          echo "discovered=done" >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run (336h)
        id: dry2
        if: steps.dry1.outputs.final && fromJSON(steps.dry1.outputs.final) < 8
        env:
          TRIGGER_WINDOW_H: 336
        run: |
          node scripts/send_triggered.js --dry=true --limit=${{ env.OUT_LIMIT }} --pack | tee dry2.log
          F=$(grep -oE '"final":\s*[0-9]+' dry2.log | tail -1 | awk -F: '{print $2+0}');
          echo "final=$F" >> $GITHUB_OUTPUT
          echo "### Try B (336h + discovered) → final=$F" >> "$GITHUB_STEP_SUMMARY"

      - name: Send (336h)
        if: steps.dry2.outputs.final && fromJSON(steps.dry2.outputs.final) >= 8
        env:
          TRIGGER_WINDOW_H: 336
        run: node scripts/send_triggered.js --dry=false --limit=${{ env.OUT_LIMIT }} --pack

      # 5) Try C：仍不足 8 → 放宽 persona（一次）
      - name: Relax persona (once)
        if: steps.dry2.outputs.final && fromJSON(steps.dry2.outputs.final) < 8
        run: |
          cat > /tmp/persona_relaxed.json <<'JSON'
          ["security","trust","privacy","legal","procurement","sourcing","vendor","thirdparty","compliance","risk","dpo","gdpr"]
          JSON
          echo "PERSONA_RULES=/tmp/persona_relaxed.json" >> $GITHUB_ENV
          echo "persona=relaxed" >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run (336h + relaxed persona)
        id: dry3
        if: steps.dry2.outputs.final && fromJSON(steps.dry2.outputs.final) < 8
        env:
          TRIGGER_WINDOW_H: 336
        run: |
          node scripts/send_triggered.js --dry=true --limit=${{ env.OUT_LIMIT }} --pack | tee dry3.log
          F=$(grep -oE '"final":\s*[0-9]+' dry3.log | tail -1 | awk -F: '{print $2+0}');
          echo "final=$F" >> $GITHUB_OUTPUT
          echo "### Try C (336h + relaxed persona) → final=$F" >> "$GITHUB_STEP_SUMMARY"

      - name: Send (336h + relaxed persona)
        if: steps.dry3.outputs.final && fromJSON(steps.dry3.outputs.final) >= 8
        env:
          TRIGGER_WINDOW_H: 336
        run: node scripts/send_triggered.js --dry=false --limit=${{ env.OUT_LIMIT }} --pack

      # 6) Try D（Pass D）：仍不足 8 → 放宽 caps（单公司上限 + 冷却天数）一次
      - name: Relax caps (once)
        if: steps.dry3.outputs.final && fromJSON(steps.dry3.outputs.final) < 8
        run: |
          echo "DOMAIN_CAP=4" >> $GITHUB_ENV     # 当日对同一公司最多 4 封（默认多为 1）
          echo "COOLDOWN_DAYS=7" >> $GITHUB_ENV  # 冷却期 7 天（默认多为 14~21）
          echo "caps=relaxed" >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run (336h + relaxed persona + caps)
        id: dry4
        if: steps.dry3.outputs.final && fromJSON(steps.dry3.outputs.final) < 8
        env:
          TRIGGER_WINDOW_H: 336
        run: |
          node scripts/send_triggered.js --dry=true --limit=${{ env.OUT_LIMIT }} --pack | tee dry4.log
          F=$(grep -oE '"final":\s*[0-9]+' dry4.log | tail -1 | awk -F: '{print $2+0}');
          echo "final=$F" >> $GITHUB_OUTPUT
          echo "### Try D (336h + relaxed persona + caps) → final=$F" >> "$GITHUB_STEP_SUMMARY"

      - name: Send (336h + relaxed persona + caps)
        if: steps.dry4.outputs.final && fromJSON(steps.dry4.outputs.final) >= 8
        env:
          TRIGGER_WINDOW_H: 336
        run: node scripts/send_triggered.js --dry=false --limit=${{ env.OUT_LIMIT }} --pack

      # 7) 仍不足 → 给出清晰原因，便于后续处理
      - name: Summarize failure cause
        if: |
          (steps.dry1.outputs.final && fromJSON(steps.dry1.outputs.final) < 8) &&
          (steps.dry2.outputs.final == '' || fromJSON(steps.dry2.outputs.final) < 8) &&
          (steps.dry3.outputs.final == '' || fromJSON(steps.dry3.outputs.final) < 8) &&
          (steps.dry4.outputs.final == '' || fromJSON(steps.dry4.outputs.final) < 8)
        run: |
          echo "### Boost not enough (final still < 8)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Likely causes: small pool, vendor-match miss, suppression (cooldown/domain-cap) still tight." >> "$GITHUB_STEP_SUMMARY"
          echo "- Try next: Run 'Discover Contacts' manually (twice), widen 'domains.csv', or temporarily raise DOMAIN_CAP/COOLDOWN_DAYS a bit more." >> "$GITHUB_STEP_SUMMARY"

      # 8) Safe push（若有日志/小改）
      - name: Safe push changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            chmod +x scripts/git_safe_push.sh || true
            bash scripts/git_safe_push.sh "outreach: triggered boost (with Pass D)"
          else
            echo "no changes to commit"
          fi
