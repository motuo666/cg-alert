name: Outreach (Bulk)

on:
  workflow_dispatch:
    inputs:
      csv_path:
        description: "CSV path"
        required: true
        default: "data/leads.csv"
      limit:
        description: "count"
        required: true
        default: "5"
      offset:
        description: "offset"
        required: true
        default: "0"
      subject_tpl:
        description: "subject template"
        required: false
        default: "Renewal heads-up — {v1}/{v2}"
      body_tpl:
        description: "body template"
        required: false
        default: "Hi {company} team — quick heads-up.\nWe track public changes on {v1}/{v2}/{v3} (pricing/terms/DPA/subprocessors/status). Reply “1” for a 7-day pilot; “9” to opt out.\n— CG Alert"

jobs:
  bulk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: |
          npm init -y >/dev/null 2>&1
          npm install nodemailer csv-parse --silent

      # 先验证 Slack 变量是否传进来了，并立刻发一条“开始”提示
      - name: Verify Slack & ping start
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "❌ SLACK_WEBHOOK secret not set"
            exit 1
          fi
          echo '{"text":"🔔 Outreach (Bulk) run started"}' > body.json
          curl -s -X POST -H 'content-type: application/json' --data @body.json "$SLACK_WEBHOOK" || true

      - name: Send bulk
        env:
          CG_STAGE: "1"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          node scripts/send_bulk.js \
            "${{ github.event.inputs.csv_path }}" \
            "${{ github.event.inputs.limit }}" \
            "${{ github.event.inputs.offset }}" \
            "${{ github.event.inputs.subject_tpl }}" \
            "${{ github.event.inputs.body_tpl }}"
