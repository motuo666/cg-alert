name: Public Change Poller
on:
  schedule: [{ cron: "0 */4 * * *" }]  # 每4小时一次，足够满足P95<24h
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  poll:
    runs-on: ubuntu-latest
    concurrency: { group: cg-write, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install deps
        run: npm ci
      - name: Sanitize data
        run: node scripts/data_sanitize.js
      - name: Build endpoints
        run: node scripts/endpoint_inventory.js
      - name: Poll public endpoints
        env:
          MAX_ENDPOINTS: "800"      # 保守、低成本
          PER_HOST: "6"
          VENDOR_DAILY_MAX: "2"
        run: node scripts/poll_public_endpoints.js
      - name: Rebuild updates + SEO
        run: |
          node scripts/build_updates.js || true
          node scripts/seo_inject.js || true
      - name: Commit if changed
        run: |
          git config user.name "CG Bot"
          git config user.email "bot@cg-alert.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "poller: public endpoints + site refresh"
            git push
          else
            echo "No changes."
          fi
