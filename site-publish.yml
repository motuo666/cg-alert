name: site-publish
on:
  push:
    branches:
      - main
    paths:
      - reports/**
      - templates/**
      - scripts/gen_feeds.py
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pyyaml
      - name: Generate feeds & pages
        env:
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL || vars.SITE_ORIGIN || 'https://www.cg-alert.com' }}
        run: python scripts/gen_feeds.py
      - name: Commit & push RSS / sitemap / reports index
        run: |
          set -e
          git config user.name "cg-alert-bot"
          git config user.email "bot@cg-alert.com"

          git add rss/index.xml sitemap.xml reports/index.html || true

          if git diff --cached --quiet; then
            echo "No RSS/sitemap/report index changes; skipping commit & push."
            exit 0
          fi

          if git commit -m "chore: auto-update rss/sitemap/reports index (site-publish)"; then
            git push || echo "WARN: git push failed (non-fast-forward). Another job updated main; will retry on next run."
          else
            echo "WARN: commit failed (maybe no staged changes)."
          fi
concurrency:
  group: cg-full-pipeline
  cancel-in-progress: false
