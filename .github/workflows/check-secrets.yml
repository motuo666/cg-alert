name: "Check Secrets & Vars"
on:
  workflow_dispatch: {}
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Vars（Actions → Variables）
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
      INTAKE_FORM_URL: ${{ vars.INTAKE_FORM_URL }}
      STRIPE_LINK_PORTFOLIO: ${{ vars.STRIPE_LINK_PORTFOLIO }}

      # Core secrets（Actions → Secrets）
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      UNSUB_HMAC_SECRET: ${{ secrets.UNSUB_HMAC_SECRET }}

      # IMAP（Outreach Health / 退信压制依赖）
      IMAP_HOST: ${{ secrets.IMAP_HOST }}
      IMAP_USER: ${{ secrets.IMAP_USER }}
      IMAP_PASS: ${{ secrets.IMAP_PASS }}

      # SMTP 发信
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      MAIL_FROM: ${{ secrets.MAIL_FROM || vars.MAIL_FROM }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate required vars/secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()

          # 必需：站点/CTA 变量（Vars）
          req_vars=(SITE_ORIGIN INTAKE_FORM_URL STRIPE_LINK_PORTFOLIO)

          # 必需：核心 secrets（Slack/Cloudflare/Stripe/HMAC）
          req_core=(SLACK_WEBHOOK_URL CF_API_TOKEN STRIPE_WEBHOOK_SECRET UNSUB_HMAC_SECRET)

          # 必需：SMTP 发信
          req_smtp=(SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS MAIL_FROM)

          # 必需：IMAP（Outreach Health 依赖；若暂不用，可改为可选：把这一段注释）
          req_imap=(IMAP_HOST IMAP_USER IMAP_PASS)

          for k in "${req_vars[@]}"; do [[ -z "${!k:-}" ]] && missing+=("vars.$k"); done
          for k in "${req_core[@]}"; do [[ -z "${!k:-}" ]] && missing+=("secrets.$k"); done
          for k in "${req_smtp[@]}"; do [[ -z "${!k:-}" ]] && missing+=("secrets.$k"); done
          for k in "${req_imap[@]}"; do [[ -z "${!k:-}" ]] && missing+=("secrets.$k"); done

          {
            echo "## Check Secrets & Vars"
            echo "### Vars"
            echo "- SITE_ORIGIN: $([[ -n "${SITE_ORIGIN:-}" ]] && echo set || echo missing)"
            echo "- INTAKE_FORM_URL: $([[ -n "${INTAKE_FORM_URL:-}" ]] && echo set || echo missing)"
            echo "- STRIPE_LINK_PORTFOLIO: $([[ -n "${STRIPE_LINK_PORTFOLIO:-}" ]] && echo set || echo missing))"
            echo
            echo "### Core"
            echo "- SLACK_WEBHOOK_URL: $([[ -n "${SLACK_WEBHOOK_URL:-}" ]] && echo set || echo missing)"
            echo "- CF_API_TOKEN: $([[ -n "${CF_API_TOKEN:-}" ]] && echo set || echo missing)"
            echo "- STRIPE_WEBHOOK_SECRET: $([[ -n "${STRIPE_WEBHOOK_SECRET:-}" ]] && echo set || echo missing)"
            echo "- UNSUB_HMAC_SECRET: $([[ -n "${UNSUB_HMAC_SECRET:-}" ]] && echo set || echo missing)"
            echo
            echo "### SMTP"
            echo "- SMTP_HOST: $([[ -n "${SMTP_HOST:-}" ]] && echo set || echo missing)"
            echo "- SMTP_PORT: $([[ -n "${SMTP_PORT:-}" ]] && echo set || echo missing)"
            echo "- SMTP_USER: $([[ -n "${SMTP_USER:-}" ]] && echo set || echo missing)"
            echo "- SMTP_PASS: $([[ -n "${SMTP_PASS:-}" ]] && echo set || echo missing)"
            echo "- MAIL_FROM: $([[ -n "${MAIL_FROM:-}" ]] && echo set || echo missing)"
            echo
            echo "### IMAP"
            echo "- IMAP_HOST: $([[ -n "${IMAP_HOST:-}" ]] && echo set || echo missing)"
            echo "- IMAP_USER: $([[ -n "${IMAP_USER:-}" ]] && echo set || echo missing)"
            echo "- IMAP_PASS: $([[ -n "${IMAP_PASS:-}" ]] && echo set || echo missing)"
          } >> "$GITHUB_STEP_SUMMARY"

          if ((${#missing[@]})); then
            echo "❌ Missing required keys: ${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "✅ All required keys present." >> "$GITHUB_STEP_SUMMARY"
          fi

- name: Normalize Slack env
  shell: bash
  run: |
    if [[ -n "${SLACK_WEBHOOK:-}" && -z "${SLACK_WEBHOOK_URL:-}" ]]; then echo "SLACK_WEBHOOK_URL=$SLACK_WEBHOOK" >> $GITHUB_ENV; fi
    if [[ -n "${SLACK_WEBHOOK_URL:-}" && -z "${SLACK_WEBHOOK:-}" ]]; then echo "SLACK_WEBHOOK=$SLACK_WEBHOOK_URL" >> $GITHUB_ENV; fi
