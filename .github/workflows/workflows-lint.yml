name: Workflows Lint
on:
  pull_request:
  push:
    paths:
      - ".github/workflows/**/*.yml"
      - ".github/workflows/**/*.yaml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-actionlint@v1
        with:
          reporter: local          # 输出到日志即可
          fail_level: error        # error 级别即失败（一次到位的严格度）
          actionlint_flags: "-color"  # 合法输入；仅美化输出
