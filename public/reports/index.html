<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports — CG Alert</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/assets/cg-theme.css">
  <link rel="canonical" href="https://www.cg-alert.com/reports/">
</head>
<body>
<header class="app-header">
  <div class="nav container">
    <a class="logo" href="/"><img src="/icon.svg" alt="CG Alert">CG Alert</a>
    <a href="/reports/">Reports</a>
    <a href="/who-uses/">Who Uses</a>
    <a href="/rss.xml" rel="nofollow">RSS</a>
  </div>
</header>


<main class="container">
  <h1>Vendor Change Packs</h1>
  <p class="sub">Verified change packs by month and vendor. All times in UTC.</p>
  <div id="reports-root"><p>Loading…</p></div>
</main>
<script>
(function(){
  const root = document.getElementById('reports-root');
  fetch('/reports/index.json', {cache:'no-store'})
    .then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(data=>{
      const months = data.months || data;
      const keys = Object.keys(months).sort().reverse();
      const frag = document.createDocumentFragment();
      keys.forEach(m=>{
        const h2 = document.createElement('h2'); h2.textContent = m; frag.appendChild(h2);
        const ul = document.createElement('ul'); ul.className = 'vendor-list';
        (months[m]||[]).forEach(v=>{
          const li = document.createElement('li');
          const a = document.createElement('a'); a.href = `/reports/${m}/${v}/`; a.textContent = v;
          li.appendChild(a); ul.appendChild(li);
        });
        frag.appendChild(ul);
      });
      root.innerHTML=''; root.appendChild(frag);
    })
    .catch(_=>{ root.innerHTML = '<p class="sub">No index.json yet.</p>'; });
})();
</script>
<script id="reports-dupe-guard">
(function(){
  try{
    var hs = document.querySelectorAll('body > header');
    if (hs.length >= 2) { hs[0].remove(); }
  }catch(e){}
})();
</script>
</body>
</html>
