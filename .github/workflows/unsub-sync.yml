name: Unsubscribe / Suppression Sync
true:
  schedule:
  - cron: 23 1 * * *
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  unsubsync:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Node (if package.json present)
      if: ${{ hashFiles('package.json') != '' }}
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Apply suppression lists (if present)
      shell: bash
      run: "set -euo pipefail\nif [ -f scripts/suppression_apply.js ]; then\n  if\
        \ [ -f package.json ]; then npm ci || npm i; fi\n  node scripts/suppression_apply.js\n\
        elif [ -f scripts/suppression_apply.mjs ]; then\n  if [ -f package.json ];\
        \ then npm ci || npm i; fi\n  node scripts/suppression_apply.mjs\nelse\n \
        \ echo \"No suppression apply script; skipping.\"\nfi\nfi\n"
