name: Promote Intakes

on:
  schedule: [{ cron: "*/15 * * * *" }]   # 每15分钟
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    concurrency: { group: cg-write-promote, cancel-in-progress: false }

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Install deps
        run: npm ci || npm install --no-audit --no-fund

      - name: Preflight & promote
        env:
          PROMOTE_DRY: ${{ inputs.dry || '' }}
          PROMOTE_MAX: '500'
        run: |
          node scripts/promote-intakes.js

      - name: Safe push (with rebase & retries)
        run: |
          git config user.name "CG Bot"
          git config user.email "bot@cg-alert.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "promote: intakes → customers (auto)"
            tries=0
            until [ $tries -ge 3 ]
            do
              git pull --rebase --autostash origin main || (git rebase --abort || true)
              if git push origin HEAD:main; then
                echo "Push OK"; exit 0
              fi
              tries=$((tries+1))
              echo "Retry #$tries after 3s"; sleep 3
            done
            echo "Push failed after retries"; exit 1
          else
            echo "No changes."
          fi
