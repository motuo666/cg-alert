name: Outreach S2 (auto)
on:
  schedule: [ { cron: "30 16 * * *" } ]   # 每天 16:30 UTC
  workflow_dispatch: {}
jobs:
  s2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: |
          npm init -y >/dev/null 2>&1
          npm install nodemailer csv-parse csv-stringify --silent
      - name: Segment S2 (≥3天)
        run: node scripts/segment.js 2 3 50
      - name: Abort if empty
        run: '[ -s data/targets_stage2.csv ] || { echo "no targets"; exit 0; }'
      - name: Send S2
        env:
          CG_STAGE: "2"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: node scripts/send_bulk.js "data/targets_stage2.csv" "50" "75" \
          "Quick check before renewal — {v1}/{v2}" \
          "Hi {company} team — quick check.\nWe saw public changes on {v1}/{v2}/{v3}. 7-day pilot, no login. Reply “1” to start, “9” to opt out.\n— CG Alert"
