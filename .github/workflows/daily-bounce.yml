name: Daily Bounce
true:
  schedule:
  - cron: 17 2 * * *
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  bounce:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Node (if package.json present)
      if: ${{ hashFiles('package.json') != '' }}
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Run bounce sweep if present
      shell: bash
      run: "set -euo pipefail\nif [ -f scripts/bounce_sweep.js ]; then\n  if [ -f\
        \ package.json ]; then npm ci || npm i; fi\n  node scripts/bounce_sweep.js\n\
        elif [ -f scripts/bounce_sweep.mjs ]; then\n  if [ -f package.json ]; then\
        \ npm ci || npm i; fi\n  node scripts/bounce_sweep.mjs\nelif [ -f scripts/bounce_sweep.sh\
        \ ]; then\n  bash scripts/bounce_sweep.sh\nelse\n  echo \"No bounce sweep\
        \ script found; skipping.\"\nfi\nfi\n"
