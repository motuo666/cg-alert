name: Bootstrap Clean & Cover  (push->auto run)
on:
  push:
    branches: [ main ]                    # ← 换成你的默认分支名（若不是 main）
    paths: [ ".github/workflows/bootstrap-clean.yml" ]  # 改这个文件就会触发
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: bootstrap-clean
  cancel-in-progress: true

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Write clean_and_cover.sh
        run: |
          mkdir -p tools
          cat > tools/clean_and_cover.sh <<'CLEAN'
          #!/usr/bin/env bash
          set -euo pipefail
          ts(){ date -u +"%Y-%m-%dT%H:%M:%SZ"; }; log(){ echo "[$(ts)] $*"; }
          [ -d .git ] && [ -d .github ] || { echo "not repo root"; exit 1; }
          mkdir -p .github/workflows scripts tools

          # 保护标签
          TAG="pre-clean-$(date -u +%Y%m%d-%H%M%S)"
          git add -A && git commit -m "chore: checkpoint before clean (auto)" || true
          git tag -f "$TAG" || true

          # 删除 34 个冗余 workflow（缺文件自动跳过）
          del_list=( "_ping.yml" "alert-changes.yml" "apply-fixpack.yml" "auto-domains.yml" "auto-tags.yml" "channel-digest.yml" "codeql.yml" "collect-evidence.yml" "csv-normalize.yml" "customer-feeds.yml" "daily-ops-report.yml" "data-sanitize.yml" "deps-fix-core.yml" "deps-fix-minimist.yml" "dmarc-auto.yml" "e2e-fullchain.yml" "fix-leads.yml" "git-unignore-evidence.yml" "internal-linking.yml" "kpi-force-green.yml" "kpi-jumpstart.yml" "leads-lint.yml" "manual-monthly-public-report.yml" "manual-promote-intakes.yml" "manual-weekly-health.yml" "nav-tighten.yml" "restore-legacy-home.yml" "run-root.yml" "secret-scan.yml" "sitemap-ping.yml" "slack-ping.yml" "upsell-capacity.yml" "vendor-scale.yml" "collect-evidence-daily.yml" )
          for f in "${del_list[@]}"; do p=".github/workflows/$f"; [ -f "$p" ] && git rm -f "$p" || true; done

          # 旧名统一
          [ -f .github/workflows/Outreach-S1.yml ] && git mv .github/workflows/Outreach-S1.yml .github/workflows/outreach-s1.yml || true

          # 写入 14 个核心 workflows（Node 20 + Safe Push/兜底）
          write(){ mkdir -p "$(dirname "$1")"; cat > "$1"; }

          # === outreach-s1.yml ===
          write .github/workflows/outreach-s1.yml <<'YAML'
          name: Outreach S1
          on:
            schedule: [ { cron: "30 17 * * 1-5" } ]
            workflow_dispatch:
              inputs:
                dry:   { description: "dry run", default: "true", required: true }
                limit: { description: "max emails", default: "20",  required: true }
          permissions: {}
          concurrency: { group: outreach-s1, cancel-in-progress: true }
          jobs:
            s1:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with: { node-version: 20 }
                - run: npm ci || npm i --no-audit --no-fund || true
                - run: node scripts/leads_guard.js && node scripts/validate_leads.js || true
                - id: gate
                  env: { TRIGGER_WINDOW_H: 48 }
                  run: node scripts/s1_gate.js || echo "ok=0" >> $GITHUB_OUTPUT
                - if: steps.gate.outputs.ok == '1'
                  env:
                    SMTP_HOST: ${{ secrets.SMTP_HOST }}
                    SMTP_PORT: ${{ secrets.SMTP_PORT }}
                    SMTP_USER: ${{ secrets.SMTP_USER }}
                    SMTP_PASS: ${{ secrets.SMTP_PASS }}
                    MAIL_FROM: ${{ secrets.MAIL_FROM }}
                    BCC_TO:     ${{ secrets.BCC_TO }}
                  run: node scripts/send_bulk.js --dry=${{ inputs.dry }} --limit=${{ inputs.limit }}
                - if: steps.gate.outputs.ok != '1'
                  run: echo "No fresh evidence → skip"
          YAML
          # === outreach-triggered.yml ===
          write .github/workflows/outreach-triggered.yml <<'YAML'
          name: Outreach Triggered
          on:
            schedule: [ { cron: "5 16 * * 1-5" } ]
            workflow_dispatch:
              inputs:
                dry:      { description: "dry run", default: "true", required: true }
                limit:    { description: "max emails", default: "20",   required: true }
                window_h: { description: "evidence window (hours)", default: "48", required: true }
          permissions: {}
          concurrency: { group: outreach-triggered, cancel-in-progress: true }
          jobs:
            trig:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with: { node-version: 20 }
                - run: npm ci || npm i --no-audit --no-fund || true
                - env:
                    TRIGGER_WINDOW_H: ${{ inputs.window_h }}
                    SMTP_HOST: ${{ secrets.SMTP_HOST }}
                    SMTP_PORT: ${{ secrets.SMTP_PORT }}
                    SMTP_USER: ${{ secrets.SMTP_USER }}
                    SMTP_PASS: ${{ secrets.SMTP_PASS }}
                    MAIL_FROM: ${{ secrets.MAIL_FROM }}
                    BCC_TO:     ${{ secrets.BCC_TO }}
                  run: node scripts/send_triggered.js --dry=${{ inputs.dry }} --limit=${{ inputs.limit }}
          YAML
          # === promote-intakes.yml ===
          write .github/workflows/promote-intakes.yml <<'YAML'
          name: Promote Intakes
          on: { schedule: [ { cron: "*/15 * * * *" } ], workflow_dispatch: {} }
          permissions: { contents: write, pull-requests: write }
          concurrency: { group: promote-intakes, cancel-in-progress: false }
          jobs:
            promote:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                  with: { fetch-depth: 0 }
                - uses: actions/setup-node@v4
                  with: { node-version: 20 }
                - run: npm ci || npm i --no-audit --no-fund || true
                - run: |
                    if [ -f scripts/promote-intakes.js ]; then node scripts/promote-intakes.js;
                    elif [ -f scripts/promote_intakes.js ]; then node scripts/promote_intakes.js;
                    else echo "promote-intakes script not found"; exit 1; fi
                - run: |
                    chmod +x scripts/git_safe_push.sh || true
                    if [ -x scripts/git_safe_push.sh ]; then bash scripts/git_safe_push.sh "promote: intakes -> customers";
                    else git add -A && git pull --rebase --autostash || true && git commit -m "promote: intakes -> customers" || true && git push || true; fi
          YAML
          # === weekly-health-check.yml ===
          write .github/workflows/weekly-health-check.yml <<'YAML'
          name: Weekly Health Check
          on:
            schedule: [ { cron: "0 15 * * 1" } ]
            workflow_dispatch:
              inputs: { force_green: { description: "临时强制绿(1=不失败+自愈)", default: "0", required: false } }
          permissions: { contents: write }
          concurrency: { group: weekly-health, cancel-in-progress: true }
          jobs:
            check:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                  with: { fetch-depth: 0 }
                - uses: actions/setup-node@v4
                  with: { node-version: 20 }
                - run: npm ci || npm i --no-audit --no-fund || true
                - env:
                    SMTP_HOST: ${{ secrets.SMTP_HOST }}
                    SMTP_PORT: ${{ secrets.SMTP_PORT }}
                    SMTP_USER: ${{ secrets.SMTP_USER }}
                    SMTP_PASS: ${{ secrets.SMTP_PASS }}
                    IMAP_HOST: ${{ secrets.IMAP_HOST }}
                    IMAP_PORT: ${{ secrets.IMAP_PORT }}
                    IMAP_USER: ${{ secrets.IMAP_USER }}
                    IMAP_PASS: ${{ secrets.IMAP_PASS }}
                    SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
                    KPI_FORCE_GREEN: ${{ inputs.force_green || '0' }}
                  run: |
                    set -e
                    node scripts/weekly_health_check.js || if [ "${{ inputs.force_green || '0' }}" = "1" ]; then echo "force green"; else exit 1; fi
                - if: always()
                  run: |
                    chmod +x scripts/git_safe_push.sh || true
                    if [ -x scripts/git_safe_push.sh ]; then bash scripts/git_safe_push.sh "kpi: weekly health";
                    else git add -A && git pull --rebase --autostash || true && git commit -m "kpi: weekly health" || true && git push || true; fi
          YAML
          # === monthly-public-report.yml ===
          write .github/workflows/monthly-public-report.yml <<'YAML'
          name: Monthly Public Report
          on:
            schedule: [ { cron: "10 15 1 * *" } ]
            workflow_dispatch: { inputs: { month: { description: "YYYY-MM（空=当前月）", required: false } } }
          permissions: { contents: write }
          concurrency: { group: monthly-public-report, cancel-in-progress: true }
          jobs:
            report:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                  with: { fetch-depth: 0 }
                - uses: actions/setup-node@v4
                  with: { node-version: 20 }
                - run: npm ci || npm i --no-audit --no-fund || true
                - env: { REPORT_MONTH: ${{ inputs.month }} }
                  run: node scripts/build_public_monthly.js
                - run: |
                    chmod +x scripts/git_safe_push.sh || true
                    if [ -x scripts/git_safe_push.sh ]; then bash scripts/git_safe_push.sh "report: public monthly ${{ inputs.month || 'auto' }}";
                    else git add -A && git pull --rebase --autostash || true && git commit -m "report: public monthly ${{ inputs.month || 'auto' }}" || true && git push || true; fi
          YAML
          # === seo-tighten.yml ===
          write .github/workflows/seo-tighten.yml <<'YAML'
          name: SEO Tighten
          on:
            push: { branches: [ main ], paths: [ "vendors/**", "updates/**", "evidence/**" ] }
            workflow_dispatch: {}
          permissions: { contents: write }
          concurrency: { group: seo-tighten, cancel-in-progress: true }
          jobs:
            tighten:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                  with: { fetch-depth: 0 }
                - uses: actions/setup-node@v4
                  with: { node-version: 20 }
                - run: npm ci || npm i --no-audit --no-fund || true
                - run: node scripts/seo_inject.js
                - run: |
                    chmod +x scripts/git_safe_push.sh || true
                    if [ -x scripts/git_safe_push.sh ]; then bash scripts/git_safe_push.sh "seo: inject json-ld/canonical/meta";
                    else git add -A && git pull --rebase --autostash || true && git commit -m "seo: inject json-ld/canonical/meta" || true && git push || true; fi
          YAML
          # === domain-grow.yml ===
          write .github/workflows/domain-grow.yml <<'YAML'
          name: Domain Grow (daily)
          on:
            schedule: [ { cron: "25 3 * * *" } ]
            workflow_dispatch: { inputs: { new_domains: { description: "新增域上限", default: "60", required: true } } }
          permissions: { contents: write }
          concurrency: { group: cg-domain-grow, cancel-in-progress: false }
          jobs:
            grow:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                  with: { fetch-depth: 0 }
                - uses: actions/setup-node@v4
                  with: { node-version: 20 }
                - run: npm ci || npm i --no-audit --no-fund || true
                - env: { NEW_DOMAINS_LIMIT: ${{ inputs.new_domains || 60 }} }
                  run: node scripts/auto_discover_domains.js
                - run: |
                    node scripts/auto_append_domains.js
                    node scripts/endpoint_inventory.js
                - run: |
                    chmod +x scripts/git_safe_push.sh || true
                    if [ -x scripts/git_safe_push.sh ]; then bash scripts/git_safe_push.sh "grow: +auto discovered domains (daily)";
                    else git add -A && git pull --rebase --autostash || true && git commit -m "grow: +auto discovered domains (daily)" || true && git push || true; fi
          YAML
          # === channel-grow.yml ===
          write .github/workflows/channel-grow.yml <<'YAML'
          name: Channel Grow (weekly)
          on:
            schedule: [ { cron: "10 4 * * 1" } ]
            workflow_dispatch: { inputs: { limit: { description: "每周渠道候选上限", default: "40", required: true } } }
          permissions: { contents: write }
          concurrency: { group: cg-channel, cancel-in-progress: false }
          jobs:
            grow:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                  with: { fetch-depth: 0 }
                - uses: actions/setup-node@v4
                  with: { node-version: 20 }
                - run: npm ci || npm i --no-audit --no-fund || true
                - env: { NEW_CHANNELS_LIMIT: ${{ inputs.limit || 40 }} }
                  run: node scripts/auto_discover_channels.js
                - run: |
                    chmod +x scripts/git_safe_push.sh || true
                    if [ -x scripts/git_safe_push.sh ]; then bash scripts/git_safe_push.sh "channel: weekly partner targets";
                    else git add -A && git pull --rebase --autostash || true && git commit -m "channel: weekly partner targets" || true && git push || true; fi
          YAML
          # === public-change-poller.yml ===
          write .github/workflows/public-change-poller.yml <<'YAML'
          name: Public Change Poller
          on: { schedule: [ { cron: "0 */4 * * *" } ], workflow_dispatch: {} }
          permissions: { contents: write }
          concurrency: { group: public-change-poller, cancel-in-progress: true }
          jobs:
            poll:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                  with: { fetch-depth: 0 }
                - uses: actions/setup-node@v4
                  with: { node-version: 20 }
                - run: npm ci || npm i --no-audit --no-fund || true
                - run: |
                    node scripts/endpoint_inventory.js || true
                    node scripts/poll_public_endpoints.js
                    node scripts/build_updates.js || true
                    node scripts/seo_inject.js || true
                - run: |
                    chmod +x scripts/git_safe_push.sh || true
                    if [ -x scripts/git_safe_push.sh ]; then bash scripts/git_safe_push.sh "poller: public endpoints + site refresh";
                    else git add -A && git pull --rebase --autostash || true && git commit -m "poller: public endpoints + site refresh" || true && git push || true; fi
          YAML
          # === vendor-catalog.yml ===
          write .github/workflows/vendor-catalog.yml <<'YAML'
          name: Vendor Catalog
          on: { schedule: [ { cron: "10 15 * * 1" } ], workflow_dispatch: {} }
          permissions: { contents: write }
          concurrency: { group: vendor-catalog, cancel-in-progress: true }
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                  with: { fetch-depth: 0 }
                - uses: actions/setup-node@v4
                  with: { node-version: 20 }
                - env: { SITE_ORIGIN: 'https://www.cg-alert.com' }
                  run: node scripts/vendor_catalog.js
                - run: |
                    chmod +x scripts/git_safe_push.sh || true
                    if [ -x scripts/git_safe_push.sh ]; then bash scripts/git_safe_push.sh "vendors: weekly refresh";
                    else git add -A && git pull --rebase --autostash || true && git commit -m "vendors: weekly refresh" || true && git push || true; fi
          YAML
          # === weekly-updates.yml ===
          write .github/workflows/weekly-updates.yml <<'YAML'
          name: Weekly Public Updates
          on: { schedule: [ { cron: "0 15 * * 1" } ], workflow_dispatch: {} }
          permissions: { contents: write }
          concurrency: { group: weekly-updates, cancel-in-progress: true }
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                  with: { fetch-depth: 0 }
                - uses: actions/setup-node@v4
                  with: { node-version: 20 }
                - run: npm ci || npm i --no-audit --no-fund || true
                - run: node scripts/build_updates.js
                - run: |
                    chmod +x scripts/git_safe_push.sh || true
                    if [ -x scripts/git_safe_push.sh ]; then bash scripts/git_safe_push.sh "updates: weekly refresh";
                    else git add -A && git pull --rebase --autostash || true && git commit -m "updates: weekly refresh" || true && git push || true; fi
          YAML
          # === categories.yml ===
          write .github/workflows/categories.yml <<'YAML'
          name: Categories Build
          on: { schedule: [ { cron: "12 15 * * 1" } ], workflow_dispatch: {} }
          permissions: { contents: write }
          concurrency: { group: categories, cancel-in-progress: true }
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                  with: { fetch-depth: 0 }
                - uses: actions/setup-node@v4
                  with: { node-version: 20 }
                - run: npm ci || npm i --no-audit --no-fund || true
                - env: { SITE_ORIGIN: 'https://www.cg-alert.com' }
                  run: node scripts/build_categories.js
                - run: |
                    chmod +x scripts/git_safe_push.sh || true
                    if [ -x scripts/git_safe_push.sh ]; then bash scripts/git_safe_push.sh "categories: weekly refresh";
                    else git add -A && git pull --rebase --autostash || true && git commit -m "categories: weekly refresh" || true && git push || true; fi
          YAML
          # === inbound.yml ===
          write .github/workflows/inbound.yml <<'YAML'
          name: Inbound (poll inbox)
          on: { schedule: [ { cron: "*/15 * * * *" } ], workflow_dispatch: {} }
          permissions: { contents: write }
          concurrency: { group: inbound-poll, cancel-in-progress: false }
          jobs:
            poll:
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - uses: actions/checkout@v4
                  with: { fetch-depth: 0 }
                - uses: actions/setup-node@v4
                  with: { node-version: 20 }
                - run: |
                    npm ci || true
                    npm i --no-audit --no-fund imapflow@1 mailparser@3.8.1 csv-parse@5 csv-stringify@6 nodemailer@7 || true
                - env:
                    IMAP_HOST: ${{ secrets.IMAP_HOST }}
                    IMAP_PORT: ${{ secrets.IMAP_PORT || 993 }}
                    IMAP_USER: ${{ secrets.IMAP_USER || secrets.SMTP_USER }}
                    IMAP_PASS: ${{ secrets.IMAP_PASS || secrets.SMTP_PASS }}
                    SMTP_HOST: ${{ secrets.SMTP_HOST }}
                    SMTP_PORT: ${{ secrets.SMTP_PORT }}
                    SMTP_USER: ${{ secrets.SMTP_USER }}
                    SMTP_PASS: ${{ secrets.SMTP_PASS }}
                    MAIL_FROM: ${{ secrets.MAIL_FROM }}
                    SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
                  run: node scripts/poll_inbox.js --dry=0 || echo "IMAP not configured; skip"
                - if: always()
                  run: |
                    mkdir -p data
                    date -u +"%FT%TZ" > data/last_poll.txt
                - if: always()
                  run: |
                    chmod +x scripts/git_safe_push.sh || true
                    if [ -x scripts/git_safe_push.sh ]; then bash scripts/git_safe_push.sh "inbound: bounces + heartbeat";
                    else git add -A && git pull --rebase --autostash || true && git commit -m "inbound: bounces + heartbeat" || true && git push || true; fi
          YAML
          # === discover-contacts.yml ===
          write .github/workflows/discover-contacts.yml <<'YAML'
          name: Discover Public Contacts
          on: { schedule: [ { cron: "8 15 * * 1-5" } ], workflow_dispatch: {} }
          permissions: { contents: write }
          concurrency: { group: "discover-contacts-${{ github.ref }}", cancel-in-progress: true }
          jobs:
            run:
              if: github.ref == 'refs/heads/main'
              runs-on: ubuntu-latest
              timeout-minutes: 15
              steps:
                - uses: actions/checkout@v4
                  with: { fetch-depth: 0 }
                - uses: actions/setup-node@v4
                  with: { node-version: 20 }
                - run: node scripts/discover_contacts.js
                - run: node scripts/validate_leads.js || true
                - run: |
                    chmod +x scripts/git_safe_push.sh || true
                    if [ -x scripts/git_safe_push.sh ]; then bash scripts/git_safe_push.sh "leads: discover + validate";
                    else git add -A && git pull --rebase --autostash || true && git commit -m "leads: discover + validate" || true && git push || true; fi
          YAML

          # 别名脚本 + slug 统一器
          cat > scripts/vendor_catalog.js <<'JS'
          #!/usr/bin/env node
          require('./build_vendor_catalog.js');
          JS
          chmod +x scripts/vendor_catalog.js || true
          cat > scripts/vendors_slug_unify.js <<'JS'
          #!/usr/bin/env node
          const fs = require('fs'), path = require('path');
          const ROOT = path.join(__dirname, '..'), VDIR = path.join(ROOT, 'vendors');
          function clean(s){ return String(s||'').trim().split(',')[0].trim().toLowerCase(); }
          function moveDir(a,b){ if(!fs.existsSync(a))return; fs.mkdirSync(b,{recursive:true});
            for(const f of fs.readdirSync(a)){ const s=path.join(a,f), d=path.join(b,f); if(!fs.existsSync(d)) fs.renameSync(s,d); }
            try{ fs.rmdirSync(a);}catch{}
          }
          (function(){
            if(!fs.existsSync(VDIR)) return console.log('no vendors/');
            for(const d of fs.readdirSync(VDIR,{withFileTypes:true})){
              if(!d.isDirectory()) continue; const o=d.name; if(!o.includes(',')) continue;
              const n=clean(o); if(!n||n===o) continue; console.log(`unify: ${o} -> ${n}`); moveDir(path.join(VDIR,o), path.join(VDIR,n));
            }
            console.log('done');
          })();
          JS
          chmod +x scripts/vendors_slug_unify.js || true

          # 自愈 + 推送（Safe Push 兜底）
          node scripts/vendors_slug_unify.js || true
          node scripts/leads_guard.js || true
          node scripts/validate_leads.js || true
          git add -A
          git pull --rebase --autostash || true
          git commit -m "ci: clean workflows & harden pipelines (bootstrap)" || true
          git push || true
          echo "完成 ✅"
          CLEAN
          chmod +x tools/clean_and_cover.sh

      - name: Run
        run: bash tools/clean_and_cover.sh
