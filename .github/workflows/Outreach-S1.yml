name: Outreach S1

on:
  schedule:
    - cron: "30 17 * * 1-5"
  workflow_dispatch:
    inputs:
      dry:   { description: "Dry run (true/false)", required: true, default: "false" }
      limit: { description: "Max emails to send",    required: true, default: "20" }

concurrency: { group: outreach-s1, cancel-in-progress: false }

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      DRY:   ${{ inputs.dry   || 'false' }}
      LIMIT: ${{ inputs.limit || '20'  }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      IMAP_HOST: ${{ secrets.IMAP_HOST }}
      IMAP_PORT: ${{ secrets.IMAP_PORT }}
      IMAP_USER: ${{ secrets.IMAP_USER }}
      IMAP_PASS: ${{ secrets.IMAP_PASS }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      BCC_TO: ${{ secrets.BCC_TO }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install deps
        run: npm ci

      - name: Leads sanity
        run: node scripts/validate_leads.js

      - name: Gate by recent evidence (48h)
        id: gate
        env: { TRIGGER_WINDOW_H: "48" }
        run: node scripts/s1_gate.js

      - name: Send S1 (only when gate=1)
        if: steps.gate.outputs.ok == '1'
        run: node scripts/send_bulk.js --dry=${DRY} --limit=${LIMIT}

      - name: Skip note (no fresh evidence)
        if: steps.gate.outputs.ok != '1'
        run: echo "No fresh evidence → skip S1 this run"

      - name: Heartbeat
        if: always()
        run: |
          mkdir -p .heartbeat
          date -u +"%Y-%m-%dT%H:%M:%SZ gate=${{ steps.gate.outputs.ok }} dry=${DRY} limit=${LIMIT}" > .heartbeat/outreach-s1.txt
          git config user.name "cg-alert-bot"
          git config user.email "bot@cg-alert.com"
          git add .heartbeat/outreach-s1.txt || true
          git commit -m "heartbeat(outreach-s1): update" || true
          git push || true

      - name: Slack notify
        if: always()
        run: |
          STATUS="${{ job.status }}"
          MSG="Outreach S1 • status=${STATUS} • gate=${{ steps.gate.outputs.ok }} • dry=${DRY} • limit=${LIMIT}"
          curl -sS -X POST -H 'Content-type: application/json' --data "$(jq -n --arg t "$MSG" '{text:$t}')" "$SLACK_WEBHOOK"
