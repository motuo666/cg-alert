name: Vendor Catalog

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Git identity
        run: |
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"

      - name: Update templates (noop)
        run: echo "No-op"

      - name: Create PR with updates
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: update workflows from vendor catalog'
          branch: bot/vendor-catalog
          title: 'Vendor catalog: update workflows'
          body: 'Automated updates from vendor catalog.'
          labels: 'automation'
          delete-branch: true
