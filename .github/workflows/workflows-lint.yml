name: Workflows Lint

on:
  push:
    paths:
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download actionlint (latest)
        run: |
          set -euo pipefail
          curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- latest ./bin
          echo "$PWD/bin" >> $GITHUB_PATH

      - name: Run actionlint (YAML only, skip shellcheck & archives)
        run: |
          set -euo pipefail
          actionlint -version
          # Only check top-level YAML under .github/workflows/, to avoid archived jobs
          actionlint -no-use-default-glob             -glob '.github/workflows/*.yml'             -color             -shellcheck=
