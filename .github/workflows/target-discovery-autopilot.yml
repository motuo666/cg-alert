name: Target Discovery Autopilot

on:
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    env:
      ENABLE_AUTOPILOT: ${{ vars.ENABLE_AUTOPILOT || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard & run
        shell: bash
        run: |
          set -e
          echo "ENABLE_AUTOPILOT=${ENABLE_AUTOPILOT}"
          if [ "${ENABLE_AUTOPILOT}" != "true" ]; then
            echo "Discovery autopilot disabled. Exit 0."; exit 0; fi

          if [ ! -f scripts/target_discovery.js ]; then
            echo "scripts/target_discovery.js missing; skipping"; exit 0; fi

          # guard-missing:scripts/target_discovery.js
          if [ ! -f scripts/target_discovery.js ]; then echo 'missing, skip'; exit 0; fi
          node scripts/target_discovery.js
