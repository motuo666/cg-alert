name: Weekly Report
on:
  schedule:
    - cron: "10 3 * * 1"   # 周一 03:10 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  weekly:
    runs-on: ubuntu-latest
    concurrency:
      group: weekly-report
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm i dayjs fs-extra
      - name: Build weekly report
        run: node scripts/weekly_report.js
      - name: Commit report
        run: |
          set -e
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A public/reports
          if git diff --staged --quiet; then
            echo "No new report."
          else
            git commit -m "chore(report): publish weekly"
            git push
          fi
