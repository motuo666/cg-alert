<section class="cg-wrap">
<form data-form="" data-worker="" id="intake" novalidate="">
<input name="plan" type="hidden" value="enterprise"/>
<label>Company Email<br/><input name="email" placeholder="you@company.com" required="" style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;" type="email"/></label>
<div style="height:12px"></div>

<div style="height:12px"></div>
<label>Vendors (comma separated)<br/><input name="vendors" placeholder="okta.com, slack.com, ... " style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;"/></label>
<div style="height:12px"></div>
<label>Frequency<br/>
<select name="cadence" style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;">
<option value="weekly">Weekly</option>

</select>
</label>
<div style="height:16px"></div>
<button id="submitBtn" style="background:#0e7490;color:white;border:none;padding:10px 16px;border-radius:10px;" type="submit">Submit</button>
<div aria-live="polite" id="notice"></div>
</form><div id="msg" style="margin-top:12px;font-size:14px;color:#0f766e;"></div>
<script>
    // If you deploy with ENV replacements, set window.WORKER_URL / window.INTAKE_FORM_URL here.
    window.WORKER_URL = window.WORKER_URL || "";
    window.INTAKE_FORM_URL = window.INTAKE_FORM_URL || "";
  </script>
<script defer="" src="/assets/app-intake.js">
document.addEventListener('DOMContentLoaded', function(){
  const form = document.getElementById('intake');
  if (!form) return;
  const submitBtn = form.querySelector('button[type="submit"]');
  const meta = document.querySelector('meta[name="worker-url"]');
  const WORKER = (window.WORKER_URL || (meta && meta.content) || '').replace(/\/$/, '');
  const INTAKE_FALLBACK = (window.INTAKE_FORM_URL || '').trim();
  const ok = (msg) => {
    let box = document.getElementById('intake-success');
    if (!box) {
      box = document.createElement('div');
      box.id = 'intake-success';
      box.style.marginTop = '16px';
      box.style.padding = '12px 14px';
      box.style.border = '1px solid #10b981';
      box.style.background = '#ecfdf5';
      box.style.color = '#065f46';
      box.style.borderRadius = '8px';
      form.parentNode.insertBefore(box, form.nextSibling);
    }
    box.textContent = msg || 'Submitted successfully. We will contact you within 24h.';
  };
  const fail = (msg) => {
    let box = document.getElementById('intake-error');
    if (!box) {
      box = document.createElement('div');
      box.id = 'intake-error';
      box.style.marginTop = '16px';
      box.style.padding = '12px 14px';
      box.style.border = '1px solid #ef4444';
      box.style.background = '#fef2f2';
      box.style.color = '#991b1b';
      box.style.borderRadius = '8px';
      form.parentNode.insertBefore(box, form.nextSibling);
    }
    box.textContent = msg || 'Submit failed. Please try again.';
  };
  form.addEventListener('submit', async (e) => {
    if (WORKER) e.preventDefault();
    const fd = new FormData(form);
    const payload = Object.fromEntries(fd.entries());
    const required = ['company','email'];
    for (const k of required) {
      if (!payload[k] || String(payload[k]).trim()==='') {
        if (WORKER) {
          e.preventDefault();
          fail('Missing required field: ' + k);
          return;
        }
      }
    }
    if (!WORKER) {
      return; // normal HTML submit (fallback target URL)
    }
    try {
      submitBtn && (submitBtn.disabled = true, submitBtn.textContent = 'Submitting');
      const res = await fetch(WORKER + '/intake', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload),
        mode: 'cors',
        credentials: 'omit'
      });
      if (res.ok) {
        ok('提交成功✓  我们会在 24 小时内与您联系。');
        form.reset();
      } else {
        const t = await res.text().catch(()=>'');
        fail('提交失败：' + (t || res.status));
      }
    } catch (err) {
      fail('网络异常，请稍后重试。');
    } finally {
      submitBtn && (submitBtn.disabled = false, submitBtn.textContent = 'Submit');
    }
  }, {passive: false});
});
</script>
