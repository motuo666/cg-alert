name: Patch Env Fallback
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  workflow: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply env fallback to workflows
        run: |
          node scripts/ci/apply_env_fallback.js
      - name: Commit changes
        run: |
          set -e
          if git diff --quiet; then
            echo "no changes"; exit 0
          fi
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add .github/workflows
          git commit -m "unify env: use secrets||vars fallback across workflows"
          git push
