name: Bounce Sweep
on:
  schedule:
    - cron: '30 20 * * *'   # 05:30 JST
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-24.04
    env:
      IMAP_HOST: ${{ secrets.IMAP_HOST }}
      IMAP_USER: ${{ secrets.IMAP_USER }}
      IMAP_PASS: ${{ secrets.IMAP_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm i imap-simple@5.1.0 mailparser@3.7.1
      - name: Sweep bounces
        run: node scripts/bounce_sweep.js
      - name: Commit suppression list
        run: |
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add data/suppressions.csv || true
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "bounce: update suppressions" && git push; fi
