name: All Systems Go
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/all-systems-go.yml"
permissions:
  contents: read
jobs:
  dryrun:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Sanity checks
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking required paths..."
          for p in index.html pricing/index.html reports/index.html rss/index.html intake/index.html assets; do
            if [ ! -e "$p" ]; then
              echo "::warning::missing $p"
            fi
          done
          echo "Scanning for dangerous placeholders"
          if grep -RIn --exclude-dir=.git -E "<<ImageDisplayed>>|conversation too long; truncated|FIXME|TODO" . ; then
            echo "::error::Repository contains dangerous placeholder content. Replace these files before going live."
            exit 1
          else
            echo "OK: no dangerous placeholders found."
          fi
