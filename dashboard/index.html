<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CG Alert — Evidence Dashboard</title><link rel="stylesheet" href="/enterprise.css"></head>
<body><main class="wrap"><h1>Evidence Dashboard</h1>
<p class="muted">Latest captures by vendor (from <code>/evidence</code>). If a capture page is not yet published, you'll be taken to the vendor's monthly report instead.</p>
<table><thead><tr><th>Vendor</th><th>Latest</th></tr></thead><tbody>
<tr><td>gmail.com</td><td><a data-fallback href="/evidence/gmail.com/2025-10-30T11-14-51-152Z/index0.html" data-vendor="gmail.com" data-ts="2025-10-30T11-14-51-152Z">2025-10-30T11-14-51-152Z</a></td></tr>
</tbody></table>
</main><script>
document.querySelectorAll('a[data-fallback]').forEach(a=>{
  a.addEventListener('click', async (e)=>{
    try{
      const url=a.getAttribute('href');
      const r=await fetch(url, {method:'HEAD'});
      if(r.ok) return;
      const v=a.dataset.vendor, ts=a.dataset.ts;
      const ym=ts.slice(0,7);
      const fallback='/reports/'+ym+'/'+encodeURIComponent(v)+'/';
      window.location=fallback;
      e.preventDefault();
    }catch(_){}
  });
});
</script></body></html>
