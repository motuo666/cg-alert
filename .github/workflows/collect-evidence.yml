name: Collect Evidence

on:
  schedule:
    - cron: "0 */6 * * *"   # 每6小时
  workflow_dispatch: {}

concurrency:
  group: collect-evidence
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      USER_AGENT: CGAlertBot/1.0 (+https://www.cg-alert.com)
      RETRIES: "3"
      TIMEOUT_MS: "12000"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v5
        with: { node-version: "20" }

      - name: Install deps
        run: npm ci

      - name: Sanity check domains.csv
        run: |
          echo "---- data/domains.csv (first 20 lines) ----"
          [ -f data/domains.csv ] && head -n 20 data/domains.csv || echo "NO data/domains.csv"
          echo "-------------------------------------------"

      - name: Collect evidence (robots-aware, resilient)
        continue-on-error: true
        run: node scripts/collect_evidence.js

      - name: Commit & push evidence/state
        if: always()
        run: |
          git config user.name "cg-alert-bot"
          git config user.email "bot@cg-alert.com"
          git add -A evidence/ data/evidence_state.json .heartbeat/ || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(collect): evidence update"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Slack notify
        if: always()
        run: |
          STATUS="${{ job.status }}"
          SUMMARY="$(cat .heartbeat/collect-evidence.json 2>/dev/null || echo '{}')"
          MSG="Collect Evidence • status=${STATUS} • summary=${SUMMARY}"
          curl -sS -X POST -H 'Content-type: application/json' --data "$(jq -n --arg t "$MSG" '{text:$t}')" "$SLACK_WEBHOOK"
