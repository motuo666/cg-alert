name: Site Polish (Light)
on: { workflow_dispatch: {} }
permissions: { contents: write }
concurrency: { group: site-polish, cancel-in-progress: true }
jobs:
  polish:
    runs-on: ubuntu-latest
    env:
      STRIPE_LINK_PORTFOLIO:  ${{ vars.STRIPE_LINK_PORTFOLIO }}
      STRIPE_LINK_COMPLIANCE: ${{ vars.STRIPE_LINK_COMPLIANCE || vars.STRIPE_LINK_BUSINESS }}
      STRIPE_LINK_ENTERPRISE: ${{ vars.STRIPE_LINK_ENTERPRISE }}
      INTAKE_FORM_URL:        ${{ vars.INTAKE_FORM_URL }}
      WORKER_URL:             ${{ vars.WORKER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Apply light theme
        run: node scripts/derivatives/apply_theme.js
      - name: Sync pricing & CTAs
        run: node scripts/derivatives/sync_pricing.js
      - name: Commit & push
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add -A
          if git diff --cached --quiet; then
            echo "no site polish changes"
          else
            git commit -m "site: light theme + pricing sync (2,988/6,000/12,000) + intake"
            git pull --rebase --autostash || true
            git push
          fi
