name: Site Hardening
on:
  workflow_dispatch: null
  push:
    branches:
    - main
    paths:
    - public/**/*.html
    - .github/workflows/site-hardening.yml
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Detect site root
      id: root
      shell: bash
      run: "set -eo pipefail\nif [ -d \"cg-alert-main\" ]; then\n  echo \"root=cg-alert-main\"\
        \ >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"root=.\" >> \"$GITHUB_OUTPUT\"\nfi\n"
    - name: Inject meta/canonical/CSP
      uses: actions/github-script@v7
      env:
        ROOT: ${{ steps.root.outputs.root }}
        ORIGIN: https://www.cg-alert.com
        DESC: Evidence-backed vendor change alerts.
      with:
        script: "const fs = require('fs');\nconst path = require('path');\nconst root\
          \ = process.env.ROOT || '.';\nconst origin = (process.env.ORIGIN || '').replace(/\\\
          /+$/,'');\nconst defaultDesc = process.env.DESC || 'Evidence-backed vendor\
          \ change alerts.';\n\nfunction walk(dir, acc=[]) {\n  for (const ent of\
          \ fs.readdirSync(dir, { withFileTypes: true })) {\n    const p = path.join(dir,\
          \ ent.name);\n    if (ent.isDirectory()) walk(p, acc);\n    else if (ent.isFile()\
          \ && p.endsWith('.html')) acc.push(p);\n  }\n  return acc;\n}\n\nfunction\
          \ canonicalFor(file) {\n  const absRoot = path.resolve(root);\n  const rel\
          \ = path.resolve(file).slice(absRoot.length).replace(/\\/g,'/');\n  let\
          \ urlPath = rel;\n  if (urlPath.endsWith('/index.html')) urlPath = urlPath.slice(0,\
          \ -'index.html'.length);\n  if (!urlPath.startsWith('/')) urlPath = '/'\
          \ + urlPath;\n  return origin ? (origin + urlPath) : urlPath;\n}\n\nfunction\
          \ ensure(head, needle, make) {\n  return head.includes(needle) ? head :\
          \ (head + '\\n' + make());\n}\n\nconst files = walk(root);\nlet touched\
          \ = 0;\nfor (const f of files) {\n  let s = fs.readFileSync(f, 'utf8');\n\
          \  const m = s.match(/<head[^>]*>/i);\n  if (!m) continue;\n  const i =\
          \ s.indexOf(m[0]) + m[0].length;\n  const j = s.indexOf('</head>', i);\n\
          \  if (j < 0) continue;\n  let head = s.slice(i, j);\n  const before = head;\n\
          \n  if (!/Content-Security-Policy/i.test(head)) {\n    head = ensure(head,\
          \ 'Content-Security-Policy', () =>\n      `<meta http-equiv=\"Content-Security-Policy\"\
          \ content=\"default-src 'self'; img-src 'self' data:; connect-src 'self'\
          \ https://buy.stripe.com https://api.cg-alert.com; frame-src https://buy.stripe.com;\
          \ style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri\
          \ 'self'; form-action 'self' https://buy.stripe.com https://forms.gle;\"\
          >`\n    );\n  }\n  if (!/rel=['\"]canonical['\"]/i.test(head) && origin)\
          \ {\n    head = ensure(head, 'rel=\"canonical\"', () => `<link rel=\"canonical\"\
          \ href=\"${canonicalFor(f)}\">`);\n  }\n  if (!/name=['\"]description['\"\
          ]/i.test(head)) {\n    head = ensure(head, 'name=\"description\"', () =>\
          \ `<meta name=\"description\" content=\"${defaultDesc}\">`);\n  }\n\n  if\
          \ (head !== before) {\n    s = s.slice(0, i) + head + s.slice(j);\n    fs.writeFileSync(f,\
          \ s);\n    touched++;\n  }\n}\ncore.info(`Hardening updated ${touched} HTML\
          \ files.`);\nfi\n"
concurrency:
  group: cg-full-pipeline
  cancel-in-progress: false
