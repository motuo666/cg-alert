<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vendors — CG Alert</title>
<link rel="canonical" href="https://www.cg-alert.com/vendors/">
<link rel="stylesheet" href="/assets/home-v3c.css">
<meta name="description" content="Directory of vendors monitored by CG Alert with recent change activity.">
</head><body>
<header class="cg-header">
  <div class="cg-wrap">
    <a class="cg-brand" href="/">CG Alert</a>
    <nav class="cg-nav">
      <a href="/#how">How it works</a>
      <a href="/reports/">Reports</a>
      <a href="/rss/">RSS</a>
      <a href="/pricing/">Pricing</a>
      <a href="/enterprise/" class="cg-btn sm">Enterprise</a>
    </nav>
  </div>
</header>

<main class="cg-wrap" style="padding:32px 0 80px">
  <h1>Vendors</h1>
  <div class="cg-controls" style="margin:12px 0 24px">
    <input id="q" placeholder="Filter vendors..." style="width:100%;max-width:360px;padding:8px;border:1px solid #e5e7eb;border-radius:8px">
  </div>
  <div id="list" class="cg-cards grid"></div>
</main>

<script>
(async function(){
  const $ = (s)=>document.querySelector(s);
  const list = $('#list'), q = $('#q');
  let raw = [];
  try { raw = await (await fetch('/api/vendors.json',{cache:'no-store'})).json(); } catch(_) { raw = []; }

  const norm = (arr)=> (Array.isArray(arr)?arr:[]).map(v=>{
    const slugFromUrl = ((v.url||'').split('/').filter(Boolean).pop()||'').toLowerCase();
    const slug = (v.slug || v.vendor || slugFromUrl || '').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
    const name = v.name || v.vendor || slug || 'unknown';
    return { name, slug, url: v.url || `/vendors/${slug}/`, count: v.count||0 };
  }).filter(v=> v.slug && !v.slug.startsWith('_'));

  let data = norm(raw);

  function render(){
    const kw = (q.value||'').toLowerCase();
    const items = data.filter(v => !kw || v.name.toLowerCase().includes(kw));
    list.innerHTML = items.map(v => `
      <a class="cg-card hover card" href="${v.url}" data-slug="${v.slug}" style="text-decoration:none">
        <div class="cg-muted" style="font-size:12px">${v.count} recent</div>
        <div class="cg-strong" style="font-size:18px">${v.name}</div>
      </a>`).join('') || '<div class="cg-note">No vendors yet.</div>';
  }

  q.addEventListener('input', render);
  render();

  list.addEventListener('click', async (e)=>{
    const a = e.target.closest('a.card'); if(!a) return;
    e.preventDefault();
    try { const r = await fetch(a.href, {method:'HEAD'}); location.href = r.ok ? a.href : (a.href + 'feed.xml'); }
    catch { location.href = a.href + 'feed.xml'; }
  });
})();
</script>

<footer class="site-footer" style="margin-top:48px;padding:24px 0;border-top:1px solid rgba(0,0,0,.06);text-align:center">
  <div class="cg-wrap"><a href="/terms/">Terms</a> · <a href="/privacy/">Privacy</a> · <a href="/rss/">RSS</a></div>
</footer>
</body></html>
