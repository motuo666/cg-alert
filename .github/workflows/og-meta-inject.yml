name: Inject OG/Twitter meta

on:
  workflow_dispatch:        # 手动触发

permissions:
  contents: write           # 允许这个 workflow 往仓库 push 代码

jobs:
  inject-og:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies for add_open_graph.py
        run: |
          pip install beautifulsoup4

      - name: Inject OG/Twitter meta into all HTML pages
        run: |
          # 假设 scripts 目录在仓库根目录
          python scripts/add_open_graph.py . --site-origin https://www.cg-alert.com

      - name: Commit & push changes (if any)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git status
          git diff --stat

          # 如果没有改动，就直接退出
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git add .
          git commit -m "chore: inject OG/Twitter meta tags"
          git push
