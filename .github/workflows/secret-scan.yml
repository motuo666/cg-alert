name: Secret Scan (TruffleHog)

on:
  pull_request:
  push: { branches: [ "main" ] }
  schedule: [ { cron: "30 14 * * 1" } ]   # 每周一 08:30 MT
  workflow_dispatch:

permissions: { contents: read }

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: { group: "trufflehog-${{ github.ref }}", cancel-in-progress: true }
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844c123c6a86e0a82  # v4.2.2
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@c9a68114c3b89a882cfe6a0f66c51a8aac10bfed # 3.x 固定SHA
        with:
          extra_args: "--only-verified --regex --max-blob-size=1000"
