name: All Systems Go
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dryrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Doctor
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking required paths..."
          for p in index.html pricing/index.html reports/index.html rss/index.html intake/index.html assets; do
            if [ ! -e "$p" ]; then
              echo "::warning::missing $p"
            fi
          done
          echo "Scanning for truncated placeholders ('...' or unicode ellipsis)…"
          if grep -RIn --exclude-dir=.git -E "\.\.\.|…|<<ImageDisplayed>>|conversation too long; truncated" . ; then
            echo "::error::Repository contains truncated placeholder content. Replace these files before going live."
            exit 1
          else
            echo "OK: no obvious placeholders found."
          fi
