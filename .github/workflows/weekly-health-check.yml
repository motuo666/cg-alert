name: Weekly Health (Self-Heal)
on:
  schedule:
    - cron: "0 15 * * 1"  # 周一 15:00 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  health:
    runs-on: ubuntu-latest
    concurrency:
      group: cg-write-health
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install deps
        run: npm ci || npm install --no-audit --no-fund
      - name: Ensure endpoint inventory
        run: node scripts/endpoint_inventory.js
      - name: Poll public endpoints (sample)
        env: { POLL_MAX: "32" }
        run: node scripts/poll_public_endpoints.js
      - name: Evidence force seed (baseline)
        env: { FORCE_LIMIT: "30" }
        run: node scripts/evidence_force_seed.js
      - name: SEO inject (idempotent)
        run: node scripts/seo_inject.js
      - name: Commit & Safe push
        id: push
        run: scripts/_ci_safe_push.sh main "kpi: self-heal (seed + poll + seo)"
      - name: SMTP/IMAP check & KPI
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SMTP_REQUIRED: "0"
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          IMAP_REQUIRED: "0"
        run: node scripts/weekly_health_check.js
