name: Outreach Rescue

on:
  workflow_dispatch:
    inputs:
      probe_to:
        description: "测试收件地址（可选）"
        required: false
      dry_run:
        description: "仅验证，不实际发信（0/1）"
        default: "1"
        required: true

permissions:
  contents: write

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install deps
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i nodemailer@6 csv-parse@5

      - name: Leads sanity
        run: node scripts/leads_sanity.js

      - name: SMTP probe
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          PROBE_TO: ${{ inputs.probe_to }}
        run: node scripts/smtp_probe.js

      - name: Dry-run S1
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          S1_SUBJECT: ${{ vars.S1_SUBJECT }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/send_bulk.js
