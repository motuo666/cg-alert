name: Pricing Patch
true:
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Node (if package.json present)
      if: ${{ hashFiles('package.json') != '' }}
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Apply pricing patch if present
      shell: bash
      run: "set -euo pipefail\nchanged=0\nif [ -f scripts/pricing_patch.mjs ]; then\n\
        \  if [ -f package.json ]; then npm ci || npm i; fi\n  node scripts/pricing_patch.mjs\
        \ && changed=1 || true\nelif [ -f scripts/pricing_patch.js ]; then\n  if [\
        \ -f package.json ]; then npm ci || npm i; fi\n  node scripts/pricing_patch.js\
        \ && changed=1 || true\nelse\n  echo \"No pricing patch script; skipping.\"\
        \nfi\nfi\n"
    - name: Commit & push if changed
      shell: bash
      run: "set -euo pipefail\nif git diff --quiet; then\n  echo \"No changes to commit\"\
        \n  exit 0\nfi\ngit config user.email \"bot@cg-alert.com\"\ngit config user.name\
        \  \"cg-alert-bot\"\ngit add -A\nif git diff --cached --quiet; then\n  echo\
        \ \"No staged changes\"\n  exit 0\nfi\ngit commit -m \"pricing: patch applied\"\
        \ngit push\n"
