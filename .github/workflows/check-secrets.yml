name: Check Secrets / Vars

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail

          red() { printf "\e[31m%s\e[0m\n" "$1"; }
          green() { printf "\e[32m%s\e[0m\n" "$1"; }

          # Vars (non-secret; set in Actions → Variables)
          need_vars=(
            SITE_ORIGIN
            INTAKE_FORM_URL
            STRIPE_LINK_RENEWAL_DESK
            STRIPE_LINK_PORTFOLIO
            STRIPE_LINK_COMPLIANCE
            SLACK_WEBHOOK_URL
            COMPANY_LEGAL_NAME
            MAIL_POSTAL_ADDRESS
            CF_ACCOUNT_ID
            KV_NAMESPACE_ID
            WORKER_URL
            UNSUB_HMAC_SECRET
          )

          # Secrets (sensitive; set in Actions → Secrets)
          need_secrets=(
            SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS
            IMAP_HOST IMAP_PORT IMAP_USER IMAP_PASS
            CF_API_TOKEN
            STRIPE_WEBHOOK_SECRET
            ENRICH_API_TOKEN
            TARGET_DISCOVERY_API_TOKEN
          )

          missing=0
          echo "Checking repository Variables..."
          for v in "${need_vars[@]}"; do
            val="${{ '{{' }} vars.${{ '}}' }}"
            # The above can't directly expand; use GitHub outputs: we emulate check by printing placeholders
            # Instead, rely on GH env interpolation per-var:
            if [ -z "${{ '${{ vars.SITE_ORIGIN }}' }}" ] && [ "$v" = "SITE_ORIGIN" ]; then red "vars.SITE_ORIGIN missing"; missing=$((missing+1)); fi
            if [ -z "${{ '${{ vars.INTAKE_FORM_URL }}' }}" ] && [ "$v" = "INTAKE_FORM_URL" ]; then red "vars.INTAKE_FORM_URL missing"; missing=$((missing+1)); fi
            if [ -z "${{ '${{ vars.STRIPE_LINK_RENEWAL_DESK }}' }}" ] && [ "$v" = "STRIPE_LINK_RENEWAL_DESK" ]; then red "vars.STRIPE_LINK_RENEWAL_DESK missing"; missing=$((missing+1)); fi
            if [ -z "${{ '${{ vars.STRIPE_LINK_PORTFOLIO }}' }}" ] && [ "$v" = "STRIPE_LINK_PORTFOLIO" ]; then red "vars.STRIPE_LINK_PORTFOLIO missing"; missing=$((missing+1)); fi
            if [ -z "${{ '${{ vars.STRIPE_LINK_COMPLIANCE }}' }}" ] && [ "$v" = "STRIPE_LINK_COMPLIANCE" ]; then red "vars.STRIPE_LINK_COMPLIANCE missing"; missing=$((missing+1)); fi
            if [ -z "${{ '${{ vars.SLACK_WEBHOOK_URL }}' }}" ] && [ "$v" = "SLACK_WEBHOOK_URL" ]; then red "vars.SLACK_WEBHOOK_URL missing"; missing=$((missing+1)); fi
            if [ -z "${{ '${{ vars.COMPANY_LEGAL_NAME }}' }}" ] && [ "$v" = "COMPANY_LEGAL_NAME" ]; then red "vars.COMPANY_LEGAL_NAME missing"; missing=$((missing+1)); fi
            if [ -z "${{ '${{ vars.MAIL_POSTAL_ADDRESS }}' }}" ] && [ "$v" = "MAIL_POSTAL_ADDRESS" ]; then red "vars.MAIL_POSTAL_ADDRESS missing"; missing=$((missing+1)); fi
            if [ -z "${{ '${{ vars.CF_ACCOUNT_ID }}' }}" ] && [ "$v" = "CF_ACCOUNT_ID" ]; then red "vars.CF_ACCOUNT_ID missing"; missing=$((missing+1)); fi
            if [ -z "${{ '${{ vars.KV_NAMESPACE_ID }}' }}" ] && [ "$v" = "KV_NAMESPACE_ID" ]; then red "vars.KV_NAMESPACE_ID missing"; missing=$((missing+1)); fi
            if [ -z "${{ '${{ vars.WORKER_URL }}' }}" ] && [ "$v" = "WORKER_URL" ]; then red "vars.WORKER_URL missing"; missing=$((missing+1)); fi
            if [ -z "${{ '${{ vars.UNSUB_HMAC_SECRET }}' }}" ] && [ "$v" = "UNSUB_HMAC_SECRET" ]; then red "vars.UNSUB_HMAC_SECRET missing"; missing=$((missing+1)); fi
          done

          echo "Checking repository Secrets..."
          if [ -z "${{ '${{ secrets.SMTP_HOST }}' }}" ]; then red "secrets.SMTP_HOST missing"; missing=$((missing+1)); fi
          if [ -z "${{ '${{ secrets.SMTP_PORT }}' }}" ]; then red "secrets.SMTP_PORT missing"; missing=$((missing+1)); fi
          if [ -z "${{ '${{ secrets.SMTP_USER }}' }}" ]; then red "secrets.SMTP_USER missing"; missing=$((missing+1)); fi
          if [ -z "${{ '${{ secrets.SMTP_PASS }}' }}" ]; then red "secrets.SMTP_PASS missing"; missing=$((missing+1)); fi

          if [ -z "${{ '${{ secrets.IMAP_HOST }}' }}" ]; then red "secrets.IMAP_HOST missing"; missing=$((missing+1)); fi
          if [ -z "${{ '${{ secrets.IMAP_PORT }}' }}" ]; then red "secrets.IMAP_PORT missing"; missing=$((missing+1)); fi
          if [ -z "${{ '${{ secrets.IMAP_USER }}' }}" ]; then red "secrets.IMAP_USER missing"; missing=$((missing+1)); fi
          if [ -z "${{ '${{ secrets.IMAP_PASS }}' }}" ]; then red "secrets.IMAP_PASS missing"; missing=$((missing+1)); fi

          if [ -z "${{ '${{ secrets.CF_API_TOKEN }}' }}" ]; then red "secrets.CF_API_TOKEN missing"; missing=$((missing+1)); fi
          if [ -z "${{ '${{ secrets.STRIPE_WEBHOOK_SECRET }}' }}" ]; then red "secrets.STRIPE_WEBHOOK_SECRET missing"; missing=$((missing+1)); fi

          # Optional
          if [ -z "${{ '${{ secrets.ENRICH_API_TOKEN }}' }}" ]; then red "(optional) secrets.ENRICH_API_TOKEN missing"; fi
          if [ -z "${{ '${{ secrets.TARGET_DISCOVERY_API_TOKEN }}' }}" ]; then red "(optional) secrets.TARGET_DISCOVERY_API_TOKEN missing"; fi

          if [ "$missing" -gt 0 ]; then
            red "✗ Missing $missing required variables/secrets"
            exit 1
          else
            green "✓ All required variables/secrets are set"
          fi
