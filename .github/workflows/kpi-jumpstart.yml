name: KPI Jumpstart
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    concurrency: { group: cg-write, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install deps
        run: npm ci
      - name: Expand domains from pool (+120)
        run: node scripts/domains_expand_from_pool.js 120
      - name: Build endpoint inventory
        run: node scripts/endpoint_inventory.js
      - name: Poll public endpoints (robots-aware)
        env: { MAX_ENDPOINTS: "800", PER_HOST: "6" }
        run: node scripts/poll_public_endpoints.js
      - name: Build updates + SEO
        run: |
          node scripts/build_updates.js
          node scripts/seo_inject.js
      - name: Safe push
        run: |
          chmod +x scripts/git_safe_push.sh
          bash scripts/git_safe_push.sh "kpi: expand domains + poll + site update"
