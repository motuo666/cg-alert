name: Endpoint Backoff Sweeper

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sweep endpoints with backoff
        run: |
          set -euo pipefail
          if [ -f scripts/discovery/endpoint_backoff_sweeper.js ]; then
            node scripts/discovery/endpoint_backoff_sweeper.js
          else
            echo "::warning::scripts/discovery/endpoint_backoff_sweeper.js not found. Skipping."
          fi
      - name: Commit changes (if any)
        run: |
          set -euo pipefail
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add -A || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Endpoint backoff sweep (auto)"
            git pull --rebase --autostash || true
            git push
          fi
