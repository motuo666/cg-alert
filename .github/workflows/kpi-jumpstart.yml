name: KPI Jumpstart
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install deps
        run: npm ci
      - name: Expand domains from pool (+80)
        run: node scripts/domains_expand_from_pool.js 80
      - name: Build endpoint inventory
        run: node scripts/endpoint_inventory.js
      - name: Poll public endpoints (robots-aware)
        env: { MAX_ENDPOINTS: "500", PER_HOST: "5" }
        run: node scripts/poll_public_endpoints.js
      - name: Build updates + SEO
        run: |
          node scripts/build_updates.js
          node scripts/seo_inject.js
      - name: Commit
        run: |
          git config user.name "CG Bot"
          git config user.email "bot@cg-alert.com"
          git add -A
          git commit -m "kpi: expanded domains, polled endpoints, site updated" || echo "no changes"
          git push
