name: "stabilize-p0"

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 * * * *"  # hourly

permissions:
  contents: write

concurrency:
  group: stabilize-p0
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Repair static pages (sanitize head and remove ellipsis)
        run: node scripts/repair_pages.js

      - name: Align acceptance script worker path
        run: |
          if grep -q "worker/lead-gateway.js" scripts/run_acceptance.sh; then
            sed -i 's#worker/lead-gateway.js#lead-gateway/src/index.js#g' scripts/run_acceptance.sh
          fi

      - name: Commit & push if changed
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          if git diff --quiet; then
            echo "no changes"
          else
            git add -A
            git commit -m "stabilize: repair static pages + align acceptance script"
            git pull --rebase --autostash || true
            git push
          fi
