name: Pricing Patch

on:
  schedule:
    - cron: '10 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (if package.json present)
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps (if package.json present)
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          set -euo pipefail
          npm ci || npm i
- name: Apply pricing patch
  run: |
   set -euo pipefail

   if [ -f "scripts/pricing_patch.mjs" ]; then
     echo "→ Running: scripts/pricing_patch.mjs"
     case ".mjs" in
       .mjs|.js)
         node "scripts/pricing_patch.mjs"
         ;;
       .sh)
         bash "scripts/pricing_patch.mjs"
         ;;
       *)
         echo "Unknown extension for scripts/pricing_patch.mjs, trying bash"
         bash "scripts/pricing_patch.mjs"
         ;;
     esac
     exit 0
   fi

   if [ -f "scripts/pricing_patch.js" ]; then
     echo "→ Running: scripts/pricing_patch.js"
     case ".js" in
       .mjs|.js)
         node "scripts/pricing_patch.js"
         ;;
       .sh)
         bash "scripts/pricing_patch.js"
         ;;
       *)
         echo "Unknown extension for scripts/pricing_patch.js, trying bash"
         bash "scripts/pricing_patch.js"
         ;;
     esac
     exit 0
   fi
   echo "skip: none of expected scripts found"; exit 0

- name: Commit & push changes (if any)
  run: |
    set -euo pipefail
    git config user.email "bot@cg-alert.com"
    git config user.name  "cg-alert-bot"
    git add -A || true
    if git diff --cached --quiet; then
      echo "no changes to commit"
    else
      git commit -m "pricing: patch"
      git pull --rebase --autostash || true
      git push
    fi
