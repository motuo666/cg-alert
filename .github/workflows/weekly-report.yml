name: Weekly Report
on:
  schedule: [ { cron: '0 0 * * MON' } ]  # UTC Monday 00:00 (JST 09:00)
  workflow_dispatch:
permissions: { contents: write }
jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/ops/weekly_report.js
      - name: Commit weekly report
        run: |
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add -A ops/weekly
          if git diff --cached --quiet; then echo "no weekly changes"; else git commit -m "ops: weekly report"; git pull --rebase --autostash || true; git push; fi
