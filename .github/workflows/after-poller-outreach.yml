name: After Poller → Outreach Auto
on:
  workflow_run:
    workflows: ["Public Change Poller"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: outreach-auto
  cancel-in-progress: false

jobs:
  gate_and_dispatch:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SEND_TZ: Asia/Tokyo
      SEND_DAYS: Mon,Tue,Wed,Thu,Fri
      SEND_START_HOUR: "9"
      SEND_END_HOUR: "20"
      TARGET_EVID_TODAY: ${{ vars.TARGET_EVID_TODAY || '10' }}
      TTD_LOOKBACK_HOURS: ${{ vars.TTD_LOOKBACK_HOURS || '48' }}
      REQUIRE_CHANGED_VENDORS: ${{ vars.REQUIRE_CHANGED_VENDORS || 'true' }}
      OUTREACH_LIMIT: ${{ vars.TARGET_SENT || '12' }}
      OUTREACH_WINDOW_H: ${{ vars.WINDOW_H || '336' }}
      OUTREACH_DRY_DEFAULT: ${{ vars.OUTREACH_DRY_DEFAULT || 'false' }}
      FORCE_MIN_SEND: ${{ vars.FORCE_MIN_SEND || 'false' }}
      UNSUB_7D_MAX: ${{ vars.UNSUB_7D_MAX || '3' }}
      COMPLAINT_7D_MAX: ${{ vars.COMPLAINT_7D_MAX || '0.1' }}
      BOUNCE_7D_MAX: ${{ vars.BOUNCE_7D_MAX || '8' }}
    steps:
      - uses: actions/checkout@v4
      - name: KPI Guard (auto-dry on breach)
        id: kpi
        run: node scripts/outreach/kpi_guard.js
      - name: Gate & dispatch Outreach Triggered
        env:
          OUTREACH_DRY_DEFAULT: ${{ steps.kpi.outputs.outreach_dry }}
        run: node scripts/outreach/gate_and_dispatch.js
