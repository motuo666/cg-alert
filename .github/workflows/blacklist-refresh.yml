name: Blacklist Refresh

on:
  schedule:
    - cron: "9 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh bounce blacklist
        run: |
          set -euo pipefail
          if [ -f scripts/bounce/blacklist_refresh.js ]; then
            node scripts/bounce/blacklist_refresh.js
          else
            echo "::warning::scripts/bounce/blacklist_refresh.js not found. Skipping."
          fi
      - name: Commit changes (if any)
        run: |
          set -euo pipefail
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add -A || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Blacklist refresh (auto)"
            git pull --rebase --autostash || true
            git push
          fi
