name: Site Doctor

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'reports/**'
      - 'public/**'
      - 'evidence/**'
      - '_redirects'
      - 'public/_redirects'
      - 'scripts/**'
      - '.github/workflows/site-doctor.yml'

permissions:
  contents: write

concurrency:
  group: site-doctor
  cancel-in-progress: true

jobs:
  doctor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. 同步 reports → public/reports
      - name: Sync reports into public/reports
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p public/reports
          if [ -d reports ]; then
            rsync -av --delete reports/ public/reports/
          fi
          test -d public/reports

      # 2. 确保 /feed 指向的 /updates/rss.xml 存在
      #    把 public/reports.rss.xml 复制成 public/updates/rss.xml
      #    如果 public/reports.rss.xml 不存在，就 fail
      - name: Ensure RSS alias for /feed
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p public/updates
          if [ -f public/reports.rss.xml ]; then
            cp public/reports.rss.xml public/updates/rss.xml
          fi
          test -f public/updates/rss.xml

      # 3. 把根目录 _redirects 同步进构建输出目录 public/_redirects
      - name: Sync _redirects into public/_redirects
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -f _redirects ]; then
            mkdir -p public
            cp _redirects public/_redirects
          fi
          test -f public/_redirects

      # 4. 清掉所有 *.bak，防止脏备份进 SEO
      - name: Prune backup garbage (*.bak)
        shell: bash
        run: |
          set -Eeuo pipefail
          find reports public evidence -type f -name '*.bak' -print -delete || true

      # 5. 跑规范修整（header、主题注入、链接归一化等）
      - name: Normalize pages (site_doctor.js / theme_injector.js)
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/site_doctor.js
          node scripts/theme_injector.js

      # 6. 基础健康检查（任何一个不满足就 fail，防止静默坏站）
      - name: Sanity checks
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "[check] core landing pages"
          test -f public/seo/index.html
          test -f public/who-uses/index.html

          echo "[check] sitemap"
          test -f public/sitemap.xml
          test -f public/seo/sitemap.xml

          echo "[check] reports dir (public/reports)"
          test -d public/reports
          if [ "$(ls -A public/reports | wc -l)" -gt 0 ]; then
            echo "public/reports is non-empty"
          else
            echo "ERROR: public/reports is empty"
            exit 1
          fi

          echo "[check] evidence dir with at least one index.html and one diff.html (provable deltas)"
          test -d public/evidence
          # 必须至少有一条 index.html 证据
          find public/evidence -maxdepth 5 -type f -name index.html -print -quit | grep .
          # 必须至少有一条 diff.html 变化对比
          find public/evidence -maxdepth 6 -type f -name diff.html   -print -quit | grep .

          echo "[check] rss alias (/updates/rss.xml)"
          test -f public/updates/rss.xml

          echo "[check] no leftover .bak after prune"
          if find public reports evidence -type f -name '*.bak' | grep . ; then
            echo "ERROR: .bak files still present after prune"
            exit 1
          fi

          echo "[check] redirects file exists (root / -> /seo/ 301 and /feed -> /updates/rss.xml 301)"
          REDIR_FILE="public/_redirects"
          test -f "$REDIR_FILE"

          echo "[check] /feed redirect rule"
          grep -E '^[[:space:]]*/feed[[:space:]]+/updates/rss\.xml[[:space:]]+301' "$REDIR_FILE"

          echo "[check] / (root) redirect rule"
          # 要求 / → /seo/ 301
          grep -E '^[[:space:]]*/[[:space:]]+/seo/[[:space:]]+301' "$REDIR_FILE"

      # 7. 有变更才 commit+push
      - name: Commit & push (if changes)
        shell: bash
        run: |
          set -Eeuo pipefail

          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"

          git add -A reports public evidence

          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "site-doctor: sync reports/, ensure feed rss, sync _redirects, prune *.bak, normalize theme"
            git pull --rebase --autostash || true
            git push
          fi
