name: Bounce Sweep
on:
  schedule:
    - cron: '30 20 * * *'   # 05:30 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install IMAP dependency (no lockfile change)
        run: npm i imapflow@1.0.105 --no-save
      - name: Sweep bounces (non-fatal)
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          DEBUG_IMAPFLOW: 1
        run: |
          set +e
          node scripts/bounce_sweep.js
          code=$?
          if [ "$code" != "0" ]; then
            echo "::warning::Bounce sweep skipped or failed (code=$code)."
            exit 0
          fi
      - name: Commit suppressions (staged-only)
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add -A data/suppressions.csv || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "bounce: update suppressions"
            git pull --rebase --autostash || true
            git push
          fi
