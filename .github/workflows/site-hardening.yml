name: Site Hardening
on:
  workflow_dispatch:
    inputs:
      origin:
        description: "SITE_ORIGIN (e.g., https://www.cg-alert.com)"
        required: true
        default: "https://www.cg-alert.com"
      desc:
        description: "Default meta description"
        required: true
        default: "Evidence-backed vendor change alerts."
permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve site root
        id: loc
        shell: bash
        run: |
          set -eo pipefail
          if [ -d "cg-alert-main" ]; then
            echo "root=cg-alert-main" >> "$GITHUB_OUTPUT"
          else
            echo "root=." >> "$GITHUB_OUTPUT"
          fi

      - name: Inject CSP/canonical/description across HTML
        uses: actions/github-script@v7
        env:
          ROOT: ${{ steps.loc.outputs.root }}
          ORIGIN: ${{ inputs.origin }}
          DESC: ${{ inputs.desc }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const root = process.env.ROOT || '.';
            const origin = (process.env.ORIGIN || '').replace(/\/+$/,'');
            const defaultDesc = process.env.DESC || 'Evidence-backed vendor change alerts.';

            function walk(dir, acc=[]) {
              for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
                const p = path.join(dir, ent.name);
                if (ent.isDirectory()) walk(p, acc);
                else if (ent.isFile() && p.endsWith('.html')) acc.push(p);
              }
              return acc;
            }
            function canonicalFor(file) {
              const absRoot = path.resolve(root);
              const rel = path.resolve(file).slice(absRoot.length).replace(/\\/g,'/');
              let urlPath = rel;
              if (urlPath.endsWith('/index.html')) urlPath = urlPath.slice(0, -'index.html'.length);
              if (!urlPath.startsWith('/')) urlPath = '/' + urlPath;
              return origin ? (origin + urlPath) : urlPath;
            }
            function ensure(head, needle, make) {
              return head.includes(needle) ? head : (head + '\n' + make());
            }

            const files = walk(root);
            let touched = 0;
            for (const f of files) {
              let s = fs.readFileSync(f, 'utf8');
              const m = s.match(/<head[^>]*>/i);
              if (!m) continue;
              const i = s.indexOf(m[0]) + m[0].length;
              const j = s.indexOf('</head>', i);
              if (j < 0) continue;
              let head = s.slice(i, j);
              const before = head;

              if (!/Content-Security-Policy/i.test(head)) {
                head = ensure(head, 'Content-Security-Policy', () =>
                  `<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; connect-src 'self' https://buy.stripe.com https://api.cg-alert.com; frame-src https://buy.stripe.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'self' https://buy.stripe.com https://forms.gle;">`
                );
              }
              if (!/rel=['"]canonical['"]/i.test(head) && origin) {
                head = ensure(head, 'rel="canonical"', () => `<link rel="canonical" href="${canonicalFor(f)}">`);
              }
              if (!/name=['"]description['"]/i.test(head)) {
                head = ensure(head, 'name="description"', () => `<meta name="description" content="${defaultDesc}">`);
              }

              if (head !== before) {
                s = s.slice(0, i) + head + s.slice(j);
                fs.writeFileSync(f, s);
                touched++;
              }
            }
            core.info(`Hardening updated ${touched} HTML files.`);

      - name: Render static reports grid
        run: |
          node scripts/render_reports_static.js

      - name: Commit changes
        shell: bash
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "Site hardening: inject CSP/canonical/description"
            git push
          fi
