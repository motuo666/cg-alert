name: Site Patch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sitepatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (if package.json present)
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply site patch tools (if present)
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          if [ -f ops_fix_canonical_www.sh ]; then
            bash ops_fix_canonical_www.sh && changed=1 || true
          fi
          if [ -f scripts/inject_meta.mjs ]; then
            if [ -f package.json ]; then npm ci || npm i; fi
            node scripts/inject_meta.mjs && changed=1 || true
          fi
          if [ -f scripts/cta_hotpatch.js ]; then
            if [ -f package.json ]; then npm ci || npm i; fi
            node scripts/cta_hotpatch.js && changed=1 || true
          fi

      - name: Commit & push if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add -A
          if git diff --cached --quiet; then
            echo "No staged changes"
            exit 0
          fi
          git commit -m "site: hotpatch applied"
          git push
