name: Check Secrets & Vars
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Normalize Slack env
      shell: bash
      run: 'if [[ -n "${SLACK_WEBHOOK:-}" && -z "${SLACK_WEBHOOK_URL:-}" ]]; then
        echo "SLACK_WEBHOOK_URL=$SLACK_WEBHOOK" >> $GITHUB_ENV; fi

        if [[ -n "${SLACK_WEBHOOK_URL:-}" && -z "${SLACK_WEBHOOK:-}" ]]; then echo
        "SLACK_WEBHOOK=$SLACK_WEBHOOK_URL" >> $GITHUB_ENV; fi

        '
    - name: Print essential vars (masked)
      shell: bash
      run: 'set -Eeuo pipefail

        echo "SITE_ORIGIN=${SITE_ORIGIN:-}"

        echo "INTAKE_FORM_URL=${INTAKE_FORM_URL:-}"

        echo "STRIPE_LINK_PORTFOLIO=${STRIPE_LINK_PORTFOLIO:-}"

        echo "SLACK_WEBHOOK(defined?)=$([[ -n "${SLACK_WEBHOOK:-}" ]] && echo yes
        || echo no)"

        echo "SLACK_WEBHOOK_URL(defined?)=$([[ -n "${SLACK_WEBHOOK_URL:-}" ]] && echo
        yes || echo no)"

        '
    - name: Validate presence
      shell: bash
      run: "set -Eeuo pipefail\nmissing=0\nfor key in SITE_ORIGIN SLACK_WEBHOOK SLACK_WEBHOOK_URL;\
        \ do\n  val=\"${!key:-}\"\n  if [[ -z \"$val\" ]]; then echo \"::error::Missing\
        \ $key\"; missing=1; fi\ndone\nexit $missing\n"
'on':
  workflow_dispatch: null
