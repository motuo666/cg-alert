name: Outreach S1
on:
  schedule: [ { cron: "30 17 * * 1-5" } ]   # 工作日 11:30 MT（夏令时）
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: "outreach-s1-${{ github.ref }}", cancel-in-progress: true }
jobs:
  send:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844c123c6a86e0a82
      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.3
        with: { node-version: '18' }
      - name: Send batch S1
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          DRY_RUN: '0'
        run: node scripts/send_bulk.js --stage s1
