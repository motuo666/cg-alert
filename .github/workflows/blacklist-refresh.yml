name: Blacklist Refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '5 2 * * 1,4'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Merge suppression lists
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/bounce/blacklist_refresh.js ]; then
            node scripts/bounce/blacklist_refresh.js
          else
            echo "::warning::scripts/bounce/blacklist_refresh.js not found"
          fi
