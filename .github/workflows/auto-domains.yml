name: Auto Append Domains

on:
  schedule: [{ cron: "45 14 * * 1" }] # 每周一 14:45 UTC
  workflow_dispatch: {}

permissions: { contents: write }

jobs:
  append:
    runs-on: ubuntu-latest
    concurrency: { group: cg-write-domains, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install deps
        run: npm install csv-parse csv-stringify
      - name: Append 30-50 domains (from pool & discovery)
        env:
          BATCH_MIN: "30"
          BATCH_MAX: "50"
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/auto_append_domains.js
      - name: Commit (safe push)
        run: |
          chmod +x scripts/_ci_safe_push.sh
          git add data/domains.csv || true
          git diff --quiet || git commit -m "grow: +auto discovered domains (weekly)"
          bash scripts/_ci_safe_push.sh main origin 5
