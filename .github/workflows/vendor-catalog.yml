name: Vendor Catalog

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: vendor-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Git identity
        run: |
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
      - name: Update templates
        shell: bash
        run: |
          set -Eeuo pipefail
          # 这里放你真正的批量更新逻辑；暂时占位不做任何修改
          echo "No-op"
      - name: Commit changes (if any)
        shell: bash
        run: |
          set -Eeuo pipefail
          git add .github/workflows || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update workflows from vendor catalog"
            git push
          fi
