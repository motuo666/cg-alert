name: Pricing Patch (3-tier normalize)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Apply patch
        run: node scripts/patch_pricing_config.js
      - name: Commit
        run: |
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add pricing/config.json
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "pricing: normalize to 3-tier (Email-first)"; git pull --rebase --autostash || true; git push; fi
