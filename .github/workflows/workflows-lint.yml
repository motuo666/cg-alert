name: Workflows Lint
on:
  push:
    paths:
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/workflows/**"
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_on_error: true
      - name: Allow '||' in expressions (documented)
        run: |
          echo "Note: '||' is allowed in GitHub expressions for fallback; skipping legacy forbid check."
          exit 0
fi
