  </nav>

<main class="cg-wrap" style="padding-top:28px">
  <h1 style="font-weight:900;margin:0 0 10px">Intake</h1>
  
<meta name="worker-url" content=""> <!-- Fill with your Worker URL, e.g., https://lead-gateway.<zone>.workers.dev -->
<p>Tell us where to deliver your alerts. Email-only delivery.</p>
<form id="intake" class="cg-card" style="max-width:760px">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
    <label>Email<input name="email" type="email" required placeholder="you@company.com"></label>
    <label>Company<input name="company" required placeholder="ACME Inc."></label>
    <label>Company domain<input name="domain" required placeholder="acme.com"></label>
    <label>Plan<select name="plan" required>
      <option value="renewal_desk">$2,988 — Renewal Desk</option>
      <option value="renewal_leverage">$6,000 — Renewal Leverage (3 vendors)</option>
      <option value="compliance">$12,000 — Compliance & Vendor Risk (6 vendors)</option>
    </select></label>
    <label style="grid-column:1/-1">Named vendors (comma‑separated for 6k/12k)<input name="vendors" placeholder="Vendor A, Vendor B, Vendor C"></label>
    <label style="grid-column:1/-1">Notes<textarea name="notes" rows="4" placeholder="Anything we should know?"></textarea></label>
  </div>
  <div style="display:flex;gap:12px;align-items:center;margin-top:12px">
    <button class="cg-btn" type="submit">Submit</button>
    <span id="intake_status" class="cg-sub"></span>
  </div>
  <p class="cg-caption" style="margin-top:8px">We monitor public pages only. Email delivery. No calls.</p>
</form>
<script src="/assets/app-intake.js"></script>
