name: Public Change Poller

on:
  workflow_dispatch:
    inputs:
      refetch:
        description: 'Force refetch endpoints (optional)'
        required: false
        default: 'false'
      month:
        description: 'Rebuild packs for which month (YYYY-MM, optional)'
        required: false
        default: ''
  schedule:
    # 每日 03:40 UTC 跑一遍（可按需调整）
    - cron: '40 3 * * *'

concurrency:
  group: public-change-poller
  cancel-in-progress: true

permissions:
  contents: write

env:
  NODE_OPTIONS: --max_old_space_size=4096
  SITE_ORIGIN: https://www.cg-alert.com
  # 若在仓库 Variables 配置下两项，Pack 页按钮会自动显示；未配置则自动隐藏
  INTAKE_FORM_URL: ${{ vars.INTAKE_FORM_URL }}
  STRIPE_LINK_PORTFOLIO: ${{ vars.STRIPE_LINK_PORTFOLIO }}

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 🧰 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: 📦 Install deps (tolerant)
        run: |
          npm ci || npm i --no-audit --no-fund || true

      - name: 🗂️ Endpoint inventory (optional)
        if: ${{ github.event.inputs.refetch == 'true' }}
        run: |
          if [ -f scripts/endpoint_inventory.js ]; then
            node scripts/endpoint_inventory.js || true
          fi

      - name: 🌐 Public Change Poller
        run: |
          if [ -f scripts/poll_public_endpoints.js ]; then
            node scripts/poll_public_endpoints.js
          else
            echo "poll_public_endpoints.js not found"; exit 1
          fi

      # === 自动回填 evidence 指纹（hash/fingerprint） ===
      - name: 🔎 Backfill evidence fingerprint (hash)
        run: |
          if [ -f scripts/normalize_evidence.js ]; then
            node scripts/normalize_evidence.js
          else
            echo "normalize_evidence.js not found"; exit 1
          fi

      # === 可核证链：为 evidence 写入 commit / run_url / 统一 sha256 字段 ===
      - name: 🧾 Enrich evidence provenance (commit/run_url)
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          if [ -f scripts/evidence_enrich_provenance.js ]; then
            node scripts/evidence_enrich_provenance.js
          else
            echo "evidence_enrich_provenance.js not found (skip)"; true
          fi

      # === 变化片段摘要：为新证据提取最小 diff 片段 ===
      - name: ✂️ Extract diff excerpts
        run: |
          if [ -f scripts/extract_diff_excerpt.js ]; then
            node scripts/extract_diff_excerpt.js
          else
            echo "extract_diff_excerpt.js not found (skip)"; true
          fi

      # 先重建索引（含 commit/run_url），再计算材料性，再生成 Packs / Updates / Categories，并注入 SEO
      - name: 🧱 Rebuild evidence index
        run: |
          if [ -f scripts/build_evidence_index.js ]; then
            node scripts/build_evidence_index.js
          else
            echo "build_evidence_index.js not found"; exit 1
          fi

      # === 材料性评分（90 天 + 类型权重） ===
      - name: 🎯 Compute materiality score
        run: |
          if [ -f scripts/materiality_score.js ]; then
            node scripts/materiality_score.js
          else
            echo "materiality_score.js not found (skip)"; true
          fi

      - name: 🗃️ Build change packs
        env:
          SITE_ORIGIN: https://www.cg-alert.com
          INTAKE_FORM_URL: ${{ vars.INTAKE_FORM_URL }}
          STRIPE_LINK_PORTFOLIO: ${{ vars.STRIPE_LINK_PORTFOLIO }}
          REBUILD_MONTH: ${{ github.event.inputs.month }}
        run: |
          if [ -f scripts/build_change_pack.js ]; then
            node scripts/build_change_pack.js
          else
            echo "build_change_pack.js not found"; exit 1
          fi

      - name: 🔁 Build Subprocessor reverse index (/who-uses)
        run: |
          if [ -f scripts/build_who_uses.js ]; then
            node scripts/build_who_uses.js || true
          fi

      - name: 📰 Build /updates & /categories (tolerant)
        run: |
          if [ -f scripts/build_updates.js ]; then node scripts/build_updates.js || true; fi
          if [ -f scripts/build_categories.js ]; then node scripts/build_categories.js || true; fi
          if [ -f scripts/vendor_catalog.js ]; then node scripts/vendor_catalog.js || true; fi

      - name: 🔎 Inject SEO (idempotent)
        run: |
          if [ -f scripts/seo_inject.js ]; then node scripts/seo_inject.js || true; fi

      - name: 📝 Step Summary
        run: |
          YM="${{ github.event.inputs.month }}"
          if [ -z "$YM" ]; then YM=$(date -u +%Y-%m); fi
          TODAY=$(date -u +%F)
          CHANGED=$(find evidence -type f -name "${TODAY}-*.json" 2>/dev/null | wc -l)
          BASELINES=$(find evidence -type f -name "${TODAY}-*00000000.json" 2>/dev/null | wc -l)
          INDEX_ROWS=$(test -f data/evidence.ndx && wc -l < data/evidence.ndx || echo 0)
          PACKS=$(find "reports/$YM" -type f -name index.html 2>/dev/null | wc -l)
          HASH_OK=$(awk -F'\t' '($4!="") && $4!~/^0+$/ {ok++} END{print ok+0}' data/evidence.ndx 2>/dev/null || echo 0)
          {
            echo "### Public Change Poller"
            echo "- New evidence today: $CHANGED"
            echo "- Baselines today: $BASELINES"
            echo "- Index rows: $INDEX_ROWS"
            echo "- Hash (non-zero) rows: $HASH_OK"
            echo "- Change Packs this month ($YM): $PACKS"
          } >> "$GITHUB_STEP_SUMMARY"

      # === 关键发布：确保新文件被纳入提交 ===
      - name: 🚀 Publish public artifacts (stage changes)
        run: |
          git add -A reports updates data/evidence.ndx data/materiality.csv evidence public/who-uses || true

      - name: 🔐 Safe push
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            chmod +x scripts/git_safe_push.sh || true
            bash scripts/git_safe_push.sh "poll: public changes + provenance/excerpts + index/materiality + packs/updates/seo"
          else
            echo "no changes to commit"
          fi
