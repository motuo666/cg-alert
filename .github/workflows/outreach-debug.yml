name: Outreach Debug
on: { workflow_dispatch: {} }

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '18' }
      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm i nodemailer --no-audit --no-fund; fi
      - name: Leads sanity
        run: node scripts/leads_sanity.js
      - name: SMTP probe (verify; optional send)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_ADDR: outreach@mail2.cg-alert.com
          # 可填你自己的邮箱做实发验证；不填则仅 verify
          PROBE_TO: ${{ vars.PROBE_TO || '' }}
        run: node scripts/smtp_probe.js
