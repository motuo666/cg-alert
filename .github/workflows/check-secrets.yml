name: check-secrets
on:
  push: null
  pull_request: null
  workflow_dispatch: null
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Ensure required secrets exist
      run: "req=(SMTP_HOST SMTP_USER SMTP_PASS IMAP_HOST IMAP_USER IMAP_PASS SLACK_WEBHOOK_URL)\n\
        missing=()\nfor k in \"${req[@]}\"; do\n  if [ -z \"${!k}\" ]; then missing+=(\"\
        $k\"); fi\ndone\nif [ ${#missing[@]} -gt 0 ]; then\n  echo \"Missing secrets:\
        \ ${missing[*]}\"\n  exit 1\nfi\n"
      env:
        SMTP_HOST: ${{ secrets.SMTP_HOST }}
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASS: ${{ secrets.SMTP_PASS }}
        IMAP_HOST: ${{ secrets.IMAP_HOST }}
        IMAP_USER: ${{ secrets.IMAP_USER }}
        IMAP_PASS: ${{ secrets.IMAP_PASS }}
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
permissions:
  contents: write
concurrency:
  group: cg-full-pipeline
  cancel-in-progress: false
