name: Stabilize
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (if package.json present)
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run stabilize suite (if present)
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          if [ -f scripts/stabilize.sh ]; then
            bash scripts/stabilize.sh && changed=1 || true
          fi
          if [ -f scripts/stabilize.mjs ]; then
            if [ -f package.json ]; then npm ci || npm i; fi
            node scripts/stabilize.mjs && changed=1 || true
          fi
          if [ -f scripts/stabilize.js ]; then
            if [ -f package.json ]; then npm ci || npm i; fi
            node scripts/stabilize.js && changed=1 || true
          fi

      - name: Commit & push if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add -A
          if git diff --cached --quiet; then
            echo "No staged changes"
            exit 0
          fi
          git commit -m "stabilize: periodic fixes"
          git push
