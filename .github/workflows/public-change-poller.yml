name: Public Change Poller
on:
  schedule:
    - cron: '30 18 * * *'   # 03:30 JST (UTC+9)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-change-poller
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm i fast-xml-parser@4.4.0 --no-save
      - name: Run poller
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
        run: node scripts/poller.js
      - name: Commit evidence (idempotent)
        shell: bash
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add -A
          if git status --porcelain | grep -q .; then
            git commit -m "poller: evidence updates"
            git pull --rebase --autostash || true
            git push
          else
            echo "no changes"
          fi
