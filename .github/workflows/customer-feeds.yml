name: Customer Feeds
on:
  schedule: [ { cron: '22 15 * * 1' } ]  # 每周一 09:22 MT
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '18' }
      - name: Build
        env: { SITE_ORIGIN: 'https://www.cg-alert.com' }
        run: node scripts/build_customer_feeds.js
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/customers/*.json customers/*_feed.xml || true
          git commit -m "feat(customer-feeds): weekly build" || echo "nothing to commit"
          git push
