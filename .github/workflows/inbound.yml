name: Inbound (poll inbox)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inbound-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Normalize Slack env
        shell: bash
        run: |
          if [[ -n "${SLACK_WEBHOOK:-}" && -z "${SLACK_WEBHOOK_URL:-}" ]]; then echo "SLACK_WEBHOOK_URL=$SLACK_WEBHOOK" >> $GITHUB_ENV; fi
          if [[ -n "${SLACK_WEBHOOK_URL:-}" && -z "${SLACK_WEBHOOK:-}" ]]; then echo "SLACK_WEBHOOK=$SLACK_WEBHOOK_URL" >> $GITHUB_ENV; fi
      - name: Poll inbox / change poller (script if present)
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -x scripts/run_public_change_poller.sh ]]; then
            bash scripts/run_public_change_poller.sh
          elif [[ -f scripts/poll_public_endpoints.js ]]; then
            node scripts/poll_public_endpoints.js
          else
            echo "No poller script found; skipping." >&2
          fi
