name: Promote Intakes

on:
  schedule:
    - cron: "*/15 * * * *"   # 保留原来的每15分钟
  workflow_dispatch: {}       # 恢复按钮

permissions: { contents: write, pull-requests: write }

concurrency:
  group: promote-intakes
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci || npm i --no-audit --no-fund || true
      - name: Run promote script
        run: |
          if [ -f scripts/promote-intakes.js ]; then
            node scripts/promote-intakes.js
          elif [ -f scripts/promote_intakes.js ]; then
            node scripts/promote_intakes.js
          else
            echo "promote-intakes script not found"; exit 1
          fi
      - name: Commit & Safe Push
        run: |
          git config --local user.name  "CG Bot"
          git config --local user.email "bot@cg-alert.com"
          git add -A
          git diff --cached --quiet || git commit -m "promote: intakes -> customers"
          git pull --rebase --autostash origin main || (git rebase --abort || true)
          git push origin HEAD:main
