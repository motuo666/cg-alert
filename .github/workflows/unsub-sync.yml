name: Unsubscribe / Suppression Sync
on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unsubsync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (if package.json present)
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply suppression lists (if present)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/suppression_apply.js ]; then
            if [ -f package.json ]; then npm ci || npm i; fi
            node scripts/suppression_apply.js
          elif [ -f scripts/suppression_apply.mjs ]; then
            if [ -f package.json ]; then npm ci || npm i; fi
            node scripts/suppression_apply.mjs
          else
            echo "No suppression apply script; skipping."
          fi
