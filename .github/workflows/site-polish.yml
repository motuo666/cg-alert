name: Site Polish
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit site files if changed
        run: |
          set -e
          git add -N index.html about/index.html who-uses/index.html intake/index.html reports/index.html terms/index.html privacy/index.html dashboard/index.html deal-desk/index.html 404.html 2>/dev/null || true
          git add -A assets _headers _redirects robots.txt sitemap.xml security.txt site.webmanifest icon.svg reports/rss.xml partials scripts .github || true
          if git diff --cached --quiet; then
            echo "no site changes"
          else
            git config user.email "bot@cg-alert.com"
            git config user.name  "cg-alert-bot"
            git commit -m "site: enterprise ultra (nav additions, FAQ/Deal Desk/Dashboard, QA, headers)"
            git pull --rebase --autostash || true
            git push
          fi
