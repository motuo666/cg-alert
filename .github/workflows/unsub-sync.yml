name: Unsub/Bounce/Complaint Sync

on:
  schedule:
    - cron: '55 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (if package.json present)
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps (if package.json present)
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          set -euo pipefail
          npm ci || npm i
- name: Apply suppression
  run: |
   set -euo pipefail

   if [ -f "scripts/suppression_apply.js" ]; then
     echo "→ Running: scripts/suppression_apply.js"
     case ".js" in
       .mjs|.js)
         node "scripts/suppression_apply.js"
         ;;
       .sh)
         bash "scripts/suppression_apply.js"
         ;;
       *)
         echo "Unknown extension for scripts/suppression_apply.js, trying bash"
         bash "scripts/suppression_apply.js"
         ;;
     esac
     exit 0
   fi

   if [ -f "scripts/suppression_apply.mjs" ]; then
     echo "→ Running: scripts/suppression_apply.mjs"
     case ".mjs" in
       .mjs|.js)
         node "scripts/suppression_apply.mjs"
         ;;
       .sh)
         bash "scripts/suppression_apply.mjs"
         ;;
       *)
         echo "Unknown extension for scripts/suppression_apply.mjs, trying bash"
         bash "scripts/suppression_apply.mjs"
         ;;
     esac
     exit 0
   fi
   echo "skip: none of expected scripts found"; exit 0
