name: Build Diff Visuals
true:
  workflow_dispatch:
    inputs:
      evidence_root:
        description: Evidence root relative to repo
        required: false
        default: public/evidence
        type: string
      max_lines:
        description: 'Guardrail: max lines per side (fallback to coarse)'
        required: false
        default: '5000'
        type: string
      max_ms:
        description: 'Guardrail: max ms per pair (fallback to coarse)'
        required: false
        default: '5000'
        type: string
  push:
    paths:
    - public/evidence/**
    - scripts/build_diff_visuals.js
    - scripts/diff_engine.js
    - .github/workflows/build-diffs.yml
permissions:
  contents: write
concurrency:
  group: build-diffs-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-diffs:
    runs-on: ubuntu-latest
    env:
      EVIDENCE_ROOT: ${{ inputs.evidence_root || 'public/evidence' }}
      DIFF_MAX_LINES: ${{ inputs.max_lines || '5000' }}
      DIFF_MAX_MS: ${{ inputs.max_ms || '5000' }}
      DIFF_MAX_BYTES: '1500000'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Generate diff.html (SAFE)
      shell: bash
      run: "set -e\nif [[ ! -d \"$EVIDENCE_ROOT\" ]]; then\n  echo \"No evidence dir\
        \ ($EVIDENCE_ROOT); nothing to do.\" | tee -a \"$GITHUB_STEP_SUMMARY\"\n \
        \ exit 0\nfi\nnode -e \"require('./scripts/build_diff_visuals.js')\"\n"
    - name: Commit diffs (if any)
      shell: bash
      run: "set -e\ngit config user.email \"bot@cg-alert.com\"\ngit config user.name\
        \  \"cg-alert-bot\"\ngit add -A public/evidence\nif git diff --cached --quiet;\
        \ then\n  echo \"no diffs to commit\" | tee -a \"$GITHUB_STEP_SUMMARY\"\n\
        else\n  git commit -m \"evidence: add diff visualizations (safe)\"\n  git\
        \ pull --rebase --autostash || true\n  git push\n  echo \"Committed and pushed\
        \ diff visualizations.\" | tee -a \"$GITHUB_STEP_SUMMARY\"\nfi\n"
'on':
  workflow_dispatch: null
