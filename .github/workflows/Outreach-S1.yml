name: Outreach S1 (Send)

on:
  schedule:
    - cron: '30 17 * * 1-5' # 11:30 MT (UTC-6/7季节变化，你在 MT)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "outreach-s1-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  send:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4   # ✅ 别用 tarball/SHA

      - name: Setup Node
        uses: actions/setup-node@v4 # ✅ 官方 tag
        with:
          node-version: '18'

      - name: Sanity: list repo
        run: |
          pwd && node -v
          ls -al
          ls -al scripts || true

      - name: Send S1
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DRY_RUN: '0'            # 排障时可设 '1'
        run: node scripts/send_bulk.js
