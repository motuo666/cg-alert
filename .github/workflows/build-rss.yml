name: build-rss

on:
  workflow_dispatch:
  schedule:
    - cron: "12 * * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build rss.xml (sanitized origin)
        env:
          SITE_ORIGIN: "https://www.cg-alert.com"
        run: |
          node scripts/build_rss.js
          echo "Built rss.xml:"
          grep -n "<link>" public/rss.xml | head -1 || true
          head -n 20 public/rss.xml || true
      - name: Commit & push if changed
        shell: bash
        run: |
          set -e
          git add -A public vendors reports updates _redirects _headers || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "rss: rebuild with correct origin (2025-10-24T17:42:30Z)"
            git push
          fi
