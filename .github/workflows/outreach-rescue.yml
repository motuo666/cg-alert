name: Outreach Rescue
on:
  workflow_dispatch:
    inputs:
      probe_to:
        description: "测试收件地址（可选）"
        required: false
      dry_run:
        description: "仅验证，不实际发信（0=真发, 1=干跑）"
        default: "1"
        required: true

permissions:
  contents: read

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '18' }

      # 防呆：禁止 scripts/ 下误设 ESM
      - name: Guard: no ESM under scripts
        run: |
          if [ -f scripts/package.json ] && grep -q '"type": *"module"' scripts/package.json; then
            echo 'ERROR: scripts/package.json contains "type":"module". Remove it or set "commonjs".'
            exit 1
          fi

      - name: Install deps (nodemailer,csv-parse)
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i nodemailer@6 csv-parse@5 --no-audit --no-fund

      - name: Leads sanity
        run: node scripts/leads_sanity.js

      - name: Check secrets presence
        run: |
          test -n "${{ secrets.SMTP_HOST }}" || (echo "SMTP_HOST missing" && exit 1)
          test -n "${{ secrets.SMTP_USER }}" || (echo "SMTP_USER missing" && exit 1)
          test -n "${{ secrets.SMTP_PASS }}" || (echo "SMTP_PASS missing" && exit 1)
          # SMTP_PORT 可缺省（脚本会自动在 465/587 兜底）

      - name: Network probe (DNS + TCP 465/587)
        env: { SMTP_HOST: ${{ secrets.SMTP_HOST }} }
        run: |
          set -x
          getent hosts "$SMTP_HOST" || true
          getent ahostsv4 "$SMTP_HOST" || true
          getent ahostsv6 "$SMTP_HOST" || true
          for p in 465 587; do
            echo "== test tcp ${SMTP_HOST}:$p =="
            (echo | timeout 8 openssl s_client -connect ${SMTP_HOST}:$p -servername ${SMTP_HOST} -brief) || true
            nc -vz -w 6 ${SMTP_HOST} $p || true
            bash -lc "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/${SMTP_HOST}/$p'" && echo "bash tcp ok" || echo "bash tcp fail"
          done

      - name: SMTP probe (auto IPv4 + 465/587 fallback)
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_ADDR: ${{ vars.MAIL_FROM || secrets.SMTP_USER }}
          PROBE_TO:  ${{ github.event.inputs.probe_to }}
        run: node scripts/smtp_probe.js

      - name: Dry-run S1 (no SMTP, no templates needed)
        env:
          DRY_RUN:  ${{ github.event.inputs.dry_run }}
        run: node scripts/send_bulk.js
