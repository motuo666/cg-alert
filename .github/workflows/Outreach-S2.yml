name: Outreach S2 (Follow-up)

on:
  schedule:
    - cron: '00 18 * * 1-5'   # 12:00 MT
  workflow_dispatch:

permissions: { contents: read }

concurrency:
  group: "outreach-s2"
  cancel-in-progress: false

jobs:
  send:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '18' }

      - name: Sanity
        run: |
          echo "default_branch=${{ github.event.repository.default_branch }}"
          node -v
          ls -al
          ls -al scripts || true

      - name: Install deps
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install nodemailer csv-parse@5 csv-stringify@6 --no-fund --no-audit

      - name: Send S2
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          FROM_NAME: ${{ secrets.FROM_NAME }}
          REPLY_TO: ${{ secrets.REPLY_TO }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          DRY_RUN: '0'
        run: node scripts/send_followup.js
