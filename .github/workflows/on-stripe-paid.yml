name: On Stripe Paid → Reconcile
on:
  repository_dispatch:
    types: [stripe_paid]
  workflow_dispatch:
    inputs:
      email:
        description: "Buyer email"
        required: true
        type: string
        default: "buyer@testco.com"
      plan:
        description: "Plan (portfolio|business|enterprise)"
        required: true
        type: choice
        options: ["portfolio","business","enterprise"]
        default: "portfolio"
      vendors:
        description: "Comma-separated domains (e.g. okta.com, slack.com)"
        required: false
        type: string
        default: "okta.com, slack.com"
      rhythm:
        description: "Delivery rhythm"
        required: true
        type: choice
        options: ["daily","weekly"]
        default: "weekly"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse event/inputs
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          payload="$(cat "$GITHUB_EVENT_PATH" 2>/dev/null || echo '{}')"
          email="$(jq -r '.client_payload.email // .inputs.email // ""' <<<"$payload")"
          plan="$(jq -r '.client_payload.plan // .inputs.plan // ""' <<<"$payload")"
          vendors="$(jq -r '.client_payload.vendors // .inputs.vendors // ""' <<<"$payload")"
          rhythm="$(jq -r '.client_payload.rhythm // .inputs.rhythm // "weekly"' <<<"$payload")"

          # Basic validation
          if [ -z "$email" ]; then
            echo "::error::email is required"; exit 1
          fi
          case "$plan" in
            portfolio|business|enterprise) ;;
            *) echo "::error::invalid plan: $plan (expect portfolio|business|enterprise)"; exit 1 ;;
          esac
          case "$rhythm" in
            daily|weekly) ;;
            *) echo "::error::invalid rhythm: $rhythm (expect daily|weekly)"; exit 1 ;;
          esac

          printf 'email=%s
plan=%s
vendors=%s
rhythm=%s
' "$email" "$plan" "$vendors" "$rhythm" >> "$GITHUB_OUTPUT"

      - name: Upsert customers.csv
        shell: bash
        run: |
          set -euo pipefail
          file="customers.csv"
          test -f "$file" || echo 'email,company,plan,rhythm,vendors,created_at' > "$file"
          ts="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          email="${{ steps.parse.outputs.email }}"
          plan="${{ steps.parse.outputs.plan }}"
          vendors="${{ steps.parse.outputs.vendors }}"
          rhythm="${{ steps.parse.outputs.rhythm }}"

          tmp="$(mktemp)"
          awk -F, -v em="$email" 'BEGIN{IGNORECASE=1} NR==1{print; next} {gsub(/^\"|\"$/,"",$1); if($1!=em) print $0}' "$file" > "$tmp" || true
          mv "$tmp" "$file"

          printf '"%s","","%s","%s","%s","%s"\n' "$email" "$plan" "$rhythm" "$vendors" "$ts" >> "$file"

      - name: Commit reconciliation
        shell: bash
        run: |
          set -euo pipefail
          if [ -x scripts/ci/commit_or_skip.sh ]; then
            chmod +x scripts/ci/commit_or_skip.sh
            scripts/ci/commit_or_skip.sh "stripe: reconcile customers (${% raw %}{{% endraw %} steps.parse.outputs.email }})"
          else
            git config user.email "bot@cg-alert.com"
            git config user.name  "cg-alert-bot"
            git add -A customers.csv
            if git diff --cached --quiet; then
              echo "no changes to commit"
            else
              git commit -m "stripe: reconcile customers (${{ steps.parse.outputs.email }})"
              git pull --rebase --autostash || true
              git push || true
            fi
          fi

      - name: Slack notify
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL || vars.SLACK_WEBHOOK_URL }}
        shell: bash
        run: |
          test -z "$SLACK_WEBHOOK_URL" && exit 0
          jq -n             --arg t "✅ Stripe reconcile: ${{ steps.parse.outputs.plan }} → ${{ steps.parse.outputs.email }}"             --arg v "${{ steps.parse.outputs.vendors }}"             --arg r "${{ steps.parse.outputs.rhythm }}"             --arg u "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"             '{text: "\($t)
vendors=\($v) rhythm=\($r)
\($u)"}'           | curl -sS -X POST -H 'Content-Type: application/json' -d @- "$SLACK_WEBHOOK_URL" >/dev/null
