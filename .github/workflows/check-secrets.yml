name: Check Secrets / Vars

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
      INTAKE_FORM_URL: ${{ vars.INTAKE_FORM_URL }}
      STRIPE_LINK_PORTFOLIO: ${{ vars.STRIPE_LINK_PORTFOLIO }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
      MAIL_POSTAL_ADDRESS: ${{ vars.MAIL_POSTAL_ADDRESS }}
      SLACK_WEBHOOK_URL: ${{ vars.SLACK_WEBHOOK_URL }}
      IMAP_HOST: ${{ secrets.IMAP_HOST }}
      IMAP_PORT: ${{ secrets.IMAP_PORT }}
      IMAP_USER: ${{ secrets.IMAP_USER }}
      IMAP_PASS: ${{ secrets.IMAP_PASS }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      UNSUB_HMAC_SECRET: ${{ vars.UNSUB_HMAC_SECRET }}
      ENRICH_API_URL: ${{ vars.ENRICH_API_URL }}
      ENRICH_API_TOKEN: ${{ secrets.ENRICH_API_TOKEN }}
      COMPANY_LEGAL_NAME: ${{ vars.COMPANY_LEGAL_NAME }}
      TARGET_DISCOVERY_API_URL: ${{ vars.TARGET_DISCOVERY_API_URL }}
      TARGET_DISCOVERY_API_TOKEN: ${{ secrets.TARGET_DISCOVERY_API_TOKEN }}
    steps:
      - name: Check required envs
        run: |
          set -e
          missing=0
          for v in SITE_ORIGIN INTAKE_FORM_URL STRIPE_LINK_PORTFOLIO SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS MAIL_FROM MAIL_POSTAL_ADDRESS SLACK_WEBHOOK_URL IMAP_HOST IMAP_PORT IMAP_USER IMAP_PASS CF_API_TOKEN CF_ACCOUNT_ID KV_NAMESPACE_ID STRIPE_WEBHOOK_SECRET UNSUB_HMAC_SECRET ENRICH_API_URL ENRICH_API_TOKEN COMPANY_LEGAL_NAME TARGET_DISCOVERY_API_URL TARGET_DISCOVERY_API_TOKEN; do
            val=$(eval echo "\$$v")
            if [ -z "$val" ] ||                [ "$val" = "REPLACE_ME" ] ||                [[ "$val" == *"REPLACE_WITH_STRIPE_PORTFOLIO"* ]] ||                [[ "$val" == *"REPLACE_WITH_GOOGLE_FORM"* ]]; then
              echo "MISSING or PLACEHOLDER: $v"
              missing=1
            fi
          done
          if [ $missing -ne 0 ]; then
            echo "❌ Required secrets/vars missing."
            exit 1
          fi
          echo "✅ All required secrets/vars look present."
