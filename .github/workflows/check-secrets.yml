name: Check Secrets & Vars
on:
  workflow_dispatch: {}
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
      INTAKE_FORM_URL: ${{ vars.INTAKE_FORM_URL }}
      STRIPE_LINK_PORTFOLIO: ${{ vars.STRIPE_LINK_PORTFOLIO }}
      # optional but recommended
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      BCC_TO: ${{ secrets.BCC_TO }}
      IMAP_HOST: ${{ secrets.IMAP_HOST }}
      IMAP_USER: ${{ secrets.IMAP_USER }}
      IMAP_PASS: ${{ secrets.IMAP_PASS }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      MAIL_FROM: ${{ secrets.MAIL_FROM || vars.MAIL_FROM }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate required vars/secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          req_vars=(SITE_ORIGIN INTAKE_FORM_URL STRIPE_LINK_PORTFOLIO)
          req_smtp=(SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS MAIL_FROM)
          for k in "${req_vars[@]}"; do [[ -z "${!k:-}" ]] && missing+=("vars.$k"); done
          for k in "${req_smtp[@]}"; do [[ -z "${!k:-}" ]] && missing+=("secrets.$k"); end="${!k:-}"; done
          {
            echo "## Check Secrets & Vars"
            echo "### Vars"
            echo "- SITE_ORIGIN: ${SITE_ORIGIN:-<empty>}"
            echo "- INTAKE_FORM_URL: ${INTAKE_FORM_URL:-<empty>}"
            echo "- STRIPE_LINK_PORTFOLIO: ${STRIPE_LINK_PORTFOLIO:-<empty>}"
            echo ""
            echo "### SMTP"
            echo "- SMTP_HOST: $([[ -n "${SMTP_HOST:-}" ]] && echo set || echo missing)"
            echo "- SMTP_PORT: $([[ -n "${SMTP_PORT:-}" ]] && echo set || echo missing)"
            echo "- SMTP_USER: $([[ -n "${SMTP_USER:-}" ]] && echo set || echo missing)"
            echo "- SMTP_PASS: $([[ -n "${SMTP_PASS:-}" ]] && echo set || echo missing)"
            echo "- MAIL_FROM: $([[ -n "${MAIL_FROM:-}" ]] && echo set || echo missing)"
            echo ""
            echo "### Optional"
            echo "- BCC_TO: $([[ -n "${BCC_TO:-}" ]] && echo set || echo missing)"
            echo "- IMAP_HOST: $([[ -n "${IMAP_HOST:-}" ]] && echo set || echo missing)"
            echo "- IMAP_USER: $([[ -n "${IMAP_USER:-}" ]] && echo set || echo missing)"
            echo "- IMAP_PASS: $([[ -n "${IMAP_PASS:-}" ]] && echo set || echo missing)"
            echo "- SLACK_WEBHOOK_URL: $([[ -n "${SLACK_WEBHOOK_URL:-}" ]] && echo set || echo missing)"
          } >> "$GITHUB_STEP_SUMMARY"
          if ((${#missing[@]})); then
            echo "❌ Missing required keys: ${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "✅ All required keys present." >> "$GITHUB_STEP_SUMMARY"
          fi
