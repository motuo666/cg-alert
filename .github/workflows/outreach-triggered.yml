name: Outreach Triggered

on:
  workflow_dispatch:
    inputs:
      dry:
        description: "Dry run first?"
        required: true
        default: "true"
        type: choice
        options: ["true","false"]
      limit:
        description: "Max emails to send (real run)"
        required: true
        default: "12"
      window_h:
        description: "Primary window hours (A)"
        required: true
        default: "168"

permissions:
  contents: write

jobs:
  trig:
    runs-on: ubuntu-latest
    env:
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://www.cg-alert.com' }}
      PERSONA_RULES: config/persona_rules.json
      REGION_FILTER: config/region_filter.json
      DRY_FIRST: ${{ inputs.dry }}
      SEND_LIMIT: ${{ inputs.limit }}
      WINDOW_H: ${{ inputs.window_h }}
      FALLBACK_WINDOW_H: "720"     # Try E
      FORCE_MIN_SEND: "8"           # 兜底确保当日 >= 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci || npm i --no-audit --no-fund || true

      - name: Lead hygiene (suppression sync)
        run: |
          node scripts/normalize_suppression_logs.js || true
          node scripts/leads_guard.js || true

      - name: Triggered outreach (A→E auto-escalation)
        shell: bash
        run: |
          set -euo pipefail

          # --- helpers -------------------------------------------------------
          try_dry () {
            local win="$1"; shift || true
            # 打干跑，统计 "DRY SENT " 行数为 final，避免 JSON/字符串解析问题
            node scripts/send_triggered.js --dry=true --limit=999 --window_h="$win" "$@" \
              | tee /tmp/try.log
            awk '/^DRY SENT /{n++} END{print (n+0)}' /tmp/try.log
          }
          send_real () {
            local win="$1"; shift || true
            node scripts/send_triggered.js --dry=false --limit="${SEND_LIMIT}" --window_h="$win" "$@"
          }
          # -------------------------------------------------------------------

          echo "### Link Guard" >> "$GITHUB_STEP_SUMMARY"
          node scripts/link_guard.js 2>/dev/null || true

          echo "### Try A (${WINDOW_H}h)" >> "$GITHUB_STEP_SUMMARY"
          F=$(try_dry "${WINDOW_H}")
          echo "- final=${F}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${DRY_FIRST}" = "false" ] && [ "${F:-0}" -ge 8 ]; then
            send_real "${WINDOW_H}"
            exit 0
          fi

          echo "### Try B (336h)" >> "$GITHUB_STEP_SUMMARY"
          F=$(try_dry "336")
          echo "- final=${F}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${DRY_FIRST}" = "false" ] && [ "${F:-0}" -ge 8 ]; then
            send_real "336"
            exit 0
          fi

          echo "### Try C (336h + relaxed persona)" >> "$GITHUB_STEP_SUMMARY"
          # 放松画像：同时兼容 env/cli 两种开关
          F=$(
            RELAX_PERSONA=1 node scripts/send_triggered.js --dry=true --limit=999 --window_h=336 \
              | tee /tmp/tryC.log
            awk '/^DRY SENT /{n++} END{print (n+0)}' /tmp/tryC.log
          )
          echo "- final=${F}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${DRY_FIRST}" = "false" ] && [ "${F:-0}" -ge 8 ]; then
            RELAX_PERSONA=1 send_real "336"
            exit 0
          fi

          echo "### Relax caps + Try D (336h)" >> "$GITHUB_STEP_SUMMARY"
          F=$(try_dry "336" --domain_cap=4 --domain_window_d=7 --email_cooldown_d=7 --vendor_company_d=7)
          echo "- final=${F}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${DRY_FIRST}" = "false" ] && [ "${F:-0}" -ge 8 ]; then
            send_real "336" --domain_cap=4 --domain_window_d=7 --email_cooldown_d=7 --vendor_company_d=7
            exit 0
          fi

          echo "### 30d fallback + Try E (720h)" >> "$GITHUB_STEP_SUMMARY"
          F=$(
            RELAX_PERSONA=1 INCLUDE_DISCOVERED=1 \
            node scripts/send_triggered.js --dry=true --limit=999 --window_h=720 \
                 --domain_cap=4 --domain_window_d=7 --email_cooldown_d=7 --vendor_company_d=7 \
              | tee /tmp/tryE.log
            awk '/^DRY SENT /{n++} END{print (n+0)}' /tmp/tryE.log
          )
          echo "- final=${F}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${DRY_FIRST}" = "false" ] && [ "${F:-0}" -ge 8 ]; then
            RELAX_PERSONA=1 INCLUDE_DISCOVERED=1 \
              send_real "720" --domain_cap=4 --domain_window_d=7 --email_cooldown_d=7 --vendor_company_d=7
            exit 0
          fi

          # 兜底：确保当日 >= FORCE_MIN_SEND（仍基于真实变更 + 30d）
          if [ "${DRY_FIRST}" = "false" ] && [ "${FORCE_MIN_SEND:-0}" -gt 0 ]; then
            echo "### Force minimum send (${FORCE_MIN_SEND})" >> "$GITHUB_STEP_SUMMARY"
            RELAX_PERSONA=1 INCLUDE_DISCOVERED=1 \
            node scripts/send_triggered.js --dry=false \
                 --limit="${FORCE_MIN_SEND}" --window_h="${FALLBACK_WINDOW_H}" \
                 --domain_cap=6 --domain_window_d=14 --email_cooldown_d=5 --vendor_company_d=5 \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Boost not enough (final=${F:-0}) — widen domains.csv & run Discover Contacts." >> "$GITHUB_STEP_SUMMARY"
          fi
