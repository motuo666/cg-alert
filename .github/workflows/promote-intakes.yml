name: Promote Intakes

on:
  schedule: [{ cron: "*/15 * * * *" }]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    concurrency: { group: cg-write-promote, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Promote intakes -> customers (idempotent)
        env:
          PROMOTE_DRY: "0"
          PROMOTE_MAX: "200"
          PROMOTE_STRICT_HEADER: "0"
        run: node scripts/promote-intakes.js

      - name: Commit (safe push)
        run: |
          chmod +x scripts/_ci_safe_push.sh
          git add data/customers.csv || true
          git diff --quiet || git commit -m "promote: +customers (from intakes)"
          bash scripts/_ci_safe_push.sh main origin 5
