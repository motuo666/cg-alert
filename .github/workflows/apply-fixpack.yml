name: Apply Fix Pack
on:
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure fixpack exists
        run: |
          test -f cg-alert-fixpack-2025-10-12.zip || (echo "fixpack zip not found in repo root" && exit 1)
      - name: Apply fixpack
        run: |
          unzip -q cg-alert-fixpack-2025-10-12.zip -d /tmp/cg-fix
          bash /tmp/cg-fix/apply.sh
      - name: Commit changes
        run: |
          git config user.name "cg-alert-bot"
          git config user.email "bot@cg-alert.com"
          git add -A
          git commit -m "apply: cg-alert fixpack 2025-10-12" || echo "no changes"
          git push
