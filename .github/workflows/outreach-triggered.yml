name: Outreach Triggered
on:
  workflow_dispatch:
    inputs:
      dry:
        description: "dry run?"
        required: true
        default: "true"
      limit:
        description: "send limit"
        required: true
        default: "12"
      window_h:
        description: "window hours (A)"
        required: true
        default: "336"

env:
  SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
  PERSONA_RULES: config/persona_rules.json
  REGION_FILTER: config/region_filter.json
  SEND_LIMIT: ${{ inputs.limit }}
  WINDOW_H: ${{ inputs.window_h }}
  FALLBACK_WINDOW_H: 720
  FORCE_MIN_SEND: 8
  SMTP_HOST: ${{ secrets.SMTP_HOST }}
  SMTP_PORT: ${{ secrets.SMTP_PORT }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_PASS: ${{ secrets.SMTP_PASS }}
  MAIL_FROM: ${{ secrets.MAIL_FROM }}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci || npm i

      - name: Suppression Sync (safe)
        run: |
          node scripts/normalize_suppression_logs.js || true
          node scripts/leads_guard.js || true

      - name: Define helpers
        shell: bash
        run: |
          set -euo pipefail
          send_real () {
            local win="$1"; shift || true
            node scripts/send_triggered.js --dry=false --limit="${SEND_LIMIT}" --window_h="$win" "$@"
          }
          count_dry () {
            local cmd="$1"
            bash -lc "$cmd" > /tmp/dry.log 2>&1 || true
            awk '/^DRY SENT /{n++} END{print (n+0)}' /tmp/dry.log
          }
          echo 'TOTAL_SENT=0' >> $GITHUB_ENV

      - name: Try A/B/C/D/E (dry) or Real
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.dry }}" == "true" ]]; then
            echo "### Try A (${{ env.WINDOW_H }}h)" >> "$GITHUB_STEP_SUMMARY"
            PA=$(count_dry "node scripts/send_triggered.js --dry=true --limit=999 --window_h='${{ env.WINDOW_H }}'")
            echo "plan=${PA}" >> "$GITHUB_STEP_SUMMARY"

            echo "### Try B (336h)" >> "$GITHUB_STEP_SUMMARY"
            PB=$(count_dry "node scripts/send_triggered.js --dry=true --limit=999 --window_h=336")
            echo "plan=${PB}" >> "$GITHUB_STEP_SUMMARY"

            echo "### Try C (336h + RELAX_PERSONA=1)" >> "$GITHUB_STEP_SUMMARY"
            PC=$(count_dry "RELAX_PERSONA=1 node scripts/send_triggered.js --dry=true --limit=999 --window_h=336")
            echo "plan=${PC}" >> "$GITHUB_STEP_SUMMARY"

            echo "### Try D (336h + caps relaxed)" >> "$GITHUB_STEP_SUMMARY"
            PD=$(count_dry "node scripts/send_triggered.js --dry=true --limit=999 --window_h=336 --domain_cap=4 --domain_window_d=7 --email_cooldown_d=7 --vendor_company_d=7")
            echo "plan=${PD}" >> "$GITHUB_STEP_SUMMARY"

            echo "### Try E (720h + discovered + relaxed persona)" >> "$GITHUB_STEP_SUMMARY"
            PE=$(count_dry "RELAX_PERSONA=1 INCLUDE_DISCOVERED=1 node scripts/send_triggered.js --dry=true --limit=999 --window_h=720 --domain_cap=4 --domain_window_d=7 --email_cooldown_d=7 --vendor_company_d=7")
            echo "plan=${PE}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # ==== 真实发送 ====
          echo "### Real Send" >> "$GITHUB_STEP_SUMMARY"
          # 先看 C（你给的样例 C=10）
          RELAX_PERSONA=1 node scripts/send_triggered.js --dry=true --limit=999 --window_h=336 > /tmp/planC.log 2>&1 || true
          PLAN=$(awk '/^DRY SENT /{n++} END{print (n+0)}' /tmp/planC.log)
          echo "plan(C)=${PLAN}" >> "$GITHUB_STEP_SUMMARY"

          if [[ "${PLAN:-0}" -ge 8 ]]; then
            echo "C"
            RELAX_PERSONA=1 send_real 336 | tee /tmp/C.log
          else
            echo "E (fallback)"
            RELAX_PERSONA=1 INCLUDE_DISCOVERED=1 send_real 720 --domain_cap=4 --domain_window_d=7 --email_cooldown_d=7 --vendor_company_d=7 | tee /tmp/E.log
          fi

      - name: Append sent_log & commit (real only)
        if: ${{ inputs.dry == 'false' }}
        run: |
          set -euo pipefail
          node scripts/append_sent_from_log.js /tmp/C.log || true
          node scripts/append_sent_from_log.js /tmp/E.log || true

          SENT=$(grep -h -c '^SENT ' /tmp/C.log /tmp/E.log 2>/dev/null || true)
          echo "SENT=${SENT}" >> "$GITHUB_STEP_SUMMARY"
          echo "TOTAL_SENT=${SENT}" >> "$GITHUB_STEP_SUMMARY"

          git add -A data/sent_log.csv || true
          if [ -n "$(git status --porcelain)" ]; then
            git -c user.name="cg-bot" -c user.email="bot@cg-alert.com" commit -m "outreach: append sent_log (workflow)"
            git pull --rebase --autostash || true
            git push
          fi
