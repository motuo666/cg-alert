name: content-gen
on:
  schedule:
    - cron: '13 3 * * *'
  push:
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'reports/**'
      - 'rss/**'
      - '.github/workflows/content-gen.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate feeds & update pages
        run: |
          set -e
          python3 scripts/gen_feeds.py
      - name: Commit changes (if any)
        run: |
          set -e
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "cg-alert bot"
            git config user.email "bot@cg-alert.com"
            git add -A
            git commit -m "chore(content): auto-generate RSS/reports/sitemap [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
