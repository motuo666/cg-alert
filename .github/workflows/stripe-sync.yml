name: Stripe Sync (KV → repo)
on:
  schedule: [ { cron: '*/30 * * * *' } ]  # every 30 minutes UTC
  workflow_dispatch:
permissions: { contents: write }
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/stripe/sync_from_kv.js
      - name: Commit customers/orders
        run: |
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add -A data/customers.csv data/orders.csv data/stripe_sync_state.json
          if git diff --cached --quiet; then echo "no new orders"; else git commit -m "stripe: sync KV → repo"; git pull --rebase --autostash || true; git push; fi
