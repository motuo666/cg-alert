name: Public Change Poller

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 */3 * * *"  # 每 3 小时（UTC）

permissions:
  contents: write

concurrency:
  group: public-change-poller
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    env:
      # 站点根（用于生成外链、RSS 等）；不存在则兜底为线上域名
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://www.cg-alert.com' }}
      # Proof 页基址（供 build_change_pack 使用，指向站内快照目录）
      PROOF_BASE: ${{ vars.SITE_ORIGIN || 'https://www.cg-alert.com' }}/reports/proof
      # 保留页面正文，便于哈希/差异计算
      POLL_SAVE_BODY: "1"
      # 兼容两种命名（脚本会二次兜底）
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      NODE_OPTIONS: --max_old_space_size=3072

    steps:

- name: Normalize Slack env
  shell: bash
  run: bash scripts/run_public_change_poller.sh
