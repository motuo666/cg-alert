<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intake — CG Alert</title>
<meta name="description" content="Tell us your enterprise vendors and requirements. We'll set up monitoring and evidence-backed alerts.">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="canonical" href="https://www.cg-alert.com/intake/">
<link rel="preconnect" href="https://buy.stripe.com" crossorigin>
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0b0f1a">
<link rel="stylesheet" href="/assets/home-v3c.css">
<meta name="worker-url" content="{{WORKER_URL}}">
<script defer src="/assets/app-intake.js"></script>
</head>
<body class="cg-body">
  <header class="cg-topbar">
    <div class="cg-wrap">
      <a class="cg-logo" href="/"><img src="/assets/logo.svg" alt="CG Alert" width="124" height="28"></a>
      <nav class="cg-nav">
        <a href="/who-uses/">Who uses</a>
        <a href="/reports/">Reports</a>
        <a href="/pricing/">Pricing</a>
        <a class="cg-btn" href="/intake/">Request Enterprise →</a>
      </nav>
    </div>
  </header>
  <main class="cg-main">
    <section class="cg-hero slim">
      <div class="cg-wrap">
        <h1>Enterprise Intake</h1>
        <p class="cg-subtle">Tell us your vendors and cadence. We’ll provision Enterprise monitoring and delivery.</p>
      </div>
    </section>
    <section class="cg-wrap">

<div class="card">
  <form id="intake-form" class="cg-form" novalidate>
    <input type="hidden" name="plan" value="enterprise">
    <div class="grid-2">
      <label>Full name
        <input name="name" required placeholder="Leslie Knope">
      </label>
      <label>Work email
        <input name="email" type="email" required placeholder="leslie@pawnee.gov">
      </label>
    </div>
    <div class="grid-2">
      <label>Company
        <input name="company" required placeholder="Pawnee Parks & Rec">
      </label>
      <label>Role / Title
        <input name="title" placeholder="Procurement Lead">
      </label>
    </div>
    <label>Vendors (comma separated)
      <input name="vendors" required placeholder="okta.com, slack.com, box.com">
    </label>
    <label>Cadence
      <select name="cadence">
        <option value="weekly">Weekly</option>
        <option value="daily">Daily</option>
        <option value="monthly">Monthly</option>
      </select>
    </label>
    <label>Notes (context, timelines, specific pages)
      <textarea name="notes" rows="4" placeholder="Renewal targets, must‑watch pages, liabilities, DPA/SLA constraints…"></textarea>
    </label>
    <div class="actions">
      <button id="intake-submit" class="cg-btn primary" type="submit">Submit</button>
      <span id="intake-status" class="cg-subtle" aria-live="polite"></span>
    </div>
  </form>
</div>

    </section>
  </main>
  <footer class="cg-footer">
    <div class="cg-wrap">
      <div class="cg-col">
        <strong>CG Alert</strong>
        <p class="cg-subtle">Evidence‑backed vendor change alerts.</p>
      </div>
      <nav class="cg-col cg-footer-nav">
        <a href="/who-uses/">Who uses</a>
        <a href="/pricing/">Pricing</a>
        <a href="/terms/">Terms</a>
        <a href="/privacy/">Privacy</a>
        <a href="/rss/">RSS</a>
      </nav>
    </div>
  </footer>
</body>
</html>
