name: Promote Intakes
true:
  workflow_dispatch: {}
  schedule:
  - cron: '*/15 * * * *'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: promote-intakes
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - run: npm ci || npm i --no-audit --no-fund
    - name: Promote
      run: "if [ -f scripts/promote-intakes.js ]; then\n  node scripts/promote-intakes.js\n\
        elif [ -f scripts/promote_intakes.js ]; then\n  node scripts/promote_intakes.js\n\
        else\n  echo \"promote-intakes script not found\"; exit 1\nfi\n"
    - name: Safe Push
      run: 'chmod +x scripts/git_safe_push.sh

        bash scripts/git_safe_push.sh "promote: intakes -> customers"

        '
'on':
  workflow_dispatch: null
