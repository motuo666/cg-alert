name: Public Change Poller
on:
  schedule:
    - cron: '30 18 * * *'   # 03:30 JST (UTC+9)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-change-poller
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm i node-fetch@3.3.2 fast-xml-parser@4.4.0
      - name: Run poller
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
        run: node scripts/poller.js
      - name: Commit evidence & updates
        run: |
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add vendors updates reports out public || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "poller: evidence updates"
            git pull --rebase --autostash || true
            git push
