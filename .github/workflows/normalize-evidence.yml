name: Normalize Evidence
true:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Run normalizer
      run: node scripts/normalize_evidence.mjs
    - name: Commit & push if changed
      shell: bash
      run: "set -e\ngit config user.email \"bot@cg-alert.com\"\ngit config user.name\
        \  \"cg-alert-bot\"\n# 必须包含 evidence 和 public/evidence\ngit add -A evidence\
        \ public/evidence\nif git diff --cached --quiet; then\n  echo \"no changes\"\
        \n  exit 0\nfi\ngit commit -m \"normalize evidence: fill missing hash + snapshots\"\
        \ngit pull --rebase --autostash || true\ngit push\n"
'on':
  workflow_dispatch: null
