name: Outreach S2 (follow-up)
on:
  schedule:
    - cron: "45 3 * * 1-5"
  workflow_dispatch:
    inputs: { limit: { description: "count", required: true, default: "30" } }
jobs:
  s2:
    runs-on: ubuntu-latest
    concurrency: outreach
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm init -y && npm install nodemailer csv-parse csv-stringify
      - name: Segment S2
        run: node scripts/segment.js 2 2 "${{ github.event.inputs.limit || 30 }}"
      - name: Send S2
        env:
          CG_STAGE: "2"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: node scripts/send_bulk.js "data/targets_stage2.csv" "${{ github.event.inputs.limit || 30 }}" "0"
