name: Manual • Monthly Public Report
on:
  workflow_dispatch:
    inputs:
      month:
        description: "YYYY-MM（留空=当前月）"
        required: false
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci || npm i --no-audit --no-fund || true
      - name: Build report
        env: { REPORT_MONTH: ${{ inputs.month }} }
        run: node scripts/build_public_monthly.js
      - name: Commit & safe push
        run: |
          git config --local user.name  "CG Bot"
          git config --local user.email "bot@cg-alert.com"
          git add -A && (git diff --cached --quiet || git commit -m "report: public monthly ${{ inputs.month || 'auto' }} (manual)" )
          git pull --rebase --autostash origin main || (git rebase --abort || true)
          git push origin HEAD:main || true
