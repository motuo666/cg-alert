name: Site Polish

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '40 2 * * *'  # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Normalize evidence (enhanced)
        run: node scripts/normalize_evidence.mjs
      - name: Commit and push if changed
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          if ! git diff --quiet; then
            git add -A
            git commit -m "Polish: localize evidence assets & inject fallback css"
            git pull --rebase --autostash || true
            git push
          else
            echo "No changes to commit."
          fi
