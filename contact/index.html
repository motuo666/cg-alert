<!doctype html>
<html lang="en">
<head>

  <meta name="description" content="Contact CG Alert for enterprise inquiries, support, and partnerships.">

<body>
  <header>
    <h1>Contact CG Alert</h1>
  </header>
  <main>
    <section>
      <p>Tell us about your use case. We usually respond within one business day.</p>
      <ul>
        <li>Email: <a href="mailto:hello@cg-alert.com">hello@cg-alert.com</a></li>
        <li>Enterprise: <a href="/pricing/">See pricing</a> or request a tailored plan.</li>
      </ul>
      <form action="https://example.com/webhook" method="post">
        <label>Company<input name="company" required></label>
        <label>Work email<input name="email" type="email" required></label>
        <label>Message<textarea name="message" required></textarea></label>
        <button type="submit">Send</button>
      </form>
    </section>
  </main>
  <footer>
    <p>© 2025 CG Alert</p>
  </footer>
</body>
</html>
