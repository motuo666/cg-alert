<!DOCTYPE html>
<html lang="en"><head>
<meta name="worker-url" content="https://api.cg-alert.com">
<meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/>

<link href="/icon.svg" rel="icon" type="image/svg+xml"/>
<link href="https://www.cg-alert.com/reports/" rel="canonical">
<link href="/assets/home-v3c.css" rel="stylesheet"/>
<meta content="Evidence-backed vendor change reports. Search and browse recent alerts." name="description"/>
<style>
  .cg-searchbar{display:flex;gap:.75rem;align-items:center;margin:1.25rem 0;}
  .cg-searchbar input{flex:1; padding:.75rem 1rem; border:1px solid #e5e7eb; border-radius:12px; font-size:16px; outline:none}
  .cg-searchbar input:focus{box-shadow:0 0 0 3px rgba(59,130,246,.2); border-color:#93c5fd}
  .card-meta{color:#6b7280;font-size:.9rem;margin-bottom:.5rem}
</style>
</link><style id="reports-searchbar-patch">
.cg-searchbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:16px 0 8px 0;}
.cg-searchbar input[type='search']{flex:1;padding:10px 12px;border:1px solid #e5e7eb;border-radius:10px;font-size:16px;outline:none;}
.cg-searchbar a.cg-btn{white-space:nowrap;}
</style>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; connect-src 'self' https://buy.stripe.com https://api.cg-alert.com; frame-src https://buy.stripe.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'self'; form-action 'self' https://buy.stripe.com https://forms.gle;"></head><body>
<header class="cg-topbar">
<div class="cg-wrap cg-nav">
<a class="cg-brand" href="/"><img alt="CG Alert" height="40" src="/icon.svg" width="40"/><span>CG Alert</span></a>
<nav class="cg-links" id="topnav">
<a href="/#pricing">Pricing</a>
<a href="#how">How it works</a>
<a href="#evidence">Evidence</a>
<a href="#compare">Compare</a>
<a href="#faq">FAQ</a>
</nav>
</div>
</header>
<section class="cg-wrap">
<h1>Reports</h1>
<div class="cg-searchbar">
<input #ddd;border-radius:12px;font-size:16px;\"="" 14px;border:1px="" id='\"q\"' placeholder="Search vendor, title, URL, hash…" solid="" style='\"width:100%;max-width:680px;height:44px;padding:10px' type="search"/>
</div>
<div class="cg-grid3" id="grid"></div>
<div class="cg-note" id="empty" style="display:none;margin:1rem 0;">
    No reports yet. New evidence will appear here automatically after the daily build.
  </div>
</section>
<footer class="cg-footer">
<div class="cg-wrap cg-footlinks">
<a href="/who-uses/">Who uses</a>
<a href="/about/">About</a>
<a href="/reports/">Reports</a>
<a href="/rss/index.xml">RSS</a>
<a href="/terms/">Terms</a>
<a href="/privacy/">Privacy</a>
<span>© CG Alert — evidence-backed vendor change alerts.</span>
</div>
</footer>
<script>
(async () => {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  let items = [];
  try {
    const res = await fetch('/reports/feed.json', {cache:'no-store'});
    if (res.ok) items = await res.json();
  } catch(_) {}
  const render = (list) => {
    grid.innerHTML = '';
    if (!list.length){ empty.style.display='block'; return; }
    empty.style.display='none';
    list.forEach(it => {
      const a = document.createElement('a');
      a.className = 'cg-card hover';
      a.href = it.page || it.url || '#';
      a.innerHTML =
        `<div class="card-meta">${it.vendor || 'Vendor'} · ${it.captured || ''} · ${it.sha256 ? ('SHA256 ' + it.sha256.slice(0,8)+'…') : ''}</div>
         <h3>${it.title || 'Change detected'}</h3>
         <p>${it.snippet || ''}</p>`;
      grid.appendChild(a);
    });
  };
  render(items);
  document.getElementById('q').addEventListener('input', e=>{
    const q = e.target.value.trim().toLowerCase();
    if(!q){ render(items); return; }
    render(items.filter(it =>
      [it.vendor,it.title,it.snippet,it.url,it.sha256].join(' ').toLowerCase().includes(q)
    ));
  });
})();
</script>
</body></html>
