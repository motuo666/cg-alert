name: Final Acceptance

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# 从仓库 Variables 读取（Settings → Secrets and variables → Actions → Variables）
env:
  SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
  STRIPE_LINK_PORTFOLIO: ${{ vars.STRIPE_LINK_PORTFOLIO }}
  STRIPE_LINK_BUSINESS:  ${{ vars.STRIPE_LINK_BUSINESS }}
  INTAKE_FORM_URL:       ${{ vars.INTAKE_FORM_URL }}

jobs:
  final-acceptance:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required variables
        shell: bash
        run: |
          set -euo pipefail
          req=(SITE_ORIGIN STRIPE_LINK_PORTFOLIO STRIPE_LINK_BUSINESS INTAKE_FORM_URL)
          miss=()
          for k in "${req[@]}"; do
            v="${!k:-}"
            if [[ -z "$v" ]]; then miss+=("$k"); fi
          done
          if (( ${#miss[@]} )); then
            echo "::error::Missing repository Variables: ${miss[*]}"
            exit 1
          fi
          printf 'OK: variables present\nSITE_ORIGIN=%s\n' "${SITE_ORIGIN}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 避免自检误报：排除 .git/.github/scripts/evidence 以及 yml 自身
      - name: Scan for truncation/ellipsis markers
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn \
               --exclude-dir=.git \
               --exclude-dir=.github \
               --exclude-dir=scripts \
               --exclude-dir=evidence \
               --exclude='*.yml' \
               -F 'conversation too long; truncated' . ; then
            echo "::error::Truncation/ellipsis markers found in repo"
            exit 1
          fi
          echo "OK: no truncation markers"

      - name: Normalize & build site
        shell: bash
        env:
          SITE_ORIGIN: ${{ env.SITE_ORIGIN }}
        run: |
          set -euo pipefail
          python3 scripts/normalize_events.py --root .
          python3 scripts/auto_fix_links.py --root .
          python3 scripts/normalize_canonical.py --root . --site-origin "${SITE_ORIGIN}"
          node scripts/build_sitemap.mjs
          python3 scripts/harden_html.py .

      - name: Link check
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_links.py --root .

      - name: Compute rolling KPIs (non-fatal)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ops/compute_rolling_kpis.js ]; then
            node ops/compute_rolling_kpis.js || true
          fi

      - name: Summary
        shell: bash
        run: |
          echo "Final Acceptance passed core checks."
