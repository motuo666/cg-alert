name: Daily Bounce Sweep

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (if package.json present)
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps (if package.json present)
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          set -euo pipefail
          npm ci || npm i
- name: Run bounce sweep
  run: |
    set -euo pipefail

    if [ -f "scripts/bounce_sweep.js" ]; then
      echo "→ Running: scripts/bounce_sweep.js"
      case ".js" in
        .mjs|.js)
          node "scripts/bounce_sweep.js"
          ;;
        .sh)
          bash "scripts/bounce_sweep.js"
          ;;
        *)
          echo "Unknown extension for scripts/bounce_sweep.js, trying bash"
          bash "scripts/bounce_sweep.js"
          ;;
      esac
      exit 0
    fi

    if [ -f "scripts/bounce/bounce_sweep.js" ]; then
      echo "→ Running: scripts/bounce/bounce_sweep.js"
      case ".js" in
        .mjs|.js)
          node "scripts/bounce/bounce_sweep.js"
          ;;
        .sh)
          bash "scripts/bounce/bounce_sweep.js"
          ;;
        *)
          echo "Unknown extension for scripts/bounce/bounce_sweep.js, trying bash"
          bash "scripts/bounce/bounce_sweep.js"
          ;;
      esac
      exit 0
    fi
    echo "skip: none of expected scripts found"; exit 0
