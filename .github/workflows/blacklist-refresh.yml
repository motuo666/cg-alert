name: Blacklist Refresh
on:
  schedule:
    - cron: '20 0 * * *'
  repository_dispatch:
    types: [kv_sync_kick]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  bl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Merge free domains + manual + high-bounce
        run: node scripts/bounce/blacklist_refresh.js
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo no changes; else
            git config user.email "bot@cg-alert.com"
            git config user.name  "cg-alert-bot"
            git add config/blacklist/domains_auto.txt
            if git diff --cached --quiet; then echo "no changes"; else git commit -m "blacklist: refresh (free+manual+bounce)"
            git push
          fi
      - name: Trigger kv_sync & autopilot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          curl -s -X POST -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json"             https://api.github.com/repos/${GITHUB_REPO}/dispatches -d '{"event_type":"kv_sync_kick"}' || true
          curl -s -X POST -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json"             https://api.github.com/repos/${GITHUB_REPO}/dispatches -d '{"event_type":"autopilot_kick"}' || true
