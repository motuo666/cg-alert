name: Weekly Report

on:
  schedule:
    - cron: '5 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (if package.json present)
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps (if package.json present)
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          set -euo pipefail
          npm ci || npm i
- name: Build weekly report
  run: |
   set -euo pipefail

   if [ -f "scripts/customer_digest.js" ]; then
     echo "→ Running: scripts/customer_digest.js"
     case ".js" in
       .mjs|.js)
         node "scripts/customer_digest.js"
         ;;
       .sh)
         bash "scripts/customer_digest.js"
         ;;
       *)
         echo "Unknown extension for scripts/customer_digest.js, trying bash"
         bash "scripts/customer_digest.js"
         ;;
     esac
     exit 0
   fi

   if [ -f "scripts/weekly_report.mjs" ]; then
     echo "→ Running: scripts/weekly_report.mjs"
     case ".mjs" in
       .mjs|.js)
         node "scripts/weekly_report.mjs"
         ;;
       .sh)
         bash "scripts/weekly_report.mjs"
         ;;
       *)
         echo "Unknown extension for scripts/weekly_report.mjs, trying bash"
         bash "scripts/weekly_report.mjs"
         ;;
     esac
     exit 0
   fi

   if [ -f "scripts/weekly_report.js" ]; then
     echo "→ Running: scripts/weekly_report.js"
     case ".js" in
       .mjs|.js)
         node "scripts/weekly_report.js"
         ;;
       .sh)
         bash "scripts/weekly_report.js"
         ;;
       *)
         echo "Unknown extension for scripts/weekly_report.js, trying bash"
         bash "scripts/weekly_report.js"
         ;;
     esac
     exit 0
   fi
   echo "skip: none of expected scripts found"; exit 0
