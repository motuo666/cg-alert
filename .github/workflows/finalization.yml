name: Finalization Guard

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  finalize-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps (if any)
        run: |
          echo "No runtime deps"

      - name: Apply finalization (P0+P1+P2)
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || secrets.SITE_ORIGIN }}
          PUBLISH_DIR: ${{ vars.PUBLISH_DIR || '.' }}
        run: |
          if [ -z "${SITE_ORIGIN}" ]; then
            echo "::error ::SITE_ORIGIN is empty. Set either Repository variables or Secrets."
            exit 1
          fi
          python3 scripts/normalize_events.py --root .
          python3 scripts/auto_fix_links.py --root .
          python3 scripts/normalize_canonical.py --root . --site-origin "${SITE_ORIGIN}"
          node scripts/build_sitemap.mjs


      - name: Verify links
        run: |
          python3 scripts/check_links.py --root .

      - name: Verify data schema
        run: |
          python3 scripts/check_data_schema.py --root .
