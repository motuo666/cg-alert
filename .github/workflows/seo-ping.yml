name: seo-ping
concurrency:
  group: seo-ping-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ensure-and-ping:
    runs-on: ubuntu-latest
    env:
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://www.cg-alert.com' }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v6
      with:
        node-version: '20'
    - name: Ensure root sitemap.xml
      run: node scripts/ops/sitemap_sync.js
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - public/**
    - evidence/**
    - reports/**
    - sitemap.xml
    - public/sitemap.xml
  schedule:
  - cron: 17 3 * * *
