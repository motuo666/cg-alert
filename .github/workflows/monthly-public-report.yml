name: Monthly Public Report

on:
  schedule:
    - cron: "10 15 1 * *"  # 每月1日 15:10 UTC
  workflow_dispatch:
    inputs:
      month:
        description: "YYYY-MM (empty = current month)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: monthly-public-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci

      - name: Build monthly public artifacts
        run: |
          node scripts/build_public_monthly.js --month="${{ inputs.month }}"
          node scripts/seo_inject.js

      - name: Commit & push reports (force add even if ignored)
        run: |
          git config user.name "cg-alert-bot"
          git config user.email "bot@cg-alert.com"
          git add -f reports/ reports/rss.xml || true
          git commit -m "chore(reports): publish ${{ inputs.month || 'current' }}" || true
          git push || true

      - name: Slack notify
        if: always()
        run: |
          STATUS="${{ job.status }}"
          MSG="Monthly Public Report • status=${STATUS} • month=${{ inputs.month || 'current' }}"
          curl -sS -X POST -H 'Content-type: application/json' --data "$(jq -n --arg t "$MSG" '{text:$t}')" "$SLACK_WEBHOOK"
