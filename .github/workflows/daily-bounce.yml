name: Daily Bounce Sweep
on:
  schedule: [ { cron: '0 5 * * *' } ]  # UTC
  workflow_dispatch:
permissions: { contents: write }
jobs:
  sweep:
    runs-on: ubuntu-latest
    env:
      IMAP_HOST: ${{ secrets.IMAP_HOST }}
      IMAP_PORT: ${{ secrets.IMAP_PORT }}
      IMAP_USER: ${{ secrets.IMAP_USER }}
      IMAP_PASS: ${{ secrets.IMAP_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install deps
        run: npm i imapflow@1
      - name: Sweep
        run: node scripts/inbox/poll_inbox.js || true
      - name: Commit suppressions
        run: |
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add -A data/suppressions.csv
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "suppressions: daily sweep"; git pull --rebase --autostash || true; git push; fi
