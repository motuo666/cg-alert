name: SEO Tighten
permissions:
  contents: write
jobs:
  tighten:
    runs-on: ubuntu-latest
    env:
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://www.cg-alert.com' }}
      INTAKE_FORM_URL: ${{ vars.INTAKE_FORM_URL }}
      STRIPE_LINK_PORTFOLIO: ${{ vars.STRIPE_LINK_PORTFOLIO }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Use Node 18
      uses: actions/setup-node@v4
      with:
        node-version: 18
    - name: Run SEO & CTA inject (idempotent)
      run: 'node ./seo_inject.js | tee /tmp/seo_inject.log

        echo "-----"

        cat /tmp/seo_inject.log

        '
    - name: Generate Sitemap and RSS
      run: 'node scripts/sitemaps_full.cjs

        '
      working-directory: ./
    - name: Safe push (include vendors/updates/reports & indices)
      run: "set -e\ngit config user.email \"bot@cg-alert.com\"\ngit config user.name\
        git add -A public vendors reports updates _redirects _headers || true
        \ data/materiality.csv data/vendor_catalog.csv evidence public/who-uses public/sitemap.xml\
        \ public/rss.xml || true\nif git diff --cached --quiet; then\n  echo \"no\
        \ changes to commit\"\nelse\n  git commit -m \"SEO Tighten: inject SEO + CTA\
        \ + generate Sitemap/RSS [skip ci]\"\n  chmod +x ./git_safe_push.sh || true\n\
        \  if [ -f ./git_safe_push.sh ]; then\n    ./git_safe_push.sh\n  else\n  \
        \  # 兜底直推（仅当仓库策略允许）\n    git pull --rebase --autostash || true\n    git push\n\
        \  fi\nfi\n"
    - name: Post-deploy check (optional)
      if: ${{ always() }}
      run: "set -e\nPAGES=\"${{ vars.SITE_ORIGIN || 'https://www.cg-alert.com' }}\"\
        \nfor P in \"/vendors/zendesk.com/\" \"/updates/\"; do\n  echo \"check $PAGES$P\"\
        \n  if curl -fsSL \"$PAGES$P?v=${{ github.sha }}\" | grep -q \"CG-CTA-INJECT\"\
        ; then\n    echo \"ok: CTA visible on $PAGES$P\"\n  else\n    echo \"::warning::CTA\
        \ not visible on $PAGES$P (likely caching/deploy lag)\"\n  fi\ndone\n"
'on':
  workflow_dispatch: null
  push:
    paths:
    - vendors/**
    - updates/**
    - seo_inject.js
