name: Slack Ping
on:
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Post to Slack
        env:
          URL: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          echo '{"text":"✅ Slack webhook connected (CG Alert)"}' > body.json
          curl -s -X POST -H 'Content-type: application/json' --data @body.json "$URL"
