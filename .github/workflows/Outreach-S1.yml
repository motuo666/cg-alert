name: Outreach S1 (Send)

on:
  schedule:
    - cron: '30 17 * * 1-5' # 11:30 MT (UTC cron)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: outreach-s1
  cancel-in-progress: false

jobs:
  send:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install deps
        run: |
          npm --version
          npm init -y >/dev/null 2>&1 || true
          npm i nodemailer@6 csv-parse@5

      - name: Debug context
        run: |
          echo "ref=$GITHUB_REF"
          echo "event=$GITHUB_EVENT_NAME"
          echo "default_branch=${{ github.event.repository.default_branch }}"
          node -v
          echo "repo files:" && ls -al
          echo "scripts dir:" && ls -al scripts || true

      - name: Pick script
        id: pick
        run: |
          set -e
          for c in scripts/send_bulk.js scripts/outreach_s1.js scripts/send.js; do
            if [ -f "$c" ]; then echo "script=$c" >> $GITHUB_OUTPUT; echo "USING=$c"; exit 0; fi
          done
          echo "找不到 S1 发送脚本（期待 scripts/send_bulk.js 或 outreach_s1.js 或 send.js）" >&2
          exit 1

      - name: Leads sanity
        run: node scripts/leads_sanity.js

      - name: Send S1
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          S1_SUBJECT: ${{ vars.S1_SUBJECT }}
          DRY_RUN: '0'
        run: node "${{ steps.pick.outputs.script }}"

      - name: Commit CSV updates
        if: always()
        run: |
          git config user.name "CG Bot"
          git config user.email "bot@cg-alert.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "inbound sync"
            git push
          else
            echo "No changes to commit."
          fi
