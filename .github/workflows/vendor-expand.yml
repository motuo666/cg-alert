name: Vendor Expand

on:
  schedule:
    - cron: "30 */6 * * *"  # every 6h offset
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vendor-expand
  cancel-in-progress: true

jobs:
  expand:
    if: ${{ false }}  # disabled by overlay on 2025-11-02
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install

      - name: Expand endpoints.json from targets/customers
        run: node scripts/expand_endpoints.js

      - name: Commit & push endpoints.json
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add config/endpoints.json || true
          if git diff --cached --quiet; then
            echo "no new endpoints"
          else
            git commit -m "vendor-expand: expand endpoints.json from targets/customers"
            git pull --rebase --autostash || true
            git push
          fi