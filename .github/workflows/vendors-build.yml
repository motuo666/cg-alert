name: Vendors Build
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install deps
      run: npm ci || npm install
    - name: Build reports (cards + index.json + RSS)
      run: node scripts/reports_build.mjs
    - name: Commit & push
      run: "set -e\ngit config user.email \"bot@cg-alert.com\"\ngit config user.name\
        \  \"cg-alert-bot\"\ngit add -A reports rss\nif git diff --cached --quiet;\
        \ then\n  echo \"no changes to commit\"\nelse\n  git commit -m \"Reports build:\
        fi"
concurrency:
  group: cg-full-pipeline
  cancel-in-progress: false
