name: Stripe Webhook Intake
on:
  repository_dispatch:
    types: [stripe-webhook]
  workflow_dispatch:
    inputs:
      email:
        description: "Test only: buyer email"
        required: false
        default: ""
      customer_id:
        description: "Test only: Stripe customer id"
        required: false
        default: ""
      event_type:
        description: "Test only: Stripe event type"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse incoming payload (supports repository_dispatch & workflow_dispatch)
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          payload="$(cat "$GITHUB_EVENT_PATH" 2>/dev/null || echo '{}')"
          # Extract values from either repository_dispatch.client_payload.* or workflow_dispatch.inputs.*
          email="$(jq -r '.client_payload.email // .inputs.email // ""' <<<"$payload")"
          customer_id="$(jq -r '.client_payload.customer_id // .inputs.customer_id // ""' <<<"$payload")"
          event_type="$(jq -r '.client_payload.event_type // .inputs.event_type // .action // ""' <<<"$payload")"
          printf 'email=%s\ncustomer_id=%s\nevent_type=%s\n' "$email" "$customer_id" "$event_type" >> "$GITHUB_OUTPUT"

      - name: Append intake row
        id: write
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          file="data/intakes.csv"
          test -f "$file" || echo "timestamp,email,customer_id,event_type,source_event,run_id,run_url" > "$file"
          ts="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          src="${{ github.event_name }}"
          run_id="${{ github.run_id }}"
          run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # CSV-safe append
          printf '"%s","%s","%s","%s","%s","%s","%s"\n' \
            "$ts" "${{ steps.parse.outputs.email }}" "${{ steps.parse.outputs.customer_id }}" \
            "${{ steps.parse.outputs.event_type }}" "$src" "$run_id" "$run_url" >> "$file"

      - name: Commit intake
        shell: bash
        run: |
          chmod +x scripts/ci/commit_or_skip.sh || true
          scripts/ci/commit_or_skip.sh "intake: stripe webhook ${{ steps.parse.outputs.event_type }} (${{ steps.parse.outputs.email }})"

      - name: Slack notify
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL || vars.SLACK_WEBHOOK_URL }}
        shell: bash
        run: |
          test -z "$SLACK_WEBHOOK_URL" && exit 0
          jq -n \
            --arg t "✅ Stripe webhook: ${{ steps.parse.outputs.event_type }} (${{ steps.parse.outputs.email }})" \
            --arg u "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{text: "\($t)\n\($u)"}' \
          | curl -sS -X POST -H 'Content-Type: application/json' -d @- "$SLACK_WEBHOOK_URL" >/dev/null
