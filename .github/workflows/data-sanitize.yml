name: Data Sanitize on Push
on:
  push:
    branches: [ main ]
    paths:
      - "data/*.csv"
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install deps
        run: npm ci
      - name: Sanitize CSVs
        run: node scripts/data_sanitize.js
      - name: Commit fixes
        run: |
          git config user.name "CG Bot"
          git config user.email "bot@cg-alert.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "sanitize: domains/endpoints normalized"
            git push
          else
            echo "No sanitize changes."
          fi
