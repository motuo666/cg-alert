name: Categories Build
on:
  schedule:
    - cron: '12 15 * * 1'   # 每周一 09:12 MT（夏令时）
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: "categories-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844c123c6a86e0a82 # v4.2.2
      - uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.3
        with: { node-version: '18' }
      - name: Build category pages
        env:
          SITE_ORIGIN: 'https://www.cg-alert.com'
        run: node scripts/build_categories.js
      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add categories/** sitemap-categories.xml || true
          git commit -m "chore(categories): weekly refresh" || echo "nothing to commit"
          git push
