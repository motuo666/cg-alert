name: Leads Lint

on:
  schedule:
    - cron: '15 2 * * *'  # 每天 02:15 UTC（低峰）
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: leads-lint
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 18

      # 统一换行、移除表头、补 status/mx_ok、拆粘连行、去重、email 小写
      - name: Normalize leads.csv
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f data/leads.csv ]; then
            echo "data/leads.csv missing"; exit 1
          fi
          # 统一为 LF，避免 CRLF 边缘问题
          sed -i 's/\r$//' data/leads.csv || true

          node - <<'EOF'
          const fs=require('fs');
          const p='data/leads.csv';
          function isEmail(x){ return /^[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}$/.test(x||''); }
          function isDomain(x){ return /^[A-Za-z0-9.\-]+\.[A-Za-z]{2,}$/.test(x||''); }
          const okStatus=new Set(['new','sent','bounced','unsub']);

          let t=fs.readFileSync(p,'utf8').replace(/\r\n/g,'\n');
          let lines=t.split('\n').filter(l=>l.trim().length>0);

          // 自动移除表头
          const header='email,company,domain,vendor1,vendor2,vendor3,persona,status,mx_ok';
          if(lines[0] && lines[0].trim().toLowerCase().replace(/\s+/g,'')===header){
            lines.shift();
            console.log('removed header');
          }

          const out=[], seen=new Set();
          function push(cols){
            cols=cols.map(s=>(s||'').trim());
            while(cols.length<9) cols.push('');
            if(cols.length>9) cols=cols.slice(0,9);

            let [email,company,domain,v1,v2,v3,persona,status,mx_ok]=cols;
            if(!isEmail(email)||!company||!isDomain(domain)) return;

            email=email.toLowerCase();
            domain=domain.toLowerCase();

            // status / mx_ok 纠偏
            status=okStatus.has((status||'').toLowerCase()) ? (status||'').toLowerCase() : 'new';
            mx_ok=/^[01]$/.test(mx_ok||'') ? mx_ok : '1';

            if(seen.has(email)) return;
            seen.add(email);

            out.push([email,company,domain,v1,v2,v3,persona||'procurement',status,mx_ok].join(','));
          }

          for(const line of lines){
            const cols=line.split(',').map(s=>s.trim());
            if(cols.length===9){
              push(cols);
            }else if(cols.length%9===0){
              for(let i=0;i<cols.length;i+=9) push(cols.slice(i,i+9)); // 拆粘连
            }else if(cols.length>9){
              push(cols.slice(0,9)); // 取前 9 列兜底
            } // <9 直接丢弃
          }

          if(out.length===0){
            console.error('no valid leads after normalization');
            process.exit(1);
          }
          fs.writeFileSync(p,out.join('\n')+'\n','utf8');
          console.log(`normalized & deduped: ${out.length} rows`);
          EOF

      - name: Validate leads.csv (strict)
        run: node scripts/validate_leads.js

      - name: Commit normalized leads (if changed)
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- data/leads.csv; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/leads.csv
            git commit -m "chore(leads): normalize & validate (auto-fix status/mx_ok, dedupe)"
            git push
          else
            echo "No changes"
          fi
