name: Outreach Health
on:
  schedule:
    - cron: "30 14 * * *"   # 每天 08:30 MT ≈ 14:30 UTC
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # 如果你的 IMAP_* / SLACK_WEBHOOK 放在 Environment(比如 production)，取消注释并改名：
    # environment: production

    # 统一把 Secrets 注入到“作业级 env”，所有 step 可见
    env:
      IMAP_HOST: ${{ secrets.IMAP_HOST }}
      IMAP_PORT: ${{ secrets.IMAP_PORT }}
      IMAP_USER: ${{ secrets.IMAP_USER }}
      IMAP_PASS: ${{ secrets.IMAP_PASS }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      # 可选（不配也行）
      IMAP_SENT_BOX: ${{ secrets.IMAP_SENT_BOX }}
      IMAP_BOUNCE_FROM: ${{ secrets.IMAP_BOUNCE_FROM }}
      DEBUG: '1'   # 首次排错保留，跑通后可以删

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 0) 必要变量自检，缺哪个直接在日志里报错并终止
      - name: Preflight - check required secrets present
        run: |
          set -e
          missing=0
          for n in IMAP_HOST IMAP_PORT IMAP_USER IMAP_PASS SLACK_WEBHOOK; do
            if [ -z "${!n}" ]; then
              echo "::error title=Missing secret::$n is empty/unset"
              missing=1
            else
              echo "$n=OK"
            fi
          done
          if [ "$missing" = "1" ]; then exit 1; fi

      # 1) Slack 预检 Ping（这一步成功 == Webhook 没问题）
      - name: Slack preflight ping
        run: |
          set -e
          curl -fsS -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\"[Outreach Health] preflight ping $(date -u +%F' '%T) UTC\"}" \
            "$SLACK_WEBHOOK"

      # 2) 安装依赖并运行脚本
      - name: Install deps
        run: npm init -y && npm install imapflow

      - name: Run outreach health
        run: node scripts/outreach_health.js

      # 3) 无论成功/失败都发收尾消息，便于你在 Slack 看到状态
      - name: Slack completion (always)
        if: always()
        run: |
          curl -fsS -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\"[Outreach Health] job status: ${{ job.status }} at $(date -u +%F' '%T) UTC\"}" \
            "$SLACK_WEBHOOK"
