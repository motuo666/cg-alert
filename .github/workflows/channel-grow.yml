name: Channel Grow (weekly)
permissions:
  contents: write
concurrency:
  group: cg-channel
  cancel-in-progress: false
jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
    - name: Install deps
      shell: bash
      run: 'set -e

        npm ci || npm i --no-audit --no-fund

        '
    - name: Resolve limit & summarize
      id: resolve
      shell: bash
      run: "set -euo pipefail\n# 事件判断：手动触发沿用 inputs.limit；定时触发回退到 40\nEVENT=\"${{\
        \ github.event_name }}\"\nRAW_LIMIT=\"${{ inputs.limit }}\"\nif [[ \"${EVENT}\"\
        \ != \"workflow_dispatch\" || -z \"${RAW_LIMIT}\" ]]; then\n  NEW_LIMIT=\"\
        40\"\nelse\n  # 仅接受纯数字，否则回退 40\n  if [[ \"${RAW_LIMIT}\" =~ ^[0-9]+$ ]]; then\n\
        \    NEW_LIMIT=\"${RAW_LIMIT}\"\n  else\n    echo \"::warning::inputs.limit\
        \ 非数字，回退 40\"\n    NEW_LIMIT=\"40\"\n  fi\nfi\n\necho \"NEW_CHANNELS_LIMIT=${NEW_LIMIT}\"\
        \ >> \"$GITHUB_ENV\"\necho \"limit=${NEW_LIMIT}\" >> \"$GITHUB_OUTPUT\"\n\n\
        {\n  echo \"## Channel Grow (weekly)\"\n  echo \"- event: ${EVENT}\"\n  echo\
        \ \"- NEW_CHANNELS_LIMIT: ${NEW_LIMIT}\"\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
    - name: Discover channel candidates
      env:
        NEW_CHANNELS_LIMIT: ${{ env.NEW_CHANNELS_LIMIT }}
      run: 'node scripts/auto_discover_channels.js

        '
    - name: Safe commit & push
      shell: bash
      run: "set -euo pipefail\ngit config user.email \"bot@cg-alert.com\"\ngit config\
        \ user.name  \"cg-alert-bot\"\n\n# 全量安全提交（仅在有变更时推送）\ngit add -A || true\n\
        if git diff --cached --quiet; then\n  echo \"no changes to commit\"\n  echo\
        \ \"### Commit\" >> \"$GITHUB_STEP_SUMMARY\"\n  echo \"- no changes\" >> \"\
        $GITHUB_STEP_SUMMARY\"\nelse\n  git commit -m \"channel: weekly partner targets\
        \ (limit=${{ steps.resolve.outputs.limit }})\"\n  git pull --rebase --autostash\
        \ || true\n  git push\n  echo \"### Commit\" >> \"$GITHUB_STEP_SUMMARY\"\n\
        \  echo \"- pushed with limit=${{ steps.resolve.outputs.limit }}\" >> \"$GITHUB_STEP_SUMMARY\"\
        \nfi\ngit add public reports || true\n"
'on':
  workflow_dispatch:
    inputs:
      limit:
        description: 每周渠道候选上限
        default: '40'
        required: true
  schedule:
  - cron: 10 4 * * 1
