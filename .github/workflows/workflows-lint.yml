name: Workflows Lint

on:
  push:
    paths:
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/actionlint@v1
        with:
          args: >
            -color
            -shellcheck=on
            -ignore 'property ".*" is not defined in object type {} \[expression\]'
            .github/workflows/*.yml .github/workflows/*.yaml
