name: Channel Grow (weekly)
on:
  schedule:
    - cron: "20 9 * * 1"  # 每周一 09:20 UTC
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  channel_grow:
    runs-on: ubuntu-latest
    concurrency: { group: cg-write-channel, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Discover channels
        env: { CHANNEL_LIMIT: "40" }
        run: node scripts/auto_discover_channels.js
      - name: Commit & Safe push
        run: scripts/_ci_safe_push.sh main "channel: +auto discovered (weekly)"
