name: Auto Acceptance
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm ci || npm i
      - name: Acceptance Check
        run: |
          node scripts/acceptance_check.js | tee /tmp/acc.txt
          cat /tmp/acc.txt >> "$GITHUB_STEP_SUMMARY"
