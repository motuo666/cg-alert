name: Inbound (poll inbox)

on:
  schedule:
    - cron: "*/15 * * * *"   # 每 15 分钟
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: inbound-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      # 固定版本，避免 mailparser/imapflow 版本波动
      - name: Install deps
        run: |
          npm ci || true
          npm i --no-audit --no-fund imapflow@1 mailparser@3.8.1 csv-parse@5 csv-stringify@6 nodemailer@7 || true

      - name: Env check
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
        run: |
          echo "IMAP_HOST=${IMAP_HOST:-imap.zoho.com}"
          echo "IMAP user set: $([ -n "$SMTP_USER" ] && echo yes || echo no)"

      - name: Poll inbox & update CSV
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}   # 为空则脚本内部回退
          IMAP_PORT: 993
          IMAP_USER: ${{ secrets.IMAP_USER || secrets.SMTP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS || secrets.SMTP_PASS }}
          IMAP_SECURE: "true"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: node scripts/poll_inbox.js --dry=0

      # 心跳写入：仅在收件成功后记录，日报读取此文件判断“今天是否真的跑过收件”
      - name: Heartbeat (record last poll time)
        if: success()
        run: |
          mkdir -p data
          NOW=$(date -u +"%FT%TZ")
          TODAY=$(date -u +"%F")
          if [ -f data/last_poll.txt ] && grep -q "^$TODAY" data/last_poll.txt; then
            echo "already recorded today: $(cat data/last_poll.txt)"
          else
            echo "$NOW" > data/last_poll.txt
          fi

      # 一次性提交：CSV 变更（如 bounces.csv）+ 心跳文件
      - name: Commit & push changes
        if: always()
        run: |
          git config user.name  "CG Bot"
          git config user.email "ops@cg-alert.com"
          git add data/*.csv 2>/dev/null || true
          git add data/last_poll.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "inbound sync: csv+heartbeat"
            git push
          else
            echo "Nothing to commit."
          fi
