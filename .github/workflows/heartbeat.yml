name: Heartbeat
true:
  workflow_dispatch: {}
  schedule:
  - cron: 0 * * * *
permissions:
  contents: read
jobs:
  beat:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install deps
      run: npm i dayjs fs-extra
    - name: Check snapshot freshness
      env:
        HB_MAX_HOURS: '26'
      run: node scripts/heartbeat_check.js
'on':
  workflow_dispatch: null
