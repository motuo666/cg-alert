name: Discover Public Contacts
on:
  schedule:
    - cron: '08 15 * * 1-5'   # 工作日 09:08 MT（夏令时）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "discover-contacts-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '18' }
      - name: Discover contacts (filtered by public pages)
        run: node scripts/discover_contacts.js
      - name: Commit leads.csv
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/leads.csv || true
          git commit -m "chore(leads): discover public contacts (filtered)" || echo "nothing to commit"
          git push
