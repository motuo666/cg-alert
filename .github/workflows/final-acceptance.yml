name: Final Acceptance

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  final-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard: no truncation markers
        shell: bash
        run: |
          set -euo pipefail
          # Only block the exact marker that indicates a truncated paste.
          if grep -RIn --exclude-dir=.git -F 'conversation too long; truncated' . ; then
            echo "::error::Truncation marker found in repo"
            exit 1
          fi
          echo "OK: no truncation markers"
