name: Autopilot Step

on:
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autopilot:
    runs-on: ubuntu-latest
    env:
      # 默认不启用；要启用就到 Repo → Settings → Variables 设置为 "true"
      ENABLE_AUTOPILOT: ${{ vars.ENABLE_AUTOPILOT || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard & run
        shell: bash
        run: |
          set -e
          echo "ENABLE_AUTOPILOT=${ENABLE_AUTOPILOT}"
          if [ "${ENABLE_AUTOPILOT}" != "true" ]; then
            echo "Autopilot disabled. Exit 0."; exit 0; fi

          if [ ! -f scripts/ops/autopilot_step.js ]; then
            echo "scripts/ops/autopilot_step.js missing; skipping"; exit 0; fi

          # guard-missing:scripts/ops/autopilot_step.js
          if [ ! -f scripts/ops/autopilot_step.js ]; then echo 'missing, skip'; exit 0; fi
          node scripts/ops/autopilot_step.js
          fi
