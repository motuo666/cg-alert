name: Site QA
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/qa/**'
      - '.github/workflows/site-qa.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Assets check
        run: node scripts/qa/assets_check.js
      - name: Link check
        run: node scripts/qa/link_check.js
      - name: Policy check
        run: node scripts/qa/policy_check.js
      - name: Upload QA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: site-qa
          path: artifacts/
