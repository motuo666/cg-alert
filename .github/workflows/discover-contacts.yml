name: Discover Public Contacts
true:
  workflow_dispatch: {}
  schedule:
  - cron: 8 15 * * 1-5
permissions:
  contents: write
concurrency:
  group: discover-contacts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install deps (pinned if lock exists)
      run: "npm ci || npm i --no-audit --no-fund \n"
    - name: Discover contacts (public-only; persona+region filters)
      env:
        PERSONA_RULES: config/persona_rules.json
        REGION_FILTER: config/region_filter.json
      run: node scripts/discover_contacts.js
    - name: Guard & Validate (9 cols, enums, MX)
      run: 'node scripts/leads_guard.js || true

        node scripts/validate_leads.js

        '
    - name: Safe Push
      run: 'chmod +x scripts/git_safe_push.sh

        bash scripts/git_safe_push.sh "leads: discover + validate"

        '
'on':
  workflow_dispatch: null
