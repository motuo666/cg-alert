name: outbound
jobs:
  send:
    runs-on: ubuntu-latest
    concurrency:
      group: outbound
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install deps
      run: npm i nodemailer node-fetch@2
    - name: Send outbound sequence
      env:
        CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
        CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        SMTP_HOST: ${{ secrets.SMTP_HOST }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASS: ${{ secrets.SMTP_PASS }}
        MAIL_FROM: ${{ secrets.MAIL_FROM }}
        WORKER_URL: ${{ vars.WORKER_URL }}
        UNSUB_HMAC_SECRET: ${{ secrets.UNSUB_HMAC_SECRET }}
        SEND_RATE: 20
      run: node scripts/send_outbound.js
'on':
  workflow_dispatch: null
  schedule:
  - cron: 0 * * * *
