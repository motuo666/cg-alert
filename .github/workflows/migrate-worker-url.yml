name: Migrate Worker URL
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (if package.json present)
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run migration script if present
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          if [ -f scripts/patch_site_workers_url.mjs ]; then
            if [ -f package.json ]; then npm ci || npm i; fi
            node scripts/patch_site_workers_url.mjs && changed=1 || true
          elif [ -f scripts/patch_site_workers_url.js ]; then
            if [ -f package.json ]; then npm ci || npm i; fi
            node scripts/patch_site_workers_url.js && changed=1 || true
          elif [ -f scripts/patch_site_workers_url.sh ]; then
            bash scripts/patch_site_workers_url.sh && changed=1 || true
          else
            echo "No migration script; skipping."
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit & push if changed
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add -A
          if git diff --cached --quiet; then
            echo "No staged changes"
            exit 0
          fi
          git commit -m "worker-url: automated migration"
          git push
