name: Weekly Health Check
on:
  schedule:
    - cron: "0 15 * * 1"   # 每周一 15:00 UTC（可改）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '18' }
      - name: Install deps for SMTP/IMAP checks
        run: npm i --no-audit --no-fund nodemailer imapflow
      - name: Weekly Health Check
        env:
          SITE_ORIGIN: https://www.cg-alert.com
          DOMAIN: cg-alert.com
          STRIPE_PORTFOLIO_URL: https://buy.stripe.com/cNi6oJ6JwcYUe2K72ics801
          STRIPE_BUSINESS_URL:  https://buy.stripe.com/3cI28t6Jw4soaQy0DUcs800
          FORM_URL: https://forms.gle/TCaom33BRJGbcJ3r5
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/weekly_health_check.js
