name: check  # 先修再展示

on:
  workflow_dispatch: {}
  # 如需自动跑，取消注释定时触发（UTC）
  # schedule:
  #   - cron: "5 3 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        shell: bash
        run: |
          npm ci || npm i

      - name: Run pipeline (fix -> show)
        shell: bash
        run: |
          set -euo pipefail
          # 1) 生成快照
          node scripts/daily_ops_report.js || true
          # 2) 修正 sent_today 等
          node scripts/fix_sent_today.js || true
          # 3) 做自动验收（以修正后的数据为准）
          node scripts/acceptance_check.js

      - name: Summaries to GitHub Step Summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "## Daily Ops Snapshot (UTC)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifacts/daily_ops.json ]; then
            cat artifacts/daily_ops.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo '{"note":"no daily_ops.json produced"}' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Auto Acceptance" >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifacts/acceptance.md ]; then
            cat artifacts/acceptance.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_acceptance.md missing — check acceptance_check.js execution_" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily_ops
          path: |
            artifacts/daily_ops.json
            artifacts/acceptance.md
          if-no-files-found: warn
