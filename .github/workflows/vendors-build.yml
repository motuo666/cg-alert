name: Vendors Build

on:
  schedule:
    - cron: '12 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLISH_DIR: ${{ vars.PUBLISH_DIR || '.' }}
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://www.cg-alert.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build vendor pages
        run: |
          set -e
          node scripts/build_vendors_index.js
          node scripts/build_vendors_timeline.js
          node scripts/build_sitemap_filtered.js

      - name: Commit & push
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add "$PUBLISH_DIR/vendors" "$PUBLISH_DIR/api" "$PUBLISH_DIR/sitemap.xml" || true
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "vendors: rebuild index & timelines + sitemap"
            git pull --rebase --autostash || true
            git push
          fi
