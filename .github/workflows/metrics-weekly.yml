name: Metrics Weekly
on:
  schedule:
    - cron: '0 2 * * 1'      # 11:00 JST Monday
  workflow_dispatch:

permissions: { contents: write }

jobs:
  rollup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm i fast-xml-parser@4.4.0 --no-save
      - name: Aggregate metrics
        run: node scripts/metrics_aggregate.js
      - name: Commit metrics
        run: |
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add data/metrics/*
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "metrics: weekly rollup"
            git pull --rebase --autostash || true
            git push
          fi
