name: Auto Append Vendor Tags
on:
  schedule:
    - cron: '50 14 * * 1'   # 每周一 08:50 MT（夏令时）= 14:50 UTC
  workflow_dispatch:
permissions: { contents: write }
jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with: { node-version: '18' }
      - name: Install deps
        run: npm install csv-parse csv-stringify
      - name: Append 5-10 tags
        env:
          BATCH_MIN: '5'
          BATCH_MAX: '10'
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/auto_append_tags.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vendor_tags.csv || true
          git commit -m "chore(tags): weekly auto-append vendor tags" || echo "nothing to commit"
          git push
