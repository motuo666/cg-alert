name: Stripe Sync (KV → repo)
on:
  schedule: [ { cron: '20 3 * * *' } ]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Sync customers
        run: node scripts/kv_stripe_sync.js
      - name: Commit
        run: |
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add -A data/customers.csv
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "customers: sync from KV (Stripe)"; git pull --rebase --autostash || true; git push; fi
