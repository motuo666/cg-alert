name: finalize-and-verify
on:
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: write
  statuses: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - uses: actions/setup-python@v5
      with:
        python-version: 3.11
    - name: Export env
      run: 'echo "SITE_ORIGIN=https://www.cg-alert.com" >> $GITHUB_ENV

        echo "PUBLISH_DIR=." >> $GITHUB_ENV

        '
    - name: Build
      shell: bash
      run: 'set -euo pipefail

        python3 scripts/normalize_events.py --root .

        python3 scripts/auto_fix_links.py --root .

        python3 scripts/normalize_canonical.py --root . --site-origin "${SITE_ORIGIN}"

        node scripts/build_sitemap.mjs

        python3 scripts/harden_html.py .

        '
    - name: Verify internal links
      run: python3 scripts/check_links.py --root .
concurrency:
  group: cg-full-pipeline
  cancel-in-progress: false
