name: Outreach Health

on:
  schedule:
    - cron: "30 14 * * *"   # 每天 08:30 MT ≈ 14:30 UTC
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    # 如果你的 Secrets 放在 Environment（例如 production），取消注释并改成你的环境名
    # environment: production

    env:
      IMAP_HOST: ${{ secrets.IMAP_HOST }}
      IMAP_PORT: ${{ secrets.IMAP_PORT }}
      IMAP_USER: ${{ secrets.IMAP_USER }}
      IMAP_PASS: ${{ secrets.IMAP_PASS }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      # 可选（未设置则用脚本默认）：
      IMAP_SENT_BOX: ${{ secrets.IMAP_SENT_BOX }}
      IMAP_BOUNCE_FROM: ${{ secrets.IMAP_BOUNCE_FROM }}
      DEBUG: '1'   # 首次排错开，稳定后可删

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1) Preflight：检查 Secrets 是否注入到作业环境（缺啥直接 fail）
      - name: Preflight - check required secrets
        run: |
          missing=0
          for n in IMAP_HOST IMAP_PORT IMAP_USER IMAP_PASS SLACK_WEBHOOK; do
            if [ -z "${!n}" ]; then
              echo "::error title=Missing secret::$n is empty/unset"
              missing=1
            else
              echo "$n=OK"
            fi
          done
          if [ "$missing" = "1" ]; then exit 1; fi

      # 2) Slack 预热：确保 webhook 可用（Secrets 会被 GitHub 自动掩码）
      - name: Slack preflight ping
        run: |
          payload=$(jq -nc --arg t "[Outreach Health] preflight $(date -u +%FT%TZ)" '{text:$t}')
          curl -sS -X POST -H 'Content-Type: application/json' -d "$payload" "$SLACK_WEBHOOK"

      # 3) 依赖
      - name: Install deps
        run: |
          npm init -y >/dev/null 2>&1
          npm install imapflow

      # 4) 跑脚本
      - name: Run outreach health
        run: node scripts/outreach_health.js

      # 5) 兜底：若失败，发一条简短报警到 Slack（确保你必然能看到失败）
      - name: Slack fallback on failure
        if: failure()
        run: |
          payload=$(jq -nc --arg t "[Outreach Health] job status: failure at $(date -u +%FT%TZ)" '{text:$t}')
          curl -sS -X POST -H 'Content-Type: application/json' -d "$payload" "$SLACK_WEBHOOK"
