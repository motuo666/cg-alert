name: Auto Blacklist From Bounces
on:
  workflow_run:
    workflows: ["Bounce Sweep"]
    types: [completed]
  schedule:
    - cron: '25 0 * * *'
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Extract & update auto blacklist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/bounce/auto_blacklist_from_bounces.js
