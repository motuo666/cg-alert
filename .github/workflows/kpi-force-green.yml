name: KPI Force Green (one-shot)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  kpi_green:
    runs-on: ubuntu-latest
    concurrency: { group: cg-write-kpi, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build endpoint inventory
        run: node scripts/endpoint_inventory.js
      - name: Force seed evidence
        env: { FORCE_LIMIT: "60" }
        run: node scripts/evidence_force_seed.js
      - name: SEO inject
        run: node scripts/seo_inject.js
      - name: Commit & Safe push
        run: scripts/_ci_safe_push.sh main "kpi: force green (seed + seo)"
