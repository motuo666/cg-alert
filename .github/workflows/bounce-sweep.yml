name: Bounce Sweep

on:
  schedule:
    - cron: "15 * * * *" # hourly offset
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bounce-sweep
  cancel-in-progress: true

jobs:
  bounce:
    runs-on: ubuntu-latest
    env:
      IMAP_HOST: ${{ secrets.IMAP_HOST }}
      IMAP_PORT: ${{ secrets.IMAP_PORT }}
      IMAP_USER: ${{ secrets.IMAP_USER }}
      IMAP_PASS: ${{ secrets.IMAP_PASS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install

      - name: Sweep inbox for bounces/complaints/unsubs
        run: node scripts/poll_inbox.js

      - name: Commit & push bounce/unsub logs
        run: |
          set -e
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add data/bounces.csv data/complaints.csv data/unsubscribes.csv || true
          if git diff --cached --quiet; then
            echo "no bounce changes"
          else
            git commit -m "bounce-sweep: update suppression sources"
            git pull --rebase --autostash || true
            git push
          fi
