name: SEO Tighten
on:
  push:
    branches: [ main ]
    paths:
      - "vendors/**"
      - "updates/**"
      - "evidence/**"
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  tighten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci || npm i --no-audit --no-fund || true
      - run: node scripts/seo_inject.js
      - name: Commit
        run: |
          git config --local user.name "CG Bot"
          git config --local user.email "bot@cg-alert.com"
          git add -A && (git diff --cached --quiet || git commit -m "seo: inject json-ld/canonical/meta")
          git pull --rebase --autostash origin main || (git rebase --abort || true)
          git push origin HEAD:main || true
