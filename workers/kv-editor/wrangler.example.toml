# workers/kv-editor/wrangler.example.toml  (sanitized)
# DO NOT COMMIT SECRETS HERE. Use `wrangler secret put ...` instead.
name = "kv-editor"
main = "worker.js"
compatibility_date = "2025-01-15"
account_id = "REPLACE_WITH_CF_ACCOUNT_ID"
workers_dev = true

# Bind KV in production; the actual namespace id should be configured in CF dashboard.
[[kv_namespaces]]
binding = "CG_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets to set (do NOT put in this file):
#   wrangler secret put AUTH_USER
#   wrangler secret put AUTH_PASS
#   wrangler secret put GITHUB_REPO
#   wrangler secret put GITHUB_TOKEN
