name: Monthly Report
on:
  workflow_dispatch: null
  schedule:
  - cron: 0 4 1 * *
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: No-op sanity
      run: 'echo "Workflow $GITHUB_WORKFLOW is syntactically valid and ready."

        '
concurrency:
  group: cg-full-pipeline
  cancel-in-progress: false
