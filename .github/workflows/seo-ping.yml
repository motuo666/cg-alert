name: seo-ping

on:
  workflow_dispatch: {}
  push:
    branches: ["main"]
    paths:
      - "public/**"
      - "evidence/**"
      - "reports/**"
      - "sitemap.xml"
      - "public/sitemap.xml"
  schedule:
    - cron: "17 3 * * *"

jobs:
  ensure-and-ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Ensure root sitemap.xml
        run: node scripts/ops/sitemap_sync.js
      - name: Ping Google/Bing with sitemap
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://www.cg-alert.com' }}
        run: |
          set -e
          curl -fsS "https://www.google.com/ping?sitemap=${SITE_ORIGIN%/}/sitemap.xml" || true
          curl -fsS "https://www.bing.com/ping?sitemap=${SITE_ORIGIN%/}/sitemap.xml" || true
