name: Final Acceptance
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  metadata: read

jobs:
  final-acceptance:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required variables (masked echo)
        shell: bash
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
          STRIPE_LINK_PORTFOLIO: ${{ vars.STRIPE_LINK_PORTFOLIO }}
          STRIPE_LINK_BUSINESS: ${{ vars.STRIPE_LINK_BUSINESS }}
          INTAKE_FORM_URL: ${{ vars.INTAKE_FORM_URL }}
        run: |
          set -euo pipefail
          missing=()
          for k in SITE_ORIGIN STRIPE_LINK_PORTFOLIO STRIPE_LINK_BUSINESS INTAKE_FORM_URL; do
            v="${!k:-}"
            if [[ -z "$v" ]]; then
              missing+=("$k")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required variables: ${missing[*]}"
            exit 1
          fi

          mask() {
            local s="$1"
            local n="${#s}"
            if (( n <= 8 )); then
              printf '%s\n' "********"
            else
              printf '%s\n' "${s:0:4}****${s: -4}"
            fi
          }

          echo "Env overview:"
          echo "  SITE_ORIGIN           = $(mask "$SITE_ORIGIN")"
          echo "  STRIPE_LINK_PORTFOLIO = $(mask "$STRIPE_LINK_PORTFOLIO")"
          echo "  STRIPE_LINK_BUSINESS  = $(mask "$STRIPE_LINK_BUSINESS")"
          echo "  INTAKE_FORM_URL       = $(mask "$INTAKE_FORM_URL")"

          # Domain whitelist check for SITE_ORIGIN
          allow_domains_regex='^(https://(www\.)?cg-alert\.com)$'
          if ! [[ "$SITE_ORIGIN" =~ $allow_domains_regex ]]; then
            echo "::warning::SITE_ORIGIN '$SITE_ORIGIN' not in whitelist; allowed: https://www.cg-alert.com"
          fi

      - name: Scan for truncation/ellipsis markers (allowlist-aware)
        shell: bash
        run: |
          set -euo pipefail
          # Only fail if markers exist OUTSIDE the allowlisted files
          if grep -RIn --exclude-dir=.git \
                        --exclude-dir=.github \
                        --exclude-dir=node_modules \
                        --exclude-dir=scripts \
                        --exclude-dir=evidence \
                        -F 'conversation too long; truncated' . ; then
            echo "::error::Truncation/ellipsis markers found in repo (outside allowlist)"
            exit 1
          fi
          echo "OK: no truncation markers"

      - name: Node & Python
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build artifacts (sitemap/rss/hardening)
        shell: bash
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
        run: |
          set -euo pipefail
          python3 scripts/normalize_events.py --root . || true
          python3 scripts/auto_fix_links.py --root . || true
          python3 scripts/normalize_canonical.py --root . --site-origin "${SITE_ORIGIN}" || true
          node scripts/build_sitemap.mjs || node scripts/build_sitemap.js || true
          python3 scripts/harden_html.py . || true
          echo "Build steps completed"

      - name: Link check (internal only)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_links.py --root .

      - name: Done
        shell: bash
        run: echo "Final Acceptance ✅"
