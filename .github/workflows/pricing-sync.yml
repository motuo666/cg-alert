name: Pricing Sync

on:
  schedule:
    - cron: '15 3 * * *'   # 每日 03:15 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pricing:
    runs-on: ubuntu-latest
    env:
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://www.cg-alert.com' }}
      INTAKE_FORM_URL: ${{ vars.INTAKE_FORM_URL || secrets.INTAKE_FORM_URL }}
      STRIPE_LINK_PORTFOLIO: ${{ vars.STRIPE_LINK_PORTFOLIO || secrets.STRIPE_LINK_PORTFOLIO }}
      STRIPE_LINK_BUSINESS: ${{ vars.STRIPE_LINK_BUSINESS || secrets.STRIPE_LINK_BUSINESS }}
      # Enterprise 走表单，以下为可选，允许为空
      STRIPE_LINK_RENEWAL_DESK: ${{ vars.STRIPE_LINK_RENEWAL_DESK || secrets.STRIPE_LINK_RENEWAL_DESK }}
      STRIPE_LINK_COMPLIANCE:   ${{ vars.STRIPE_LINK_COMPLIANCE   || secrets.STRIPE_LINK_COMPLIANCE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Run Pricing Sync
        run: node scripts/pricing_sync.js
