name: Monthly Public Report
on:
  schedule:
    - cron: "10 15 1 * *" # 每月1日 15:10 UTC
  workflow_dispatch:
    inputs:
      month:
        description: "Month (YYYY-MM)"
        required: false
permissions: { contents: write }
jobs:
  monthly:
    runs-on: ubuntu-latest
    concurrency: { group: cg-write-monthly, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build monthly public report
        env: { REPORT_MONTH: ${{ github.event.inputs.month }} }
        run: node scripts/build_public_monthly.js
      - name: Commit & Safe push
        run: scripts/_ci_safe_push.sh main "reports: monthly public + rss"
