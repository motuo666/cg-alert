name: Outreach Triggered
on:
  schedule:
    - cron: '0 19 * * *'   # 04:00 JST
  workflow_dispatch:
    inputs:
      dry:
        description: "Dry run?"
        required: true
        default: "true"
        type: choice
        options: ["true","false"]
      limit:
        description: "Max emails to send when dry=false"
        required: true
        default: "20"

concurrency:
  group: outreach-triggered
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-24.04
    env:
      RAMP_SERIES: "12,20,30,50,80"
      REPLY_TO: "Jason <ops@cg-alert.com>"
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      UNSUB_HMAC_SECRET: ${{ secrets.UNSUB_HMAC_SECRET }}
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
      LIMIT: ${{ inputs.limit }}
      DRY: ${{ inputs.dry }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm i nodemailer@6.9.13 crypto-js@4.2.0
      - name: Send emails
        run: node scripts/outreach_send.js
