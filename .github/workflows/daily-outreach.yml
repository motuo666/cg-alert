name: Daily Outreach (manual)

on:
  workflow_dispatch:
permissions: { contents: write }

concurrency:
  group: outreach-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compute SEND_LIMIT
        id: ramp
        run: node scripts/compute_send_limit.js
      - name: Install deps
        run: npm i nodemailer@6
      - name: Send
        env:
          REGION_FILTER: ${{ vars.REGION_FILTER || '' }}
          RAMP_BASE: ${{ vars.RAMP_BASE || 12 }}
          RAMP_WEEKLY_INCREMENT: ${{ vars.RAMP_WEEKLY_INCREMENT || 8 }}
          RAMP_DAILY_INCREMENT: ${{ vars.RAMP_DAILY_INCREMENT || 0 }}
          RAMP_MAX: ${{ vars.RAMP_MAX || 100 }}
          RAMP_START_DATE: ${{ vars.RAMP_START_DATE || '2025-11-01' }}
          DOMAIN_LIMIT: ${{ vars.DOMAIN_LIMIT || 2 }}
          SEND_SPACING_MS: ${{ vars.SEND_SPACING_MS || 1200 }}
          ERROR_ABORT_THRESHOLD: ${{ vars.ERROR_ABORT_THRESHOLD || 3 }}
          ERROR_ABORT_WINDOW: ${{ vars.ERROR_ABORT_WINDOW || 10 }}
          SEED_SEND: ${{ vars.SEED_SEND || 'true' }}
        run: node scripts/send_triggered.js --limit "${{ steps.ramp.outputs.limit }}" --dry=false || true
      - name: Commit logs
        run: |
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          if [ -d out ]; then git add -A out; fi
          if [ -f data/suppressions.csv ]; then git add data/suppressions.csv; fi
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "outreach: manual send"; git pull --rebase --autostash || true; git push; fi
      - name: Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL || vars.SLACK_WEBHOOK_URL }}
        run: |
          set -e
          jq -n --arg t "❌ ${{ github.workflow }} failed • run=${{ github.run_id }}" '{text:$t}' \
          | curl -sS -H 'Content-Type: application/json' -d @- "$SLACK_WEBHOOK_URL" >/dev/null
