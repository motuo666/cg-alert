name: Daily Evidence
on:
  schedule: [ { cron: '30 0,6,12,18 * * *' } ]  # UTC
  workflow_dispatch:
permissions: { contents: write }
jobs:
  harvest_and_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Harvest public endpoints
        run: node scripts/harvest/poll_public_endpoints.js || true
      - name: Build reports & RSS
        run: |
          node scripts/reports/build_change_pack.js || true
          node scripts/reports/generate_reports_index.js || true
          node scripts/reports/build_rss.js || true
      - name: Commit evidence/reports (if any)
        run: |
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add -A public/evidence reports rss.xml
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "evidence: daily harvest + reports build"; git pull --rebase --autostash || true; git push; fi
