name: Outreach (Test Send)

on:
  workflow_dispatch:
    inputs:
      to:
        description: "收件人邮箱（先填你自己的）"
        required: true
      subject:
        description: "邮件主题"
        required: true
        default: "（测试）CG Alert 首封"
      body:
        description: "纯文本正文"
        required: true
        default: "你好，这是一封来自 CG Alert 的测试邮件。若收到请回复“OK”。"

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm init -y && npm install nodemailer
      - name: Send test email
        run: node scripts/send_email.js "${{ github.event.inputs.to }}" "${{ github.event.inputs.subject }}" "${{ github.event.inputs.body }}"
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
