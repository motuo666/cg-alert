name: content-gen

on:
  workflow_dispatch:
  schedule:
    - cron: "13 3 * * *"   # 每天 03:13 UTC 生成
  push:
    paths:
      - "data/**"
      - "scripts/**"
      - "reports/**"
      - "rss/**"
      - ".github/workflows/content-gen.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate reports & RSS
        run: |
          python3 scripts/gen_feeds.py
      - name: Commit & Push if changed
        run: |
          set -e
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "cg-bot"
            git config user.email "bot@cg-alert.com"
            git add -A
            git commit -m "chore(content): refresh reports/rss [skip ci]"
            git push
          else
            echo "No changes."
          fi
