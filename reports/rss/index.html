<section class="section">
  <h1>Subscribe via RSS</h1>
  <p class="lead">Get a human‑readable feed below, or <a href="/rss/index.xml" rel="alternate">view the raw XML</a>.</p>
  <div id="rss-list" class="cg-cards"></div>
</section>
<script>
(async function() {
  try {
    const res = await fetch("/rss/index.xml");
    const text = await res.text();
    const xml = new DOMParser().parseFromString(text, "application/xml");
    const items = Array.from(xml.querySelectorAll("item, entry"));
    const list = document.getElementById("rss-list");
    list.innerHTML = '';
    items.slice(0, 120).forEach(it => {
      const title = it.querySelector("title")?.textContent || "(no title)";
      const linkEl = it.querySelector("link");
      let link = "#";
      if (linkEl) link = linkEl.getAttribute("href") || linkEl.textContent || "#";
      const date = (it.querySelector("pubDate")||it.querySelector("updated")||it.querySelector("published"))?.textContent || "";
      const descEl = it.querySelector("description")||it.querySelector("summary")||it.querySelector("content");
      const desc = descEl ? (descEl.textContent||'').replace(/<[^>]+>/g,'') : "";
      const a = document.createElement("a");
      a.className = "card";
      a.href = link.startsWith("http") ? link : "#";
      a.innerHTML = `<div class="card-title">${title}</div>
                     <div class="card-meta">${date}</div>
                     <div class="card-body">${(desc||'').slice(0,240)}</div>`;
      if (/not\s*found/i.test(a.textContent) || /\bsample\b/i.test(a.textContent)) return;
      list.appendChild(a);
    });
  } catch (e) {
    document.getElementById("rss-list").innerHTML = '<div class="card">Failed to load feed.</div>';
  }
})();
</script>
