name: Autopilot Step
on:
  schedule:
    - cron: '35 0 * * *'   # 每天 00:35 UTC
  repository_dispatch:
    types: [autopilot_kick]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  step:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Compute & dispatch outreach
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OUTREACH_WORKFLOW_FILE: ${{ vars.OUTREACH_WORKFLOW_FILE || 'outreach-triggered.yml' }}
          AUTOPILOT_REF: ${{ github.ref_name }}
        run: |
  set -e
  if [ "${{ vars.ENABLE_AUTOPILOT || 'false' }}" != "true" ]; then
    echo "Autopilot disabled via vars"; exit 0; fi
  if [ ! -f scripts/ops/autopilot_step.js ]; then
    echo "scripts/ops/autopilot_step.js missing; skipping"; exit 0; fi
  node scripts/ops/autopilot_step.js
