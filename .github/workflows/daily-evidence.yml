name: Daily Evidence
on:
  schedule: [ { cron: '30 0,6,12,18 * * *' } ]  # 4x daily UTC
  workflow_dispatch:
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Harvest
        run: node scripts/poll_public_endpoints.js || true
      - name: Build reports+rss
        run: |
          node scripts/build_change_pack.js || true
          node scripts/generate_reports_index.js || true
          node scripts/build_rss.js || true
      - name: Commit
        run: |
          git config user.email "bot@cg-alert.com"
          git config user.name  "cg-alert-bot"
          git add -A public/evidence reports rss.xml
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "evidence/reports refresh"; git pull --rebase --autostash || true; git push; fi
