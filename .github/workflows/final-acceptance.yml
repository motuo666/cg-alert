name: Final Acceptance
on:
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
env:
  SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
  STRIPE_LINK_PORTFOLIO: ${{ vars.STRIPE_LINK_PORTFOLIO }}
  STRIPE_LINK_BUSINESS: ${{ vars.STRIPE_LINK_BUSINESS }}
  INTAKE_FORM_URL: ${{ vars.INTAKE_FORM_URL }}
jobs:
  final-acceptance:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Validate required variables
      shell: bash
      run: "set -euo pipefail\nreq=(SITE_ORIGIN STRIPE_LINK_PORTFOLIO STRIPE_LINK_BUSINESS\
        \ INTAKE_FORM_URL)\nmiss=()\nfor k in \"${req[@]}\"; do\n  v=\"${!k:-}\"\n\
        \  if [[ -z \"$v\" ]]; then miss+=(\"$k\"); fi\ndone\nif (( ${#miss[@]} ));\
        \ then\n  echo \"::error::Missing repository Variables: ${miss[*]}\"\n  exit\
        \ 1\nfi\nprintf 'OK: variables present\\nSITE_ORIGIN=%s\\n' \"${SITE_ORIGIN}\"\
        \n"
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Scan for truncation/ellipsis markers
      shell: bash
      run: "set -euo pipefail\nif grep -RIn \\\n     --exclude-dir=.git \\\n     --exclude-dir=.github\
        \ \\\n     --exclude-dir=scripts \\\n     --exclude-dir=evidence \\\n    \
        \ --exclude='*.yml' \\\n     -F 'conversation too long; truncated' . ; then\n\
        \  echo \"::error::Truncation/ellipsis markers found in repo\"\n  exit 1\n\
        fi\necho \"OK: no truncation markers\"\n"
    - name: Normalize & build site
      shell: bash
      env:
        SITE_ORIGIN: ${{ env.SITE_ORIGIN }}
      run: 'set -euo pipefail

        python3 scripts/normalize_events.py --root .

        python3 scripts/auto_fix_links.py --root .

        python3 scripts/normalize_canonical.py --root . --site-origin "${SITE_ORIGIN}"

        node scripts/build_sitemap.mjs

        python3 scripts/harden_html.py .

        '
    - name: Link check
      shell: bash
      run: 'set -euo pipefail

        python3 scripts/check_links.py --root .

        '
    - name: Compute rolling KPIs (non-fatal)
      shell: bash
      run: "set -euo pipefail\nif [ -f ops/compute_rolling_kpis.js ]; then\n  node\
        \ ops/compute_rolling_kpis.js || true\nfi\n"
    - name: Summary
      shell: bash
      run: 'echo "Final Acceptance passed core checks."

        '
concurrency:
  group: cg-full-pipeline
  cancel-in-progress: false
