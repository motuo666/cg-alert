name: Monthly Public Report

on:
  schedule:
    - cron: "10 15 1 * *"   # 每月 1 日 15:10 UTC
  workflow_dispatch:
    inputs:
      month:
        description: "YYYY-MM（空=当前月）"
        required: false

permissions:
  contents: write

concurrency:
  group: monthly-public-report
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://www.cg-alert.com' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps (best effort)
        run: npm ci || npm i --no-audit --no-fund || true

      - name: Ensure artifacts dir
        run: mkdir -p artifacts

      - name: Compute month
        id: month
        shell: bash
        run: |
          if [ -n "${{ inputs.month }}" ]; then
            VAL="${{ inputs.month }}"
          else
            VAL="$(date -u +%Y-%m)"
          fi
          # Guard: YYYY-MM 格式
          if ! echo "$VAL" | grep -Eq '^[0-9]{4}-[0-9]{2}$'; then
            echo "Bad month format: $VAL" >&2
            exit 1
          fi
          echo "val=$VAL" >> "$GITHUB_OUTPUT"
          echo "resolved=$VAL"

      - name: Build public monthly pages
        env:
          REPORT_MONTH: ${{ steps.month.outputs.val }}
          SITE_ORIGIN: ${{ env.SITE_ORIGIN }}
        shell: bash
        run: |
          set -euo pipefail
          # 兼容多种脚本命名
          if [ -f scripts/build_public_monthly.js ]; then
            node scripts/build_public_monthly.js
          elif [ -f scripts/build_public_monthly_report.js ]; then
            node scripts/build_public_monthly_report.js
          elif [ -f scripts/build_monthly_report.js ]; then
            node scripts/build_monthly_report.js "$REPORT_MONTH"
          else
            echo "scripts/build_public_monthly.js not found (also tried build_public_monthly_report.js / build_monthly_report.js)"
            exit 1
          fi

      - name: Rebuild evidence index (ndx)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/build_evidence_index.js ]; then
            node scripts/build_evidence_index.js
          else
            echo "scripts/build_evidence_index.js not found"
            exit 1
          fi

      - name: Monthly prune & create artifact zip
        env:
          REPORT_MONTH: ${{ steps.month.outputs.val }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/prune_evidence_monthly.js ]; then
            node scripts/prune_evidence_monthly.js
          elif [ -f scripts/prune_evidence.js ]; then
            node scripts/prune_evidence.js "$REPORT_MONTH"
          else
            echo "scripts/prune_evidence_monthly.js not found (also tried prune_evidence.js)"
            exit 1
          fi

      # —— 发布当月 checksum（对当月 evidence.ndx 行做 sha256，输出 reports/<YYYY-MM>/checksum.txt）
      - name: Publish monthly checksum
        env:
          REPORT_MONTH: ${{ steps.month.outputs.val }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/monthly_checksum.js ]; then
            node scripts/monthly_checksum.js
          elif [ -f scripts/monthly_checksum.mjs ]; then
            node scripts/monthly_checksum.mjs
          else
            echo "scripts/monthly_checksum.js not found (also tried monthly_checksum.mjs)"
            exit 1
          fi

      - name: Upload Artifact (evidence zip)
        if: ${{ hashFiles('artifacts/*.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ steps.month.outputs.val }}
          path: artifacts/*.zip
          if-no-files-found: ignore
          retention-days: 7

      - name: Create/Update GitHub Release
        if: ${{ hashFiles('artifacts/*.zip') != '' }}
        uses: ncipollo/release-action@v1
        with:
          tag: evidence-${{ steps.month.outputs.val }}
          name: Evidence Pack ${{ steps.month.outputs.val }}
          artifacts: "artifacts/*.zip"
          artifactErrorsFailBuild: false
          generateReleaseNotes: true
          allowUpdates: true
          removeArtifacts: false
          token: ${{ secrets.GITHUB_TOKEN }}

      # —— 免费补丁：Sitemap Ping，加速收录 /reports/
      - name: Ping sitemaps
        shell: bash
        run: |
          set -e
          echo "Pinging sitemaps for ${SITE_ORIGIN}"
          curl -s "https://www.google.com/ping?sitemap=${SITE_ORIGIN}/sitemap.xml" || true
          curl -s "https://www.bing.com/ping?sitemap=${SITE_ORIGIN}/sitemap.xml" || true

      # —— Run Summary（可视化产出指标）
      - name: Summarize
        env:
          REPORT_MONTH: ${{ steps.month.outputs.val }}
        shell: bash
        run: |
          set -euo pipefail
          YM="${REPORT_MONTH}"
          PAGES=$(find "reports/${YM}" -type f -name index.html 2>/dev/null | wc -l | tr -d ' ')
          NDX_ROWS=$(test -f data/evidence.ndx && awk -F'\t' -v ym="$YM" '$1 ~ ym {c++} END{print c+0}' data/evidence.ndx || echo 0)
          ZIP_OK=$(ls -1 artifacts/*.zip 2>/dev/null | wc -l | tr -d ' ')
          CS_PATH="reports/${YM}/checksum.txt"
          CS_SUM=$(test -f "$CS_PATH" && tail -c 64 "$CS_PATH" || echo "missing")
          {
            echo "### Monthly Public Report"
            echo "- Month: ${YM}"
            echo "- Report pages: ${PAGES}"
            echo "- evidence.ndx rows for ${YM}: ${NDX_ROWS}"
            echo "- Artifact zip(s): ${ZIP_OK}"
            echo "- Checksum tail(64): ${CS_SUM}"
            echo "- Checksum file: ${CS_PATH}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Safe Push (with fallback)
        shell: bash
        env:
          COMMIT_MSG: report: public monthly ${{ steps.month.outputs.val }}
        run: |
          set -euo pipefail
          if [ -x scripts/git_safe_push.sh ]; then
            bash scripts/git_safe_push.sh "${COMMIT_MSG}"
          else
            echo "[fallback] scripts/git_safe_push.sh not found; using safe git fallback"
            git config user.email "bot@cg-alert.com"
            git config user.name  "cg-alert-bot"
            git add -A reports data public || true
            if git diff --cached --quiet; then
              echo "[fallback] no changes to commit"
            else
              git commit -m "${COMMIT_MSG}"
              git pull --rebase --autostash || true
              git push || true
            fi
          fi
