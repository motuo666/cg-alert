name: Content Gen
on:
  push:
    branches: [ main ]
    paths:
      - "data/events.*"
      - "scripts/**"
      - "reports/**"
      - "rss/**"
      - "sitemap.xml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: python -m pip install --upgrade pip
      - name: Normalize & Generate
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
        run: python3 scripts/normalize_events.py
      - name: Commit changes
        run: |
          git config user.name "cg-bot"
          git config user.email "bot@cg-alert.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(ci): auto-generate RSS/Reports/Sitemap"
            git push
          else
            echo "No changes."
          fi
