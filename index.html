<!doctype html>
<meta charset="utf-8">
<title>Enable Alerts</title>
<meta name="robots" content="noindex">
<style>
  body{font-family:system-ui,Segoe UI,Arial;line-height:1.55;padding:24px;max-width:720px;margin:auto}
  .muted{color:#666} code{background:#f5f5f5;padding:2px 4px;border-radius:4px}
  .err{background:#ffecec;border:1px solid #f5c2c7;padding:12px;border-radius:8px}
</style>
<div id="app">
  <p>Redirecting to request alerts… <span class="muted">(auto)</span></p>
</div>
<script>
(function(){
  // 别带任何查询参数（不要 ?usp=header）
  const FORM_BASE = "https://docs.google.com/forms/d/e/1FAIpQLSdGidrPsKJ1jJ1c7cUCw0gmQBqn81htHWsEeCM1EaNoeyfQAQ/viewform";
  const ENTRY_VENDOR = "718093581"; // 你的 Vendor 字段 entry id（纯数字）

  const $ = s => document.querySelector(s);
  const qs = new URLSearchParams(location.search);
  const vendor = qs.get("vendor") || "";
  const keep = ["utm_source","utm_medium","utm_campaign"]
    .map(k => qs.get(k) ? `${k}=${encodeURIComponent(qs.get(k))}` : "")
    .filter(Boolean).join("&");

  function showError(msg, tips){
    $("#app").innerHTML =
      `<div class="err"><b>配置不完整：</b> ${msg}</div>` +
      `<p class="muted">${tips}</p>` +
      `<p class="muted">示例：<code>/intake/?vendor=slack.com&utm_source=test</code></p>`;
  }

  if(!/^\d+$/.test(ENTRY_VENDOR)){
    return showError("ENTRY_VENDOR 为空或不是数字。", "从表单「获取预填链接」里复制 entry.数字 的数字部分。");
  }
  if(!vendor){
    return showError("URL 缺少 vendor 参数。", "从邮件点进来会自动带上；手测可加 ?vendor=slack.com。");
  }

  // 使用 canonical 基址 + usp=pp_url，防止 Google 重定向丢参
  const base = FORM_BASE.split("?")[0];
  const url = `${base}?usp=pp_url&entry.${ENTRY_VENDOR}=${encodeURIComponent(vendor)}${keep?`&${keep}`:''}`;

  location.replace(url);
})();
</script>
