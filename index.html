<!doctype html>
<meta charset="utf-8">
<title>Enable Alerts</title>
<meta name="robots" content="noindex">
<style>
  body{font-family:system-ui,Segoe UI,Arial;line-height:1.55;padding:24px;max-width:720px;margin:auto}
  .muted{color:#666} code{background:#f5f5f5;padding:2px 4px;border-radius:4px}
  .err{background:#ffecec;border:1px solid #f5c2c7;padding:12px;border-radius:8px}
</style>
<div id="app">
  <p>Redirecting to request alerts… <span class="muted">(auto)</span></p>
</div>
<script>
(function(){
  // 已填：空白表单链接（含 ?usp=header 可用）
  const FORM_BASE = "https://docs.google.com/forms/d/e/1FAIpQLSdGidrPsKJ1jJ1c7cUCw0gmQBqn81htHWsEeCM1EaNoeyfQAQ/viewform?usp=header";
  // 已填：Vendor 字段 entry id（纯数字）
  const ENTRY_VENDOR = "718093581";

  const $ = s => document.querySelector(s);
  const qs = new URLSearchParams(location.search);
  const vendor = qs.get("vendor") || "";
  const keep = ["utm_source","utm_medium","utm_campaign"]
    .map(k => qs.get(k) ? `${k}=${encodeURIComponent(qs.get(k))}` : "")
    .filter(Boolean).join("&");

  function showError(msg, tips){
    $("#app").innerHTML =
      `<div class="err"><b>配置不完整：</b> ${msg}</div>` +
      `<p class="muted">${tips}</p>` +
      `<p class="muted">访问示例：<code>/intake/?vendor=slack.com&utm_source=test</code></p>`;
  }

  // 自检 1：ENTRY_VENDOR 必须是数字
  if(!/^\d+$/.test(ENTRY_VENDOR)){
    return showError(
      "缺少 Google Form 字段 ID（ENTRY_VENDOR）。",
      "在表单右上角「更多」→「获取预填链接」，给 Vendor 填 ACME，点「获取链接」，复制链接中形如 entry.1234567890=ACME 的数字部分，把它粘到本页 ENTRY_VENDOR。"
    );
  }
  // 自检 2：必须有 vendor 参数
  if(!vendor){
    return showError(
      "URL 缺少 vendor 参数。",
      "从邮件点进来会自动携带 vendor。你也可以手动在地址后加 ?vendor=slack.com 进行测试。"
    );
  }

  // 构造目标 URL（考虑 FORM_BASE 已含 ? 的情况）
  const sep = FORM_BASE.includes("?") ? "&" : "?";
  const url = `${FORM_BASE}${sep}entry.${ENTRY_VENDOR}=${encodeURIComponent(vendor)}${keep?`&${keep}`:''}`;

  // 跳转
  location.replace(url);
})();
</script>
