name: Site Fixups
on:
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Cleanup invalid CSP meta placeholders
      shell: bash
      run: "set -e\nshopt -s globstar nullglob\nfor f in **/*.html; do\n  if grep\
        \ -q \"Content-Security-Policy\" \"$f\"; then\n    # remove lines containing\
        \ placeholder ellipses in CSP meta\n    sed -i \"/Content-Security-Policy.*\\\
        .\\.\\./d\" \"$f\" || true\n  fi\ndone\n"
    - name: Ensure RSS title and stylesheet reference
      shell: bash
      run: "set -e\nrss=\"reports/rss/index.xml\"\nif [ -f \"$rss\" ]; then\n  if\
        \ ! grep -q \"<title>\" \"$rss\"; then\n    # add a basic title element into\
        \ channel if missing\n    awk '1; /<channel>/ && !x {print \"  <title>CG Alert\
        \ — Evidence Feed</title>\"; x=1}' \"$rss\" > \"$rss.tmp\" && mv \"$rss.tmp\"\
        \ \"$rss\"\n  fi\nfi\n"
    - name: Ensure Pages _headers caching rules
      shell: bash
      run: "set -e\ntouch _headers\nadd_block() {\n  block=\"$1\"\n  key=\"$2\"\n\
        \  if ! grep -Fq \"$key\" _headers; then\n    printf \"\\n%s\\n\" \"$block\"\
        \ >> _headers\n  fi\n}\nadd_block \"/assets/*\\n  Cache-Control: public, max-age=2592000,\
        \ immutable\" \"/assets/*\"\nadd_block \"/*.html\\n  Cache-Control: public,\
        \ max-age=300\" \"/*.html\"\n"
    - name: Commit & push
      run: "set -e\ngit config user.email \"bot@cg-alert.com\"\ngit config user.name\
        \  \"cg-alert-bot\"\ngit add -A\nif git diff --cached --quiet; then\n  echo\
        \ \"no changes to commit\"\nelse\n  git commit -m \"site-fixups: CSP cleanup,\
        \ RSS title, caching headers\"\n  git pull --rebase --autostash || true\n\
        \  git push\nfi\n"
concurrency:
  group: cg-full-pipeline
  cancel-in-progress: false
